name        : Build wheel
description : Provision a Rust-only Cargo environment, run `maturin-action`, and upload the resulting artifact. Callers check out the repo first, and rewrite the README before shipping one.

inputs:
  command:
    description : maturin subcommand (`build` or `sdist`)
    required    : true

  args:
    default     : ''
    description : Per-platform flags appended to the fixed `--release --locked` build flags

  manylinux:
    default     : ''
    description : Manylinux compatibility tag (`2_17` on Linux, empty elsewhere)

  name:
    default     : sdist
    description : Tag suffix in the uploaded `wheels-{name}` artifact and the `provision-cargo` shared-key scope.

  save:
    default     : true
    description : When `false` the caches restore but never save. `warm.yml` is the only caller that saves.

  target:
    default     : ''
    description : Cargo target triple (Linux/macOS/Windows wheel rows). Empty for sdist.

  upload:
    default     : true
    description : When `false` the artifact upload is skipped, for warming runs that discard the wheel.

runs:
  using: composite

  steps:
    - name : Provision Cargo
      if   : ${{ inputs.command != 'sdist' }}
      uses : ./.github/actions/provision-cargo
      with:
        save       : ${{ inputs.save }}
        shared-key : prose-dist-${{ inputs.name }}
        tools      : rust

    - name : Run maturin
      env  : { PIP_BREAK_SYSTEM_PACKAGES: '1' }
      uses : PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
      with:
        args              : ${{ inputs.command == 'build' && format('--release --locked {0}', inputs.args) || inputs.args }}
        command           : ${{ inputs.command }}
        manylinux         : ${{ inputs.manylinux }}
        maturin-version   : v1.14.1
        target            : ${{ inputs.target }}
        working-directory : crate

    - name : Upload artifact
      if   : ${{ inputs.upload != 'false' }}
      uses : actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        if-no-files-found : error
        name              : wheels-${{ inputs.name }}
        path              : target/wheels/*
        retention-days    : 7

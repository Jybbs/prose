name        : Download wheels
description : Pull `wheels-*` artifacts uploaded by the build matrix into `dist/`.

inputs:
  pattern:
    default     : wheels-*
    description : Glob matching the artifact names to download.

runs:
  using: composite

  steps:
    - name : Download wheel artifacts
      uses : actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        merge-multiple : true
        path           : dist
        pattern        : ${{ inputs.pattern }}

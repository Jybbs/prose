name        : Download wheels
description : Pull `wheels-*` artifacts uploaded by the build matrix into `dist/`, with one site for the `actions/download-artifact` SHA pin. A narrowed `pattern` pulls the single artifact a job installs, leaving the default for jobs that read every platform.

inputs:
  pattern:
    default     : wheels-*
    description : Glob matching the artifact names to download.

runs:
  using: composite

  steps:
    - name : Download wheel artifacts
      uses : actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        merge-multiple : true
        path           : dist
        pattern        : ${{ inputs.pattern }}

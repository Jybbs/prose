name        : Provision bun
description : Restore `~/.bun/install/cache` and `site/node_modules` keyed off `site/bun.lock`, so a later `bun install` skips the resolve and link work. Assumes bun is already on PATH.

inputs:
  cache-dependency-glob:
    default     : site/bun.lock
    description : Files whose hash keys the bun deps cache. Empty disables the cache.

  save:
    default     : true
    description : When `false` the cache restores but never saves.

runs:
  using: composite

  steps:
    - name : Restore bun cache
      if   : ${{ inputs.cache-dependency-glob != '' }}
      uses : ./.github/actions/restore
      with:
        key  : bun-deps-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-glob) }}
        path : |
          ~/.bun/install/cache
          site/node_modules
        save : ${{ inputs.save }}

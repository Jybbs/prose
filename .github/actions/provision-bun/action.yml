name        : Provision bun
description : Restore `~/.bun/install/cache` and `site/node_modules` keyed off `site/bun.lock` so subsequent `bun install --frozen-lockfile` invocations skip the resolve and link work. Assumes bun is already on PATH from an earlier `provision-cargo` step.

inputs:
  cache-dependency-glob:
    default     : site/bun.lock
    description : Files whose hash keys the bun deps cache. Empty disables the cache.

  save:
    default     : true
    description : When `false` the restore-only variant of the cache action runs, so a pull-request run reads the entry `main` owns without saving one to its own ref.

runs:
  using: composite

  steps:
    - name : Restore bun cache
      if   : ${{ inputs.cache-dependency-glob != '' && inputs.save != 'false' }}
      uses : actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key  : &key bun-deps-${{ runner.os }}-${{ hashFiles(inputs.cache-dependency-glob) }}
        path : &path |
          ~/.bun/install/cache
          site/node_modules

    - name : Restore bun cache without saving
      if   : ${{ inputs.cache-dependency-glob != '' && inputs.save == 'false' }}
      uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key  : *key
        path : *path

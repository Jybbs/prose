name        : Provision Cargo
description : Install the `.mise/config.toml` tools, or the subset `tools` names, and restore the Swatinem Cargo cache for the given `shared-key`.

inputs:
  shared-key:
    description : The Swatinem cache scope, which two rows given the same name read and write together. An empty value skips the cache step and leaves the mise archive unwritten.
    required    : true

  save:
    default     : true
    description : When `false` the caches restore but never save. `warm.yml` and `module.yml` leave it `true`, being the only callers that write these entries.

  tools:
    default     : ''
    description : Space-separated subset of `.mise/config.toml` tools to install, which `MISE_ENABLE_TOOLS` then limits the rest of the job to beside the uv `provision-uv` installs, so the `_.python.venv` directive stays off in a job that installs no Python. Empty installs the full toolset.

runs:
  using: composite

  steps:
    - name  : Point mise, rustup, and Cargo at the shared environment
      env   : { TOOLS: "${{ inputs.tools }}" }
      shell : bash
      run   : |
        {
          echo "CARGO_TERM_COLOR=always"
          echo "MISE_CARGO_HOME=${LOCALAPPDATA:-$HOME/.local/share}/mise/cargo"
          echo "MISE_RUSTUP_HOME=${LOCALAPPDATA:-$HOME/.local/share}/mise/rustup"
          [[ -z "$TOOLS" ]] || echo "MISE_ENABLE_TOOLS=uv,${TOOLS// /,}"
        } >> "$GITHUB_ENV"

    - name : Read the required mise version
      id   : mise
      uses : $/.github/actions/mise-floor

    - name : Install mise tools
      uses : jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c
      with:
        cache_max_age_days : 0
        cache_save         : ${{ inputs.shared-key != '' && inputs.save != 'false' }}
        install_args       : ${{ inputs.tools }}
        version            : ${{ steps.mise.outputs.version }}

    - name : Restore Cargo cache
      if   : ${{ inputs.shared-key != '' }}
      uses : Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        save-if    : ${{ inputs.save != 'false' }}
        shared-key : ${{ inputs.shared-key }}

name        : Provision Cargo
description : Install the `.mise/config.toml` tools, the Rust toolchain among them, and restore the Swatinem Cargo cache for the given `shared-key`.

inputs:
  shared-key:
    description : Swatinem cache scope. Distinct keys allow per-profile cache isolation.
    required    : true

  cache:
    default     : true
    description : When `false` the Swatinem cache step is skipped and the mise archive is not written back.

  cache-targets:
    default     : true
    description : When `false` only the Cargo home is cached. The `--zig` wheel rows build in a container whose fingerprints never match a host-built `target/`.

  save:
    default     : true
    description : When `false` the caches restore but never save. `warm.yml` is the only caller that saves.

  tools:
    default     : ''
    description : Space-separated subset of `.mise/config.toml` tools to install. Empty installs the full toolset.

runs:
  using: composite

  steps:
    - name  : Point mise, rustup, and Cargo at the shared environment
      shell : bash
      run   : |
        {
          echo "CARGO_TERM_COLOR=always"
          echo "MISE_RUSTUP_HOME=$HOME/.local/share/mise/rustup"
        } >> "$GITHUB_ENV"

    - name : Install mise tools
      uses : jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
      with:
        cache_save   : ${{ inputs.cache != 'false' && inputs.save != 'false' }}
        install_args : ${{ inputs.tools }}

    - name : Restore Cargo cache
      if   : ${{ inputs.cache != 'false' }}
      uses : Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        cache-targets : ${{ inputs.cache-targets }}
        save-if       : ${{ inputs.save != 'false' }}
        shared-key    : ${{ inputs.shared-key }}

    - name  : Point Cargo at the git CLI for its git dependencies
      shell : bash
      run   : echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"

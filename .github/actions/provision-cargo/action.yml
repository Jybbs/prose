name        : Provision Cargo
description : Install the `.mise/config.toml` tools, the Rust toolchain among them, and restore the Swatinem Cargo cache for the given `shared-key`.

inputs:
  shared-key:
    description : The Swatinem cache scope, which two rows given the same name read and write together. An empty value skips the cache step and leaves the mise archive unwritten.
    required    : true

  save:
    default     : true
    description : When `false` the caches restore but never save. `warm.yml` and `module.yml` leave it `true`, being the only callers that write these entries.

  tools:
    default     : ''
    description : Space-separated subset of `.mise/config.toml` tools to install. Empty installs the full toolset.

runs:
  using: composite

  steps:
    - name  : Point mise, rustup, and Cargo at the shared environment
      shell : bash
      run   : |
        {
          echo "CARGO_TERM_COLOR=always"
          echo "MISE_RUSTUP_HOME=${LOCALAPPDATA:-$HOME/.local/share}/mise/rustup"
        } >> "$GITHUB_ENV"

    - name  : Read the required mise version
      id    : mise
      shell : bash
      run   : |
        version=$(sed -n 's/^min_version *= *"\([^"]*\)".*/\1/p' .mise/config.toml)
        [[ -n "$version" ]] || { echo "::error::.mise/config.toml sets no min_version"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name : Install mise tools
      uses : jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        cache_save   : ${{ inputs.shared-key != '' && inputs.save != 'false' }}
        install_args : ${{ inputs.tools }}
        version      : ${{ steps.mise.outputs.version }}

    - name : Restore Cargo cache
      if   : ${{ inputs.shared-key != '' }}
      uses : Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      with:
        save-if    : ${{ inputs.save != 'false' }}
        shared-key : ${{ inputs.shared-key }}

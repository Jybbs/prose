name        : Provision uv
description : Install uv through mise off the `.mise/config.toml` pin, so one home carries the version.

inputs:
  save:
    default     : true
    description : When `false` the mise archive restores but never saves.

runs:
  using: composite

  steps:
    - name  : Read the required mise version
      id    : mise
      shell : bash
      run   : |
        version=$(sed -n 's/^min_version *= *"\([^"]*\)".*/\1/p' .mise/config.toml)
        [[ -n "$version" ]] || { echo "::error::.mise/config.toml sets no min_version"; exit 1; }
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name : Install mise tools
      uses : jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
      with:
        cache_save   : ${{ inputs.save != 'false' }}
        install_args : uv
        version      : ${{ steps.mise.outputs.version }}

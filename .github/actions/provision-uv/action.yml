name        : Provision uv
description : Install uv through mise off the `.mise/config.toml` pin, so one home carries the version, and set `MISE_ENABLE_TOOLS` to uv for the rest of the job, so the `_.python.venv` directive stays off.

inputs:
  cache:
    default     : true
    description : When `false` the mise archive neither restores nor saves, so uv installs from the URL and checksum `.mise/mise.lock` records.

  save:
    default     : true
    description : When `false` the mise archive restores but never saves.

runs:
  using: composite

  steps:
    - name  : Limit mise to uv for the rest of the job
      run   : echo "MISE_ENABLE_TOOLS=uv" >> "$GITHUB_ENV"
      shell : bash

    - name : Read the required mise version
      id   : mise
      uses : $/.github/actions/mise-floor

    - name : Install mise tools
      uses : jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785
      with:
        cache              : ${{ inputs.cache != 'false' }}
        cache_max_age_days : 0
        cache_save         : ${{ inputs.save != 'false' }}
        install_args       : uv
        version            : ${{ steps.mise.outputs.version }}

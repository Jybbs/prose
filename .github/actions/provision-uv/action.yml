name        : Provision uv
description : Install uv through mise off the `.mise/config.toml` pin, so one home carries the version.

inputs:
  save:
    default     : true
    description : When `false` the mise archive restores but never saves.

runs:
  using: composite

  steps:
    - name : Install mise tools
      uses : jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea
      with:
        cache_save   : ${{ inputs.save != 'false' }}
        install_args : uv

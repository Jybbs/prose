name        : Provision uv
description : Install uv through mise off the `.mise/config.toml` pin, so one home carries the version.

inputs:
  cache:
    default     : true
    description : When `false` the mise archive neither restores nor saves, so uv installs from the URL and checksum `.mise/mise.lock` records.

  save:
    default     : true
    description : When `false` the mise archive restores but never saves.

runs:
  using: composite

  steps:
    - name : Read the required mise version
      id   : mise
      uses : $/.github/actions/mise-floor

    - name : Install mise tools
      uses : jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
      with:
        cache        : ${{ inputs.cache != 'false' }}
        cache_save   : ${{ inputs.save != 'false' }}
        install_args : uv
        version      : ${{ steps.mise.outputs.version }}

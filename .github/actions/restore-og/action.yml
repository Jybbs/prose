name        : Restore OG cache
description : Restore `.cache/og` under a rolling commit-keyed entry with a prefix fallback, so every run reuses the newest card store and a `main` run saves its own forward.

inputs:
  save:
    default     : true
    description : When `false` the cache restores but never saves.

runs:
  using: composite

  steps:
    - name : Restore the OG card cache
      if   : ${{ inputs.save != 'false' }}
      uses : actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with : &entry
        key          : og-cards-${{ runner.os }}-${{ github.sha }}
        path         : .cache/og
        restore-keys : og-cards-${{ runner.os }}-

    - name : Restore the OG card cache without saving
      if   : ${{ inputs.save == 'false' }}
      uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with : *entry

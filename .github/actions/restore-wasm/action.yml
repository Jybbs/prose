name        : Restore wasm cache
description : Restore `site/public/wasm` from the cache, under an exact key hashed from the wasm sources. A hit stamps the restored files forward and switches the job's tasks back to modification-time freshness, since a fresh runner holds no recorded source hashes and hash freshness would rerun `wasm:pack`, so it reads its outputs as current and skips the `prose_wasm` compile, the `wasm-bindgen` emission, and the `wasm-opt` pass. The save is left to the caller, and on a push both `module.yml` and `deploy.yml` write the entry under the key this action reports.

outputs:
  cache-hit:
    description : Whether the module restored under an exact key match.
    value       : ${{ steps.entry.outputs.cache-hit }}

  key:
    description : The key the restore attempted, which a later `actions/cache/save` writes under.
    value       : ${{ steps.entry.outputs.cache-primary-key }}

runs:
  using: composite

  steps:
    - name : Restore the wasm module
      id   : entry
      uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key  : wasm-module-${{ runner.os }}-${{ hashFiles('.mise/config.toml', '.mise/lib/wasm.bash', '.mise/tasks/wasm/pack', 'Cargo.lock', 'Cargo.toml', 'crate/Cargo.toml', 'crate/src/**', 'wasm/**') }}
        path : site/public/wasm

    - name  : Stamp the restored module forward
      if    : ${{ steps.entry.outputs.cache-hit == 'true' }}
      run   : |
        find site/public/wasm -type f -exec touch {} +
        echo MISE_TASK_SOURCE_FRESHNESS_HASH_CONTENTS=false >> "$GITHUB_ENV"
      shell : bash

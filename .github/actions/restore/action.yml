name        : Restore
description : Restore a cache entry, saving it back at job end only where `save` stays true, so pull-request runs read the entries `main` owns without writing their own.

inputs:
  key:
    description : Exact cache key.
    required    : true

  path:
    description : Files or directories the entry holds.
    required    : true

  restore-keys:
    default     : ''
    description : Prefix fallback keys, empty for exact-match-only.

  save:
    default     : true
    description : When `false` the cache restores but never saves.

  touch:
    default     : false
    description : When `true` restored files are stamped forward on a hit, so mtime freshness checks see them as newer than the checkout.

outputs:
  cache-hit:
    description : Whether the entry restored under an exact key match.
    value       : ${{ steps.save.outputs.cache-hit || steps.restore.outputs.cache-hit }}

runs:
  using: composite

  steps:
    - name : Restore the cache
      id   : save
      if   : ${{ inputs.save != 'false' }}
      uses : actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key          : ${{ inputs.key }}
        path         : ${{ inputs.path }}
        restore-keys : ${{ inputs.restore-keys }}

    - name : Restore the cache without saving
      id   : restore
      if   : ${{ inputs.save == 'false' }}
      uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        key          : ${{ inputs.key }}
        path         : ${{ inputs.path }}
        restore-keys : ${{ inputs.restore-keys }}

    - name  : Stamp restored files forward
      if    : ${{ inputs.touch != 'false' && (steps.save.outputs.cache-hit == 'true' || steps.restore.outputs.cache-hit == 'true') }}
      run   : |
        echo "${{ inputs.path }}" | while IFS= read -r entry; do
          [ -e "$entry" ] && find "$entry" -type f -exec touch {} +
        done
      shell : bash

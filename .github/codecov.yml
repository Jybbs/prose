comment: false

ignore: [wasm/src]

coverage:
  precision : 2
  round     : down

  status:
    patch: &targets
      default:
        flag_coverage_not_uploaded_behavior : &missing pass
        target                              : &target 95%
      rust: &status
        flag_coverage_not_uploaded_behavior : *missing
        flags                               : [rust]
        target                              : *target
      site:
        <<    : *status
        flags : [site]

    project: *targets

flags:
  rust: &flag
    carryforward : true
    paths        : [crate/src]
  site:
    <<    : *flag
    paths : [site/.vitepress]

name        : 🪻 CI
run-name    : 🪻 CI · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!site/**'
      - site/.vitepress/tests/wasm/**

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  check:
    name    : ${{ matrix.name }}
    runs-on : &ubuntu ubuntu-latest

    env:
      CODECOV_TOKEN : ${{ secrets.CODECOV_TOKEN }}
      SHA           : &sha ${{ github.event.pull_request.head.sha || github.sha }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run check
            name       : 🪶 Format
          - command    : mise run lockfile
            name       : 🪵 Lockfile
          - command    : ./.github/scripts/audit-parity.py
            name       : 🪷 Parity
          - command    : mise run audit
            name       : 🪓 Unused
          - command    : mise run lint rust
            name       : 📎 Clippy
            shared-key : prose-clippy
          - command    : mise run build
            name       : 🗜️ Build
            shared-key : prose-build
          - command    : mise run build wasm
            name       : 🛶 Wasm
            shared-key : prose-wasm
          - bun-lock   : site/bun.lock
            command    : mise run smoke
            name       : 🪃 Browser
            save       : false
            shared-key : prose-wasm
          - command    : mise run upload rust
            name       : ☂️ Coverage
            shared-key : prose-coverage

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          cache      : ${{ matrix.shared-key != '' }}
          save       : ${{ matrix.save }}
          shared-key : ${{ matrix.shared-key }}

      - name : Provision bun
        uses : ./.github/actions/provision-bun
        with : { cache-dependency-glob: "${{ matrix.bun-lock }}" }

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  gate:
    name    : 🗞️ Brief
    if      : always()
    needs   : check
    runs-on : *ubuntu

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : Summarize and gate
        env:
          CHECK : ${{ needs.check.result }}
          REF   : ${{ github.head_ref || github.ref_name }}
          SHA   : *sha
        run  : ./.github/scripts/summary.py ci

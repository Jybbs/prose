name        : 🪻 CI
run-name    : 🪻 CI · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!site/**'
      - '!tests/site/**'
      - site/**.md
      - tests/site/wasm/**
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  check:
    name            : ${{ matrix.name }}
    if              : ${{ !github.event.pull_request.draft }}
    runs-on         : &ubuntu ubuntu-24.04
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - task       : rust:check
            name       : 🪶 Format
          - task       : lock:check
            name       : 🪵 Lockfile
          - task       : repo:audit
            name       : 🪷 Audit
          - task       : repo:lint
            name       : 🧷 Workflows
            tools      : zizmor
          - task       : rust:unused
            name       : 🪓 Unused
          - task       : rust:deny
            name       : 🛂 Crates
          - task       : rust:lint
            name       : 📎 Clippy
            shared-key : prose-clippy
          - task       : rust:build
            name       : 🗜️ Build
            shared-key : &debug-key prose-debug
          - task       : rust:suite
            name       : 🪚 Suite
            shared-key : *debug-key
          - task       : rust:proof corpus
            name       : 🥃 Proof · Corpus
            shared-key : *debug-key
          - task       : rust:proof settle
            name       : 🥃 Proof · Settle
            probe      : 'true'
            shared-key : prose-probe-workspace
          - task       : py:lint
            name       : 🪻 Prose
            shared-key : *debug-key
          - task       : wasm:lint
            name       : 🛶 Wasm
            shared-key : prose-wasm
          - task       : wasm:smoke
            module     : 'true'
            name       : 🪃 Browser
            shared-key : prose-wasm
          - task       : rust:upload
            name       : ☂️ Coverage
            shared-key : prose-coverage

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with:
          probe      : ${{ matrix.probe }}
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}
          tools      : ${{ matrix.tools }}

      - name : Restore the wasm module
        if   : ${{ matrix.module == 'true' }}
        uses : $/.github/actions/restore-wasm

      - name : mise run ${{ matrix.task }}
        env:
          CODECOV_TOKEN      : ${{ endsWith(matrix.task, ':upload') && secrets.CODECOV_TOKEN || '' }}
          MISE_GITHUB_TOKEN  : ${{ matrix.task == 'lock:check' && github.token || '' }}
          PROSE_PROOF_PROFILE: ${{ matrix.probe == 'true' && 'probe' || '' }}
          REPORT             : ${{ runner.temp }}/tasks.json
        run  : mise run -c --report-file "$REPORT" ${{ matrix.task }}

      - name : List the row's tasks
        env:
          REPORT : ${{ runner.temp }}/tasks.json
          ROW    : ${{ matrix.name }}
        if   : ${{ !cancelled() }}
        run  : mise run gha:brief tasks

  gate:
    name            : 🗞️ Brief
    if              : ${{ always() && !github.event.pull_request.draft }}
    needs           : check
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : $/.github/actions/provision-uv
        with : { save: *no-save }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief ci

name        : 🪻 CI
run-name    : 🪻 CI · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!site/**'
      - '!tests/site/**'
      - site/**.md
      - tests/site/wasm/**
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  check:
    name            : ${{ matrix.name }}
    if              : ${{ !github.event.pull_request.draft }}
    runs-on         : &ubuntu ubuntu-24.04
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run rust:check --rustfmt
            name       : 🪶 Format
          - command    : mise run lock:check
            name       : 🪵 Lockfile
          - command    : mise run repo:audit
            name       : 🪷 Audit
          - command    : mise run repo:lint
            name       : 🧷 Workflows
            tools      : zizmor
          - command    : mise run rust:unused
            name       : 🪓 Unused
          - command    : mise run rust:deny
            name       : 🛂 Crates
          - command    : mise run rust:lint
            name       : 📎 Clippy
            shared-key : prose-clippy
          - command    : mise run rust:build
            name       : 🗜️ Build
            shared-key : &debug-key prose-debug
          - command    : mise run rust:suite
            name       : 🪚 Suite
            shared-key : *debug-key
          - command    : mise run rust:proof corpus
            name       : 🥃 Proof · Corpus
            shared-key : *debug-key
          - command    : PROSE_PROOF_PROFILE=probe mise run rust:proof settle
            name       : 🥃 Proof · Settle
            probe      : 'true'
            shared-key : prose-probe-workspace
          - command    : mise run py:lint
            name       : 🪻 Prose
            shared-key : *debug-key
          - command    : mise run wasm:lint
            name       : 🛶 Wasm
            shared-key : prose-wasm
          - command    : mise run wasm:smoke
            module     : 'true'
            name       : 🪃 Browser
            shared-key : prose-wasm
          - command    : mise run rust:upload
            name       : ☂️ Coverage
            shared-key : prose-coverage

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with:
          probe      : ${{ matrix.probe }}
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}
          tools      : ${{ matrix.tools }}

      - name : Restore the wasm module
        if   : ${{ matrix.module == 'true' }}
        uses : $/.github/actions/restore-wasm

      - name : ${{ matrix.command }}
        env:
          CODECOV_TOKEN : ${{ endsWith(matrix.command, ':upload') && secrets.CODECOV_TOKEN || '' }}
        run  : ${{ matrix.command }}

  gate:
    name            : 🗞️ Brief
    if              : ${{ always() && !github.event.pull_request.draft }}
    needs           : check
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : $/.github/actions/provision-uv
        with : { save: *no-save }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief ci

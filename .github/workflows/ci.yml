name        : 🪻 CI
run-name    : 🪻 CI · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!LICENSE'
      - '!site/**'
      - site/.vitepress/tests/wasm/**

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  check:
    name            : ${{ matrix.name }}
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run rust:check
            name       : 🪶 Format
          - command    : mise run lock:check
            name       : 🪵 Lockfile
          - command    : mise run repo:audit
            name       : 🪷 Audit
          - command    : mise run rust:unused
            name       : 🪓 Unused
          - command    : mise run rust:lint
            name       : 📎 Clippy
            shared-key : prose-clippy
          - command    : mise run rust:build
            name       : 🗜️ Build
            shared-key : &debug-key prose-debug
          - command    : mise run rust:suite
            name       : 🪚 Suite
            shared-key : *debug-key
          - command    : mise run rust:proof
            name       : 🥃 Proof
            shared-key : *debug-key
          - command    : mise run wasm:build
            name       : 🛶 Wasm
            shared-key : prose-wasm
          - command    : mise run wasm:smoke
            name       : 🪃 Browser
            shared-key : prose-wasm
          - command    : mise run rust:upload
            name       : ☂️ Coverage
            shared-key : prose-coverage

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}

      - name : ${{ matrix.command }}
        env  : { CODECOV_TOKEN: "${{ endsWith(matrix.command, ':upload') && secrets.CODECOV_TOKEN || '' }}" }
        run  : ${{ matrix.command }}

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : check
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: *no-save }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief ci

name        : 🪻 Corpus
run-name    : 🪻 Corpus · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  BASE : ${{ github.event.pull_request.base.sha || github.sha }}
  REF  : ${{ github.head_ref || github.ref_name }}
  SHA  : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths: &watched
      - .github/actions/**
      - .github/workflows/corpus.yml
      - .mise/config.toml
      - .mise/lib/**
      - .mise/tasks/gha/baseline
      - .mise/tasks/gha/brief
      - .mise/tasks/gha/plan
      - .mise/tasks/gha/prune
      - .mise/tasks/rust/bake
      - .mise/tasks/rust/delta
      - .mise/tasks/rust/imports
      - .mise/tasks/rust/mutations
      - .mise/tasks/rust/probe
      - .mise/tasks/rust/settle
      - .mise/tasks/rust/subsets
      - Cargo.lock
      - Cargo.toml
      - crate/Cargo.toml
      - crate/src/**
      - crate/tests/common/**
      - crate/tests/corpus.rs
      - crate/tests/imports/**
      - crate/tests/settle.rs

  push:
    branches:
      - main
    paths: *watched

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  plan:
    name            : 🗺️ Plan
    outputs         : { matrix: "${{ steps.matrix.outputs.matrix }}" }
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - &provision-uv
        name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: &no-save 'false' }

      - name : Scope the subset probe
        id   : matrix
        run  : mise run gha:plan corpus

  bake:
    name            : 🧱 Bake
    if              : &push ${{ github.event_name != 'pull_request' }}
    permissions     : &prune-caches { actions: write, contents: read }
    runs-on         : *ubuntu
    timeout-minutes : &sweep 30

    steps:
      - *checkout

      - &provision-cargo
        name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          save       : *no-save
          shared-key : prose-probe

      - &interpreter
        name : Key the caches to the pinned interpreter
        id   : python
        run  : |
          mise x -- python -c '
          import sys, sysconfig
          version = sys.version.split()[0]
          print("corpus=" + sysconfig.get_paths()["stdlib"])
          for kind in ("breaks", "mutations", "stage"):
              print(f"{kind}=corpus-{kind}-{version}-")
          ' >> "$GITHUB_OUTPUT"

      - name : Look up the mutation set
        id   : mutations
        uses : &cache-restore actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key         : &mutations-key ${{ steps.python.outputs.mutations }}${{ hashFiles('sweeps/src/bin/mutate.rs', 'sweeps/Cargo.toml') }}
          lookup-only : true
          path        : &mutations-dir ${{ runner.temp }}/mutations

      - name : Bake the baseline stage and the mutation set
        env:
          PROSE_DELTA_STAGE      : &stage-dir ${{ runner.temp }}/stage
          PROSE_SETTLE_MUTATIONS : ${{ steps.mutations.outputs.cache-hit != 'true' && format('{0}/mutations', runner.temp) || '' }}
        run  : mise run rust:bake

      - name : Save the baseline stage
        uses : &cache-save actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key  : ${{ steps.python.outputs.stage }}${{ github.sha }}
          path : ${{ runner.temp }}/stage/.git

      - name : Save the mutation set
        if   : ${{ steps.mutations.outputs.cache-hit != 'true' }}
        uses : *cache-save
        with:
          key  : *mutations-key
          path : *mutations-dir

      - name : Drop the stages this bake replaces
        if   : &main ${{ github.ref == 'refs/heads/main' }}
        env  : { GH_TOKEN: "${{ github.token }}", PREFIX: "${{ steps.python.outputs.stage }}" }
        run  : mise run gha:prune

  breaks:
    name            : 🧱 Breaks
    if              : *push
    permissions     : *prune-caches
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    steps:
      - *checkout

      - *provision-cargo

      - *interpreter

      - name : Bake the break set every rewritten module imports against
        env  : { PROSE_IMPORTS_BAKE: &breaks-path "${{ runner.temp }}/breaks/set.json" }
        run  : mise run imports

      - name : Save the break set
        uses : *cache-save
        with:
          key  : ${{ steps.python.outputs.breaks }}${{ github.sha }}
          path : &breaks-dir ${{ runner.temp }}/breaks

      - name : Drop the break sets this bake replaces
        if   : *main
        env  : { GH_TOKEN: "${{ github.token }}", PREFIX: "${{ steps.python.outputs.breaks }}" }
        run  : mise run gha:prune

  settle:
    name            : ⚓ Settle
    if              : &pull-request ${{ github.event_name == 'pull_request' }}
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    steps:
      - *checkout

      - *provision-cargo

      - *interpreter

      - name : Sweep the corpus at every width and axis
        run  : mise run rust:settle "${{ steps.python.outputs.corpus }}"

  mutations:
    name            : 🎨 Mutations
    if              : *pull-request
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    steps:
      - *checkout

      - *provision-cargo

      - *interpreter

      - name : Restore the mutation set
        uses : *cache-restore
        with:
          key  : *mutations-key
          path : *mutations-dir

      - name : Format every mutation of the corpus
        env  : { PROSE_SETTLE_MUTATIONS: *mutations-dir }
        run  : mise run rust:mutations "${{ steps.python.outputs.corpus }}" 600

  delta:
    name            : 🦋 Delta
    if              : *pull-request
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    steps:
      - *checkout

      - *provision-cargo

      - *interpreter

      - name : Restore the baseline stage
        id   : stage
        uses : *cache-restore
        with:
          key          : ${{ steps.python.outputs.stage }}${{ env.BASE }}
          path         : ${{ runner.temp }}/stage/.git
          restore-keys : ${{ steps.python.outputs.stage }}

      - name : Serve or rebake the baseline
        env:
          RESTORED : ${{ steps.stage.outputs.cache-matched-key }}
          STAGE    : *stage-dir
        run  : mise run gha:baseline

      - name : Format the head at every width against the baseline
        env  : { PROSE_DELTA_STAGE: *stage-dir }
        run  : mise run rust:delta

  imports:
    name            : 🪟 Imports
    if              : *pull-request
    outputs         : { armed: "${{ steps.ratchet.outputs.armed }}" }
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    steps:
      - *checkout

      - *provision-cargo

      - *interpreter

      - name : Restore the baked break set
        uses : *cache-restore
        with:
          key          : ${{ steps.python.outputs.breaks }}${{ env.BASE }}
          path         : *breaks-dir
          restore-keys : ${{ steps.python.outputs.breaks }}

      - name : Import every rewritten module against the baked break set
        id   : ratchet
        env:
          PROSE_IMPORTS_ARMED    : ${{ runner.temp }}/armed
          PROSE_IMPORTS_BASELINE : *breaks-path
        run  : |
          mise run imports
          echo "armed=$(cat "$PROSE_IMPORTS_ARMED")" >> "$GITHUB_OUTPUT"

      - name : Report a run no baked break set armed
        if   : ${{ steps.ratchet.outputs.armed != 'true' }}
        run  : echo "::warning::no baked break set reached this run at the current generation, so the ratchet asserted nothing"

  subsets:
    name            : ${{ matrix.label }}
    needs           : plan
    runs-on         : *ubuntu
    timeout-minutes : *sweep

    strategy:
      fail-fast : false
      matrix    : ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - *checkout

      - *provision-cargo

      - name : Probe every rule alone and every pair touching the family
        env:
          PROSE_SETTLE_PAIRS : ${{ matrix.pairs }}
          PROSE_SETTLE_RULES : ${{ matrix.rules }}
        run  : mise run rust:subsets

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [bake, breaks, delta, imports, mutations, plan, settle, subsets]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - *provision-uv

      - name : Summarize and gate
        env:
          BAKE      : ${{ needs.bake.result }}
          BREAKS    : ${{ needs.breaks.result }}
          DELTA     : ${{ needs.delta.result }}
          ARMED     : ${{ needs.imports.outputs.armed }}
          IMPORTS   : ${{ needs.imports.result }}
          MUTATIONS : ${{ needs.mutations.result }}
          PLAN      : ${{ needs.plan.result }}
          SETTLE    : ${{ needs.settle.result }}
          SUBSETS   : ${{ needs.subsets.result }}
        run  : mise run gha:brief corpus

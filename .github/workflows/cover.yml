name        : 🪻 Cover
run-name    : 🪻 Cover · ${{ github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches : [main]

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}-${{ github.sha }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    env             : { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run rust:upload
            name       : ☂️ Rust
            shared-key : prose-coverage
          - command    : mise run site:upload
            name       : ☂️ Site
            save       : 'false'
            shared-key : prose-debug

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          save       : ${{ matrix.save }}
          shared-key : ${{ matrix.shared-key }}

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : checks
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: 'false' }

      - name : Summarize and gate
        env  : { CHECKS: "${{ needs.checks.result }}" }
        run  : mise run gha:brief cover

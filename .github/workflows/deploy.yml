name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha || github.event.before }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/*.md
      - .github/ISSUE_TEMPLATE/**
      - .github/actions/**
      - .github/scripts/platforms.toml
      - .github/workflows/deploy.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/lib/**
      - .mise/tasks/**
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - crate/Cargo.toml
      - crate/pyproject.toml
      - crate/src/**
      - crate/tests/fixtures/**
      - site/**
      - wasm/**

  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/scripts/platforms.toml
      - .github/workflows/deploy.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/lib/**
      - .mise/tasks/**
      - Cargo.lock
      - Cargo.toml
      - crate/Cargo.toml
      - crate/pyproject.toml
      - crate/src/**
      - crate/tests/fixtures/**
      - site/**
      - wasm/**

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    runs-on         : &ubuntu ubuntu-24.04
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run lock:check
            name       : 🪵 Lockfile
          - command    : mise run repo:audit
            name       : 🪷 Audit
          - command    : mise run site:typecheck
            name       : 🪡 Typecheck
          - command    : mise run site:lint
            name       : 🧶 Lint
          - command    : mise run site:upload
            name       : ☂️ Coverage
            shared-key : &debug-key prose-debug
          - command    : mise run site:cruft
            name       : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with:
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}

      - name : ${{ matrix.command }}
        env:
          CODECOV_TOKEN     : ${{ endsWith(matrix.command, ':upload') && secrets.CODECOV_TOKEN || '' }}
          MISE_GITHUB_TOKEN : ${{ matrix.command == 'mise run lock:check' && github.token || '' }}
        run  : ${{ matrix.command }}

  press:
    name            : 🎞️ Press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: *debug-key }

      - name : Restore the wasm module
        id   : wasm-module
        uses : $/.github/actions/restore-wasm

      - name : Restore the wasm build cache
        if   : ${{ steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if    : 'false'
          shared-key : prose-wasm

      - name : Restore the OG card cache
        id   : og-cards
        uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key          : &og-key og-cards-${{ runner.os }}-${{ github.sha }}
          path         : &og-path .cache/og
          restore-keys : og-cards-${{ runner.os }}-

      - name : Build the site and check internal links
        run  : mise run site:links

      - name : Save the wasm module
        if   : ${{ github.event_name != 'pull_request' && steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : &cache-save actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key  : ${{ steps.wasm-module.outputs.key }}
          path : site/public/wasm

      - name : Save the OG card cache
        if   : ${{ github.event_name != 'pull_request' && steps.og-cards.outputs.cache-hit != 'true' }}
        uses : *cache-save
        with:
          key  : *og-key
          path : *og-path

      - name : Upload the site bundle
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found : error
          name              : &bundle site-bundle
          path              : &dist site/.vitepress/dist
          retention-days    : 1

  render:
    name            : 🖋️ Render
    needs           : press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: '', tools: bun node }

      - name : Download the site bundle
        uses : &download actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with : { name: *bundle, path: *dist }

      - name : Read the values the browser computes
        env  : { MISE_TASK_SKIP_DEPENDS: 'true' }
        run  : |
          mise run site:bake
          mise run site:render

  deploy:
    name            : 🪁 Deploy
    needs           : [checks, press, render]
    outputs         : { url: "${{ steps.publish.outputs.deployment-url }}" }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Download the site bundle
        uses : *download
        with : { name: *bundle, path: *dist }

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId       : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken        : ${{ secrets.CLOUDFLARE_TOKEN }}
          command         : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ env.REF }} --commit-dirty=true
          wranglerVersion : "4.157.0"

  prune:
    name            : 🍂 Prune
    if              : github.event_name != 'pull_request'
    needs           : press
    permissions     : { actions: write, contents: read }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Prune superseded caches
        uses : $/.github/actions/prune-caches

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [checks, deploy, press, render]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : $/.github/actions/provision-uv
        with : { save: "${{ github.event_name != 'pull_request' }}" }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief deploy

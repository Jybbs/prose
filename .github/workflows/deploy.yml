name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha || github.event.before }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths: &paths
      - .github/actions/**
      - .github/workflows/deploy.yml
      - .mise/config.toml
      - .mise/lib/**
      - .mise/tasks/**
      - .nvmrc
      - crate/Cargo.toml
      - site/**

  push:
    branches : [main]
    paths    : *paths

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run lock:check
            name       : 🪵 Lockfile
          - command    : mise run repo:audit
            name       : 🪷 Audit
          - command    : mise run site:typecheck
            name       : 🪡 Typecheck
          - command    : mise run site:lint
            name       : 🧶 Lint
          - command    : mise run site:upload
            name       : ☂️ Coverage
            shared-key : &debug-key prose-debug
          - command    : mise run site:cruft
            name       : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}

      - name : ${{ matrix.command }}
        env  : { CODECOV_TOKEN: "${{ endsWith(matrix.command, ':upload') && secrets.CODECOV_TOKEN || '' }}" }
        run  : ${{ matrix.command }}

  press:
    name            : 🎞️ Press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { save: *no-save, shared-key: *debug-key }

      - name : Restore the wasm module
        id   : wasm-module
        uses : ./.github/actions/restore-wasm

      - name : Restore the wasm build cache
        if   : ${{ steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if    : 'false'
          shared-key : prose-wasm

      - name : Restore the OG card cache
        id   : og-cards
        uses : actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key          : &og-key og-cards-${{ runner.os }}-${{ github.sha }}
          path         : &og-path .cache/og
          restore-keys : og-cards-${{ runner.os }}-

      - name : Build the site and check internal links
        run  : mise run site:links

      - name : Save the wasm module
        if   : ${{ github.event_name != 'pull_request' && steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : &cache-save actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key  : ${{ steps.wasm-module.outputs.key }}
          path : site/public/wasm

      - name : Save the OG card cache
        if   : ${{ github.event_name != 'pull_request' && steps.og-cards.outputs.cache-hit != 'true' }}
        uses : *cache-save
        with:
          key  : *og-key
          path : *og-path

      - name : Upload the site bundle
        uses : actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found : error
          name              : &bundle site-bundle
          path              : &dist site/.vitepress/dist
          retention-days    : 1

  deploy:
    name            : 🪁 Deploy
    needs           : [checks, press]
    outputs         : { url: "${{ steps.publish.outputs.deployment-url }}" }
    permissions     : { contents: read, deployments: write }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Download the site bundle
        uses : actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with : { name: *bundle, path: *dist }

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken  : ${{ secrets.CLOUDFLARE_TOKEN }}
          command   : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ env.REF }} --commit-dirty=true

  prune:
    name            : 🍂 Prune
    if              : github.event_name != 'pull_request'
    needs           : press
    permissions     : { actions: write, contents: read }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: *no-save }

      - name              : Delete the cache entries this run replaces
        continue-on-error : true
        env               : { GH_TOKEN: "${{ github.token }}" }
        run               : mise run gha:prune

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [checks, deploy, press]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: "${{ github.event_name != 'pull_request' }}" }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief deploy

name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

on:
  pull_request:
    paths: &paths
      - .github/actions/provision-bun/**
      - .github/actions/provision-cargo/**
      - .github/workflows/deploy.yml
      - .mise/tasks/**
      - crate/Cargo.toml
      - 'site/**'

  push:
    branches: [main]
    paths: *paths

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name    : ${{ matrix.name }}
    runs-on : &ubuntu ubuntu-latest

    env:
      CODECOV_TOKEN : ${{ secrets.CODECOV_TOKEN }}
      SHA           : ${{ github.event.pull_request.head.sha || github.sha }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - command : mise run links
            name    : 🗜️ Build
            binary  : true
            render  : true
          - command : mise run typecheck
            name    : 🪡 Typecheck
            binary  : true
          - command : mise run lint site
            name    : 🧶 Lint
          - command : mise run test site
            name    : ⚖️ Test
            site    : true
          - command : mise run upload site
            name    : ☂️ Coverage
            site    : true
          - command : mise run cruft
            name    : 🧹 Cruft
            site    : true
          - command : mise run mutation
            name    : 🎨 Mutation
            site    : true

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { save: false, shared-key: prose-build }

      - name : Build the prose binary
        if   : ${{ matrix.binary || matrix.site }}
        run  : mise run build bin

      - &provision-bun
        name : Provision bun
        uses : ./.github/actions/provision-bun

      - name : Restore the OG card cache
        if   : ${{ matrix.render }}
        uses : &cache-action actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with : &og-cache
          key          : og-cards-${{ runner.os }}-${{ github.sha }}
          path         : .cache/og
          restore-keys : og-cards-${{ runner.os }}-

      - name : Restore the Astro content cache
        if   : ${{ matrix.binary || matrix.site }}
        uses : *cache-action
        with:
          key          : astro-store-${{ runner.os }}-${{ github.sha }}
          path         : site/.astro
          restore-keys : astro-store-${{ runner.os }}-

      - name : Restore the lychee cache
        if   : ${{ matrix.render }}
        uses : *cache-action
        with:
          key          : lychee-${{ runner.os }}-${{ github.sha }}
          path         : site/.lycheecache
          restore-keys : lychee-${{ runner.os }}-

      - name : Provision the docs-site content
        if   : ${{ matrix.site }}
        run  : mise run bake

      - name : ${{ matrix.command }}
        env  : { GITHUB_TOKEN: "${{ github.token }}" }
        run  : ${{ matrix.command }}

  deploy:
    name        : 🪁 Deploy
    if          : ${{ github.event_name == 'push' }}
    needs       : checks
    outputs     : { url: "${{ steps.publish.outputs.deployment-url }}" }
    permissions : { contents: read, deployments: write }
    runs-on     : *ubuntu

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { cache: false }

      - name : Build the prose binary
        run  : mise run build bin

      - *provision-bun

      - name : Restore the OG card cache
        uses : *cache-action
        with : *og-cache

      - name : Build the site
        run  : mise run press

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken  : ${{ secrets.CLOUDFLARE_TOKEN }}
          command   : pages deploy site/dist --project-name=prose --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

  gate:
    name    : 🗞️ Brief
    if      : always()
    needs   : checks
    runs-on : *ubuntu

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : Summarize and gate
        env:
          CHECK : ${{ needs.checks.result }}
          REF   : ${{ github.head_ref || github.ref_name }}
          SHA   : ${{ github.event.pull_request.head.sha || github.sha }}
        run  : ./.github/scripts/summary.py docs

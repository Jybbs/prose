name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths: &paths
      - .github/actions/**
      - .github/workflows/deploy.yml
      - .mise/config.toml
      - .mise/lib/**
      - .mise/tasks/**
      - .nvmrc
      - crate/Cargo.toml
      - site/**

  push:
    branches : [main]
    paths    : *paths

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    env             : { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run site:typecheck
            name       : 🪡 Typecheck
          - command    : mise run site:lint
            name       : 🧶 Lint
          - command    : mise run site:upload
            name       : ☂️ Coverage
            shared-key : &debug-key prose-debug
          - command    : mise run site:cruft
            name       : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          cache      : ${{ matrix.shared-key != '' }}
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}

      - &provision-bun
        name : Provision bun
        uses : ./.github/actions/provision-bun
        with : { save: &save "${{ github.event_name != 'pull_request' }}" }

      - name : Install dependencies
        run  : mise run site:bake

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  press:
    name            : 🎞️ Press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { save: *no-save, shared-key: *debug-key }

      - name : Restore the wasm module
        id   : wasm-module
        uses : ./.github/actions/restore-wasm
        with : { save: *save }

      - name : Restore the wasm build cache
        if   : ${{ steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          save-if    : 'false'
          shared-key : prose-wasm

      - *provision-bun

      - name : Restore the OG card cache
        uses : ./.github/actions/restore
        with:
          key          : og-cards-${{ runner.os }}-${{ github.sha }}
          path         : .cache/og
          restore-keys : og-cards-${{ runner.os }}-
          save         : *save

      - name : Build the site and check internal links
        run  : mise run site:links

      - name : Upload the site bundle
        uses : actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found : error
          name              : &bundle site-bundle
          path              : &dist site/.vitepress/dist
          retention-days    : 1

  deploy:
    name            : 🪁 Deploy
    needs           : [checks, press]
    outputs         : { url: "${{ steps.publish.outputs.deployment-url }}" }
    permissions     : { contents: read, deployments: write }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Download the site bundle
        uses : actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with : { name: *bundle, path: *dist }

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken  : ${{ secrets.CLOUDFLARE_TOKEN }}
          command   : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ env.REF }} --commit-dirty=true

  prune:
    name            : 🍂 Prune
    if              : github.event_name != 'pull_request'
    needs           : press
    permissions     : { actions: write }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Prune superseded OG card caches
        env:
          GH_REPO  : ${{ github.repository }}
          GH_TOKEN : ${{ github.token }}
        run  : |
          gh cache list --key og-cards- --json id,key \
            --jq '.[] | select(.key | endswith(env.GITHUB_SHA) | not) | .id' \
            | xargs -rn1 gh cache delete

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [checks, deploy, press]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: *save }

      - name : Summarize and gate
        env:
          CHECKS : ${{ needs.checks.result }}
          DEPLOY : ${{ needs.deploy.result }}
          PRESS  : ${{ needs.press.result }}
          URL    : ${{ needs.deploy.outputs.url }}
        run  : mise run gha:brief deploy

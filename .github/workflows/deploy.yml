name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

on:
  pull_request:
    paths: &paths
      - .github/actions/provision-bun/**
      - .github/actions/provision-cargo/**
      - .github/actions/provision-uv/**
      - .github/actions/restore-og-cache/**
      - .github/actions/restore-wasm-cache/**
      - .github/workflows/deploy.yml
      - .mise/lib/**
      - .mise/tasks/**
      - .nvmrc
      - crate/Cargo.toml
      - site/**

  push:
    branches : [main]
    paths    : *paths

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : 15

    env:
      CODECOV_TOKEN : ${{ secrets.CODECOV_TOKEN }}
      SHA           : &sha ${{ github.event.pull_request.head.sha || github.sha }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - command : mise run typecheck
            name    : 🪡 Typecheck
          - command : mise run lint site
            name    : 🧶 Lint
          - binary  : true
            command : mise run upload site
            name    : ☂️ Coverage
          - command : mise run cruft
            name    : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          cache      : ${{ matrix.binary == true }}
          save       : &no-save 'false'
          shared-key : &debug-key prose-debug

      - &provision-bun
        name : Provision bun
        uses : ./.github/actions/provision-bun
        with : { save: &save "${{ github.event_name != 'pull_request' }}" }

      - name : Install dependencies
        run  : mise run bake

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  deploy:
    name            : 🪁 Deploy
    needs           : checks
    outputs         : { url: "${{ steps.publish.outputs.deployment-url }}" }
    permissions     : { contents: read, deployments: write }
    runs-on         : *ubuntu
    timeout-minutes : 15

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { save: *no-save, shared-key: *debug-key }

      - name : Restore the wasm build cache
        uses : ./.github/actions/restore-wasm-cache

      - *provision-bun

      - name : Restore the OG card cache
        uses : ./.github/actions/restore-og-cache
        with : { save: *save }

      - name : Build the site and check internal links
        run  : mise run links

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken  : ${{ secrets.CLOUDFLARE_TOKEN }}
          command   : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

  prune:
    name            : 🍂 Prune
    if              : github.event_name != 'pull_request'
    needs           : deploy
    permissions     : { actions: write }
    runs-on         : *ubuntu
    timeout-minutes : 5

    steps:
      - name : Prune superseded OG card caches
        env:
          GH_REPO  : ${{ github.repository }}
          GH_TOKEN : ${{ github.token }}
        run  : |
          gh cache list --key og-cards- --json id,key \
            --jq '.[] | select(.key | endswith(env.GITHUB_SHA) | not) | .id' \
            | xargs -rn1 gh cache delete

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : deploy
    runs-on         : *ubuntu
    timeout-minutes : 5

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: *save }

      - name : Summarize and gate
        env:
          DEPLOY : ${{ needs.deploy.result }}
          REF    : ${{ github.head_ref || github.ref_name }}
          SHA    : *sha
          URL    : ${{ needs.deploy.outputs.url }}
        run  : ./.github/scripts/summary.py deploy

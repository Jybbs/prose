name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.pull_request.base.sha || github.event.before }}
  REF    : ${{ github.head_ref || github.ref_name }}
  SHA    : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/*.md
      - .github/ISSUE_TEMPLATE/**
      - .github/actions/**
      - .github/scripts/platforms.toml
      - .github/workflows/deploy.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/lib/**
      - .mise/tasks/**
      - Cargo.lock
      - Cargo.toml
      - LICENSE
      - crate/Cargo.toml
      - crate/pyproject.toml
      - crate/src/**
      - site/**
      - tests/rust/fixtures/**
      - tests/site/**
      - wasm/**
    types: [opened, synchronize, reopened, ready_for_review]

  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/scripts/platforms.toml
      - .github/workflows/deploy.yml
      - .mise/bin/**
      - .mise/config.toml
      - .mise/mise.lock
      - .mise/lib/**
      - .mise/tasks/**
      - Cargo.lock
      - Cargo.toml
      - crate/Cargo.toml
      - crate/pyproject.toml
      - crate/src/**
      - site/**
      - tests/rust/fixtures/**
      - tests/site/**
      - wasm/**

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name            : ${{ matrix.name }}
    if              : &ready ${{ !github.event.pull_request.draft }}
    runs-on         : &ubuntu ubuntu-24.04
    timeout-minutes : &timeout 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - task       : lock:check
            name       : 🪵 Lockfile
          - task       : repo:audit
            name       : 🪷 Audit
          - task       : site:typecheck
            name       : 🪡 Typecheck
          - task       : site:lint
            name       : 🧶 Lint
          - task       : site:upload
            name       : ☂️ Coverage
            shared-key : &debug-key prose-debug
          - task       : site:cruft
            name       : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with : { persist-credentials: false }

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with:
          save       : &no-save 'false'
          shared-key : ${{ matrix.shared-key }}

      - name : mise run ${{ matrix.task }}
        env:
          CODECOV_TOKEN      : ${{ endsWith(matrix.task, ':upload') && secrets.CODECOV_TOKEN || '' }}
          MISE_GITHUB_TOKEN  : ${{ matrix.task == 'lock:check' && github.token || '' }}
          REPORT             : ${{ runner.temp }}/tasks.json
        run  : mise run -c --report-file "$REPORT" ${{ matrix.task }}

      - name : List the row's tasks
        env:
          REPORT : ${{ runner.temp }}/tasks.json
          ROW    : ${{ matrix.name }}
        if   : ${{ !cancelled() }}
        run  : mise run gha:brief tasks

  press:
    name            : 🎞️ Press
    if              : *ready
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: *debug-key }

      - name : Restore the wasm module
        id   : wasm-module
        uses : $/.github/actions/restore-wasm

      - name : Restore the wasm build cache
        if   : ${{ steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          save-if    : 'false'
          shared-key : prose-wasm

      - name : Restore the OG card cache
        id   : og-cards
        uses : &cache-restore actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key          : &og-key og-cards-${{ runner.os }}-${{ github.sha }}
          path         : &og-path .cache/og
          restore-keys : og-cards-${{ runner.os }}-

      - name : Restore the highlight cache
        id   : highlights
        uses : *cache-restore
        with:
          key          : &highlight-key highlights-${{ runner.os }}-${{ github.sha }}
          path         : &highlight-path .cache/highlight
          restore-keys : highlights-${{ runner.os }}-

      - name : Build the site and check internal links
        env  : { GITHUB_TOKEN: "${{ github.token }}" }
        run  : mise run site:links

      - name : Save the wasm module
        if   : ${{ github.event_name != 'pull_request' && steps.wasm-module.outputs.cache-hit != 'true' }}
        uses : &cache-save actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key  : ${{ steps.wasm-module.outputs.key }}
          path : site/public/wasm

      - name : Save the OG card cache
        if   : ${{ github.event_name != 'pull_request' && steps.og-cards.outputs.cache-hit != 'true' }}
        uses : *cache-save
        with:
          key  : *og-key
          path : *og-path

      - name : Save the highlight cache
        if   : ${{ github.event_name != 'pull_request' && steps.highlights.outputs.cache-hit != 'true' }}
        uses : *cache-save
        with:
          key  : *highlight-key
          path : *highlight-path

      - name : Upload the site bundle
        uses : actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found : error
          name              : &bundle site-bundle
          path              : &dist site/.vitepress/dist
          retention-days    : 1

  render:
    name            : 🖋️ Render
    if              : *ready
    needs           : press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: '', tools: bun node }

      - name : Download the site bundle
        uses : &download actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with : { name: *bundle, path: *dist }

      - name : Restore the WebKit system packages
        uses : $/.github/actions/restore-debs

      - name : Read the values the browser computes
        env  : { MISE_TASK_SKIP_DEPENDS: 'true' }
        run  : |
          mise run site:bake
          mise run site:provision
          mise run site:render

  deploy:
    name            : 🪁 Deploy
    if              : *ready
    needs           : [checks, fit, press, render, sweep]
    outputs         : { url: "${{ steps.publish.outputs.deployment-url }}" }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Download the site bundle
        uses : *download
        with : { name: *bundle, path: *dist }

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          accountId       : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken        : ${{ secrets.CLOUDFLARE_TOKEN }}
          command         : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ env.REF }} --commit-dirty=true
          wranglerVersion : "4.164.0"

  prune:
    name            : 🍂 Prune
    if              : ${{ github.event_name != 'pull_request' && !github.event.pull_request.draft }}
    needs           : press
    permissions     : { actions: write, contents: read }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Prune superseded caches
        uses : $/.github/actions/prune-caches

  sweep:
    name            : 🦯 Axe
    if              : *ready
    needs           : press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: '', tools: bun node }

      - name : Download the site bundle
        uses : *download
        with : { name: *bundle, path: *dist }

      - name : Check every built page
        env  : { MISE_TASK_SKIP_DEPENDS: 'true' }
        run  : |
          mise run site:bake
          mise run site:sweep

  fit:
    name            : 🍋 Squeeze
    if              : *ready
    needs           : press
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision Cargo
        uses : $/.github/actions/provision-cargo
        with : { save: *no-save, shared-key: '', tools: bun node }

      - name : Download the site bundle
        uses : *download
        with : { name: *bundle, path: *dist }

      - name : Check every built page at each width
        env  : { MISE_TASK_SKIP_DEPENDS: 'true' }
        run  : |
          mise run site:bake
          mise run site:fit

  gate:
    name            : 🗞️ Brief
    if              : ${{ always() && !github.event.pull_request.draft }}
    needs           : [checks, deploy, fit, press, render, sweep]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Provision uv
        uses : $/.github/actions/provision-uv
        with : { save: "${{ github.event_name != 'pull_request' }}" }

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief deploy

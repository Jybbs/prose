name        : 🪻 Deploy
run-name    : 🪻 Deploy · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

on:
  pull_request:
    paths: &paths
      - .github/actions/provision-bun/**
      - .github/actions/provision-cargo/**
      - .github/actions/provision-uv/**
      - .github/actions/restore-og-cache/**
      - .github/actions/restore-wasm-cache/**
      - .github/workflows/deploy.yml
      - .mise/lib/**
      - .mise/tasks/**
      - .nvmrc
      - crate/Cargo.toml
      - site/**

  push:
    branches : [main]
    paths    : *paths

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  checks:
    name    : ${{ matrix.name }}
    runs-on : &ubuntu ubuntu-latest

    env:
      CODECOV_TOKEN : ${{ secrets.CODECOV_TOKEN }}
      SHA           : &sha ${{ github.event.pull_request.head.sha || github.sha }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - command : mise run typecheck
            name    : 🪡 Typecheck
          - command : mise run lint site
            name    : 🧶 Lint
          - binary  : true
            command : mise run upload site
            name    : ☂️ Coverage
          - command : mise run cruft
            name    : 🧹 Cruft

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Install mise tools
        if   : ${{ !matrix.binary }}
        uses : jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea

      - name : Provision Cargo
        if   : ${{ matrix.binary }}
        uses : ./.github/actions/provision-cargo
        with : &prose-build { save: false, shared-key: prose-build }

      - &provision-bun
        name : Provision bun
        uses : ./.github/actions/provision-bun

      - name : Install dependencies
        run  : mise run bake

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  deploy:
    name        : 🪁 Deploy
    needs       : checks
    outputs     : { url: "${{ steps.publish.outputs.deployment-url }}" }
    permissions : { contents: read, deployments: write }
    runs-on     : *ubuntu

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : *prose-build

      - name : Restore the wasm build cache
        uses : ./.github/actions/restore-wasm-cache

      - *provision-bun

      - name : Restore the OG card cache
        uses : ./.github/actions/restore-og-cache

      - name : Build the site and check internal links
        run  : mise run links

      - name : Deploy to Cloudflare Pages
        id   : publish
        uses : cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          accountId : ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken  : ${{ secrets.CLOUDFLARE_TOKEN }}
          command   : pages deploy site/.vitepress/dist --project-name=prose --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true

  gate:
    name    : 🗞️ Brief
    if      : always()
    needs   : deploy
    runs-on : *ubuntu

    steps:
      - *checkout

      - name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : Summarize and gate
        env:
          DEPLOY : ${{ needs.deploy.result }}
          REF    : ${{ github.head_ref || github.ref_name }}
          SHA    : *sha
          URL    : ${{ needs.deploy.outputs.url }}
        run  : ./.github/scripts/summary.py deploy

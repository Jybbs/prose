name        : 🪻 Draft
run-name    : 🪻 Draft · ${{ github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches : [main]
    paths    : ['crate/Cargo.toml']

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  cut:
    name            : 🪻 Draft
    permissions     : { contents: write }
    runs-on         : ubuntu-latest
    timeout-minutes : 15

    steps:
      - name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth : 2
          ref         : main

      - name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : 🌱 Cut draft
        id   : cut
        env  : { GH_TOKEN: "${{ github.token }}" }
        run  : mise run gha:cut

      - name : 🗞️ Brief
        env:
          DRAFT_STATE : ${{ steps.cut.outputs.state }}
          DRAFT_URL   : ${{ steps.cut.outputs.url }}
          VERSION     : ${{ steps.cut.outputs.version }}
        run  : mise run gha:brief draft

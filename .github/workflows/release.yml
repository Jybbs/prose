name        : 🪻 Release
run-name    : 🪻 Release · ${{ github.head_ref || github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  pull_request:
    paths:
      - .github/actions/**
      - .github/scripts/**
      - .github/workflows/release.yml
      - .mise/config.toml
      - .mise/lib/**
      - .mise/tasks/gha/**
      - crate/Cargo.toml
      - crate/pyproject.toml

  push:
    tags: ['[0-9]*']

  workflow_dispatch:

concurrency:
  cancel-in-progress : ${{ github.event_name == 'pull_request' }}
  group              : ${{ github.workflow }}-${{ github.head_ref || github.ref }}

jobs:
  plan:
    name            : 🗺️ Plan
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    outputs:
      matrix : ${{ steps.matrix.outputs.matrix }}
      smoke  : ${{ steps.matrix.outputs.smoke }}

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - &provision-uv
        name : Provision uv
        uses : ./.github/actions/provision-uv
        with : { save: &no-save 'false' }

      - name : Emit build matrix
        id   : matrix
        run  : mise run gha:plan

  build:
    name            : 🎻 ${{ matrix.name }}
    needs           : plan
    runs-on         : ${{ matrix.runner }}
    timeout-minutes : 30

    strategy:
      fail-fast : false
      matrix    : ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - *checkout

      - *provision-uv

      - &rewrite-readme
        name : Rewrite README for PyPI
        run  : mise run gha:readme

      - name : Build wheel
        uses : ./.github/actions/build-wheel
        with:
          args      : ${{ matrix.args }}
          command   : build
          manylinux : ${{ matrix.manylinux }}
          name      : ${{ matrix.name }}
          save      : *no-save
          target    : ${{ matrix.target }}

  sdist:
    name            : 🚢 sdist
    needs           : plan
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - *provision-uv

      - *rewrite-readme

      - name : Build sdist
        uses : ./.github/actions/build-wheel
        with : { command: sdist }

  validate:
    name            : 🕯️ Validate
    needs           : [build, plan, sdist]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Download the smoke-test wheel
        uses : ./.github/actions/download-wheels
        with : { pattern: "${{ needs.plan.outputs.smoke }}" }

      - *provision-uv

      - name : Smoke-install built wheel
        run  : mise run gha:validate

  publish:
    name            : 📯 Publish to PyPI
    if              : github.ref_type == 'tag'
    needs           : validate
    permissions     : { attestations: write, id-token: write }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    environment:
      name : release
      url  : https://pypi.org/p/prose-formatter

    steps:
      - *checkout

      - name : Download all artifacts
        uses : ./.github/actions/download-wheels

      - *provision-uv

      - name : Attest SLSA provenance to GitHub
        uses : actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with : { show-summary: false, subject-path: "dist/*" }

      - name : Attest PEP 740 provenance to PyPI
        uses : astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027

      - name : Publish to PyPI
        run  : mise run gha:publish

  deploy:
    name            : 🪁 Deploy
    needs           : publish
    permissions     : { actions: write }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - name : Dispatch the deploy workflow
        env:
          GH_REPO  : ${{ github.repository }}
          GH_TOKEN : ${{ github.token }}
        run  : gh workflow run deploy.yml --ref main

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [build, sdist, validate, publish]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - name : Download all artifacts
        if   : needs.build.result != 'cancelled' && needs.sdist.result != 'cancelled'
        uses : ./.github/actions/download-wheels

      - *provision-uv

      - name : Write release summary
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief release

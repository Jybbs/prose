name        : 🪻 Sweep
run-name    : 🪻 Sweep · ${{ github.ref_name }}
permissions : { contents: read }

on:
  schedule:
    - cron: '17 6 * * 1'

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  sweep:
    name            : 🔗 Sweep
    runs-on         : ubuntu-latest
    timeout-minutes : 30

    steps:
      - name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with : { save: false, shared-key: prose-build }

      - name : Provision bun
        uses : ./.github/actions/provision-bun

      - name : Build the Prose binary
        run  : mise run build bin

      - name : Restore the OG card cache
        uses : &cache-action actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key          : og-cards-${{ runner.os }}-${{ github.sha }}
          path         : .cache/og
          restore-keys : og-cards-${{ runner.os }}-

      - name : Restore the lychee cache
        uses : *cache-action
        with:
          key          : lychee-${{ runner.os }}-${{ github.sha }}
          path         : .cache/.lycheecache
          restore-keys : lychee-${{ runner.os }}-

      - name : Check off-site links
        env  : { GITHUB_TOKEN: "${{ github.token }}" }
        run  : mise run sweep

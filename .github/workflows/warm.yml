name        : 🪻 Warm
run-name    : 🪻 Warm · ${{ github.ref_name }}
permissions : { contents: read }

env:
  PARENT : ${{ github.event.before }}
  REF    : ${{ github.ref_name }}
  SHA    : ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/**
      - .github/scripts/platforms.toml
      - .github/workflows/warm.yml
      - .mise/config.toml
      - Cargo.lock
      - Cargo.toml
      - crate/Cargo.toml
      - sweeps/Cargo.toml
      - wasm/Cargo.toml

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  plan:
    name            : 🗺️ Plan
    outputs         : { matrix: "${{ steps.matrix.outputs.matrix }}" }
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - &provision-uv
        name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : Emit build matrix
        id   : matrix
        run  : mise run gha:plan

  checks:
    name            : ${{ matrix.name }}
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    strategy:
      fail-fast: false

      matrix:
        include:
          - command    : mise run rust:lint
            name       : 📎 Clippy
            shared-key : prose-clippy
          - command    : mise run rust:build
            name       : 🗜️ Build
            shared-key : prose-debug
          - command    : mise run wasm:smoke
            name       : 🪃 Browser
            save       : 'false'
            shared-key : prose-wasm
          - command    : mise run rust:upload
            name       : ☂️ Coverage
            shared-key : prose-coverage
          - command    : mise run rust:probe
            name       : 🔦 Probe
            shared-key : prose-probe

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          save       : ${{ matrix.save }}
          shared-key : ${{ matrix.shared-key }}

      - name : ${{ matrix.command }}
        env  : { CODECOV_TOKEN: "${{ endsWith(matrix.command, ':upload') && secrets.CODECOV_TOKEN || '' }}" }
        run  : ${{ matrix.command }}

  wheels:
    name            : 🔥 ${{ matrix.name }}
    needs           : plan
    runs-on         : ${{ matrix.runner }}
    timeout-minutes : 30

    strategy:
      fail-fast : false
      matrix    : ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - *checkout

      - *provision-uv

      - name : Warm the wheel build for ${{ matrix.target }}
        uses : ./.github/actions/build-wheel
        with:
          args      : ${{ matrix.args }}
          command   : build
          manylinux : ${{ matrix.manylinux }}
          name      : ${{ matrix.name }}
          target    : ${{ matrix.target }}
          upload    : 'false'

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [checks, wheels]
    permissions     : { actions: write, contents: read }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - *provision-uv

      - name              : Delete the cache entries this run replaces
        continue-on-error : true
        env               : { GH_TOKEN: "${{ github.token }}" }
        run               : mise run gha:prune

      - name : Summarize and gate
        env  : { NEEDS: "${{ toJSON(needs) }}" }
        run  : mise run gha:brief warm

name        : 🪻 Warm
run-name    : 🪻 Warm · ${{ github.ref_name }}
permissions : { contents: read }

env:
  REF : ${{ github.head_ref || github.ref_name }}
  SHA : ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .github/actions/build-wheel/**
      - .github/actions/provision-bun/**
      - .github/actions/provision-cargo/**
      - .github/actions/provision-uv/**
      - .github/actions/restore-wasm/**
      - .github/scripts/platforms.toml
      - .github/workflows/warm.yml
      - .mise/config.toml
      - .mise/lib/**
      - .mise/tasks/**
      - Cargo.lock
      - Cargo.toml
      - crate/Cargo.toml
      - site/bun.lock
      - site/package.json
      - wasm/Cargo.toml

  workflow_dispatch:

concurrency:
  cancel-in-progress : false
  group              : ${{ github.workflow }}

jobs:
  plan:
    name            : 🗺️ Plan
    outputs         : { matrix: "${{ steps.matrix.outputs.matrix }}" }
    runs-on         : &ubuntu ubuntu-latest
    timeout-minutes : &timeout 15

    steps:
      - &checkout
        name : Check out repository
        uses : actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - &provision-uv
        name : Provision uv
        uses : ./.github/actions/provision-uv

      - name : Emit build matrix
        id   : matrix
        run  : mise run gha:plan

  checks:
    name            : ${{ matrix.name }}
    env             : { CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}" }
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    strategy:
      fail-fast: false

      matrix:
        include:
          - bun-lock   : site/bun.lock
            command    : mise run bake
            name       : 🥐 Bun
          - command    : mise run lint rust
            name       : 📎 Clippy
            shared-key : prose-clippy
          - command    : mise run build && mise run build bin
            name       : 🗜️ Build
            shared-key : prose-debug
          - command    : mise run build wasm && mise run pack
            name       : 🛶 Wasm
            pack       : true
            shared-key : prose-wasm
          - bun-lock   : site/bun.lock
            command    : mise run smoke
            name       : 🪃 Browser
            save       : 'false'
            shared-key : prose-wasm
          - command    : mise run upload rust
            name       : ☂️ Coverage
            shared-key : prose-coverage

    steps:
      - *checkout

      - name : Provision Cargo
        uses : ./.github/actions/provision-cargo
        with:
          cache      : ${{ matrix.shared-key != '' }}
          save       : ${{ matrix.save }}
          shared-key : ${{ matrix.shared-key }}

      - name : Provision bun
        uses : ./.github/actions/provision-bun
        with : { cache-dependency-glob: "${{ matrix.bun-lock }}" }

      - name : Restore the wasm module
        if   : ${{ matrix.pack }}
        uses : ./.github/actions/restore-wasm

      - name : ${{ matrix.command }}
        run  : ${{ matrix.command }}

  wheels:
    name            : 🔥 ${{ matrix.name }}
    needs           : plan
    runs-on         : ${{ matrix.runner }}
    timeout-minutes : 30

    strategy:
      fail-fast : false
      matrix    : ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - *checkout

      - name : Warm the wheel build for ${{ matrix.target }}
        uses : ./.github/actions/build-wheel
        with:
          args      : ${{ matrix.args }}
          command   : build
          manylinux : ${{ matrix.manylinux }}
          name      : ${{ matrix.name }}
          target    : ${{ matrix.target }}
          upload    : 'false'

  gate:
    name            : 🗞️ Brief
    if              : always()
    needs           : [checks, wheels]
    runs-on         : *ubuntu
    timeout-minutes : *timeout

    steps:
      - *checkout

      - *provision-uv

      - name : Summarize and gate
        env:
          CHECKS : ${{ needs.checks.result }}
          WHEELS : ${{ needs.wheels.result }}
        run  : mise run gha:brief warm

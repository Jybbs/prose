[doctor.checks.clone]
description = "The clone is not shallow, since a depth-limited fetch from any worktree turns every worktree shallow"
hint        = "Run `git fetch --unshallow origin`, which restores the full history to every worktree at once."
run         = '''test "$(git rev-parse --is-shallow-repository)" = false'''

[doctor.checks.linker]
description = "The Command Line Tools are installed, supplying the linker `rustc` calls on macOS"
hint        = "Run `xcode-select --install` and finish the installer it opens."
os          = ["macos"]
run         = '''test -d "$(xcode-select --print-path)"'''

[doctor.checks.lock]
description = "`lockf` or `flock` is installed, taking the lock the corpus tasks share so no two of them sweep at once"
hint        = "Install `util-linux`, which ships `flock`."
run         = '''command -v lockf > /dev/null || command -v flock > /dev/null'''

[doctor.checks.token]
description = "mise holds a GitHub token for downloading the releases its `aqua:` and `github:` tools install from"
hint        = '''Run `mise settings set github.credential_command "gh auth token"` where `gh` is signed in, or `mise token github --oauth` to sign in through GitHub's device flow, or export `GITHUB_TOKEN`.'''
run         = '''mise token github --raw > /dev/null'''

[doctor.checks.venv]
description = "`crate/.venv` was built on the `python` this config pins"
hint        = "Remove `crate/.venv`, which mise recreates on the pinned `python` the next time it loads this config, then run `mise wheel`."
run         = '''test "$("$VIRTUAL_ENV/bin/python" -c 'import sys; print(sys.base_prefix)')" = "$(mise where python)"'''

min_version = "2026.9.12"

[env]
_.python.venv = { path = "crate/.venv", create = true }
WASM_ARTIFACT = "target/wasm32-unknown-unknown/wasm-release/prose_wasm.wasm"

[settings]
auto_install                        = false
experimental                        = true
idiomatic_version_file_enable_tools = ["node"]
lockfile_platforms                  = [
  "linux-arm64",
  "linux-x64",
  "macos-arm64",
  "macos-x64",
  "windows-arm64",
  "windows-x64"
]

[task_config.input_groups]
crate     = [
  ".mise/config.toml",
  "Cargo.lock",
  "Cargo.toml",
  "crate/Cargo.toml",
  "crate/pyproject.toml",
  "crate/src/**/*.rs",
  "crate/tests/fixtures/**/*"
]
manifests = [
  ".mise/config.toml",
  "Cargo.toml",
  "corpus/Cargo.toml",
  "crate/Cargo.toml",
  "crate/pyproject.toml",
  "site/package.json",
  "wasm/Cargo.toml"
]
site      = [
  ".mise/config.toml",
  "site/**/*",
  "!site/.vitepress/.temp/**/*",
  "!site/.vitepress/dist/**/*",
  "!site/.vitepress/tests/wasm/pkg/**/*",
  "!site/coverage/**/*",
  "!site/node_modules/**/*"
]
wasm      = [
  ".mise/config.toml",
  ".mise/lib/wasm.bash",
  ".mise/tasks/wasm/build",
  ".mise/tasks/wasm/pack",
  "Cargo.lock",
  "Cargo.toml",
  "crate/Cargo.toml",
  "crate/src/**",
  "wasm/**"
]

[tools]
"aqua:WebAssembly/binaryen"    = "132"
"aqua:lycheeverse/lychee"      = "0.24.2"
"aqua:mitsuhiko/insta"         = "1.48.0"
"aqua:taiki-e/cargo-llvm-cov"  = "0.9.0"
bun                            = "1.4.2"
"cargo:cargo-bloat"            = { version = "0.12.1", lazy = true, lazy_bins = ["cargo-bloat"] }
"cargo:cargo-llvm-lines"       = { version = "0.4.46", lazy = true, lazy_bins = ["cargo-llvm-lines"] }
"cargo:samply"                 = { version = "0.13.1", lazy = true, lazy_bins = ["samply"] }
"cargo:twiggy"                 = { version = "0.8.0", lazy = true, lazy_bins = ["twiggy"] }
"github:bnjbvr/cargo-machete"  = "0.9.2"
"github:rustwasm/wasm-bindgen" = "0.2.128"
"github:sharkdp/hyperfine"     = { version = "1.20.0", lazy = true, lazy_bins = ["hyperfine"] }
maturin                        = "1.15.0"
"pypi:codecov-cli"             = "11.3.1"
python                         = "3.14.6"
rust                           = { version = "1.98.1", components = "clippy, rustfmt", profile = "minimal", targets = "wasm32-unknown-unknown" }
uv                             = "0.12.10"

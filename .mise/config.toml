min_version = "2026.6.11"

[env]
WASM_ARTIFACT = "target/wasm32-unknown-unknown/wasm-release/prose_wasm.wasm"

[settings]
auto_install                        = false
idiomatic_version_file_enable_tools = ["node"]
python.uv_venv_auto                 = "create|source"

[tools]
"aqua:lycheeverse/lychee"      = "0.24.2"
"aqua:mitsuhiko/insta"         = "1.48.0"
"aqua:taiki-e/cargo-llvm-cov"  = "0.8.7"
"aqua:wasm-bindgen/wasm-pack"  = "0.15.0"
bun                            = "1.3.14"
"github:bnjbvr/cargo-machete"  = "0.9.2"
"github:rustwasm/wasm-bindgen" = "0.2.127"
maturin                        = "1.14.1"
"pipx:codecov-cli"             = "11.3.1"
python                         = "3.14"
rust                           = { version = "1.97.1", components = "clippy, rustfmt", profile = "minimal", targets = "wasm32-unknown-unknown" }
uv                             = "0.12.3"

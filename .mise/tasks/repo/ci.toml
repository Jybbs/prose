["repo:ci"]
alias       = "ci"
description = "Full local CI sweep"
run         = [
  "mise doctor project",
  { tasks = [
    "lock:check",
    "py:lint",
    "repo:audit",
    "repo:lint",
    "rust:check",
    "rust:cruft",
    "rust:lint",
    "rust:proof",
    "rust:suite",
    "rust:unused",
    "site:coverage",
    "site:cruft",
    "site:links",
    "site:lint",
    "site:press",
    "site:render",
    "site:sweep",
    "site:typecheck",
    "wasm:lint",
    "wasm:smoke"
  ] },
  { task = "rust:wheel" }
]

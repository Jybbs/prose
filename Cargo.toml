[workspace]
members  = ["crate", "wasm"]
resolver = "3"

[workspace.dependencies]
assert_matches = "1"

[workspace.package]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/Jybbs/prose"
rust-version = "1.96"

[profile.release]
panic = "abort"
strip = "symbols"

[profile.wasm-release]
inherits = "release"
strip    = "debuginfo"

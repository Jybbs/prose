[workspace]
members  = ["corpus", "crate", "wasm"]
resolver = "3"

[workspace.dependencies]
clap                  = { version = "4.6.7", features = ["derive"] }
fs-err                = "3.3.1"
ignore                = "0.4.33"
itertools             = "0.15.0"
rayon                 = "1.12.0"
ruff_diagnostics      = "=0.0.5"
ruff_notebook         = "=0.0.5"
ruff_python_ast       = "=0.0.5"
ruff_python_formatter = "=0.0.5"
ruff_python_literal   = "=0.0.5"
ruff_python_parser    = "=0.0.5"
ruff_python_stdlib    = "=0.0.5"
ruff_python_trivia    = "=0.0.5"
ruff_source_file      = "=0.0.5"
ruff_text_size        = "=0.0.5"
rustc-hash            = "2.1.3"
serde                 = { version = "1.0.229", features = ["derive"] }
serde_json            = "1.0.151"

[workspace.lints.clippy]
nonminimal_bool          = "warn"
overly_complex_bool_expr = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace.package]
edition      = "2024"
license      = "MIT"
repository   = "https://github.com/Jybbs/prose"
rust-version = "1.98.1"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package]
insta              = { opt-level = 2 }
prose              = { codegen-units = 16 }
ruff_python_ast    = { opt-level = 2 }
ruff_python_parser = { opt-level = 2 }
ruff_python_trivia = { opt-level = 2 }
ruff_source_file   = { opt-level = 2 }
similar            = { opt-level = 2 }

[profile.probe]
debug-assertions = true
inherits         = "release"
lto              = false
overflow-checks  = true
panic            = "unwind"
strip            = "none"

[profile.profiling]
debug    = "full"
inherits = "release"
lto      = false
strip    = "none"

[profile.release]
codegen-units = 16
lto           = "fat"
panic         = "abort"
strip         = "symbols"

[profile.release.package]
ruff_python_ast    = { codegen-units = 1 }
ruff_python_parser = { codegen-units = 1 }

[profile.wasm-release]
codegen-units = 1
inherits      = "release"
lto           = false
strip         = "debuginfo"

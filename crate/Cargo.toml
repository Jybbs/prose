[package]
categories             = ["development-tools"]
description            = "A Python typesetter for the reader."
edition.workspace      = true
keywords               = ["formatter", "linter", "python", "style"]
license.workspace      = true
name                   = "prose"
readme                 = "../README.md"
repository.workspace   = true
rust-version.workspace = true
version                = "0.9.1"

[package.metadata.ruff]
release = "0.15.22"

[[bin]]
name              = "prose"
required-features = ["native"]

[lib]
doctest = false

[features]
default = ["native"]
native  = [
    "dep:annotate-snippets",
    "dep:anstream",
    "dep:anstyle",
    "dep:anstyle-query",
    "dep:anyhow",
    "dep:blake3",
    "dep:clap",
    "dep:clap_complete",
    "dep:dirs",
    "dep:fluent-uri",
    "dep:ignore",
    "dep:lsp-server",
    "dep:lsp-types",
    "dep:mimalloc",
    "dep:postcard",
    "dep:rayon",
    "dep:serde-sarif",
    "dep:similar",
    "dep:tempfile",
]

[lints]
workspace = true

[dependencies]
annotate-snippets   = { version = "=0.12.16", optional = true }
anstream            = { version = "1.0.0", optional = true }
anstyle             = { version = "1.0.14", optional = true }
anstyle-query       = { version = "1.1.5", optional = true }
anyhow              = { version = "1.0.104", optional = true }
blake3              = { version = "1.8.7", optional = true }
clap                = { workspace = true, optional = true }
clap_complete       = { version = "4.6.11", optional = true }
dirs                = { version = "6.0.0", optional = true }
fluent-uri          = { version = "0.4.1", optional = true }
fs-err              = { workspace = true }
globset             = "0.4.20"
heck                = "0.5.0"
ignore              = { workspace = true, optional = true }
indexmap            = { version = "2.14.2", features = ["serde"] }
itertools           = { workspace = true }
lsp-server          = { version = "0.10.0", optional = true }
lsp-types           = { version = "0.97.0", optional = true }
memchr              = "2.8.3"
mimalloc            = { version = "0.1.52", optional = true }
postcard            = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
rayon               = { workspace = true, optional = true }
ruff_diagnostics    = { workspace = true, features = ["serde"] }
ruff_notebook       = { workspace = true }
ruff_python_ast     = { workspace = true, features = ["schemars", "serde"] }
ruff_python_literal = { workspace = true }
ruff_python_parser  = { workspace = true }
ruff_python_stdlib  = { workspace = true }
ruff_python_trivia  = { workspace = true }
ruff_source_file    = { workspace = true, features = ["serde"] }
ruff_text_size      = { workspace = true, features = ["serde"] }
rustc-hash          = { workspace = true }
schemars            = "1.2.2"
serde               = { workspace = true }
serde-sarif         = { version = "0.8.0", optional = true }
serde_ignored       = "0.1.14"
serde_json          = { workspace = true }
similar             = { version = "3.2.0", optional = true }
smallvec            = { version = "1.16.1", features = ["serde"] }
tempfile            = { version = "3.27.0", optional = true }
textwrap            = { version = "0.16.4", default-features = false, features = ["smawk", "unicode-width"] }
thiserror           = "2.0.21"
toml                = "1.1.6"
unicode-width       = "0.2.2"

[dev-dependencies]
assert_cmd            = "2.2.2"
indoc                 = "2.0.7"
insta                 = { version = "1.48.0", features = ["glob", "yaml"] }
proptest              = "1.11.0"
rstest                = "0.26.1"
ruff_python_formatter = { workspace = true }

[build-system]
build-backend = "maturin"
requires      = ["maturin==1.15.0"]

[project]
authors         = [{ name = "Jybbs" }]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance"
]
description     = "A Python typesetter for the reader."
dynamic         = ["version"]
keywords        = [
    "alignment",
    "code-quality",
    "developer-tools",
    "formatter",
    "linter",
    "python",
    "rust",
    "static-analysis",
    "typesetting"
]
license         = "MIT"
name            = "prose-formatter"
readme          = "../README.md"
requires-python = ">=3.10"

[project.urls]
changelog = "https://github.com/Jybbs/prose/releases"
homepage  = "https://prose.fyi"
issues    = "https://github.com/Jybbs/prose/issues"
source    = "https://github.com/Jybbs/prose"

[dependency-groups]
test = ["pytest", "pytest-subprocess"]

[tool.maturin]
bindings = "bin"
strip    = true

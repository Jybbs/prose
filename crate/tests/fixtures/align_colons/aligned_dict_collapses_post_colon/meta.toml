[docs]
previewable = true
title       = "An Aligned Dict Collapses the Gap after Its Colons"

description = '''
Both entries of `config` were padded by hand after the `:`, so `"a":   1` and `"bbb":   2` carry extra spaces on the value side. Aligning the `:` column also **collapses the spaces after each colon to exactly one**, so the rows land as `"a"   : 1` and `"bbb" : 2` with the stray padding gone.
'''

previewable = true
title       = "Function-Signature Annotations Align inside the Parameter List"

description = '''
The four annotated parameters of `dispatch` settle their `:` onto a shared column at the width of the widest name, `request_id`, so `user`, `priority`, and `timeout` each gain padding before the colon. The `:` after `-> Response` closes the signature rather than annotating a parameter, so it **stays untouched**.
'''

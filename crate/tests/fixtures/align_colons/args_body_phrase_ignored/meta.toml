[docs]
previewable = true
title       = "Docstring Args Blocks Align the Parameter-Name Column"

description = '''
The docstring of `emit` contains the text `Args:` twice, once inside a prose sentence and once as the real section header. **Only the section header starts an alignable block**, so the prose mention stays as written whereas `channel`, `severity`, and `payload` beneath the header align on one `:` column.
'''

[docs]
previewable = false
title       = "Bracketed Generics Inside a Type Keep the Outer Colon"

description = '''
Each `Args:` entry of `index` pairs its name with a parenthesized type that itself contains a bracketed generic, such as `List[Tuple[int, str]]`. **The rule aligns on the `:` after each closing paren** rather than on any punctuation inside the type, because it tracks both `()` and `[]` nesting while reading an entry, so the names, the types, and the colons settle into three shared columns.
'''

[docs]
previewable = false
title       = "Bracketed Generics in Arg Types Do Not Fool the Detector"

description = '''
Each `Args:` entry of `index` pairs its name with a parenthesized type holding a bracketed generic, `List[Tuple[int, str]]`, `Dict[str, int]`, and `Dict[str, str]`. The detector tracks both `()` and `[]` nesting while scanning an entry, so **alignment anchors on the `:` after each closing paren** rather than on any punctuation inside the type.
'''

previewable = false
title       = "Parenthesized Type Hints Sit Before the Aligned Colon"

description = '''
The `Args:` entries of `schedule` carry Google-style parenthesized type hints, `(float)`, `(str)`, and `(int)`. **The rule aligns on the `:` after each closing paren**, reading past the `(...)` group to find the entry's separator, so the names, the types, and the colons settle into three shared columns.
'''

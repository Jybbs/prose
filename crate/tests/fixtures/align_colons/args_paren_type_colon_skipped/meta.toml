[docs]
previewable = false
title       = "Parenthesized Type Hints Hide Their Inner Colons"

description = '''
The `Args:` entries of `schedule` carry Google-style parenthesized type hints, `(float)`, `(str)`, and `(int)`. The detector skips past each `(...)` group, so **alignment anchors on the `:` after the closing paren**, and the names, the types, and the colons settle into three shared columns.
'''

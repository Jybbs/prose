[docs]
previewable = false
title       = "A Line Opening With Punctuation Is Left Out of the Group"

description = '''
One line in the `Args:` block of `render` opens with a bare `:` rather than an identifier, so it does not parse as an entry. **The rule leaves that line out of the alignment group**, so it stays as written whereas `template`, `context`, and `partials` around it still align on one `:` column.
'''

[docs]
previewable = false
title       = "Malformed Arg Line Starting With Punctuation Is Skipped"

description = '''
One line in the `Args:` block of `render` opens with a bare `:` rather than an identifier, so it does not parse as an entry. The rule **drops that line from the alignment group**, leaving it untouched while `template`, `context`, and `partials` around it still align on one `:` column.
'''

[docs]
previewable = false
title       = "Variadic Arg Entries Align Beside Named Ones"

description = '''
The `Args:` section of `emit` lists `*args` and `**kwargs` beside the named entry `channel`. A leading `*` is a valid start for an entry line, so **the variadic entries join the alignment group** and all three colons sit on the column set by `**kwargs`, the widest name.
'''

[docs]
previewable = false
title       = "An At-Cap Member Holds the Group Tight"

description = '''
Aligning these two aliases would insert the one-space buffer before each `:`, and the `WSGIApplication` line already sits at the line cap, so the buffer would push it past the budget. **A group whose widest member sits at the cap skips alignment entirely**, leaving both rows in their tight `WSGIEnvironment: TypeAlias` form.
'''

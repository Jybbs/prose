[docs]
previewable = false
title       = "A Member at the Line Cap Keeps the Group Unpadded"

description = '''
The `WSGIApplication` line already sits at the line cap, and aligning the two aliases would insert the one-space buffer before each `:` and push that line past the budget. **A group whose widest member sits at the cap gets no alignment at all**, so both rows keep their tight `WSGIEnvironment: TypeAlias` form.
'''

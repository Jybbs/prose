previewable = false
title       = "An Unbroken Annotated Field Run Aligns as One Block"

description = '''
The body of `User` is an unbroken run of five annotated fields at one indent, from `id` through `is_active`. Nothing interrupts the run, so **the whole body aligns as a single block**, every `:` settling on the column set by `is_active`, the widest name.
'''

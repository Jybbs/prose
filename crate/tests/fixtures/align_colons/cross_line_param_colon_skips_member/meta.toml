[docs]
previewable = false
title       = "A Parameter Whose Colon Starts the Next Line Leaves the Group"

description = '''
The parameter `a` puts its `:` at the start of the line after its name, so no colon sits on the name's own line. **The rule leaves `a` out of the alignment group**, so both of its lines stay as written whereas `bb` and `cccc` below it align on one column.
'''

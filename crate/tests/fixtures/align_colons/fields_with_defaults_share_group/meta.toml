[docs]
previewable = false
title       = "Bare and Defaulted Fields Share One Group"

description = '''
The body of `Settings` mixes bare annotated fields like `timeout: int` with defaulted ones like `debug: bool = False`. Both shapes carry the `name: type` structure the rule anchors on, so **all five fields share one alignment group** and every `:` lands on the column set by `log_level`.
'''

[docs]
previewable = false
title       = "A Flush Paren Keeps Its Call Shape"

description = '''
The docstring heads `divmod(self, other)` and `trunc(self)` press the `(` flush against the name, the shape of a call signature rather than a `name (type)` entry. No type column opens, so each call keeps the shape its author wrote, and the `:` column still settles across the run because the padding lands after the `)`.
'''

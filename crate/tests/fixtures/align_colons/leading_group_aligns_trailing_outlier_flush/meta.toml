title       = "A Leading Group Aligns While the Trailing Outlier Stays Flush"

description = '''
The keys `"name"`, `"host"`, and `"port"` sit within `max-shift` of each other and **align as one column**. Reaching the width of `"deeply_nested_fallback_descriptor"` would overshoot the cap, so that trailing key breaks off into its own group of one and keeps its `:` flush against the name.
'''

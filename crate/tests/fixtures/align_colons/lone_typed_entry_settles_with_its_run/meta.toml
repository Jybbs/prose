previewable = false
title       = "A Lone Type Group Settles Beside Untyped Siblings"

description = '''
Only `beta` in this `Args:` block carries a parenthesized type, so there is no second typed entry to form a shared type column with.

The padded gap in `beta  (int)` therefore **collapses to a single space**, and the `:` column seats across all three entries with `beta (int)` as the widest head.
'''

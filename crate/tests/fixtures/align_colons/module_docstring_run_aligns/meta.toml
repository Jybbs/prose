[docs]
previewable = false
title       = "A Module Docstring Aligns Like Any Other"

description = '''
This docstring belongs to the module itself rather than to a class or function. **The rule reads it the same way**, so the `Attributes:` entries `host` and `retry_budget` align their type and `:` columns as a section, and the sectionless `handler` and `codec` run below the blank line resolves its own columns in the same way.
'''

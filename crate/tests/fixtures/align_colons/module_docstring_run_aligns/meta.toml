[docs]
previewable = false
title       = "A Module Docstring Aligns Like Any Other"

description = '''
This docstring belongs to the module itself rather than to a class or function, and the colon walker reaches it all the same. The `Attributes:` entries `host` and `retry_budget` settle their type and `:` columns as a section, and the sectionless `handler` and `codec` run below the blank line resolves its own columns the same way.
'''

description = '''
The field `primary` opens a multi-line dict literal as its value, which **breaks the alignment group** inside `C`. The following `secondary` lands in a group of one and keeps its tight `secondary: str` form, while `"alpha"` and `"beta"` align independently inside the inner dict.

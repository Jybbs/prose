title       = "A Multi-Line Field Value Breaks the Group"

description = '''
The field `primary` opens a multi-line dict literal as its value. **That value breaks the alignment group inside `C`**, so the following `secondary` is a group of one and keeps its tight `secondary: str` form, whereas `"alpha"` and `"beta"` align independently inside the inner dict.
'''

[docs]
previewable = false
title       = "A Hand-Widened Type Gap Tightens Onto the Column"

description = '''
The author spaced every `(` out past the widest name, so `host      (str)` and `port      (int)` carry a gap wider than the column needs. **Both parens tighten onto the single space the column leaves**, and the `:` aligns just past them, because the type column pulls a gap left as readily as it pushes one right.
'''

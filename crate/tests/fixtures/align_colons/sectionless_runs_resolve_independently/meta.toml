[docs]
previewable = false
title       = "Each Sectionless Run Settles Its Own Two Columns"

description = '''
The docstring of `Frame` holds two runs of type-bearing heads with an ordinary prose line between them, which breaks the runs apart. `handler` and `codec` measure their own type and `:` columns above the prose, and `deadline` and `tag` measure theirs below it, so the wide `(Callable)` never pushes the lower run's columns out.
'''

title       = "A Skip-Held Entry Bridges the Alignment Run"

description = '''
The `"port"` entry carries a `# prose: skip[align-colons]` suppression, so it drops out of the alignment group and keeps its tight spacing untouched. `"host"` and `"timeout"` bridge across the held line and align on the shared `:` column the two of them set.

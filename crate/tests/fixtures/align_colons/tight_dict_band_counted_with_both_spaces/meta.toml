[docs]
previewable = true
title       = "A Tight Dict Band Is Measured With Both Inserted Spaces"

description = '''
Every entry of `paths` sits flush against its `:`, so aligning them inserts one space before each colon and another after it.

**Both inserted spaces count toward the budget.** At the shared column that puts the `"label"` row, with its long `"docs/annual-summary.html"` value, one column past the 42-column limit, so that row partitions out of the run. It keeps its colon flush as a lone entry, while `"verbose"` and `"dry"` align beneath it.
'''

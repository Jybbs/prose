[docs]
previewable = false
title       = "A Trailing Comment Keeps the Column In"

description = '''
The `"low"` row's long trailing comment already runs past the line budget before any padding. **The column cannot push that row further right than the one-space buffer alignment itself inserts**, so `"low"` and `"mid"` align at that minimal column while the widest key `"high"` partitions off and stays flush, leaving the `"low"` line one column longer than the comment alone already made it.
'''

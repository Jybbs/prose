[docs]
previewable = false
title       = "A Head Directly Under a Paragraph Joins No Run"

description = '''
The lines `handler (Callable):` and `codec (bytes):` sit directly under the opening summary paragraph of `Frame` with no blank line between them. **Nothing moves**, because the docstring entry reader takes them as continuation lines of that paragraph rather than as entry heads, so `align-colons` opens no run there and the source passes through unchanged.
'''

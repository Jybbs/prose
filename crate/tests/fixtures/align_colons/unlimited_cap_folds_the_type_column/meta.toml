[docs]
previewable = false
title       = "An Unlimited Cap Aligns the Type Column However Wide the Name"

description = '''
Under the default `max-shift` cap, the wide `deadline_after_first_handshake_attempt` would partition out of the type column. With `max-shift = false` in `config.toml` the spread limit is removed, so **`(str)`, `(int)`, and `(float)` sit on one column however far the widest name reaches**, and the `:` column aligns just past them.
'''

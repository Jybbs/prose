[docs]
previewable = true
title       = "An Entry Naming No Type Still Reaches the Colon Column"

description = '''
The entry `plain` carries no parenthesized type, so it joins no type-group column, having no `(` to seat there. `host (str)` and `retry_budget (int)` open their parens on a shared column, and the `:` of `plain` still pads out to the same colon column all three entries share.
'''

description = '''
The `connection_timeout` line already runs past `code-line-length`, and padding `host` out to its width pushes the `host` line past it as well. **The section still aligns as one column**, because docstring contexts resolve under no line cap, whereas the dict, annotation, and parameter contexts resolve within `code-line-length`.

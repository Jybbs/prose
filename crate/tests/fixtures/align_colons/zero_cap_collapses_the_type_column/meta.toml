[docs]
previewable = false
title       = "A Zero Cap Collapses the Type Column Too"

description = '''
`config.toml` sets `max-shift = 0` and the `Attributes:` section of `Session` arrives hand-padded. **The type column collapses along with the `:` column**, so the padded `host      (str)  :` row shrinks to `host (str):`, where each `(` sits one space past its own name and each `:` sits flush against the closing paren.
'''

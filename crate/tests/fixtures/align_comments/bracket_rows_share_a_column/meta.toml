[docs]
previewable = true
title       = "Annotated Collection Entries Share a Column"

description = '''
The `RETRY_DELAYS` list holds one entry per line, and because `1`, `30`, and `3600` differ in width, each trailing comment starts somewhere new. The entries sit at one indent on consecutive lines, so their comments form one run and settle on a single column, the notes reading as a second column beside the values.
'''

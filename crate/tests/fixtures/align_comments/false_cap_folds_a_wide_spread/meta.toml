[docs]
previewable = true
title       = "A `false` Cap Aligns a Wide Spread on One Column"

description = '''
`seed()` and `reconcile_every_pending_shipment_record()` each carry a trailing comment, and the case runs with `max-shift = false`. **The `#` after `seed()` moves all the way out to the column `reconcile_every_pending_shipment_record()` sets**, rather than falling back to the two-space minimum, because `false` removes the limit on how much padding one row may take, so a run the default limit would split aligns on one column.
'''

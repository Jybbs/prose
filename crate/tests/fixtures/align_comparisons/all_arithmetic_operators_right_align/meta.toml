previewable = false
title       = "Every Comparison Operator Right-Aligns in One Group"

description = '''
The `and` chain compares `a` through `f` with `==`, `!=`, `<`, `<=`, `>`, and `>=`, one operator per row. **Every operator right-aligns in one group**, so the last character of each sits in the shared column and the one-character `<` and `>` sit one column further right than the two-character operators.
'''

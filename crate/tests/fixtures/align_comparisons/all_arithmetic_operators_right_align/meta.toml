previewable = false
title       = "All Six Comparison Operators Right-Align in One Group"

description = '''
The `and` chain compares `a` through `f` using all six comparison operators, `==`, `!=`, `<`, `<=`, `>`, and `>=`, and they align in one group with **right-alignment**. Each operator's last character sits in the shared column, so the single-character `<` and `>` sit one column deeper than the two-character forms.
'''

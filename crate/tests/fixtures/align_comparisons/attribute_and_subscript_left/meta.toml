previewable = false
title       = "An Attribute or Subscript Left Operand Joins the Group"

description = '''
The left operands are the attribute access `foo.attr`, the subscript `bar[0]`, and the bare name `qux`. **An attribute access or a subscript joins the alignment group the same way a plain name does**, its full width counting toward the shared `==` column, so all three rows align as one group.
'''

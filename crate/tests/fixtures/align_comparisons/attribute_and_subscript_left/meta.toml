[docs]
previewable = false
title       = "Attribute and Subscript Left Sides Qualify"

description = '''
An **attribute access or subscript on the left side qualifies** for the alignment group the same way a plain name does. `foo.attr`, `bar[0]`, and the bare `qux` all count their full width toward the shared `==` column, so all three rows align as one group.
'''

[docs]
previewable = false
title       = "Operands Split by a Backslash Share No Column"

description = '''
The chain is split by a backslash continuation, so `filename in breaks` starts after `result = ` and `lineno in breaks[filename]` starts at the continuation indent. **The two operands share no column**, because their left edges start at different screen columns, so neither `in` is padded and the source passes through unchanged.
'''

title       = "A Chain Inside a Comprehension Filter Aligns"

description = '''
The `if` filter of the `filtered` comprehension carries a multi-line `and` chain over `x.kind` and `x.weight`. **The chain aligns like any other multi-line `BoolOp`**, so the two `==` move to one column inside the filter's parentheses.
'''

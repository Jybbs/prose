previewable = true
title       = "A Chained Compare Anchors on Its First Operator"

description = '''
The chained compare `0 < bar < 100` **anchors on its first operator**, so only that `<` moves into the column shared with the `==` rows for `foo` and `qux`. The second `<` stays in place and takes no part in the column math.
'''

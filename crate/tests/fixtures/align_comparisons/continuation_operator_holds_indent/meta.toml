previewable = false
title       = "A Continuation-Line Operator Holds Its Indent"

description = '''
The `in` of `"supports_collation" in model.required_features` opens a continuation line, leaving its left side on the line above. **The cross-line operand drops out of the run** rather than aligning against `collation is None`, so every line keeps its indentation untouched.
'''

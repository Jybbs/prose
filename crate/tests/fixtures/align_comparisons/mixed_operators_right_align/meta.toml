[docs]
previewable = true
title       = "Mixed-Width Operators Right-Align on the Shared Column"

description = '''
The `==` rows for `foo` and `bar_baz` and the `<` rows for `qux` and `quux` share one aligned group. The mixed-width operators **right-align**, so the second `=` of each `==` and each single-character `<` land in the same column.
'''

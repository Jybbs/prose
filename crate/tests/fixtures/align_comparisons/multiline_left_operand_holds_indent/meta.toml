[docs]
previewable = false
title       = "A Multi-Line Left Operand Holds Its Indent"

description = '''
The left operand `(a + b)` spans two lines, so its `==` sits on a later line than the one where the operand opens. **The cross-line operand drops out of the run**, leaving the single-line `dd == e` alone and unpadded.
'''

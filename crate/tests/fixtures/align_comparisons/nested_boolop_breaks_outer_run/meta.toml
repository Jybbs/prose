previewable = false
title       = "A Nested BoolOp Breaks the Outer Run"

description = '''
The parenthesized `or` chain nested inside the `and` chain **breaks the outer run**, since its multi-line range separates `foo == 1` from `qux == 4` and neither takes padding. The inner chain still aligns on its own, so `bar` pads out to meet `baz_long`'s `==`.
'''

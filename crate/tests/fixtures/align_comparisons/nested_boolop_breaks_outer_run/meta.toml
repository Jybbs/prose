title       = "A Nested Chain Ends the Outer Run and Aligns on Its Own"

description = '''
A parenthesized `or` chain sits between `foo == 1` and `qux == 4` inside the outer `and` chain. **The nested chain's multi-line range ends the outer run**, so neither `foo` nor `qux` takes padding, whereas the inner chain aligns on its own and `bar` pads out to `baz_long`'s `==`.
'''

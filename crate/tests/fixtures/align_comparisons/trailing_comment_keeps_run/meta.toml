[docs]
previewable = false
title       = "A Trailing Comment Keeps the Run Intact"

description = '''
The `# trailing` comment after `foo == 1` **does not break the alignment run**, since the three operands still sit on adjacent source lines. The `==` for `foo`, `bar_baz`, and `qux` settle into one column, whereas a comment ends a run only when it takes a line of its own.
'''

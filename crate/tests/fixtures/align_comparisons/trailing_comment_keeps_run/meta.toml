[docs]
previewable = false
title       = "A Trailing Comment Keeps the Run Together"

description = '''
The comment `# trailing` sits at the end of the `foo == 1` row rather than on a line of its own. **The trailing comment keeps the run together**, because the three operands still sit on adjacent source lines, so the `==` for `foo`, `bar_baz`, and `qux` move to one column. A comment ends a run only when it takes a line of its own.
'''

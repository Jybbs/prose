previewable = false
title       = "Flush Annotated Assignments Gain Their Spaces and Align"

description = '''
`x: int=1` and `name: str=2` arrive with no space on either side of the `=`. **Both `=` move to the column one space past `name: str` and gain a space before each value**, so the two lines read `x: int    = 1` and `name: str = 2`.
'''

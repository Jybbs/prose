previewable = false
title       = "An Augmented Assignment Aligns Inside an Indented Body"

description = '''
Inside `def tally`, `width += len(rows)` sits between `total = 0` and `count = 1`. **The `+` of `+=` counts toward the name's width, so all three `=` share one column**, and the indented run aligns the same way a module-level run does.
'''

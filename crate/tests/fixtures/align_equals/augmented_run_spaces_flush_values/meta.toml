[docs]
previewable = false
title       = "Flush Augmented Assignments Gain Their Spaces and Align"

description = '''
`x+=1` and `yy+=2` arrive with no space on either side of the `+=`. **Both `=` move to one column and each value gains a space after the operator**, so `x+=1` becomes `x  += 1` with its `+` one column before the shared `=`.
'''

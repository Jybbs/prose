[docs]
previewable = false
title       = "A Flush Augmented Run Spaces Its Values"

description = '''
`x+=1` and `yy+=2` arrive with their `+=` flush on both sides. Each gains the one-space value-side buffer past the full operator, so `x+=1` becomes `x  += 1` with its `=` in the shared column and the `+` one column before it.
'''

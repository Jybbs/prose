[docs]
previewable = false
title       = "A Backslash Continuation Drops the Assignment From the Group"

description = '''
`foo` is split from its `=` by a backslash continuation, so the `=` sits on the next line, with `bar = 2` beneath it. **The continued assignment leaves the group**, and `bar = 2` has no partner left to align with, so the source passes through unchanged.
'''

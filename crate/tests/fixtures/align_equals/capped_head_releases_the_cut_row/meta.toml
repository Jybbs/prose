[docs]
previewable = false
title       = "A Row at the Line Cap Stays Unpadded While the Rows Below It Align"

description = '''
Inside `layout`, `help_position = min(self.maxlen, 24)` already fills the 40-column `code-line-length`, and the four assignments below it are narrower. Padding `help_position` out to `header_no_color`'s column would push it past the cap, so **the first row keeps its single space and the four rows beneath it align on one column** set by `header_no_color`.
'''

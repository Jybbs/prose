[docs]
previewable = true
title       = "Comments Reset the Group, like Blank Lines"

description = '''
`alpha` and `beta` sit above the `# break` comment, with `long_name` and `short` below it. **The comment splits the assignments into two independent groups**, exactly as a blank line would, so `beta` aligns against `alpha` on one `=` column while `short` pads out to the wider `long_name` on another.
'''

[docs]
previewable = false
title       = "Cross-Indent Keywords Take a Buffer"

description = '''
`host` sits on the same line as the `connect(` opener, whereas `port` begins its own line at a deeper indent. **Keywords whose lines carry differing indents are never grouped into one `=` column**, so each takes a single space around its `=` instead, landing as `host = "localhost"` above `port = 8080`.
'''

[docs]
previewable = false
title       = "Keywords at Different Indents Each Take a Single Space"

description = '''
`host` shares the line with the `connect(` opener, whereas `port` starts its own line at a deeper indent. **Keywords whose lines start at different indents never share one `=` column**, so each takes one space on either side of its `=` instead, reading `host = "localhost"` above `port = 8080`.
'''

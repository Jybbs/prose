[docs]
previewable = false
title       = "A `**` Unpacking Ends the Keyword Run"

description = '''
`**base` is an unpacking rather than a keyword, so it **ends the keyword run** the same way a positional argument would. `name` and `tag` above it still align on a shared `=` column, while `extra` below it stands alone and takes the single-space `extra = "z"` form instead.
'''

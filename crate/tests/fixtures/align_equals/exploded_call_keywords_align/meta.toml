description = '''
The `connect` call is already exploded, one keyword per line, with `host`, `port`, and `use_tls` each written tight as `name=value`. Padding lands between each keyword name and its `=`, so all three rows share one `=` column, with the widest name, `use_tls`, setting where that column falls.

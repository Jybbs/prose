previewable = false
title       = "A Skip-Held Keyword Bridges Its Neighbors"

description = '''
The `# prose: skip[align-equals]` comment holds `port=8080` exactly as written, so **the held row keeps its tight spacing while the rows around it align across it**. `host` and `debug` still share one `=` column, as they would if the skipped line did not sit between them.
'''

previewable = false
title       = "A Skipped Keyword Stays Tight While Its Neighbors Align Across It"

description = '''
`port=8080` carries a trailing `# prose: skip[align-equals]` between `host` and `debug` inside `configure`. **The skipped row keeps its tight spacing, and `host` and `debug` still share one `=` column**, as they would if the skipped line were not between them.
'''

[docs]
previewable = false
title       = "Keyword Widening Splits the Statement Run"

description = '''
`formatter` would need eight spaces of padding to share `label_width_total`'s `=` column, and its first line also grows as the `Formatter` call's own keywords gain their spacing.

The line-cap check reads each row **at its final width, counting both the padding and the keyword widening**. The row would overflow, so `formatter` splits out of the statement run and keeps its `=` tight, while `offset_column_padding` and `display_width` still align inside the call.
'''

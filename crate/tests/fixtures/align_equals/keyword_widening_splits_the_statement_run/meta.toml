[docs]
previewable = false
title       = "Keyword Spacing Counts Toward the Fit Check and Splits the Statement Run"

description = '''
`formatter = Formatter(...)` sits below `label_width_total = 4`, and the `Formatter` call's own keywords gain spacing around their `=` in the same run. The fit check measures each row **at its final width, padding and keyword spacing both counted**, so `formatter` would overflow the budget if padded out to `label_width_total`'s column. `formatter` therefore keeps its single space, whereas `offset_column_padding` and `display_width` still align inside the call.
'''

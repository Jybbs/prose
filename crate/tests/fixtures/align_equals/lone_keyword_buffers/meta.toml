previewable = false
title       = "A Lone Exploded Keyword Gains a Space on Each Side of Its `=`"

description = '''
`handler=on_event` is the only keyword inside the exploded `register` call, so there is no column for it to join. **Its `=` still gains a space on each side**, because a keyword alone on its line reads as `name = value`, whereas a packed keyword stays tight.
'''

[docs]
previewable = false
title       = "A Parameter Without a Default Splits the Run"

description = '''
`flag: bool` carries no default and sits between `x: int = 1` and `verbose: bool = True` in `f`'s signature. **The parameter without a default splits the run**, leaving `x` and `verbose` alone on either side of it, so neither pads out and `x: int = 1` keeps its single space.
'''

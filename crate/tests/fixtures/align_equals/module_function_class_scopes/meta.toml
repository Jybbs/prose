`outer` and `answer` sit at module level, `x` and `quux` inside `foo`, and `a`, `bb`, and `ccc` in the body of `Bar`. **Each scope forms its own independent group**, so the three settle on three separate `=` columns, and no column reaches across a scope boundary.

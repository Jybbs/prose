[docs]
previewable = true
title       = "Multi-Line Annotations Break the Alignment Run"

description = '''
`fn`'s `Callable[...]` annotation spans several lines before its `=` arrives, and **the multi-line parameter breaks the run**, cutting `host` off from `timeout`. Each neighbor is left a singleton, so `host: str = "localhost"` and `timeout: float = 30.0` keep their natural widths even though the two would align if grouped.
'''

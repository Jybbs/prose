[docs]
previewable = false
title       = "A Multi-Line Augmented Target Skips the Member"

description = '''
`data[...]` spreads its subscript target across three lines before the `+=`, so that statement is skipped outright and its `]+=2` keeps its tight spacing. The skip also breaks the run, leaving `count` and `total` as singletons on either side, each normalizing to `count += 1` and `total += 3` without sharing a column.
'''

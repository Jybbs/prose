[docs]
previewable = false
title       = "A Multi-Line Value Ends the Assignment Run"

description = '''
`PRIMARY`'s value is an exploded dict spanning several lines, and `SECONDARY = 3` follows it. **The multi-line value ends the run**, so `SECONDARY` stands alone, and `PRIMARY` never pads out to the wider name even though the two `=` would otherwise share a column.
'''

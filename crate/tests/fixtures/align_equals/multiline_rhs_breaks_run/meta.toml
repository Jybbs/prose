[docs]
previewable = false
title       = "A Multi-Line Right-Hand Side Breaks the Run"

description = '''
`PRIMARY`'s value is an exploded dict spanning several lines, and **the multi-line right-hand side breaks the alignment group**. `SECONDARY = 3` below it lands in a group of its own, so `PRIMARY` never pads out to meet the wider name even though the two would otherwise share an `=` column.
'''

[docs]
previewable = false
title       = "A Multi-Line Target Skips the Member"

description = '''
The tuple target `(x, y)` spreads across four lines before its `= 2, 3` arrives, so that assignment never joins the alignment and it breaks the run. **`alpha` and `beta` are left on either side as separate singletons**, which is why `beta = 4` keeps its natural width instead of padding to match `alpha`.
'''

[docs]
previewable = false
title       = "A Multi-Line Tuple Target Is Skipped and Splits the Run"

description = '''
The tuple target `(x, y)` spreads across four lines before its `= 2, 3`, between `alpha = 1` and `beta = 4`. **The statement is skipped and splits the run**, leaving `alpha` and `beta` alone on either side, so `beta = 4` keeps its single space rather than padding out to match `alpha`.
'''

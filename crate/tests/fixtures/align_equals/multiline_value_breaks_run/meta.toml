previewable = false
title       = "A Multi-Line Value Closes the Keyword Run"

description = '''
`rows` takes an exploded list as its value, and its `=` still aligns with `w` and `title` on the line where the list opens. **The multi-line value then closes the run**, so `on_click` and `label` align as a separate group below, on a column of their own.
'''

[docs]
previewable = true
title       = "An Over-Budget Row Partitions Out of the Aligned Run"

description = '''
`q`'s name is narrow enough to join the run, but padding its `=` out to `wider_name`'s width would carry its long string value past the `code-line-length` cap of 40. `q` partitions out unpadded instead, while `wider_name` and `also_wide` align beneath the cap, leaving no line over budget.
'''

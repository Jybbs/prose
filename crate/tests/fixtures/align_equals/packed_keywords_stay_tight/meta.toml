previewable = false
title       = "Keywords Packed Onto One Line Stay Tight"

description = '''
The `check_output` call packs several keywords onto each physical line, from `shell=True` through `errors=errors`. **Every keyword keeps the tight `name=value` form**, because only a keyword alone on its line takes spaces around its `=`, and PEP 8 gives a packed call-site keyword none.
'''

[docs]
previewable = false
title       = "Condensed Keywords Stay Tight"

description = '''
The `check_output` call packs several keywords onto each physical line, `shell=True` through `errors=errors`. A keyword sharing its line with others keeps the tight `name=value` form PEP 8 gives a call-site keyword, so none of these takes the spaced-out `=` an exploded keyword would.
'''

previewable = false
title       = "Flush Parameter Defaults Gain Their Spaces and Align"

description = '''
`host: str="local"` and `port: int=8080` arrive with their defaults written flush against the `=` in the exploded `connect` signature. **Both `=` gain a space on each side and share one column**, so the two lines read `host: str = "local"` above `port: int = 8080`.
'''

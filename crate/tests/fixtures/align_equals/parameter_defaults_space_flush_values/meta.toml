title       = "Flush Parameter Defaults Align and Space Their Values"

description = '''
`host: str="local"` and `port: int=8080` arrive with their defaults written flush against the `=`. Across the exploded `connect` signature the two `=` align on one column, and each gains a space on both sides, reading `host: str = "local"` above `port: int = 8080`.
'''

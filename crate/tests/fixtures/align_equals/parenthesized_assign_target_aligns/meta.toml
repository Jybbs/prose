title       = "A Parenthesized Assignment Target Aligns"

description = '''
`(x.attr) = 1` wraps its attribute target in parentheses Python does not require, with `plain_name = 2` beneath it. **The pair aligns on one `=` column**, because the target's width is measured through the closing `)`, so the padding is written after the `)`.
'''

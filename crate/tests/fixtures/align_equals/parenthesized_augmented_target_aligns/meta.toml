[docs]
previewable = false
title       = "A Parenthesized Augmented Target Aligns"

description = '''
`(counter) += 1` wraps its target in parentheses Python does not require, with `total += 2` beneath it. **Both `+=` align on one column**, because the target's width is measured through the closing `)`, so `total` pads out to `(counter)`'s nine characters.
'''

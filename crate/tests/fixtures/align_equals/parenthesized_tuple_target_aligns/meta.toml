previewable = false
title       = "A Parenthesized Tuple Target Aligns Like a Name"

description = '''
The unpacking assignment `(a, b) = 1, 2` sits above `cc = 3`. **The tuple target keeps its parentheses and its `=` shares a column with `cc`'s**, because `(a, b)` measures six characters with the parentheses counted, so `cc` pads out to that width.
'''

previewable = true
title       = "A Parenthesized Value Keeps Its Parentheses"

description = '''
`x`'s value arrives as `(1 + 2)` written flush against its `=`. The gap rewrite treats the `(` as where the value starts, so `x` aligns with `yy`, each `=` gains its spacing, and the parentheses come through untouched as `x  = (1 + 2)`.
'''

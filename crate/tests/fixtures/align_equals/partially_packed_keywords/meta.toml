[docs]
previewable = true
title       = "Only the Keyword Alone on Its Line Buffers"

description = '''
Inside `foo`, `a` stands alone on its line while `b` and `c` share the next one. Only the keyword alone on its line takes the spaced `=`, so `a = 1` gains its buffer while `b=2, c=3` keep the tight `name=value` form.
'''

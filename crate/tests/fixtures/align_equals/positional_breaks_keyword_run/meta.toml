[docs]
previewable = true
title       = "A Positional Argument Ends the Keyword Run"

description = '''
The positional `event` leads the exploded `record` call and carries no `=`, so it sits outside the keyword run the way an undefaulted parameter sits outside a signature's. The keywords after it, `name`, `target_id`, and `ok`, align as one block on a shared `=` column set by the widest name, `target_id`.
'''

[docs]
previewable = false
title       = "A Single-Line Call Passes Through Unchanged"

description = '''
The `connect` call places `host`, `port`, and `use_tls` on one line. **The call passes through unchanged**, because the rule spaces an `=` only for a keyword that sits alone on its line, so a one-line call keeps the tight `name=value` form PEP 8 gives a call-site keyword.
'''

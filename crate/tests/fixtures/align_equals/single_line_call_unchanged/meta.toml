title       = "Single-Line Calls Pass Through Untouched"

description = '''
The `connect` call holds `host`, `port`, and `use_tls` on a single line, and **it passes through unchanged**. The rule opens `=` spacing only for keywords standing on their own lines, so a one-line call keeps the tight `name=value` form PEP 8 expects.
'''

[docs]
previewable = false
title       = "A Skip on a Wrapped Row Covers Every Line the Statement Spans"

description = '''
The `# prose: skip[align-equals]` directive trails the closing `}` of `beta`, a dict literal spanning three lines, between `a = 1` and `gamma_wide = 3`. **The skip covers every line the statement spans, not only the line carrying the comment**, so `a` never pads out to share a column with `beta`'s opening line and the source passes through unchanged.
'''

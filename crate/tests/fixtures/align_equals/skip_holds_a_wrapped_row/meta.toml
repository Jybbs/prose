[docs]
previewable = false
title       = "A Wrapped Row's Skip Holds Every Line It Spans"

description = '''
The `# prose: skip[align-equals]` trailing `beta`'s closing `}` **holds every line that statement spans out of the column math**, not just the line carrying the comment. Without it, `a` would pad out to share an `=` column with `beta`'s opening line, so the skip leaves `a = 1` at its natural width.
'''

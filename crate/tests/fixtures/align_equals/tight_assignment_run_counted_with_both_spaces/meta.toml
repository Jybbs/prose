[docs]
previewable = true
title       = "A Tight Statement Run Is Measured With Both Inserted Spaces"

description = '''
Aligning these flush `name=value` assignments gives each `=` a space on both sides, and the fit check measures every row with both spaces counted. Padded to `verbose`'s column, `label`'s row would sit exactly at the `code-line-length` cap of 35 without the value-side space and one past it with it, so `label` partitions out at a single space while `verbose` and `dry` align.
'''

title       = "An Unannotated Parameter Splits the Run"

description = '''
`unannotated=2` sits between `x: int = 1` and `verbose: bool = True` in `f`'s exploded signature. **The parameter without an annotation keeps its tight `=` and splits the run**, leaving `x` and `verbose` alone on either side of it with no partner to align with, so the signature passes through unchanged.
'''

[docs]
previewable = false
title       = "An Unannotated Parameter Splits the Run"

description = '''
`unannotated=2` carries no annotation, so its `=` stays tight per PEP 8, and **it splits the parameter run**. `x` and `verbose` are left as singletons on either side, which is why `x: int = 1` never pads out to align with `verbose: bool = True`.
'''

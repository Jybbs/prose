[docs]
previewable = false
title       = "A Parenthesized Walrus Annotation Aligns"

description = '''
`named`'s annotation is the parenthesized assignment expression `(value := int)`, and the row aligns like any other. The annotation's width is measured through its parentheses, closing `)` included, so `other_field_xyz: int` pads one space further and both `=` share a column.
'''

description = '''
`named` is annotated with the parenthesized assignment expression `(value := int)`, above `other_field_xyz: int`. **The row aligns like any other, its annotation measured through the closing `)`**, so `other_field_xyz: int` pads out one space further and both `=` share a column with the walrus left as written.

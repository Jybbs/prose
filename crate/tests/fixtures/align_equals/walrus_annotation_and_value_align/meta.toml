[docs]
previewable = false
title       = "A Walrus Annotation and a Walrus Value Align Together"

description = '''
`D` is annotated with the parenthesized assignment expression `(E := 4)` and assigned another, `(F := 5)`, above `zz: int = 1`. **The row aligns like any other and both `:=` forms pass through unchanged**, because the rewrite measures the annotation through its closing `)` and stops before the value's opening `(`, so `zz: int` pads out to share the `=` column.
'''

title       = "A Walrus Annotation and Value Align Together"

description = '''
`D`'s annotation and its value are each a parenthesized assignment expression, `(E := 4)` and `(F := 5)`.

The row aligns like any other, with `zz: int` padding out to share the `=` column, and **both `:=` forms pass through intact**. The rewrite measures through the annotation's closing `)` and stops before the value's opening `(`, so neither walrus is touched.
'''

previewable = false
title       = "A Parenthesized Walrus Parameter Annotation Aligns"

description = '''
In the exploded `configure` signature, `host` is annotated with the parenthesized assignment expression `(c := int)` above `portfolio: str` and `region: float`. **`host`'s default joins the run like any other parameter, its annotation measured through the closing `)`**, so `portfolio` and `region` pad out to `host`'s width and all three `=` share one column.
'''

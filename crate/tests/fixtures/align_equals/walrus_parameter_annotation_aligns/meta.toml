[docs]
previewable = false
title       = "A Parenthesized Walrus Parameter Annotation Aligns"

description = '''
`host`'s annotation is the parenthesized assignment expression `(c := int)`, and its default joins the signature's run like any other parameter. The annotation is measured through its closing `)`, so `portfolio` and `region` pad out to `host`'s width and all three defaults share one `=` column.
'''

[docs]
previewable = true
title       = "A Wide Target Breaks the Assignment Run"

description = '''
`really_really_long_target` is so much wider than `short` and `medium_size` that padding them to meet it would shift their `=` past `max-shift`, so **the wide row breaks the run** and keeps its own single-space gap. The rows on each side align in their own columns, `short` with `medium_size` above and `longer` with `tiny` below.
'''

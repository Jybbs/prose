title       = "A Parenthesized Yield Annotation Aligns"

description = '''
Inside the generator `stream`, `forwarded` is annotated with the parenthesized expression `(yield from items)`, and the row still aligns. The annotation is measured through its closing `)`, so `received_value_field: int` pads out to meet it and the two `=` share a column with the `yield from` text untouched.
'''

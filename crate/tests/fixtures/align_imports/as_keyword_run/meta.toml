title       = "Bare Imports with Aliases Align on the `as` Keyword"

description = '''
Four aliased imports run from `collections as c` down to `itertools as it`. **The widest module name, `collections`, fixes the shared `as` column**, and each shorter row pads between its module and the `as` to reach it, so every alias starts at the same place.

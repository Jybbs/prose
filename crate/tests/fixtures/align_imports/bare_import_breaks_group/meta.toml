[docs]
previewable = true
title       = "Non-Import Statements Reset the Alignment Run"

description = '''
`import os` carries no `as` to align against, so **it breaks the aliased run in two**, with `collections` and `datetime` sharing one `as` column above it while `re` and `json` share another below. The `LOG_LEVEL` assignment breaks a run the same way, which is why the two `from` imports around it stay singletons.
'''

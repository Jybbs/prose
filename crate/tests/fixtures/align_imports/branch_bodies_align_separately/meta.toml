[docs]
previewable = false
title       = "Imports in `if` and `else` Branches Align per Branch"

description = '''
The `if` branch imports from `tomllib` and `contextlib` and the `else` branch imports from `tomli` and `contextlib2`, a compatibility split on `sys.version_info`. **Each branch aligns within its own body**, so `contextlib` sets the first block's `import` column and the wider `contextlib2` sets the second's, and no row pads toward the other branch.
'''

[docs]
previewable = false
title       = "Relative Imports Align on the `import` Keyword"

description = '''
Four relative imports lead with one, two, or three dots, from the bare `from .` to `from ...common`. **Every `import` keyword moves to the column one space past `...common`**, the widest path, so a dotted path pads the same way a named module does.
'''

[docs]
previewable = false
title       = "Relative Imports Align Beside Absolute Ones"

description = '''
Four relative imports lead with one, two, or three dots, from the bare `from .` down to `from ...common`. **The `import` keyword lines up across the whole run**, with the widest path, `...common`, setting the column, so a dotted path aligns the same as any named one.
'''

canonical   = true
previewable = true
title       = "From-Imports Align the `import` Keyword on a Shared Column"

description = '''
Four `from ... import ...` statements form one run, with `collections` the widest module among them. Padding after the shorter modules `typing`, `sys`, and `os.path` moves every `import` keyword onto the column `collections` sets, so the imported names `OrderedDict`, `Optional`, `path`, and `join` all start at the same column.
'''

title       = "Imports in a Function Body Form Their Own Group"

description = '''
The two module-level imports and the three inside `lazy_setup` align as separate groups, **each with its own `import` column independent of the other**. At module level `collections` sets the column, whereas inside the function `contextlib` sets a narrower one, so neither group's widest module widens the other.

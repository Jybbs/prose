title       = "Imports in a Function Body Form Their Own Group"

description = '''
Two `from` imports sit at module level and three more sit inside `lazy_setup`. **The two blocks align as separate groups, each on its own `import` column**, so `collections` sets the module-level column and `contextlib` sets the column inside the function, and neither block's widest module widens the other.
'''

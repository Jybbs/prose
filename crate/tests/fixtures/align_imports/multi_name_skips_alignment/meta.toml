[docs]
previewable = false
title       = "Multi-Name Imports Skip Alignment"

description = '''
`import os, sys` and `import re as regex, json as parser` each name more than one module, and each sits beside an aliased single-module import. **Neither multi-name import is aligned, and each ends the run it sits in**, because a line naming several modules has no single `as` to align. That leaves `import collections as c` and `import datetime as dt` each in a run of one, so no padding is added and the file is left as written.
'''

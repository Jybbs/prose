[docs]
previewable = true
title       = "Own-Line Comments Reset the Run, like Blank Lines"

description = '''
The own-line comment between `from typing import Optional` and `from sys import path` **breaks the run in two**, so `typing` pads out to match `collections` whereas `sys` pads only to `os.path`, each half aligning with its own contiguous neighbors. The trailing comment on `import re as regex` sits inside that row rather than between rows, so `re` and `json` still align their `as` keywords as one run.
'''

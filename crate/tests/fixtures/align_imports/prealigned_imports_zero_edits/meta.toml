title       = "Already-Aligned Imports Are Left Alone"

description = '''
The `from`-import run already lines its `import` keywords up on the column `collections` sets, and the `import ... as` run below already aligns its `as` keywords the same way. With every gap at its target width **the rule emits zero edits**, so the output equals the input byte-for-byte.

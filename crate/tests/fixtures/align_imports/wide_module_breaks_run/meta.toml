title       = "A Wide Module Ends the `from`-Import Run"

description = '''
`from collections.abc.mapping_helpers.namespaced import OrderedDict` sits between three short `from` imports above and two more below. **The wide module ends the run and keeps its single space before `import`**, because padding every other `import` keyword out past it would exceed `max-shift`. The three imports above it are of equal width and need no padding, and below it `sys` pads to match `os.path`.
'''

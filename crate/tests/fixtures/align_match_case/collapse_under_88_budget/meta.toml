previewable = true
title       = "A Widest Pattern past `max-shift` Gates the Group"

description = '''
Five arms each hold a single assignment, and **an arm collapses onto its `case` line only when the one-line form fits the 88-column budget**.

`"under_88_columns"` and `"exactly_88_columns"` fold and align their `:`. `"longer_pattern_name"` would land on 89 columns and `"kind_with_descriptive_long_label"` runs far wider, so both stay multi-line. The `if some_long_predicate_check(event.kind)` guard counts toward its arm's measure too, which keeps that last arm multi-line as well.
'''

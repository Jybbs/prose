title       = "Single-Assignment Bodies Collapse and Align Colons"

description = '''
Each arm of the `match` on `credential.kind` holds one assignment to `icon`, so all three bodies fold onto their `case` lines. **The `:` column aligns to the widest pattern**, `"apprenticeship"`, leaving `"certification"` and `"program"` padded until the colons stack.
'''

title       = "Single-Assignment Bodies Fold and Align Their Colons"

description = '''
Each arm of the `match` on `credential.kind` holds one assignment to `icon`. **All three bodies fold onto their `case` lines and every `:` moves to the column one space past `"apprenticeship"`**, the widest pattern, so `"certification"` and `"program"` take padding until the colons stack.
'''

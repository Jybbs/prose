[docs]
previewable = true
title       = "Comments between Cases Keep the Shared Column"

description = '''
The standalone `# legacy synonyms` line sits between the first two arms, and **the comment passes through unchanged** without splitting the group. All three bodies still fold onto their `case` lines and share one `:` column, so `"certification"` and `"program"` below the comment pad to the width `"apprenticeship"` sets above it.
'''

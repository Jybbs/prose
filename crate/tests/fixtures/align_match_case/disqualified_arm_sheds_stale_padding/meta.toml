title       = "A Disqualified Arm Sheds the Padding Before Its Colon"

description = '''
`case "apprenticeship"` holds two statements, so it stays multi-line and ends the run, yet its `:` still carries the padding an earlier alignment gave it. **The padding clears and the `:` sits flush against the pattern**, while `"certification"` and `"program"` below it fold and share the column `"certification"` sets.
'''

previewable = false
title       = "A Hanging Arm Is Measured Through Its `case` Row"

description = '''
`case "install"` holds a call hanging from the `(` that ends its `case` row, its argument row 84 columns wide, so the arm read across all three rows runs past the **88-column** budget. **`"install"` joins the run and `"build"` folds beside it at the shared column**, because the rule measures the hanging arm only through the bracket ending its `case` row, so the rows beneath never count against the run.
'''

[docs]
previewable = false
title       = "A Skipped Arm Bridges the Arms Around It"

description = '''
`("gh", group, verb, *_)` sets the column `("mise", *_)` would share across the skipped arm, and padding `("mise", *_)` out to it would carry its line to 93 columns, past the 88-column `code-line-length`. **The `"mise"` arm keeps its multi-line form**, and `("gh", group, verb, *_)` and `"tag"` each fold with their `:` flush against the pattern.
'''

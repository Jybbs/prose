title       = "A Lone Arm Folds With Its Colon Flush Against the Pattern"

description = '''
The `match` on `value` holds a single arm. **`result = "lone"` folds onto its `case` line and the `:` stays flush against `"only"`** with one space after it, because no neighboring arm exists to share a column with, so no padding is written.
'''

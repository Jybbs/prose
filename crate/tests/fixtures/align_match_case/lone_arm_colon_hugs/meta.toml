title       = "A Lone Arm Collapses with Its Colon Hugging the Pattern"

description = '''
The `match` on `value` holds a single arm, so `result = "lone"` folds onto its `case` line. With no neighboring arm to share a column with, **alignment is skipped and the `:` stays tight against `"only"`** with a single space after it.
'''

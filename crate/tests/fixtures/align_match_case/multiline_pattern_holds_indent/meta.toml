title       = "A Multi-Line Pattern Holds Its Indent"

description = '''
The first arm's tuple pattern spreads `1` and `2` over parenthesized lines, so its `:` sits on a different line from the `case` that opens it. **The multi-line pattern disqualifies that arm**, which passes through untouched, whereas `case other` still folds `handle2()` onto its line, its `:` hugging the pattern because no other collapsed arm remains to align with.

[docs]
previewable = true
title       = "Multi-Line Expressions Break the Run, Too"

description = '''
`case "fail"` holds one assignment, yet its right-hand side spreads `base + extra` over parenthesized lines, and **the multi-line right-hand side disqualifies the arm** even though it is structurally a single statement. It passes through untouched, whereas `case "ok"` folds `result = simple` onto its line and, alone in its sub-group, takes no padding.
'''

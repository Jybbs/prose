[docs]
previewable = true
title       = "Nested Matches Align Independently"

description = '''
`case "wrap"` holds a whole `match inner:` as its body, so it cannot fold onto one line and stays multi-line, whereas `case "skip"` collapses to `value = 0` with its `:` hugging the pattern because it aligns alone. **The inner `match` is processed as its own group**, folding `"alpha"`, `"beta"`, and `"gamma"` onto their `case` lines and aligning their `:` on a separate column.
'''

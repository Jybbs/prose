[docs]
previewable = true
title       = "An Arm That Would Overflow at the Run's Column Splits the Run Around It"

description = '''
Five arms each hold one assignment, and `case "moved"` carries a call that fits folded alone but not once its `:` pads out to the column `"deleted_forever"` sets. **`"moved"` keeps its multi-line form, and the arms on either side of it fold as two runs of their own**, `"created"` and `"archived"` sharing one column and `"deleted_forever"` and `"restored"` sharing another.
'''

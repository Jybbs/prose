[docs]
previewable = false
title       = "A Trailing Comment Disqualifies the First Arm"

description = '''
`case "apprenticeship"` carries the comment `# explain` after its `:`, and `"license"` and `"degree"` follow with plain bodies. **The first arm stays multi-line and the other two fold and align on the column `"license"` sets**, because folding `icon = "wrench"` up would leave the comment in the middle of the line, so the trailing comment disqualifies that arm.
'''

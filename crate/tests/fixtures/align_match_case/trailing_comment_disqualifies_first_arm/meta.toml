[docs]
previewable = false
title       = "A Trailing Comment Disqualifies the First Arm"

description = '''
`case "apprenticeship"` carries the `# explain` comment after its `:`, and folding `icon = "wrench"` up would strand that comment mid-line, so **the trailing comment disqualifies the arm** and it stays multi-line. `"license"` and `"degree"` still qualify, forming their own sub-group whose `:` column the wider `"license"` sets.
'''

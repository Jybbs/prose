[docs]
previewable = false
title       = "Multi-Name `import` Aliases Sort within the Statement"

description = '''
`import zlib, argparse, os` names three modules in one statement, and **the names alphabetize within the statement** to `import argparse, os, zlib`, mirroring how the names after a `from … import …` sort. Single-name imports are the preferred form, so this comma-separated shape is rare but still covered.
'''

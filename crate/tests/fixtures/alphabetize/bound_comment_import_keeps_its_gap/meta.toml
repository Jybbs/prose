[docs]
previewable = false
title       = "A Bound Comment Holds the Gap Above Its Import"

description = '''
Collapsing bare imports would normally pull `zlib` up against its neighbors, but the `# compression helpers` comment binds to `import zlib`, and an import whose block opens on a bound comment keeps the source gap above that comment. The sort still runs around the held block, swapping `os` ahead of `time`.
'''

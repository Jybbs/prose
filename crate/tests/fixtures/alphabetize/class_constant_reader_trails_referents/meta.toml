[docs]
previewable = true
title       = "A Class Constant Reading Its Siblings Sorts Below Them"

description = '''
`ACCOUNT_TYPE_CHOICES` builds its tuple from `REGULAR`, `GOLD`, and `PLATINUM`, all read while the class body executes, so the sort **holds it below the names it reads** even though it alphabetizes first. The three choice constants still sort among themselves into `GOLD`, `PLATINUM`, `REGULAR`, whereas hoisting the reader above them would raise `NameError` at class-definition time.
'''

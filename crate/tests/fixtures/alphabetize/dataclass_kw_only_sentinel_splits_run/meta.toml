[docs]
previewable = true
title       = "A `KW_ONLY` Sentinel Splits the Field Run"

description = '''
The `_: KW_ONLY` pseudo-field marks where `Posting` stops accepting positional arguments, so `title` and `company` above it **hold their slots** while `date_posted` and `url` below it **sort**. The sentinel itself stays put, leaving the keyword-only boundary exactly where the author drew it.
'''

[docs]
previewable = true
title       = "Dictionary Keys Sort When Keys Are String Literals"

description = '''
Dict literals **partition entries by the value's AST kind**, scalar-valued entries sorting ahead of collection-valued ones whatever line count either currently takes. A blank divider fences each entry that occupies a block only once two or more share the dict, so a lone multi-line entry reads as one block against its neighbors. `**unpacked` items pin in source position, and the partition fires recursively at every level of nesting.
'''

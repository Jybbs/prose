[docs]
previewable = true
title       = "Verbatim Continuations Stay Attached to Their Parent Entry through the Reorder"

description = '''
`ValueError`'s description ends in `::` and continues into an indented doctest block, and sorting moves `OSError` above it while **the verbatim block stays attached to its parent entry**. The block's lines sit deeper than the entry's hanging column, so the walker reads them as a continuation of `ValueError` rather than as sibling entries.
'''

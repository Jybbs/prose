previewable = true
title       = "`__all__` Sorts Alphabetically"

description = '''
The string items in `__all__` **alphabetize by string value**, `"Catalog"` and `"Posting"` landing ahead of `"aggregate"` and `"render"` because uppercase sorts before lowercase. Detection keys on the assignment target's name, in that the `__all__` convention is what marks the list as documentary, so `regular_list = ["b", "a", "c"]` stays untouched.
'''

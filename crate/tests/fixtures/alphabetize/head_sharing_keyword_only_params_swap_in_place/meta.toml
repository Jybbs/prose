[docs]
previewable = false
title       = "Keyword-Only Parameters Opening Mid-Row Swap in Place"

description = '''
The keyword-only group after the `*` opens mid-row, `numeric_owner=False` trailing the `def extract` head on its line, so reordering whole rows would drag the head along with the first member. The sort swaps the parameter texts in place instead, `filter=None` into the first slot and `numeric_owner=False` into the second, leaving the head, the indent, and the closing `):` where the source wrote them.
'''

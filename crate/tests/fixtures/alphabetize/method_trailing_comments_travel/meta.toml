[docs]
previewable = false
title       = "Trailing Comments Travel With Their Method"

description = '''
Each trailing comment **moves with its method as the body sorts**, so `# reds and oranges` follows `warm` to the last line while `cool` and `neutral` rise with their own notes. The comment travels as part of the member's text rather than staying with the row it sat on, so no method ends up with a neighbor's comment.
'''

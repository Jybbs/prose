previewable = false
title       = "Methods Sort into Four Sub-Groups"

description = '''
`Matcher`'s methods **sort into four sub-groups in order**: dunders, then properties, then private methods, then publics. `__init__` and `__repr__` lead, the `@cached_property` `adjacency` and the `@property` `cluster_count` follow, `_validate_one` and `_validate_two` come next on their single leading underscore, and `public_one` and `public_two` close, each sub-group alphabetized within.
'''

[docs]
previewable = false
title       = "An Annotated Field Reading an Earlier Field Keeps Producer Order"

description = '''
`total`'s default is `width * 2`, a read of the field defined above it, so **the run keeps the producer `width` ahead of its reader `total`** rather than alphabetizing `total` first. A class body evaluates top to bottom, and moving `total` above `width` would raise `NameError`, so the file passes through unchanged.
'''

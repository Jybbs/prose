[docs]
previewable = false
title       = "An Annotated Field Reading an Earlier Field Stays Below It"

description = '''
`total`'s default is `width * 2`, a read of the field declared above it. **`width` stays ahead of `total`** rather than `total` sorting first, because a class body evaluates top to bottom and moving `total` above `width` would raise `NameError`, so the file passes through unchanged.
'''

[docs]
previewable = false
title       = "A Comment Above a Method Moves With It"

description = '''
`Matcher`'s methods reorder to `__init__` first as a dunder, then the private `_validate`, then the public `match`. **Each `#` comment above a method moves with it** to the method's new place, including `# describes the constructor`, which a blank line separates from `def __init__`, because a comment binds to the member it heads rather than to the whitespace around it.
'''

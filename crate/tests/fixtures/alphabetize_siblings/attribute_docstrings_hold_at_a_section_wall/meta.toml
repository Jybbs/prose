[docs]
previewable = false
title       = "Attribute Docstrings Hold at a Section Wall"

description = '''
In `Walled` a section marker sits between `delta` and the string literal, so the literal opens the section below the marker rather than documenting `delta`, and **it holds its slot while `delta` and `zeta` sort above the marker and `alpha` and `beta` beneath it**. In `Pinned` the skip directive walls `zeta` into a section of its own, so its docstring stays in place, whereas `"Beta count."` moves with `beta` below `alpha`.
'''

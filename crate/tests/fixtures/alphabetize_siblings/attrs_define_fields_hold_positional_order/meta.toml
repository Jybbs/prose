[docs]
previewable = false
title       = "An `attrs` Class Keeps Its Field Order"

description = '''
`Posting` is decorated with `@attrs.define`, which generates a constructor whose positional parameters follow the declared field order, the same as the standard library's `dataclass` decorator. **Nothing in the body moves**, because sorting the fields would change the meaning of every positional call site, so the decorator pins the class body and it passes through exactly as written.
'''

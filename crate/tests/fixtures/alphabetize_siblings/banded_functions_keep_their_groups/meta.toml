[docs]
previewable = false
title       = "Functions Sort by Group Before Name"

description = '''
`Widget` is a class among three functions named `Factory`, `_helper`, and `__getattr__`. **`Widget` moves above every function, and the functions order as `__getattr__`, `_helper`, `Factory`**, because a class sorts above the functions whatever its name and a function sorts by group before name, dunders first, then a single leading underscore, then everything else. The name only breaks ties inside a group, which is why `Factory` sorts last despite `F` coming before `_` in byte order.
'''

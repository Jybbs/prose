previewable = false
title       = "Class-Body Assignments Sort Within Each Banner Section"

description = '''
The `# --- Network ---` and `# --- Storage ---` banners divide `Config`'s body into two sections. **Each section sorts on its own and neither banner moves.** In the first, `PORT` and `TIMEOUT` alphabetize, whereas `CACHE_TTL` reads `TIMEOUT * 2`, so it stays below the constant it reads rather than sorting first. In the second, `root` and `backend` swap into alphabetical order.
'''

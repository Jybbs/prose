description = '''
The `# ===== Parsing =====` and `# ===== Emitting =====` banners divide the top-level functions into sections that sort on their own, `lex` moving above `tokenize` and `emit` above `render`. Each divider stays put between the clusters it separates, so no function crosses from one section into the other.
'''

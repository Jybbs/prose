[docs]
previewable = false
title       = "Names in a Multi-Name `import` Sort Within the Statement"

description = '''
`import zlib, argparse, os` names three modules in one statement. **The names alphabetize within the statement to `import argparse, os, zlib`**, the same way the names after a `from … import …` sort. One name per `import` is the preferred form, so this comma-separated form is rare but still covered.
'''

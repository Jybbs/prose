previewable = false
title       = "A Base-Class Expression Pins the Constant It Reads"

description = '''
The nested `class Store(BASE)` reads `BASE` while `Registry`'s body runs, and `APPLE` follows it. **The constants keep source order and the body passes through unchanged**, because swapping them into alphabetical order would move `BASE` below the subclass that reads it and break the name lookup.
'''

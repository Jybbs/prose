[docs]
previewable = false
title       = "A Bound Comment Holds the Gap Above Its Import"

description = '''
Collapsing the bare imports would ordinarily pull `import zlib` up against its neighbours.

The `# compression helpers` comment attaches to `zlib`, and **an import whose block opens on a bound comment keeps the blank line above that comment**. The sort still runs around the held block, so `os` and `time` swap into alphabetical order above it.
'''

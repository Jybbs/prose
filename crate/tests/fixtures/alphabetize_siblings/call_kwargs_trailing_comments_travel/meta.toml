[docs]
previewable = false
title       = "A Trailing Comment Moves With Its Keyword Argument"

description = '''
The `configure` call passes `timeout`, `retries`, and `verbose` as keywords, each with a trailing comment. **`retries` moves above `timeout` and each trailing comment moves with its argument**, so `# attempts on failure` stays on the `retries=3` line and `# seconds before giving up` stays on `timeout=30`, and neither comment drifts onto the keyword that takes its old place.
'''

[docs]
previewable = false
title       = "A Class-Body Value Keeps the Class It Names Ahead"

description = '''
`Config`'s body binds `settings = Defaults`, and a class body runs while the class is being built, so `Defaults` must already be defined when `Config` evaluates. **The two classes keep source order**, because alphabetizing would lift `Config` above `Defaults` and the assignment would raise `NameError`.
'''

[docs]
previewable = false
title       = "A Class Holds Across a Rebinding of the Constant It Reads"

description = '''
Nothing in this file moves, and the reason is worth spelling out because no error would ever report it.

`SCALE` is assigned twice, and each class body reads it the moment its own `class` statement executes, so `Zebra.V` is `2` and `Alpha.V` is `100`. Sorting `Alpha` above `Zebra` would carry it above the second assignment and silently swap those two values. **A member stays on whichever side of a binding it reads the source put it on**, so it neither rises above the binding that introduces a name nor crosses a rebinding written after it.
'''

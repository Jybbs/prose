[docs]
previewable = false
title       = "A Class Stays on Its Side of a Rebinding It Reads"

description = '''
`SCALE` is assigned twice, and each class body reads it the moment its own `class` statement executes, so `Zebra.V` is `2` and `Alpha.V` is `100`. **Nothing in the file moves**, because sorting `Alpha` above `Zebra` would carry it above the second assignment and silently swap those two values, and no error would ever report the change.

A member stays on whichever side of a binding it reads the source put it on, so it neither rises above the binding that introduces a name nor crosses a rebinding written after it.
'''

[docs]
previewable = false
title       = "A Class Stays Below the Function Its Body Calls"

description = '''
`Alpha` sorts ahead of `Zebra` by name, but its class body calls `helper()` the moment the `class` statement runs, and `helper` is defined between the two classes. **Both classes stay as written**, because the check reads every binding the run passes over rather than only the definitions it is sorting, and moving `Alpha` up would carry it above `helper`.
'''

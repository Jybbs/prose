[docs]
previewable = true
title       = "A Kept Class's Docstring Entries Stay in Field Order"

description = '''
`KeptStations` and `SortedStations` declare the same three fields and document them under `Attributes:` in declaration order, and only `KeptStations` carries `# prose: keep` on its header. **In `SortedStations` both the fields and the entries sort alphabetically, whereas in `KeptStations` both stay as written**, so its docstring still lists the fields in the order the class declares them.
'''

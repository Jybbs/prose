[docs]
previewable = false
title       = "Nested Sorts Still Run Inside a Kept Class"

description = '''
`Pipeline` carries `# prose: keep`, so its assignment, its methods, its `if TYPE_CHECKING:` arm, and its nested class all keep the order written, and so do the two methods inside the arm, since an `if` opens no scope of its own. **Every expression and every nested scope inside the body still sorts**, so the `stages` dict, the keywords of the `emit` call, the imports inside `load`, and the body of the unmarked `Settings` class are all reordered, the way a marked dict keeps its own entries while a dict nested inside it sorts.
'''

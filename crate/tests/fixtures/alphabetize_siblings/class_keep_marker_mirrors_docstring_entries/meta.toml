[docs]
previewable = true
title       = "A Kept Class's Docstring Entries Follow Its Field Order"

description = '''
`KeptStations` and `SortedStations` declare the same three fields and document them under `Attributes:` out of declaration order, beside an `elevation` entry that names no field, and only `KeptStations` carries `# prose: keep` on its header. **In `SortedStations` the fields and the entries both sort alphabetically, whereas in `KeptStations` the fields stay as written and the entries naming them follow the same order**, while `elevation`, which names no field, holds its place.
'''

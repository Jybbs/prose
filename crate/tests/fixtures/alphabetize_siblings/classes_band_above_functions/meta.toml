title       = "Classes Band Above Functions at Module Scope"

description = '''
`render`, `Widget`, `build`, and `Gadget` are written with the two kinds interleaved.

**The classes group above the functions, and each group then sorts by name.** The module reads `Gadget`, `Widget`, `build`, `render`, rather than keeping the interleaving and merely sorting each kind where it already sat.
'''

[docs]
previewable = false
title       = "A Comprehension Reading Its Own Target Does Not Block the Sort"

description = '''
`NAMES` is a comprehension that binds `name` and reads it within the same statement, sitting between `zebra` and `alpha`. **`alpha` and `zebra` trade places around it**, because a statement is exempt from the ordering check for any name it binds itself, since nothing can need to sort ahead of itself, so `NAMES` blocks nothing.
'''

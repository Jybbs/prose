[docs]
previewable = false
title       = "A Comprehension Reading Its Own Target Holds No Sort Back"

description = '''
The comprehension binds `name` and reads it within the same statement, so it is the only thing binding that name.

A statement is exempt from the ordering rule for any name it binds at its own slot, since nothing can need to sort ahead of itself. `NAMES` therefore holds nothing back, and **`alpha` and `zebra` trade places freely around it**.
'''

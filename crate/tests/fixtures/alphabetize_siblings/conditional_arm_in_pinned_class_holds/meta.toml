[docs]
previewable = false
title       = "A Conditional Arm Inside a Pinned Class Keeps Its Order"

description = '''
`Posting` is decorated with `@dataclass`, which generates a constructor taking the fields in declaration order, and an `if TYPE_CHECKING:` arm sits inside its body. **Nothing in `Posting` moves**, so `url` and `company` keep their places exactly as `title` does above them even though `company` would alphabetize first, because the pin on the class body reaches into the arm.
'''

[docs]
previewable = false
title       = "A Conditional Arm Inherits the Enclosing Pin"

description = '''
Nothing in `Posting` moves. `@dataclass` generates a constructor taking the fields in declaration order, which pins the class body.

The `if TYPE_CHECKING:` arm sits inside that same body, so **the pin reaches into it**. `url` and `company` hold their slots exactly as `title` does above them, even though `company` would alphabetize first.
'''

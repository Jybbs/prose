[docs]
previewable = false
title       = "A Conditional Arm Inherits the Enclosing Pin"

description = '''
`Posting` is pinned by `@dataclass`, whose generated constructor takes the fields in declaration order, and the `if TYPE_CHECKING:` arm sits inside that same class body. The `url` and `company` pair under the conditional therefore **holds its slots** just like `title` above it, and nothing sorts even though `company` alphabetizes first.
'''

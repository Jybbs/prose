title       = "A Constant Wedged Between Two Fields Keeps Its Place"

description = '''
`HALF` reads `width`, the annotated field directly above it, and sits between `width` and `height`. **The run keeps source order and the body passes through unchanged**, because alphabetizing the fields would move `width` below the `HALF` that reads it and break the name lookup.

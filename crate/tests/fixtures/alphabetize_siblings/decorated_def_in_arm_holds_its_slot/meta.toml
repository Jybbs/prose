previewable = false
title       = "A Decorated Definition Inside an Arm Keeps Its Place"

description = '''
`Zeta`, `Mid`, and `Alpha` sit inside a module-scope `if TYPE_CHECKING:` arm, and `Zeta` carries the `@dec` decorator. **`Zeta` keeps its place at the top, whereas the undecorated `Mid` and `Alpha` sort into alphabetical order below it**, because the body of an arm sorts under the same rules as the module itself.
'''

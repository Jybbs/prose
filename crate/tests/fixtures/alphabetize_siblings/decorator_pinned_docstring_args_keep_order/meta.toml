[docs]
previewable = false
title       = "Docstring Entries Follow a Pinned Positional Signature"

description = '''
`normalize(target, source)` takes positional parameters, which keep their order because call sites can pass them by position. **The `Args:` entries for `target` and `source` keep that same order** rather than sorting alphabetically, and the pin comes from the positional signature itself rather than from the `@pytest.mark.parametrize` decorator the function carries.
'''

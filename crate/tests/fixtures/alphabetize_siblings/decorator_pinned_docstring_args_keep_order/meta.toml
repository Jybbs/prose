[docs]
previewable = false
title       = "A Function's Docstring Entries Mirror Its Held Signature"

description = '''
`normalize(target, source)` takes positional parameters, whose order is held because call sites can pass them by position, so the `Args:` entries for `target` and `source` **keep that same order** rather than sorting alphabetically. The hold comes from the positional signature itself, not from the `@pytest.mark.parametrize` decorator the function happens to carry.
'''

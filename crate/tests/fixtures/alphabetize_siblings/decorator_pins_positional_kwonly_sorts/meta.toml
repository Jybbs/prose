[docs]
previewable = false
title       = "Positionals Keep Their Order While Keyword-Only Parameters Sort"

description = '''
`test_add` lists `b` before `a`, then `verbose`, `atomic`, and `retries` past the `*` separator. **The positional pair keeps its source order and the keyword-only run sorts to `atomic`, `retries`, `verbose`**, because reordering positionals would rebind call sites a single-file pass cannot see, whereas parameters past `*` bind by name alone.
'''

previewable = false
title       = "Pinned Positionals, Sorted Keyword-Only Parameters"

description = '''
`test_add` lists `b` before `a`, and that positional pair holds its source order because reordering it would rebind call sites a single-file pass cannot see. The parameters past the `*` separator bind by name alone, so **the keyword-only run still sorts**, `atomic`, `retries`, and `verbose` landing in alphabetical order.
'''

[docs]
previewable = false
title       = "A Function Stays Below the Constant Its Default Reads"

description = '''
`alpha` sorts ahead of `zed` by name, but `CONST` is assigned between them and `alpha`'s default argument `x=CONST` evaluates the moment the `def` executes. **The run stays as written**, because a member never crosses a statement binding a name it reads at evaluation time, whether or not that statement is itself part of the run being sorted.
'''

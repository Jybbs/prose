[docs]
previewable = false
title       = "Definitions Group Inside a Conditional Arm"

description = '''
The first arm of the `if sys.version_info` conditional contains `render`, `Widget`, and `build`, and the `else` arm contains a single `render`. **In the first arm `Widget` groups above the two functions and `build` sorts ahead of `render`, whereas the `else` arm has nothing to reorder**, because each arm is ordered on its own exactly as a module body would be.
'''

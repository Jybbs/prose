[docs]
previewable = false
title       = "Definitions Band Inside a Conditional Arm"

description = '''
Each arm of the `if` is ordered on its own, exactly as a module body would be.

Inside the first arm, `Widget` is a class, so it groups above the two functions and `build` sorts ahead of `render`. The `else` arm holds a single `render`, so **there is nothing there to reorder**.
'''

[docs]
previewable = false
title       = "A Derived Class Stays in the Class Band"

description = '''
`Widget` names `Gadget` as its base, so it has to stay below the class it reads, and both classes are interleaved with the functions `render` and `build`. **The constraint is satisfied inside the class band rather than by pushing `Widget` down past the functions**, so the module reads its two classes first, `Gadget` ahead of the `Widget` that inherits from it, with `build` and `render` below.
'''

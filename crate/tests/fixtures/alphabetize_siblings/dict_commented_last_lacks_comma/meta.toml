title       = "A Last Entry Without a Comma Gains One When It Moves"

description = '''
`"edge": "2.0"` closes the `versions` dict with a trailing `# bleeding` comment and no `,`. **Sorting moves it to the top and writes a `,` after its value, ahead of the comment**, whereas `"stable"` becomes the new last entry and stays without a comma, matching the source dict's absent magic trailing comma.
'''

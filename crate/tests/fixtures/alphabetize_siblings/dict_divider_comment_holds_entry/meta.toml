[docs]
previewable = false
title       = "A Divider-Style Comment in a Dict Moves With Its Entry"

description = '''
`# --- group ---` sits above `"c": 2` in a dict whose first entry is `"d": 1`. **Sorting moves `"c": 2` above `"d": 1` and the comment moves with `"c"`**, rather than being dropped or left stranded above the entry that took its old place, because a dict has no sections for a divider to divide, so the comment reads as an ordinary own-line comment attached to the entry below it.
'''

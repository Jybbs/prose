[docs]
previewable = false
title       = "A One-per-Line Dict Sorts When Its Close Shares the Last Entry's Line"

description = '''
The dict passed to `collect` lays one entry per line, with its closing `}` on the last entry's line. **`"a": 2` moves above `"b": 1` and the `})` closing the call stays where it was**, because the last entry's text stops at the closing brace rather than running to the end of the line.
'''

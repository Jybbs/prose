[docs]
previewable = false
title       = "A Nested Block Value Keeps Its Trailing Comment"

description = '''
`"nested"` contains a multi-line dict with a trailing `# block` comment after its closing `}`, sitting below the one-line `"scalar"`. **The inner keys sort into `"a"` then `"b"`, the `# block` comment stays attached, and the `,` sits after the closing `}` rather than inside the comment.** As the dict's only multi-line entry it takes no blank divider, so it stays directly below `"scalar"`.
'''

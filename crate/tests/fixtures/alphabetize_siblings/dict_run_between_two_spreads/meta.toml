title       = "A Keyed Run Between Two Spreads Sorts Within Itself"

description = '''
`"b": 1` and `"a": 2` sit between `**base` and `**overrides`. **The keyed run sorts within itself, `"a": 2` moving above `"b": 1`, and neither spread moves**, because later dict entries override earlier ones and moving a key across a spread could change which value wins.
'''

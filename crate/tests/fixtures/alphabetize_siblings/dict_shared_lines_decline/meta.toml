[docs]
previewable = false
title       = "A Dict Whose Entries Share Lines Keeps Source Order"

description = '''
Nothing here moves. `m` spans two lines, but `"b": 1` and `"a": 2` share the first one.

Reordering works on whole lines, so entries sharing a line leave **no separate block to move** without merging tokens together. The reassembled candidate is parsed back before anything is written, this one would not parse, and the dict keeps its source order.
'''

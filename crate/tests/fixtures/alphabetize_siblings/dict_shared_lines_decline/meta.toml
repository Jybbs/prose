[docs]
previewable = false
title       = "A Dict Whose Entries Share a Line Keeps Source Order"

description = '''
`m` spans two lines, but `"b": 1` and `"a": 2` share the first one. **Nothing moves**, because reordering works on whole lines, so entries sharing a line leave no separate block to move without merging tokens together, and the reassembled candidate is parsed back before anything is written, a check this one would fail.
'''

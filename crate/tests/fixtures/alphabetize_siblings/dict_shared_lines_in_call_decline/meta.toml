[docs]
previewable = false
title       = "A Packed-Line Dict Inside a Call Keeps Source Order"

description = '''
Nothing here moves. The dict passed to `build` packs `"wp": 1` and `"lt": 2` onto one physical line, which is the same situation a packed dict at top level is in.

Entries sharing a line leave **no separate block per entry to move**, so the reorder does not fire. The closing `}` runs straight into the call's `)`, and that trailing shape survives untouched.
'''

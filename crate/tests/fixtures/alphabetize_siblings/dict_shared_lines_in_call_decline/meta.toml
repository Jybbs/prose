[docs]
previewable = false
title       = "A Packed-Line Dict Inside a Call Keeps Source Order"

description = '''
The dict passed to `build` packs `"wp": 1` and `"lt": 2` onto one physical line, with `"ws": 3` on the next and the closing `}` running straight into the call's `)`. **Nothing moves and the `})` ending stays as written**, because entries sharing a line leave no separate block per entry to move, the same situation a packed dict at top level is in.
'''

[docs]
previewable = true
title       = "A `**` Spread Bounds the Entry Sort"

description = '''
A later dict entry overrides an earlier one that carries the same key, so `"a": 2` cannot cross `**defaults` without possibly changing which value wins. The spread bounds the sort to the run on each side of it, and with `"b"` alone above and `"a"` alone below, nothing moves.
'''

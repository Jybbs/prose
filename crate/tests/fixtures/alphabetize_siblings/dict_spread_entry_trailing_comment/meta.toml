[docs]
previewable = false
title       = "A Spread Entry Keeps Its Trailing Comment"

description = '''
`"zulu"`, `"alpha"`, and `**base` each end in a trailing `#` comment, with the spread last. **Sorting swaps `"zulu"` and `"alpha"`, `**base` stays at the tail, and every entry keeps its own comment**, the spread's `,` written after `base` and ahead of `# spread` exactly where a keyed entry would put it, even though the spread carries no key.
'''

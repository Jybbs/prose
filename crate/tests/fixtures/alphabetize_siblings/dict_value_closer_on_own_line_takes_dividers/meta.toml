previewable = false
title       = "A Value's Closer on Its Own Line Sets the Divider Extent"

description = '''
`"zulu"` and `"alpha"` each carry a parenthesized string whose closing `)` sits on its own line, so each entry occupies a two-line block even though the string ends on the first. **Blank lines fence both entries away from the one-line `"bravo"` and `"mike"` pair sorted between them**, because the dividers read the block extent rather than the value expression's range.
'''

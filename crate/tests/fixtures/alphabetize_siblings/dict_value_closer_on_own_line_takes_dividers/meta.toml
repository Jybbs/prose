[docs]
previewable = false
title       = "A Value's Closer on Its Own Line Draws the Divider"

description = '''
`"zulu"` and `"alpha"` each hold a parenthesized string whose closing `)` sits on its own line, so each entry occupies a two-line block even though the string itself ends on the first. The dividers read that block extent rather than the value expression's range, so blank lines fence both entries away from the one-line `"bravo"` and `"mike"` pair sorted between them.
'''

title       = "`Attributes:` Entries Sort and Carry Their Continuations"

description = '''
`Config`'s `Attributes:` section lists `verbose`, `timeout`, and `retries`, with `verbose`'s description spilling onto an indented continuation line. **The entries reorder alphabetically to `retries`, `timeout`, `verbose`, and the continuation line moves with `verbose`** to its new last position.
'''

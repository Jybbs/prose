[docs]
previewable = true
title       = "Verbatim Continuations Stay Attached to Their Parent Entry through the Reorder"

description = '''
`ValueError`'s description ends in `::` and continues into an indented doctest block, and sorting moves `OSError` above it.

**The verbatim block travels with `ValueError`.** Its lines sit deeper than the entry's hanging column, which is what marks them as a continuation of that entry rather than as sibling entries of their own.
'''

previewable = false
title       = "Trailing Comments Travel With Their `__all__` Entry"

description = '''
Sorting `__all__` moves `"Widget"` from first to last, and its `# the base control` comment **stays attached to its string through the move**. Each trailing comment lands beside the same export it annotated in the source, so none of the three ends up describing the wrong name.
'''

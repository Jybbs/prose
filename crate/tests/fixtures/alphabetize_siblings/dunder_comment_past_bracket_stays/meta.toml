title       = "A Comment Past the Closing Bracket Stays Put"

description = '''
The `# noqa` comment sits past the closing `]`, so the bracket between it and `"Ant"` cuts it off from any entry. Sorting swaps `"Zebra"` and `"Ant"` while the comment **stays put** after the bracket, traveling with neither string.

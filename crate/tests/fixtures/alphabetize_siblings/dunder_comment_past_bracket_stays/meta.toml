title       = "A Comment Past the Closing Bracket Stays Put"

description = '''
The `# noqa` comment sits past the closing `]` of `__all__`, on the same line as `"Ant"`. **Sorting swaps `"Zebra"` and `"Ant"` and the comment stays after the bracket**, moving with neither string, because the bracket between it and `"Ant"` cuts it off from any entry.

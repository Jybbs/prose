[docs]
previewable = true
title       = "`# prose: keep` on a Dunder List Preserves Source Order"

description = '''
A trailing `# prose: keep` holds an `__all__` or `__slots__` sequence in its authored order the same way it holds a dict, and it counts whether it sits on the opening bracket's line or the closing one.

The second `__all__` carries no marker and sorts, which shows what the first one suppressed. `plain_list` shows that **the sort reaches a sequence by its assignment target rather than by its shape**, so an ordinary list sitting beside them keeps whatever order its author wrote.
'''

[docs]
previewable = false
title       = "Keyword-Only Parameters With Call Defaults Keep Their Places"

description = '''
`build` takes the keyword-only parameters `zeta=1`, `sink=register()`, `gate=acquire()`, and `alpha=2`. **`sink` and `gate` keep their places and the literal-default `zeta` and `alpha` around them trade the first and last positions**, because default values evaluate left to right when `def build` executes, so `register()` must keep running before `acquire()`.
'''

[docs]
previewable = false
title       = "Without a Validator, Fields and Methods Both Sort"

description = '''
`Posting` extends `BaseModel` and carries no validator decorator on any method. **Both its fields and its methods sort**, the fields settling into `company`, `name`, `title` and `__init__` rising above `display` and `reset` in the method grouping, because the method skip fires only when at least one method carries a positional-binding decorator, the form validator methods take, and none here does.
'''

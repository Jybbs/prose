[docs]
previewable = true
title       = "A Deferred Forward Reference Lets the Class Band Above Its Reader"

description = '''
`visit` names `Node` in its annotations above the `class Node` that defines it, which `from __future__ import annotations` defers past definition time. The reference therefore pins nothing and **`Node` bands above `visit`**, leaving every annotation resolved in the order the rule writes.
'''

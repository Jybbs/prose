title       = "Names Sort Within One `from` Statement"

description = '''
`from collections import deque, defaultdict, Counter` lists three names in one statement. **The list alphabetizes to `Counter, defaultdict, deque`**, because the names bind independently of their listed order, and the same sort covers an inline list like this one and a parenthesized multi-line list alike.
'''

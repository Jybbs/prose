[docs]
previewable = false
title       = "Import Runs Sort Inside Function Bodies"

description = '''
`f` contains a `from` pair and `g` contains a bare `import` pair, each out of order. **Both runs alphabetize, the `from` pair reordering by module and the bare pair putting `argparse` before `zlib`**, just as at module scope, because importing a module is idempotent and order-independent, so the import-run sort applies everywhere even though function bodies otherwise skip the class, method, and field reorders.
'''

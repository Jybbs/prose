[docs]
previewable = false
title       = "A `__future__` Import Stays on the First Line of the Sorted Run"

description = '''
`from __future__ import annotations` opens the file above `import sys` and `import os`. **`sys` and `os` sort into name order and the `__future__` import stays on the first line**, because sorting it by module name would place it below them and Python only recognizes a `__future__` import at the top of the file.
'''

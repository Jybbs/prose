[docs]
previewable = false
title       = "A `__future__` Import Leads the Sorted Run"

description = '''
`import sys` and `import os` sort into name order while `from __future__ import annotations` holds the first line. Sorting it by module name would place it below them, and Python only recognizes a `__future__` import at the top of the file, so the sort leaves it first.
'''

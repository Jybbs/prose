[docs]
previewable = false
title       = "A Validator Pin Stays in Force With Method Grouping Off"

description = '''
The case runs under `group-methods = false`, and `Posting`'s `check_name` carries `@field_validator`. **`display` and `check_name` keep their source order while the fields sort by name, `name` moving ahead of `title`**, because `group-methods = false` changes only how methods sort rather than whether a class's methods are pinned, and the validator still pins them, whereas the fields are untouched by that pin.
'''

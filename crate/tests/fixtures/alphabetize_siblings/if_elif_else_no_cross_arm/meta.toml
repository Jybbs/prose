[docs]
previewable = false
title       = "`if` / `elif` / `else` Arms Sort Without Crossing"

description = '''
Each arm of the `if` / `elif` / `else` chain contains an out-of-order import pair. **Each arm sorts its body independently and no import crosses an arm boundary**, the `if` arm moving `from alpha import b` ahead of `from zeta import a` and the `elif` and `else` arms reordering their own pairs the same way, even though `from delta import f` would sort ahead of `from gamma import c` were the three arms one list.
'''

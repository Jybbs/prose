[docs]
previewable = false
title       = "`if` / `elif` / `else` Arms Sort Without Crossing"

description = '''
Each arm of the `if` / `elif` / `else` chain **sorts its body independently**.

The `if` arm moves `from alpha import b` ahead of `from zeta import a`, and the `elif` and `else` arms reorder their own pairs the same way. No import crosses an arm boundary, even though `from delta import f` would sort ahead of `from gamma import c` were the three arms one list.
'''

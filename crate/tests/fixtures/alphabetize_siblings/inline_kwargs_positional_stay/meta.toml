previewable = false
title       = "Inline Keyword Arguments Sort and the Positional Stays First"

description = '''
The one-line `Posting` call passes the positional `record` followed by `url=`, `company=`, and `title=`. **The keyword arguments sort in place on the single line to `company=`, `title=`, `url=`, and `record` stays first**, because a positional has no keyword name to sort by.
'''

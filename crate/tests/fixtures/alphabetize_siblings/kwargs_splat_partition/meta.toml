[docs]
previewable = true
title       = "Keyword Arguments at Call Sites Sort"

description = '''
Keyword arguments at a call site **alphabetize within splat-bounded segments**. Every kwarg in the `Posting` call sorts in one run from `company=` to `url=` because no splat divides it, whereas the `**overrides` splat in the `combine` call splits the list into two segments, `first=1` and `second=2` sorting ahead of it while `fourth=4` and `third=3` sort behind it, never crossing the boundary.
'''

[docs]
previewable = false
title       = "A Lambda-Valued Keyword Sorts With Its Run"

description = '''
The keyword `z=lambda row: row.compute()` sorts with its run, landing after `a=1` and `b=2`. Binding a `lambda` runs none of its body, so the `row.compute()` inside it cannot run during argument evaluation, and the keyword sorts like the literals beside it instead of pinning the way a call-valued keyword does.
'''

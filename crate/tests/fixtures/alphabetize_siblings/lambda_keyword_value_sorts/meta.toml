[docs]
previewable = false
title       = "A Lambda-Valued Keyword Sorts With Its Run"

description = '''
`z=lambda row: row.compute()` sorts with the rest of the run, landing after `a=1` and `b=2`.

Binding a `lambda` runs none of its body, so **the `row.compute()` inside it cannot execute while the arguments are evaluated**. The keyword sorts like the plain literals beside it rather than pinning the way a keyword whose value is an actual call does.
'''

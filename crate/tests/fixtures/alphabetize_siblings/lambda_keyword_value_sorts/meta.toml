[docs]
previewable = false
title       = "A Lambda-Valued Keyword Sorts With Its Run"

description = '''
`foo` is called with `z=lambda row: row.compute()`, `b=2`, and `a=1`. **`z` sorts with the rest of the run and ends up after `a=1` and `b=2`**, because binding a `lambda` runs none of its body, so the `row.compute()` inside it cannot execute while the arguments are evaluated, and the keyword sorts like the plain literals beside it rather than pinning the way a keyword whose value is an actual call does.
'''

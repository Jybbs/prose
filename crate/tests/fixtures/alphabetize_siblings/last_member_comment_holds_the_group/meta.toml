[docs]
previewable = false
title       = "A Comment on the Last Member Blocks the Sort"

description = '''
The `__slots__` tuple opens mid-row with `"name"` trailing the `(`, and its last member `"_field_type"` carries the trailing comment `# private to the descriptor`. **Nothing moves**, because a sort here would swap the string texts in place while each row's trailing text stayed put, leaving the comment attached to whichever member ended up on that row instead of `"_field_type"`, so a comment on the last member blocks the sort just as surely as one in the middle.
'''

previewable = false
title       = "`match` Case Arms Sort Without Crossing"

description = '''
`case 1` and `case 2` of the `match` each contain an out-of-order import pair. **Each `case` arm sorts its body independently and no import crosses a case boundary**, `case 1` moving `from alpha import b` ahead of `from zeta import a` and `case 2` swapping `beta` and `gamma` the same way, even though `from beta import d` would sort between `alpha` and `zeta` were the arms one list.
'''

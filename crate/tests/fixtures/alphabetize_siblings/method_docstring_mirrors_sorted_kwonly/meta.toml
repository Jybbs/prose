title       = "Docstring Entries Mirror the Sorted Keyword-Only Block"

description = '''
The docstring mirrors the signature **as the rule leaves it**, not as the source wrote it.

The keyword-only block re-sorts to `mode, retries=3`, moving the required `mode` ahead of the defaulted `retries`. The `mode:` and `retries:` entries under `Args:` swap to match, which keeps the docs in the same order as the signature a reader is scanning beside them.
'''

[docs]
previewable = false
title       = "A Method Stays Below the Attribute Whose Name It Shadows"

description = '''
`limits = span.__slots__` reads the module-level `span` class the moment the `class window:` statement executes, and a method named `span` binds that same name later in the class body. **Nothing in `window` moves**, because sorting the method above `limits` would leave `limits` reading the method rather than the class and raise `AttributeError` on a function that has no `__slots__`. A member stays on whichever side of a binding it reads the source put it on, and a method is a binding like any other.
'''

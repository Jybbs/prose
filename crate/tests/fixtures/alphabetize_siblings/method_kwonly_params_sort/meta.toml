[docs]
previewable = true
title       = "Method Keyword-Only Parameters Sort"

description = '''
The hold on positional order covers only the parameters ahead of the `*`, so `self, target, source` stay exactly as declared.

The keyword-only block behind it **still sorts**, moving the required `mode` to the front with the defaulted `atomic=True` and `retries=3` alphabetizing after it. Keyword-only parameters bind by name at every call site, so reordering them changes no caller.
'''

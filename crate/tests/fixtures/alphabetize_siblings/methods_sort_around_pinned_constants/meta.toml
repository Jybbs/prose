title       = "Methods Sort Around Pinned Class Constants"

description = '''
`DEFAULT_TIMEOUT` and `MAX_RETRIES` are interleaved with `Settings`' three methods. **The constants stay in their source places and the methods sort around them**, `__init__` taking the first method place, `_read_lock` the second, and `update` the last, each in a place another method vacated.
'''

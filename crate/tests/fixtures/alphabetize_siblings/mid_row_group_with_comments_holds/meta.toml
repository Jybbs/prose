[docs]
previewable = false
title       = "A Mid-Row Group Containing a Comment Keeps Its Order"

description = '''
`__all__` opens mid-row, `"delta"` trailing the `[`, with an own-line `# section` comment between its members. **The group keeps the order its author sectioned it into**, because a sort here would swap the string texts in place and leave every other character where it is, so the own-line comment could not move with any member.
'''

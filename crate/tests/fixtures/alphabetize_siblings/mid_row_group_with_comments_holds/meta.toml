[docs]
previewable = false
title       = "A Mid-Row Group Holding Comments Keeps Its Order"

description = '''
`__all__` opens mid-row, `"delta"` trailing the `[`, so a sort here would swap the string texts in place and leave every other character where it is. The own-line `# section` comment cannot travel with any member under such a swap, so the group keeps the order its author sectioned it into.
'''

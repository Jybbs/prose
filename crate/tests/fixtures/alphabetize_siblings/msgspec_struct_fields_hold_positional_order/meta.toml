[docs]
previewable = false
title       = "A `msgspec.Struct` Base Keeps Its Field Order"

description = '''
`Posting` extends `msgspec.Struct`, which generates a constructor binding the fields positionally. **Nothing in `Posting` moves**, even though `company` would sort first, because reordering the fields would change the meaning of every call site, so the base pins the class body just as a constructor-generating decorator would, matched by the `Struct` tail of the dotted name so an aliased import is recognized the same way.
'''

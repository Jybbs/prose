[docs]
previewable = false
title       = "A Multi-Line Member Blocks the Packed Swap"

description = '''
The `Process` call opens its keyword group mid-row with `target=worker`, followed by an `args=(...)` member spanning several lines. **The group keeps its source order**, because sorting would move `args=` ahead of `target=worker` by swapping the member texts in place, and the interior rows of `args=(...)` would keep their source columns wherever the text ended up, garbling the layout.
'''

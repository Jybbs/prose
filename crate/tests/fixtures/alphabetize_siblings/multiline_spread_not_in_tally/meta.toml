[docs]
previewable = false
title       = "A Multi-Line Spread Does Not Count Toward the Divider Tally"

description = '''
Blank-line dividers open only once a dict holds two multi-line entries. `**load_defaults(...)` spans several lines, but a spread pins in its source slot and **stays out of that count**.

That leaves `"limits"` as the only multi-line entry carrying a key, so the dict reads as one undivided block. The keys inside `"limits"` still sort, moving `"retries"` ahead of `"timeout"`.
'''

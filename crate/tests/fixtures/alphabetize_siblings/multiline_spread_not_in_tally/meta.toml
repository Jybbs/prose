[docs]
previewable = false
title       = "A Multi-Line Spread Does Not Count Toward the Divider Tally"

description = '''
`config` contains the multi-line `"limits"` dict, the one-line `"cache"`, a `**load_defaults(...)` spread spanning several lines, and the one-line `"version"`. **`"cache"` sorts ahead of `"limits"` and the dict stays one undivided block**, because blank-line dividers open only once a dict contains two multi-line entries, and a spread stays in its source place and is left out of that count, leaving `"limits"` as the only multi-line entry carrying a key.
'''

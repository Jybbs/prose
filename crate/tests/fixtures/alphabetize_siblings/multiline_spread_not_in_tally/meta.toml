[docs]
previewable = false
title       = "A Multi-Line Spread Does Not Count Toward the Divider Tally"

description = '''
`config` contains the multi-line `"limits"` dict, a `**load_defaults(...)` spread spanning several lines, and the one-line `"version"`. **The dict stays one undivided block and the keys inside `"limits"` sort, `"retries"` moving ahead of `"timeout"`**, because blank-line dividers open only once a dict contains two multi-line entries, and a spread stays in its source place and is left out of that count, leaving `"limits"` as the only multi-line entry carrying a key.
'''

[docs]
previewable = false
title       = "A Nested Keyword Run Folds into Its Outer Call"

description = '''
Both keyword runs sort, so `g`'s arguments reorder to `c=2, d=1` and `foo`'s `b=2, a=3` become `a=3, b=2`.

`z=g(...)` **keeps its first slot**, because its value is a call and moving it would change the order the arguments are evaluated in. The inner run folds into the outer call's single edit rather than emitting a second edit that would overlap it.
'''

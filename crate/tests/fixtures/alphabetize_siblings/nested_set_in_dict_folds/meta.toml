previewable = false
title       = "A Nested Reorder Folds Into Its Enclosing Edit"

description = '''
`d` maps `"z"` to the set `{"b", "a"}` and `"k"` to `1`. **The dict keys and the set both sort, `"k": 1` moving ahead of `"z"` and `{"b", "a"}` becoming `{"a", "b"}`**, because the set's reorder folds into the dict's edit rather than emitting a second overlapping edit, so the value text that moves already carries the sorted set.
'''

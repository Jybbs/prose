[docs]
previewable = true
title       = "An Opaque Base Fences the Run Around It"

description = '''
Subscripting `Generic` runs a hook out of a module this file cannot read, and a hook reached that way calls back into the module that imported it, so **nothing written above `Widget` may sort below it** and `zzz_helper` holds its place. The fence is one-sided, since every definition below `Widget` was unbound when the hook ran, leaving `yyy_render` and `aaa_build` **free to sort among themselves**. A base naming no call and no subscript runs nothing and fences nothing.
'''

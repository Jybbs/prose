[docs]
previewable = false
title       = "A Parameter Annotation Keeps the Annotated Class Below Its Type"

description = '''
`Loader.load` annotates `item` as `Record`, and Python evaluates that annotation when the `def` runs, so `Record` must already exist by the time `Loader`'s body executes. **`Record` stays first and the module keeps importing cleanly**, because alphabetical order would lift `Loader` above `Record` and break exactly that.
'''

[docs]
previewable = false
title       = "A Parenthesized Value Keeps Its Parentheses on Reorder"

description = '''
`"b"`'s value sits inside parentheses that span lines, and `"a": 2` follows it. **`"a": 2` moves ahead of `"b"` and the closing `)` moves with `"b"`'s value rather than staying behind with the comma**, so the reordered dict keeps every parenthesis balanced, because the entry's text runs to its paren-aware end.
'''

title       = "A Positional Argument Between Keywords Stays Put"

description = '''
`*overrides` sits between two keywords that need to swap.

The run **swaps the keyword texts in place and keeps every gap between them verbatim**, so the `*overrides` row stays in its own slot. Rebuilding the argument block from scratch would have dropped that row along with the rest of the original layout.
'''

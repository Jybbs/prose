[docs]
previewable = true
title       = "Decorated Functions Hold Their Slot and Their Positionals"

description = '''
Three module-level functions each sit under a value-binding decorator (*`pytest.mark.parametrize`, `hypothesis.given`, `click.argument`*). Every definition **holds its source slot**, since applying a decorator runs a call whose order a reorder would change, and every signature **holds its positional order**, leaving callers a single-file pass cannot see bound as they were.
'''

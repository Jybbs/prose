[docs]
previewable = false
title       = "A Rebound Constant Pins the Sort at Its First Binding"

description = '''
`ITEMS` binds twice, once above `alpha` and once below it, and `alpha`'s default argument `x=ITEMS` reads it. **The run stays as written**, because only the first binding matters to the default that reads it, and the check resolves a name to the earliest statement binding it rather than the last one it happens to see.
'''

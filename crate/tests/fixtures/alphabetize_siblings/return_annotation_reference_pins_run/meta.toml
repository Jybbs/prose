[docs]
previewable = false
title       = "A Return Annotation Keeps the Annotated Class Below Its Type"

description = '''
`Builder.make` declares `-> Helper`, and Python evaluates the return annotation when the `def` runs, so `Helper` must already exist by the time `Builder`'s body executes. **The pair keeps `Helper` first**, because sorting `Builder` above `Helper` would raise `NameError` the moment the module imports.
'''

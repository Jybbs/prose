[docs]
previewable = true
title       = "Set Literals Sort"

description = '''
Set-literal elements **alphabetize**, because a Python set is unordered and reordering the literal changes nothing at runtime. The key is each element's source text, so `{3, 1, 2}` settles as `{1, 2, 3}`.

`*defaults` in `mixed` pins in its source slot, since an unpacking cannot safely move, and `"a"`, `"m"`, and `"z"` sort around it without crossing it.
'''

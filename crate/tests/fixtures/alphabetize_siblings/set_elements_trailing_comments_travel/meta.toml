previewable = false
title       = "Trailing Comments Move With Their Set Element"

description = '''
`flavors` lists `vanilla`, `chocolate`, and `strawberry`, each with a trailing comment. **Each comment moves with its element as the set alphabetizes, `# the rich one` following `chocolate` to the top and `# the classic base` following `vanilla` to the bottom**, because the comment is part of the element's text rather than of its source line, so no element ends up with a neighbor's note.
'''

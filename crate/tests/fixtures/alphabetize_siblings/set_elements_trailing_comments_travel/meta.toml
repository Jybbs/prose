[docs]
previewable = false
title       = "Trailing Comments Travel With Their Set Element"

description = '''
Each trailing comment **travels with its element as the set alphabetizes**, `# the rich one` following `chocolate` to the top and `# the classic base` following `vanilla` to the bottom. The comment moves as part of the element's text rather than staying on its source line, so no element ends up with a neighbor's note.
'''

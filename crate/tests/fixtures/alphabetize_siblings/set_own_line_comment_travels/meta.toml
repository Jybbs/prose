[docs]
previewable = false
title       = "Own-Line Comments Move With Their Set Element"

description = '''
The own-line `# the rich one` sits above `chocolate`, the second element of `flavors`. **The comment moves with `chocolate` to the top of the literal, still directly above it, and `vanilla` moves down past both**, because an own-line comment attaches to the element below it rather than to the place it occupied.
'''

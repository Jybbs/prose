[docs]
previewable = false
title       = "A Single-Field Container Does Not Pin Its Methods"

description = '''
`Counter` contains one annotated field, `value`, plus `normalize` under a `@field_validator` decorator. **The methods still sort, `__init__` rising above `normalize` and `reset`**, because the pin that freezes the methods of a class carrying validators requires at least two annotated fields, so a single-field container sorts like any plain class, marking the lower bound of the detection.
'''

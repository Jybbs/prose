[docs]
previewable = false
title       = "A Single-Field Container Does Not Pin Its Methods"

description = '''
`Counter` holds one annotated field, `value`, plus `normalize` under a `@field_validator` decorator, and its methods **still sort**, `__init__` rising above `normalize` and `reset`. The pin that freezes the methods of a class carrying validators requires at least two annotated fields, so a single-field container sorts like any plain class, marking the lower bound of the detection.
'''

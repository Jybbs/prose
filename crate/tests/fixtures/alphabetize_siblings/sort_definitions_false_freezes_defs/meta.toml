[docs]
previewable = true
title       = "Definitions Freeze in Source Order When Sorting Is Off"

description = '''
With `sort-definitions = false`, `class Zebra` stays above `class Apple` and `withdraw` stays above `deposit`, so **definitions freeze in source order**, holding back the rule's most disruptive move. `Zebra`'s fields still sort, `id: int` climbing above `name: str`, because the knob covers definitions rather than the field list.
'''

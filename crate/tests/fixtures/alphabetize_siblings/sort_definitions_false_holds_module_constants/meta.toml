[docs]
previewable = false
title       = "Module Constants Keep Their Order When Definition Sorting Is Off"

description = '''
The case runs under `sort-definitions = false`, with `ZEBRA`, `APPLE`, and `MANGO` above `render` and `Widget` at module scope. **Nothing moves, the constants staying in source order above the two definitions**, because the class-body constant sort never reaches module scope, so the key that freezes the definitions leaves the constants alone as well.
'''

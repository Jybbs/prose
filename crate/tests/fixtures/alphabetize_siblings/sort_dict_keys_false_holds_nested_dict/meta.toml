[docs]
previewable = false
title       = "A Nested Dict Holds Its Order Too"

description = '''
`outer` keeps `"zulu"` before `"bravo"`, and the inner dict under `"zulu"` keeps `"yankee"` before `"alpha"`. With `sort-dict-keys = false` both levels hold their authored order, because the setting stops the key sort at every nesting depth rather than only in the outermost literal.
'''

[docs]
previewable = false
title       = "Only Dict Keys Keep Their Order When Key Sorting Is Off"

description = '''
The case runs under `sort-dict-keys = false`, with two bare imports, an `__all__`, the dict `CONFIG`, and a `render` call each out of order. **`CONFIG` alone keeps `"zulu"` before `"alpha"`, whereas the imports sort, `__all__` sorts under the untouched `sort-dunder-lists` setting, and the `render` keywords reorder to `alpha=` before `zulu=`**, because the setting turns off the dict-literal sort alone.
'''

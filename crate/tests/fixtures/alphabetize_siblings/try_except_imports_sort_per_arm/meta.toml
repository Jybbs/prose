[docs]
previewable = false
title       = "`try` and `except` Imports Sort per Arm"

description = '''
The `try` body contains three `from` imports out of order and the `except ImportError` handler contains two. **Each arm alphabetizes independently, `from alpha import b` climbing to the top of one and `from delta import e` to the top of the other, and neither sort leaks into the other arm**, the same way blank-line-separated import runs each sort within their own group.
'''

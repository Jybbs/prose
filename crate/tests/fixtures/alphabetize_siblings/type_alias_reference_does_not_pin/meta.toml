[docs]
previewable = false
title       = "A Type Alias Reading a Definition Does Not Pin the Run"

description = '''
`type Pair = tuple[Zeta, Zeta]` sits between `class Zeta` and `class Apple` and names `Zeta` in its value. **`Apple` sorts ahead of `Zeta`**, because a `type` statement evaluates its value only at first use, so moving `class Zeta` below the alias raises no `NameError` when the module imports.
'''

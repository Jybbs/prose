[docs]
previewable = false
title       = "`if TYPE_CHECKING` Blocks Sort Their Imports"

description = '''
The three `from` imports inside `if TYPE_CHECKING:` sit out of order, and they **alphabetize exactly as they would at module level**, `from alpha import beta` climbing to the top. The recursion into compound statements reaches every sub-body, so the same reorder fires inside `if`, `for`, `while`, `with`, `try`, and `match` arms.
'''

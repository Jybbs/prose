[docs]
previewable = false
title       = "`if TYPE_CHECKING` Inside a Function Sorts Its Imports"

description = '''
The `if TYPE_CHECKING:` block inside `use_types` contains three imports out of order. **They sort through the same compound-statement recursion that fires at module level, `from alpha import b` climbing to the top**, because an import run sorts in every scope, whereas a function body skips the class, method, and field reorders.
'''

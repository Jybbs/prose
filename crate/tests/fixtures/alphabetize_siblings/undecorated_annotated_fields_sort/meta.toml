previewable = false
title       = "Annotated Fields Sort With No Decorator or Base Class"

description = '''
`Posting` carries no decorator and no base class, and its annotated fields are out of order. **The fields alphabetize, `company: str` climbing above `title: str = "Untitled"`**, because the structural form, an `AnnAssign` with a `Name` target, is the signal rather than any framework around the class.
'''

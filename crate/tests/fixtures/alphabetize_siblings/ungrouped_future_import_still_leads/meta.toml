[docs]
previewable = false
title       = "The `__future__` Pin Survives a Flat Import Block"

description = '''
The case runs under `group-imports = false`, with `from __future__ import division` above a `from` import and two bare imports out of order. **The imports sort as one flat block and `from __future__ import division` stays on the first line rather than sorting among the names below it**, `import os` and `import sys` following with `from collections import Counter` last, because Python requires `__future__` imports to lead the module.
'''

[docs]
previewable = false
title       = "A Validator Decorator Pins Every Method"

description = '''
`Posting` defines two `@field_validator` methods and a plain `display` method, with its fields `title` and `name` out of order. **The class skips method alphabetization entirely, so `normalize_title`, `normalize_name`, and `display` stay in source order even though `display` would sort first, whereas the fields still sort, `name: str` climbing above `title: str`**, because a decorator like `@field_validator("title")` signals that methods may run in declaration order.
'''

[docs]
previewable = false
title       = "A Constant That Stays in Place Opens Two Blank Lines Below a Definition"

description = '''
`LIMIT = compute()` calls `compute`, so it stays where it is written, directly under `helper` with no blank line between them, and `ALPHA` and `ZETA` sort beneath it. **Two blank lines open between `helper` and `LIMIT`**, the gap a module keeps after a definition, because a constant that stays in place still spaces as a member of the band beside it.
'''

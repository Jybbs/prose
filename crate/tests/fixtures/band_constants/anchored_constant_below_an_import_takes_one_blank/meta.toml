[docs]
previewable = false
title       = "A Constant That Reads an Import Keeps One Blank Line Below It"

description = '''
`LEVEL` reads `os.environ`, so it stays below `import os` rather than sorting with the other constants, and `ALPHA` and `ZETA` sort beneath it. **The two blank lines between the import and `LEVEL` close to one**, the gap a module keeps after its imports.
'''

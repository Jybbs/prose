[docs]
previewable = false
title       = "An Annotated Constant Trails Its Type"

description = '''
`CONFIG: Settings = {}` reads `Settings` through its annotation, which Python evaluates eagerly when no deferred-annotations import is in force, so the constant depends on the class just as `HANDLER = Settings` does. **Both band beneath the class they name**, sorting by name within that band, `CONFIG` above `HANDLER`.
'''

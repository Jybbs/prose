previewable = false
title       = "Bare and Annotated Assignments Sort Together"

description = '''
The run mixes annotated and bare assignments, and **both forms sort by their target name alone**, so `apple = 1` climbs above `banana: str = "two"` and `zoo: int = 3` drops to the bottom. Whether an assignment carries an annotation makes no difference to the reorder.
'''

title       = "A Bare Annotated Declaration Sorts by Its Name"

description = '''
`zebra: int` declares a name with no value above `apple = 1` and `banana: str = "two"`. **The declaration sorts by its target name with the valued bindings**, ending up below `banana`, and with no right-hand side it reads no other name and runs no code.
'''

previewable = false
title       = "A Dependency Cycle Keeps the Whole Run in Source Order"

description = '''
`FORWARD = BACKWARD + 1` reads `BACKWARD` and `BACKWARD = FORWARD - 1` reads `FORWARD`, so the run's dependency graph carries a cycle. **The whole run stays in source order**, `MIDDLE = 0` included, because no order places each definition ahead of its use.
'''

previewable = false
title       = "A Tuple-Unpacking Target Keeps the Run in Source Order"

description = '''
`(alpha, beta) = (2, 3)` binds two names in one statement between `zebra = 1` and `delta = 4`. **The whole run stays in source order**, because a sorted order could place a statement reading `alpha` or `beta` above the unpacking that binds them.
'''

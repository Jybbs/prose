[docs]
previewable = false
title       = "Tuple-Unpacking Targets Skip the Run"

description = '''
`(alpha, beta) = (2, 3)` binds two names from one statement, and that destructuring target **stops the whole run from sorting**, so `zebra = 1` and `delta = 4` hold their places around it. Reordering could land a statement that reads `alpha` or `beta` above the unpacking that defines them.
'''

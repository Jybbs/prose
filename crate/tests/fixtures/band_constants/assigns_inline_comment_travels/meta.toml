[docs]
previewable = false
title       = "An Inline Comment Moves With Its Constant"

description = '''
`zebra = 1` ends in the trailing comment `# explanatory note`, above `alpha = 2` and `beta = 3`. **The comment moves with `zebra` to the bottom of the run** as the other two sort above it, because a trailing comment belongs to the line it ends.
'''

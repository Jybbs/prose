title       = "A Subscripted Constant Tiers within the Leading Band"

description = '''
`zebra = SETTINGS["timeout"]` indexes a fellow module constant, so `zebra` **stays below `SETTINGS` as the band sorts**. The blank line between them clears and the four bindings merge into one band, with `alpha = 1` and `beta = 2` slotting between the pair.

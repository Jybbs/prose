title       = "A Subscript of Another Constant Sorts Below It"

description = '''
`zebra = SETTINGS["timeout"]` subscripts `SETTINGS`, a constant bound in the same run, with `alpha = 1` and `beta = 2` below it and a blank line above it. **`zebra` sorts to the bottom, below the `SETTINGS` it reads, and the blank line closes** so the four sit as one band, because a tier with a single constant sits tight below the tier above.
'''

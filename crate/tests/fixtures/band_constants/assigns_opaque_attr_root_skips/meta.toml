previewable = false
title       = "Opaque Attribute Roots Skip the Run"

description = '''
`zebra = os.environ` reads through an attribute chain whose root `os` is neither a target in the run nor a module-local binding written above it, so nothing proves the read is safe to move. **The whole run skips**, leaving `alpha = 1` and `beta = 2` in source order below it.
'''

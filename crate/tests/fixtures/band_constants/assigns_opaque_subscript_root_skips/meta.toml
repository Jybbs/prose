[docs]
previewable = false
title       = "A Subscript on an Unbound Root Stays in Place"

description = '''
`zebra = sys.argv[0]` subscripts an attribute of `sys`, a name that is neither bound in the run nor written anywhere above it in the module. **`zebra` stays on the line where it is written**, with `alpha = 1` and `beta = 2` keeping their order beneath it, because nothing in the file proves the read is safe to move.
'''

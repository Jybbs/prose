[docs]
previewable = false
title       = "Opaque Subscript Roots Skip the Run"

description = '''
`zebra = sys.argv[0]` subscripts a value whose root `sys` is neither a target in the run nor a module-local binding written above it, so nothing proves the read is safe to move. **The whole run skips**, leaving `alpha = 1` and `beta = 2` in source order below it.
'''

[docs]
previewable = false
title       = "A Re-Bound Target Skips the Run"

description = '''
`LIMIT` binds twice in one run, first to `10` and again to `20`, and the later write is the one the module keeps. Reordering could swap the two writes and change the final value, so **the whole run skips**, leaving `ALPHA = 1` where it sits between them.
'''

[docs]
previewable = false
title       = "A Name Bound Twice Keeps the Run in Source Order"

description = '''
`LIMIT` is bound twice in one run, to `10` and then to `20`, with `ALPHA = 1` between the two writes. **The whole run stays in source order**, `ALPHA` included, because swapping the two writes would change the value the module keeps.
'''

title       = "Module-Level Runs Reorder Around `# fmt: off` Blocks"

description = '''
The run of `zebra`, `foo`, and `bar_baz` **ends at the `# fmt: off` line**, so those three sort among themselves and `matrix` never joins the run. The hand-shaped rows inside the suppressed span come through verbatim, with `# fmt: on` closing the scope.
'''

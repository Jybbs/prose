[docs]
previewable = false
title       = "A Backslash Line Join Keeps Its Member in Place"

description = '''
A `\` line join opens the row of `y = 2`, below `x = 1` and the own-line comment `# notes`. **`y` keeps its slot and the comment keeps its own line**, so the file passes through unchanged, because a moved member takes its whole physical rows with it, and the break the join continues sits inside that span.
'''

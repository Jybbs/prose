previewable = true
title       = "A Band Heading Stays Above Every Member"

description = '''
The comment `# the tunable solver knobs` reads as a heading for the whole band rather than a note on `MAX_INT` alone, so it **stays at the head** while the constants sort beneath it. `ALPHA_DECAY` climbs past `MAX_INT` without dragging the comment down into the middle of the band.
'''

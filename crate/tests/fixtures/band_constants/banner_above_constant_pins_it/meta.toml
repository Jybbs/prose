[docs]
previewable = false
title       = "A Banner Above a Constant Keeps It in Place"

description = '''
`CACHE_SIZE = 256` sits below `render` under the banner line `# =========================`, and a literal constant in that position would ordinarily move into the leading band above the definition. **Nothing moves**, because the banner opens a section and a band never crosses a banner, so the constant stays in the section the divider opens.
'''

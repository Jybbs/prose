[docs]
previewable = false
title       = "A Bound Comment Rewrites a Band Already in Order"

description = '''
`DEFAULT_EPSILON`, `MAX_INT`, and `PENALTY_TYPES` are already in name order, and the comment `# the convergence floor the solver stops at` sits directly below `DEFAULT_EPSILON` with a blank line after it. **The comment folds onto the line of `DEFAULT_EPSILON` as a trailing note and the blank line closes**, because the rule rewrites the whole band whenever a bound comment moves, even where sorting alone would change nothing.
'''

[docs]
previewable = false
title       = "A Bound Comment Re-Emits an Already-Settled Band"

description = '''
The three constants are already in sorted order, so sorting by itself would rewrite nothing here.

The comment on the second line sits directly below `DEFAULT_EPSILON` and describes it, so it folds up onto that constant's own line as a trailing note. **That fold is the edit that rewrites the group**, and rewriting it also closes the blank line, leaving all three constants standing together.
'''

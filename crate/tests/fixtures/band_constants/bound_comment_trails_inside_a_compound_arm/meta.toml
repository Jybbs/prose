previewable = false
title       = "A Bound Comment Trails Its Constant Inside a Compound Arm"

description = '''
`ZETA_CAP = 1` and `ALPHA_CAP = 2` sit under `if True:`, with the comment `# the ceiling the retry loop reads` directly below `ZETA_CAP` and a blank line after it. **`ALPHA_CAP` sorts above `ZETA_CAP` and the comment folds onto the line of `ZETA_CAP` as a trailing note at the arm's indent**, because the rule runs inside each module-scope compound statement as well as at the top level.
'''

[docs]
previewable = false
title       = "A Bound Comment Trails Its Constant Inside a Compound Arm"

description = '''
`band-constants` runs inside each module-scope compound statement as well as at the top level, so the two constants under `if True:` sort among themselves and `ALPHA_CAP` moves above `ZETA_CAP`.

The comment sits directly below `ZETA_CAP` and describes it, so it folds up onto that constant's line as a trailing note **at the arm's own indent**, and it travels with the constant when the sort moves it.
'''

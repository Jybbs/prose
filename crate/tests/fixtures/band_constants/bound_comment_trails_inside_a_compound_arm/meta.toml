title       = "A Bound Comment Trails Its Constant Inside a Compound Arm"

description = '''
Banding runs inside each module-scope compound arm, so the constants under `if True:` sort in place, `ALPHA_CAP = 2` climbing above `ZETA_CAP = 1`. The comment `# the ceiling the retry loop honors` binds backward to `ZETA_CAP` from the line below it, so it folds onto the constant's line as a trailing note at the arm's own indent and moves with it.
'''

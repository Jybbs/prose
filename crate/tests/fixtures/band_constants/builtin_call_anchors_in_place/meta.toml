[docs]
previewable = false
title       = "A Constant Calling a Builtin Stays in Place"

description = '''
`TABLE = dict(timeout=30)` sits below `build`, and its value names only the builtin `dict`, so by name resolution alone it could move into the leading band above the definition. **It stays where it is written**, because the value is a call, and a call runs code when the line executes, so moving it above `build` would run it earlier than the author wrote.
'''

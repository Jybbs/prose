[docs]
previewable = false
title       = "A Builtin-Call Constant Anchors in Place"

description = '''
`TABLE = dict(timeout=30)` names no module definition, in that `dict` is a builtin, so name resolution alone would let the constant hoist above `build`. The side-effect guard **anchors it in source position** anyway, because evaluating a call runs code, and lifting the line above the definition would run it earlier than the author wrote.
'''

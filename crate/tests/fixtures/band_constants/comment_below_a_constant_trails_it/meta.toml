[docs]
previewable = true
title       = "A Comment Below a Constant Trails It"

description = '''
The blank line below the comment separates it from `MAX_INT`, so it attaches upward to `DEFAULT_EPSILON` instead.

Sorting then moves `DEFAULT_EPSILON` to the top of the group and `PENALTY_TYPES` to the bottom. The comment folds onto its own constant's line as a **trailing note**, which keeps the two together rather than leaving it stranded above whichever constant sorts into its old place.
'''

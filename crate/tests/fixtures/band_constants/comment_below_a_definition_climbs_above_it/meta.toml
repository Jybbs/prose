[docs]
previewable = false
title       = "A Comment Below a Definition Moves Above It"

description = '''
`# documents render` sits directly below the body of `render`, and `ALPHA_DECAY = 1` sits below that. **`ALPHA_DECAY` moves into the leading band above the definition, and the comment moves to the line above `def render(template):`**, because a definition spans several lines, so folding the comment onto its last line as a trailing note would put it after a statement inside the body.
'''

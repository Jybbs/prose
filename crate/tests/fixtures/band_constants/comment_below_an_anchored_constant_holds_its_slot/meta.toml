[docs]
previewable = false
title       = "A Comment Below an Anchored Constant Holds Its Slot"

description = '''
`LIMIT = compute_limit()` calls a name nothing in the module defines, so the constant anchors in place and never bands. The comment `# the ceiling the scheduler honors` binds to `LIMIT`, and because the sort never rewrites the anchored line, the comment keeps the slot the source gave it, leaving `ALPHA_DECAY = 0.9` unchanged below.
'''

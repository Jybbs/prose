previewable = false
title       = "A Band Forms Inside a Module-Scope Compound Arm"

description = '''
`SCALE = factor` sits above `def factor()` inside the arm of `if FEATURE:`. **`SCALE` moves below the `factor` definition it reads**, two blank lines under it, because the rule reads the body of a top-level compound statement the same way it reads the module body, stopping at class and function boundaries, so the body of `factor` stays as written.
'''

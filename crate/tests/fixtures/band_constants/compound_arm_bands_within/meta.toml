title       = "A Band Forms Inside a Module-Scope Compound Arm"

description = '''
Constant banding descends into the arms of a top-level compound statement, so `SCALE = factor` inside the `if FEATURE:` block moves below the `factor` definition it names, forming the arm's trailing band exactly as the module body would. The descent stops at class and function boundaries, leaving `factor`'s own body untouched.

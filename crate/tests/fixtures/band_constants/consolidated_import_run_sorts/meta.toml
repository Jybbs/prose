title       = "An Import Run Sorts When Constant-Banding Consolidates It"

description = '''
`y = 1` splits the two imports, and banding moves it below them, joining the pair into one run. **That consolidated run sorts in the same pass**, `from a import x` landing above `from b import x` immediately rather than one pass behind the move that joined them.

[docs]
previewable = false
title       = "An Import Run Sorts When Constant-Banding Consolidates It"

description = '''
`y = 1` sits between the two imports and splits them into two separate runs.

Moving that constant below the imports brings the pair together as one run, and **a run that has just been joined is then sorted**, so `from a import x` lands above `from b import x`.
'''

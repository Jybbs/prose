[docs]
previewable = false
title       = "A Decorator Constant Blocks an Unsound Hoist"

description = '''
`HANDLER = decorate` names a function, the shape that would normally drop into the trailing band at the bottom of the module. `@HANDLER` decorates `target` further down and runs when that definition executes, so seating the constant last would move it past its user and raise a `NameError` at import. **The move is blocked and the module keeps source order.**
'''

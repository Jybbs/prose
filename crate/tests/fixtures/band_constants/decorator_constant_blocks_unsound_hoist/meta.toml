[docs]
previewable = false
title       = "A Constant Used as a Decorator Stays Above the Function It Decorates"

description = '''
`HANDLER = decorate` names a function, the kind of value that ordinarily moves into the trailing band at the bottom of the module, and `@HANDLER` decorates `target` further down. **Nothing moves**, because a decorator runs when its definition executes, so moving `HANDLER` below `target` would put the binding after its use and raise a `NameError` at import time.
'''

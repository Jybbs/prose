[docs]
previewable = true
title       = "A Derived Constant Reaching a Class Pools Last"

description = '''
`CONFIG = build` names the function, and `build`'s default argument `factory=Widget` names the class, so definition-time reads link all three. **`CONFIG` lands in the trailing band beneath both**, with `Widget` first so its name exists when `def build(factory=Widget)` evaluates its default, and `CONFIG` last so `build` exists when the constant binds.
'''

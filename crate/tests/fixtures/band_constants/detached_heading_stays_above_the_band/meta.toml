title       = "A Detached Heading Moves to the Top of the Band"

description = '''
`# the tunable solver knobs` stands with a blank line on each side between `solve` and the two constants below it, so it reads as a heading for the group rather than as a note on `MAX_INT`. **The constants move into the leading band above `solve` and the heading moves to the top of the group**, above `ALPHA_DECAY` once the sort puts it first, rather than following `MAX_INT` into second place.
'''

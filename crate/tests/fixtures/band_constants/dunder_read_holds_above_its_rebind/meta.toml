[docs]
previewable = true
title       = "A Dunder Read Holds Above the Line That Rebinds It"

description = '''
Nothing here moves. `__xname__ = __name__` reads the name the import machinery bound before the module body ran, and the next line rebinds `__name__` to `"decimal"`.

Sorting the group would be free to place that rebinding above the read, which would hand `__xname__` the new value. Rather than risk it, **the whole region keeps its source order**, so `ZETA` and `ALPHA` stay unsorted alongside it. A constant naming something no earlier binding covers still hoists freely, since moving one up only ever resolves its reference sooner.
'''

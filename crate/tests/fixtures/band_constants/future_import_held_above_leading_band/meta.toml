[docs]
previewable = false
title       = "A `__future__` Import Stays on the First Line"

description = '''
`from __future__ import annotations` opens the module, and `TIMEOUT = 30` sits at the bottom below `fetch`. **The constant moves up to sit one blank line below the `__future__` import, which keeps the first line**, because Python requires a `__future__` import before any other statement, and `fetch` reads `TIMEOUT` only when called, so the constant is free to move above the definition.
'''

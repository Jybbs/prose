[docs]
previewable = false
title       = "A Future Import Holds the Front"

description = '''
`from __future__ import annotations` **stays on the file's first line, above the leading band**, because Python requires a `__future__` import before any other statement. `TIMEOUT = 30` still hoists into the band beneath it, a safe move in that `fetch` reads `TIMEOUT` only when called rather than while the module loads.
'''

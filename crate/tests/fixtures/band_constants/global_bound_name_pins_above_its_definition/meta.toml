[docs]
previewable = true
title       = "A Constant Reading a Global-Bound Name Pins Above Its Definition"

description = '''
`DEFAULT = Selector` resolves against the write `setup` makes through its `global` declaration, because the module's own `class Selector` binds further down the file. A write reaching module scope from inside a function counts as that earlier binding, so **`DEFAULT` holds its source slot** while `TABLE = dict` bands freely past `helper`, its builtin standing unshadowed.
'''

[docs]
previewable = false
title       = "group-subcategories = false Sorts by Tier and Name Alone"

description = '''
`Zeta = int` is a type alias, which the default subcategory grouping clusters ahead of a plain constant like `ALPHA = 1`. Setting `group-subcategories = false` turns that clustering off, so the band sorts by tier and name alone and `ALPHA` moves above `Zeta`.
'''

[docs]
previewable = false
title       = "`group-subcategories = false` Sorts by Tier and Name Alone"

description = '''
`Zeta = int` is a type alias and `ALPHA = 1` a plain constant, and the case runs with `group-subcategories = false`. **`ALPHA` sorts above `Zeta`**, because the setting turns off the clustering that places aliases ahead of constants, leaving a plain sort by tier and name.
'''

[docs]
previewable = false
title       = "A Heading Above a Constant Keeps It in Place"

description = '''
`PALETTE` sits below `build_palette` under the line `### theme colors`, and a literal constant in that position would ordinarily move into the leading band above the definition. **Nothing moves**, because the `###` line reads as a banner opening a section rather than as a note on the constant, and a band never crosses a banner, so `PALETTE` stays in the section the heading opens.
'''

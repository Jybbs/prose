previewable = false
title       = "A Heading and a Bound Comment Both Travel"

description = '''
Two comments are in play here and each attaches to something different. `# the tunable solver knobs` heads the whole group, while `# the decay the scheduler honors` attaches upward to `BETA_DECAY`, because a blank line separates it from `ALPHA_DECAY` below it.

Sorting puts `ALPHA_DECAY` first. The heading **stays at the head of the group**, and the second comment travels with `BETA_DECAY` and lands as a trailing note on its line, so neither comment displaces the other.
'''

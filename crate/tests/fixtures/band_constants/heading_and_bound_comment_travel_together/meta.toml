description = '''
`# the tunable solver knobs` heads the run, and `# the decay the scheduler reads` sits directly below `BETA_DECAY` with a blank line between it and `ALPHA_DECAY`. **The heading stays at the top of the group and the second comment folds onto the line of `BETA_DECAY` as a trailing note**, moving with it as `ALPHA_DECAY` sorts into first place, so neither comment displaces the other.

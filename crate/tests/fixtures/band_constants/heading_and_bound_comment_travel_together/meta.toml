title       = "A Heading and a Bound Comment Both Travel"

description = '''
`# the tunable solver knobs` heads the band, and the comment below `BETA_DECAY` binds upward to that constant because a blank line separates it from `ALPHA_DECAY`. When the sort seats `ALPHA_DECAY` first, the heading stays at the head of the band while `# the decay the scheduler honors` travels with `BETA_DECAY`, landing as a trailing comment on its line, so neither placement overwrites the other.
'''

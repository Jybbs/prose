[docs]
previewable = false
title       = "An Import Below a Definition Moves Into the Import Band"

description = '''
`import os` sits below `def helper`, and `CONFIG = helper` sits below the import. **The import moves to the top of the module and `CONFIG` stays in the trailing band below the definition**, because the right-hand side of `CONFIG` reads `helper`, and that name must be bound when the line runs.
'''

[docs]
previewable = false
title       = "An Import Carries Its Comment Into the Sorted Run"

description = '''
`# the hex helpers both writers call` stands above `import binascii`, which sits below `import zlib` with a blank line on each side of the comment. **The comment moves to the top of the run directly above `binascii` as the two imports sort**, rather than staying above whichever import ends up where `binascii` stood, because an own-line comment above a member moves with it.
'''

[docs]
previewable = false
title       = "Line-Packed Statements Pin the Band"

description = '''
Nothing in this file moves. `TRAIL = make; LEAD = 1` packs two statements onto one physical line with a `;`.

Taken separately the two would travel in opposite directions, since `LEAD = 1` names a literal and would hoist to the top while `TRAIL = make` reads the `make` definition and would sink below it. Reordering works on whole statements and **cannot split a shared line**, so both stay exactly where they are.
'''

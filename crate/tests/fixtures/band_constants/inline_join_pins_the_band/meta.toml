[docs]
previewable = false
title       = "Two Statements on One Line Keep the Band in Place"

description = '''
`TRAIL = make; LEAD = 1` packs two statements onto one physical line with a `;`, above `def make()`. **Nothing moves**, because `LEAD = 1` binds a literal and would move into the leading band while `TRAIL = make` reads `make` and would move below it, and the rule moves whole physical lines, so a line two statements share stays where it is.
'''

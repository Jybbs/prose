[docs]
previewable = false
title       = "Line-Packed Statements Pin the Band"

description = '''
`TRAIL = make; LEAD = 1` packs two statements onto one physical line with a `;`, and banding reorders whole statements, so it cannot pull the pair apart. `LEAD = 1` names a literal and would hoist into the leading band while `TRAIL = make` reads the `make` definition and would trail, yet the shared line pins both in place and the file is left unchanged.
'''

previewable = false
title       = "A Leading Band Orders by Tier Before Name"

description = '''
`AREA = WIDTH * HEIGHT` reads the two constants below it, and all three sit under `area`, the function that reads `AREA`. **The three move into the leading band above the definition with `HEIGHT` and `WIDTH` first and `AREA` beneath them**, even though `AREA` sorts first by name, because the band orders by dependency tier before name, and a tier with a single constant sits tight below the tier above.
'''

[docs]
previewable = true
title       = "A Dependency-Clean Constant Hoists above Its Body Reader"

description = '''
`TIMEOUT = 30` touches only a literal, so it **hoists into the leading band at the top of the module**, above the `fetch` definition that reads it. The move is safe because `fetch` reads `TIMEOUT` only when called, so a reference inside a function body constrains no module order.
'''

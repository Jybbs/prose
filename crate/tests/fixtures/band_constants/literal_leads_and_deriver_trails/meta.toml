[docs]
canonical   = true
previewable = true
title       = "A Literal Constant Leads and a Deriver Trails the Definitions"

description = '''
This is the basic split the rule makes. A constant whose value reaches only imports, builtins, and literals **moves up to sit directly below the imports**, while a constant that names a definition further down **moves below the definitions**.

`TIMEOUT = 30` is a plain literal, so it lifts above `build`. `SESSION = build` reads the `build` definition, so it stays underneath it. The module then reads top to bottom as its imports, its plain constants, its definitions, and finally the constants derived from those definitions.
'''

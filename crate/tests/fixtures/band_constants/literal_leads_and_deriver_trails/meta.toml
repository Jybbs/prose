[docs]
canonical   = true
previewable = true
title       = "A Literal Constant Leads and a Deriver Trails the Definitions"

description = '''
A constant whose value reaches only imports, builtins, and literals **lands in a leading band directly below the imports**, while one that names a later definition **pools into a trailing band beneath the definitions**. `TIMEOUT = 30` therefore lifts above `build` into the leading band, whereas `SESSION = build` reads the `build` definition and trails it, so the module reads as its imports, its leading constants, its definitions, then the constants derived from them.
'''

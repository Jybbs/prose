[docs]
previewable = false
title       = "A Long Comment Moves Above Its Constant Rather Than Overrun the Budget"

description = '''
The comment below `ZETA_WITH_A_RATHER_LONG_NAME = 1` describes that constant, and folding it onto the constant's line as a trailing note would push the line past the line budget. **The comment moves to the line above `ZETA_WITH_A_RATHER_LONG_NAME` and follows it as `ALPHA_CAP` sorts to the top**, so the pair stays together without producing a line for `line-overflow` to report.
'''

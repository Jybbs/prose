[docs]
previewable = false
title       = "max-tiers = 1 Holds the Band Tight"

description = '''
`X = A + B` and `Y = A * B` both read `A` and `B`, so the four constants sit at two dependency levels.

`max-tiers = 1` allows only one level before a blank line would open, which here means **no blank line opens at all**. The four assignments stay as a single tight run, with the two plain literals still ordered ahead of the two derived from them.
'''

[docs]
previewable = false
title       = "`max-tiers = 1` Keeps the Band Tight"

description = '''
`X = A + B` and `Y = A * B` both read `A` and `B`, so the four constants sit at two tiers, and the case runs with `max-tiers = 1`. **No blank line opens between the two tiers**, because the setting allows one tier before a sub-band would open, so the four assignments stay one tight run with the two literals ahead of the two derived from them.
'''

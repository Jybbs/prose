[docs]
previewable = true
title       = "max-tiers = false Opens Every Tier"

description = '''
The constants sit at three dependency levels, since `X` and `Y` read `A` and `B`, and `P` and `Q` in turn read `X` and `Y`.

`max-tiers = false` removes the cap entirely, so **a blank line opens at every level boundary**. Each stage of evaluation reads as a small group of its own.
'''

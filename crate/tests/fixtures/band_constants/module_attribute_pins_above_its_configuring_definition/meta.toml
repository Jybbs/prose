[docs]
previewable = true
title       = "A Constant Reading a Configured Module Attribute Pins Above Its Definition"

description = '''
`LEVEL = logging.root.level` reads state that `Configure` sets when its body runs, so seating the constant above that class would read the level before `logging.basicConfig` had set it. **`LEVEL` holds its source slot** while `TABLE = dict` bands freely past `helper`, its builtin naming nothing the module configures.
'''

[docs]
previewable = true
title       = "A Constant Reading a Configured Module Attribute Pins Above Its Definition"

description = '''
`LEVEL = logging.root.level` reads state that `class Configure` sets when its body runs, since the class calls `logging.basicConfig` at definition time.

Moving `LEVEL` above that class would read the level before it had been configured, so **`LEVEL` holds its source position**. `TABLE = dict` names a builtin and observes nothing the module configures, so it moves up freely past `helper`.
'''

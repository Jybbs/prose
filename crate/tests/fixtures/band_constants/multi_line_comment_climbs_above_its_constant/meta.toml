[docs]
previewable = false
title       = "A Multi-Line Comment Climbs Above Its Constant"

description = '''
The two-line comment block below `DEFAULT_EPSILON` describes that constant, exactly as a single-line comment would.

Two lines cannot fold onto the assignment as a trailing note, so the block **moves above `DEFAULT_EPSILON` instead** and travels with it through the sort. The three constants still pack as one run beneath the block, `MAX_INT` and `PENALTY_TYPES` following without a blank line.
'''

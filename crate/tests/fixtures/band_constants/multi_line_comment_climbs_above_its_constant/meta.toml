[docs]
previewable = false
title       = "A Multi-Line Comment Moves Above Its Constant"

description = '''
The two-line comment block below `DEFAULT_EPSILON = 0.1` describes that constant, the way a single-line comment would. **The block moves above `DEFAULT_EPSILON` and follows it to the top of the group**, because two lines cannot fold onto the assignment as a trailing note, and `MAX_INT` and `PENALTY_TYPES` follow beneath with no blank line.
'''

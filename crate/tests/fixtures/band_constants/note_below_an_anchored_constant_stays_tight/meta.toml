[docs]
previewable = false
title       = "A Note below an Anchored Constant Stays Tight against It"

description = '''
`# documents RAW` sits directly under `RAW = compute()` with a blank line before `SCALED = RAW`, so it reads as `RAW`'s own note, and both constants anchor on the call while `ALPHA` and `ZETA` sort beneath them. **The note keeps its place against `RAW`** rather than opening a blank line, because only a heading with a blank line on each side of it holds the band off.
'''

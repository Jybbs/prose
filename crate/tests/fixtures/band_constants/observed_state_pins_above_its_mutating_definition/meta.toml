[docs]
previewable = true
title       = "A Constant Observing Mutated State Pins Above Its Definition"

description = '''
`FIRST = TRACE[0]` reads what is inside the list rather than binding the list itself, and `class Setup` appends to `TRACE` while its body executes.

Moving `FIRST` up to the top would read `TRACE` before that class body had run, so **`FIRST` holds its source position** just below the class. `LABEL = "ready"` observes nothing, so it moves up freely past `Setup`.
'''

[docs]
previewable = false
title       = "A PEP 695 Type Alias Bands as an Alias"

description = '''
`type Seconds = float` is a PEP 695 type alias rather than an ordinary constant, and aliases are grouped ahead of plain constants.

`Seconds` therefore **moves to the top** even though it was written between `MAX` and `COUNT`, and the two plain constants sort alphabetically beneath it.
'''

[docs]
previewable = false
title       = "A PEP 695 Type Alias Sorts Ahead of the Plain Constants"

description = '''
`type Seconds = float` sits between `MAX = 10` and `COUNT = 5`. **`Seconds` moves to the top and the two constants sort by name beneath it**, because a PEP 695 alias clusters with the type aliases, and the aliases sort ahead of the `SCREAMING_CASE` constants within a band.
'''

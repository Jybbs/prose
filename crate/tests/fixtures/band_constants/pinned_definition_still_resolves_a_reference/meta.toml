[docs]
previewable = false
title       = "A Constant Naming a Class Under a Banner Still Moves to the Trailing Band"

description = '''
`class FilterError` sits under the `# Filters` banner line, which keeps the class in its section, and `FILTER_ERRORS = (FilterError, OSError)` sits directly below it above `apply_filter`. **`FILTER_ERRORS` moves into the trailing band below `apply_filter`**, because its value names the class, and a class kept in place by a banner still resolves as a definition the constant depends on.
'''

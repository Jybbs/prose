[docs]
previewable = false
title       = "A Pragma Below a Constant Holds Its Slot"

description = '''
`# type: ignore` annotates whichever line it sits on, so it is inert on a line of its own yet would take effect if the band carried it onto a constant's line as a trailing comment. The pragma therefore pins where the source put it, and `ALPHA_CAP` holds below it rather than sorting above `ZETA_CAP`, leaving the file unchanged.
'''

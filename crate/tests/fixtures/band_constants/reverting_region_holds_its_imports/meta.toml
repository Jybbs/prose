[docs]
previewable = false
title       = "A Reverting Region Holds Its Imports"

description = '''
Nothing in this file moves, imports included. `@HANDLER` runs when `target` executes and reads the constant that `HANDLER = decorate` binds, so reordering would place the decorator above the name it needs.

The whole region **reverts to its source order** rather than risk that, and the imports at the head of the same region revert along with it. `zlib` stays above `abc`, where a region that did reorder would have sorted the pair.
'''

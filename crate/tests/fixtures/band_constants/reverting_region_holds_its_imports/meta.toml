previewable = false
title       = "A Region That Keeps Source Order Keeps Its Imports Unsorted Too"

description = '''
`import zlib` sits above `import abc`, and further down `@HANDLER` decorates `target` with the constant `HANDLER = decorate` binds. **Nothing moves, the two imports included**, because moving `HANDLER` below `target` would place the decorator above the name it reads, so the whole region keeps its source order, and the imports at the head of that region stay as `zlib` above `abc` rather than sorting.
'''

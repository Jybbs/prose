[docs]
previewable = false
title       = "A Second Note Climbs When the Line Is Already Full"

description = '''
The comment below `ZETA_CAP` binds upward to it, yet the constant's line already ends in a trailing note, forcing the fit check to measure from the end of that note rather than from the end of the code. Appending a second note would run the line past the budget, so `# and a second note bound from below` climbs above `ZETA_CAP` instead and travels with it when `ALPHA_CAP` sorts first.
'''

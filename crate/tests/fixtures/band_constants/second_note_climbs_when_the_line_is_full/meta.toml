[docs]
previewable = false
title       = "A Second Note Moves Above a Constant Whose Line Is Already Full"

description = '''
`ZETA_CAP = 1` already ends in a trailing note, and the comment below it describes the same constant. **The second comment moves to the line above `ZETA_CAP` and follows it as `ALPHA_CAP` sorts to the top**, because appending it after the existing note would run the line past the line budget, measured from the end of the note rather than the end of the code.
'''

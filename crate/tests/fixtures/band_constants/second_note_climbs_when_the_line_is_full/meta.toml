[docs]
previewable = false
title       = "A Second Note Climbs When the Line Is Already Full"

description = '''
`ZETA_CAP` already ends in a trailing note, and the comment below it describes that same constant.

Adding the second note to that line measures from the end of the existing note rather than from the end of the code, which runs the line past the budget. The second comment **moves above `ZETA_CAP` instead**, and travels with it when `ALPHA_CAP` sorts to the top.
'''

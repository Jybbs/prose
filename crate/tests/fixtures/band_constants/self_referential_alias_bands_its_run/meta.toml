[docs]
previewable = false
title       = "A Self-Referential Type Alias Moves With Its Run"

description = '''
`type Node = Node | None` names itself in its own value, and it sits with `LIMIT = 5` below `build`. **The alias and the constant both move into the leading band above `build`**, because Python evaluates a `type` statement's value only when something reads the alias's `__value__` or calls its `evaluate_value`, so the self-reference neither keeps `Node` in place nor blocks the move of the run around it.
'''

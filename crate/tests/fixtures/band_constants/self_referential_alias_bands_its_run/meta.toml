[docs]
previewable = false
title       = "A Self-Referential Type Alias Bands With Its Run"

description = '''
`type Node = Node | None` names itself in its own value, a reference that resolves to the alias being defined and so adds no dependency on anything else in the module. The alias and `LIMIT = 5` **both hoist above `build`** into the leading band, the self-reference neither pinning `Node` where it sat nor blocking the move of the run around it.
'''

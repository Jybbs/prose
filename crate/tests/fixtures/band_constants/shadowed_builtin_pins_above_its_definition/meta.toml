[docs]
previewable = true
title       = "A Constant Naming a Shadowed Builtin Pins Above Its Definition"

description = '''
`LIMIT = TimeoutError` reads the builtin, because it sits above the module's own `class TimeoutError` further down the file.

Moving `LIMIT` below the definitions would bind it to that class instead of the builtin, so **it holds its source position**. `TABLE = dict` names a builtin that nothing in the module shadows, so it moves up freely past `helper`.
'''

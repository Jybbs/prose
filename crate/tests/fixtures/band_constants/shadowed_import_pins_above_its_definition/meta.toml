[docs]
previewable = true
title       = "A Constant Naming a Shadowed Import Pins Above Its Definition"

description = '''
`REGISTRY = OrderedDict` reads the imported name, because it sits above the module's own `class OrderedDict` further down the file.

Moving `REGISTRY` below the definitions would bind it to that class instead of the import, so **it holds its source position**. `TABLE = dict` names a builtin that nothing shadows, so it moves up freely past `helper`.
'''

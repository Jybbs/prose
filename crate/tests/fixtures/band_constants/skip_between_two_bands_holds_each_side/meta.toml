previewable = false
title       = "A Skip Directive Between Two Bands Sorts Each Side on Its Own"

description = '''
`# prose: skip[band-constants]` trails the `PINNED` assignment, splitting the constants into a group above it and a group below. **Each group sorts on its own and nothing crosses the pinned statement**, `MIDDLE` moving above `ZEBRA` before it and `ALPHA` above `BETA` after it, because the rule rewrites each run it reads rather than the whole span between them.
'''

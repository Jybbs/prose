[docs]
previewable = false
title       = "A Skip Between Two Bands Holds Each Side"

description = '''
The `# prose: skip[band-constants]` on `PINNED` closes the region around it, leaving a band on either side. **Each band sorts on its own**, `MIDDLE` rising above `ZEBRA` before the pin and `ALPHA` above `BETA` after it, because the rule edits each band it rewrites rather than the whole body between them.
'''

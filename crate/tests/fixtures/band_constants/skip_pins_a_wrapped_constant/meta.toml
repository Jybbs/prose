[docs]
previewable = false
title       = "A Skip Directive on a Closing Bracket Keeps the Whole Assignment in Place"

description = '''
`# prose: skip[band-constants]` trails the closing `}` of `ALPHA`, several lines below the line the assignment opens on. **`ALPHA` stays last while `MIDDLE` and `ZEBRA` sort above it**, even though its name sorts first, because the span of the directive reaches back to the opening line of the statement rather than covering only the line the bracket sits on.
'''

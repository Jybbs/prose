[docs]
previewable = false
title       = "A Wrapped Constant's Skip Pins It Against the Band"

description = '''
The `# prose: skip[band-constants]` trails the closing `}` of `ALPHA`, several lines below where that assignment starts.

The directive still **pins the whole `ALPHA` assignment**, because its span reaches back to the statement's opening line rather than covering only the line the closing bracket sits on. `MIDDLE` and `ZEBRA` sort above it, and `ALPHA` stays last even though its name would sort first.
'''

title       = "Stacked Comment Blocks Keep the Blank Between Them"

description = '''
`# per-attempt ceiling, in milliseconds` binds forward to `ATTEMPT_MS`, whereas `# the retry envelope the loader reads` stands apart as a heading for the whole band. When the band hoists above `load` and opens a blank between its literal and derived tiers, the blank between the two comment blocks **survives the hoist**, so the heading and the bound note stay distinct however often the file is formatted.
'''

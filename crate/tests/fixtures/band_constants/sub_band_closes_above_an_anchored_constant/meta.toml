[docs]
previewable = true
title       = "A Sub-Band Closes with a Blank Line above an Anchored Constant"

description = '''
`DERIVED_A` and `DERIVED_B` read the base pair and open a blank-separated sub-band beneath it, and `LIMIT = compute()` anchors in place below them. **The sub-band closes with one blank line above the anchored constant**, the same tier boundary a banded member would open, so the derived pair reads apart from a constant that derives from neither.
'''

[docs]
previewable = true
title       = "Aliases, Constants, and Module State Cluster within a Band"

description = '''
The bindings here are of three different kinds. `Handler` and `Interval` are type aliases, `DEFAULT` and `MAX` are `SCREAMING_CASE` constants, and `setting` and `threshold` are lowercase module state.

Each kind **clusters with its own**, in that order, and the members alphabetize inside each cluster. The aliases lead, the constants follow, and the module state comes last.
'''

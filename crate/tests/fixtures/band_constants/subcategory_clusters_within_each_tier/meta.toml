[docs]
previewable = true
title       = "Subcategory Clustering Holds within Each Evaluation Tier"

description = '''
`Handler = Callable[[Seconds], None]` reads the `Seconds` alias and `TIMEOUT = MAX + 1` reads `MAX`, so both **climb into the derived tier** below the blank line the tier split opens. Subcategory clustering still holds inside each tier, the alias leading the constant in both, `Seconds` ahead of `MAX` above the blank and `Handler` ahead of `TIMEOUT` beneath it.
'''

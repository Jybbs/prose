[docs]
previewable = true
title       = "The Sub-Band Reads the Value, Not the Name"

description = '''
Which cluster a binding joins is decided by **its value, not by how its name is spelled**.

`opener = TarFile.open` points at something that already exists, so it counts as an alias despite its lowercase name. `Config = {"debug": True}` builds a fresh dict, so it counts as module state despite its PascalCase. `opener` therefore leads, `MAX` follows as a plain constant, and `Config` trails.
'''

title       = "A Constant Moving to the Trailing Band Leaves Its Imports Sorted"

description = '''
`RESULT = make` sits between `import b` and `import a`, splitting the import run in two. **`RESULT` moves below `def make()` into the trailing band, and the two imports merge into one run and sort**, `import a` above `import b` at the top of the module.
'''

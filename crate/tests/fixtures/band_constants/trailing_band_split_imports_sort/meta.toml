previewable = false
title       = "A Trailing-Band Splitter Leaves Its Imports Sorted"

description = '''
`RESULT = make` sits between `import b` and `import a`, splitting the import run in two. Because it names the `make` definition, the constant pools down into the trailing band, and **the two imports it had split merge into sorted order**, landing as `import a` then `import b` at the top of the module.
'''

title       = "A Trailing Band Stratifies by Tier"

description = '''
`FIRST` and `SECOND` each name the `base` definition, so all four constants pool below it, and `DERIVED_A` and `DERIVED_B` read that pair in turn. The trailing band stratifies by tier the same as a leading one, so a blank line opens between the base pair and the two constants derived from them.

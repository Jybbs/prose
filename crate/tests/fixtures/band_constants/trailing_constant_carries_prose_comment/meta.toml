[docs]
previewable = true
title       = "A Trailing-Band Constant Carries Its Comment Down"

description = '''
`REGISTRY = build_default` names a definition that appears later in the file, so the constant pools into the trailing band beneath `build_default`. The comment `# the lazily-built registry` binds to `REGISTRY` across the blank line between them, so it travels down with the constant and lands directly above it.
'''

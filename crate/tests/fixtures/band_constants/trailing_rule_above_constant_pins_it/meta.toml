[docs]
previewable = false
title       = "A Trailing Rule Above a Constant Pins It In Place"

description = '''
The `# Cache Sizing ****#` comment puts its decorative run after the label and caps the line with a `#`, the reverse of a heading whose rule opens the line. It reads as a section divider all the same, so `CACHE_SIZE` stays pinned beneath it rather than hoisting across the divider into the leading band above `render`, leaving the file unchanged.
'''

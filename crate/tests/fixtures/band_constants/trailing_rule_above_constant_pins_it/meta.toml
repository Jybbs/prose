previewable = false
title       = "A Trailing Rule Above a Constant Pins It In Place"

description = '''
Nothing in this file moves. The `# Cache Sizing ****#` line puts its decorative run after the label and caps the line with a `#`, which is the reverse of a heading whose rule opens the line.

It reads as a section divider all the same, so `CACHE_SIZE` **stays beneath it** rather than hoisting across the divider to join the constants above `render`.
'''

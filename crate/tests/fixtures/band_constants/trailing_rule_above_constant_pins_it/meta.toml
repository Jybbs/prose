[docs]
previewable = false
title       = "A Banner With a Trailing Rule Keeps the Constant Below It in Place"

description = '''
`CACHE_SIZE = 256` sits below `render` under the `# Cache Sizing` banner line, whose run of `*` follows the label and ends the line with a `#`, the reverse of a banner whose rule opens the line. **Nothing moves**, because the line still reads as a banner, and a band never crosses a banner, so `CACHE_SIZE` stays in the section it opens rather than moving above `render`.
'''

title       = "A Trailing Rule Above a Constant Pins It In Place"

description = '''
The decorative run closes the label rather than opening it, and a `#` caps the line, the box shape `# Cache Sizing ****#` takes. It reads as a section divider all the same, so banding leaves `CACHE_SIZE` beneath it rather than hoisting the constant across the divider into the leading band.
'''

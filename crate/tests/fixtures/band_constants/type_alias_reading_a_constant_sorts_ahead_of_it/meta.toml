[docs]
previewable = false
title       = "A Type Alias Reading a Constant Sorts Ahead of It"

description = '''
`type Bounded = Annotated[int, Field(le=CEILING)]` reads `CEILING = 90` from the line above it. **The alias moves ahead of the constant**, because Python evaluates a `type` statement's value only when something reads the alias's `__value__` or calls its `evaluate_value`, so the reference places it in no deeper tier and the aliases sort ahead of the `SCREAMING_CASE` constants.
'''

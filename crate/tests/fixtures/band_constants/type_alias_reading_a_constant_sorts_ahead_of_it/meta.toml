[docs]
previewable = false
title       = "A Type Alias Reading a Constant Sorts Ahead of It"

description = '''
`type Bounded = Annotated[int, Field(le=CEILING)]` reads `CEILING = 90` from the line above it. **The alias moves ahead of the constant**, because a `type` statement evaluates its value only when its `__value__` is read, so the reference places it in no deeper tier and the aliases sort ahead of the `SCREAMING_CASE` constants.
'''

[docs]
previewable = true
title       = "A Wide Fan-Out Passes the Attribute Budget"

description = '''
`os` is reached through five distinct attributes, from `os.getcwd` to `os.path`, one past the `max-attributes` budget of 4, so `import os` passes unflagged. Rewriting it as `from os import ...` would have to name all five symbols, and at that width the namespace import is the more legible form.
'''

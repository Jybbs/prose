[docs]
previewable = false
title       = "An Import Reached Through One Attribute Inside Functions Is Reported"

description = '''
`import torch` sits at module level and is used only through `torch.tensor`, once in `train` and once in `evaluate`. **The import line is reported**, because an attribute read inside a function body still resolves to the module-level binding, so both uses count toward the same import, and one distinct attribute is the narrow use the lint reports.
'''

[docs]
previewable = true
title       = "A Bare Namespace Reference Passes"

description = '''
`register(os)` passes the module object itself, a use no `from os import ...` rewrite could express, because the caller needs the namespace rather than a symbol from it. That bare reference exempts the import from this lint, so `import os` passes even though `os.getcwd` is its only attribute use.
'''

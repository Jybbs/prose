[docs]
previewable = false
title       = "A Compound Import Flags Only Its Narrowly-Used Segment"

description = '''
`import os, torch` binds both modules in one statement, and the lint counts attribute uses per segment rather than per line. `os` is reached only through `os.environ` and is reported, whereas `torch` fans out across five distinct attributes and passes, so the diagnostic lands on the narrow segment alone.
'''

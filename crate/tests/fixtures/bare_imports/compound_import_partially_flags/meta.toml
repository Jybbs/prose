[docs]
previewable = false
title       = "A Compound Import Is Reported for Its Narrowly-Used Segment Only"

description = '''
`import os, torch` binds both modules in one statement, `os` is reached only through `os.environ`, and `torch` fans out across five distinct attributes. **The diagnostic covers the `os` segment alone**, because the lint counts attribute uses per imported name rather than per line, and `torch` sits past the `max-attributes` limit.
'''

[docs]
previewable = false
title       = "`exempt-aliased = false` Reports an Aliased Import"

description = '''
`import os as o` is reached only through `o.getcwd()`, and the case runs with `exempt-aliased = false`. **The import is reported**, because the setting withdraws the exemption an alias gets by default, so the alias counts like any bare import with a single attribute use.
'''

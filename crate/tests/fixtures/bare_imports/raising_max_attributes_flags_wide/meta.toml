[docs]
previewable = true
title       = "Raising max-attributes Flags a Wider Import"

description = '''
`os` is reached through five distinct attributes, `os.getcwd` through `os.path`, one past the default `max-attributes` budget of 4 and so ordinarily unflagged. Raising the budget to `max-attributes = 6` widens the lint's reach, so the same five-attribute fan-out now falls inside it and the import is reported.
'''

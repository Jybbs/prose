title       = "An Annotated Assignment Writes Its Target and Reads Its Annotation"

description = '''
`x: int = 0` and `y: Pair = (1, 2)` follow `Pair = tuple[int, int]`. **Each annotated assignment records a write at its target's offset and a read for every name its annotation references**, so `x` and `y` carry a write and no read, and `Pair` carries the read from `y: Pair` with `annotation_read` set to `true`, because the table reads an annotation as an ordinary expression.
'''

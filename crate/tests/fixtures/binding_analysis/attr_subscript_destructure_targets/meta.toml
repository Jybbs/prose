title       = "Attribute, Subscript, and Destructuring Targets Bind Only the Names Inside Them"

description = '''
`obj.attr = 1` and `obj[ix] = 2` assign through an attribute and a subscript, and `a, b = (1, 2)`, `*head, tail = xs`, and `[c, d] = (3, 4)` destructure. **The attribute and subscript assignments bind nothing and record reads of `obj` and `ix`, whereas each destructured name records its own write**, so `a`, `b`, `head`, `tail`, `c`, and `d` each appear in the module table with one write and no read.
'''

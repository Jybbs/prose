[docs]
previewable = false
title       = "Augmented Assignment Counts One Read and One Write"

description = '''
`x` is bound by `x = 0` and then augmented twice with `+=`. **An augmented assignment counts as one read plus one write**, so `write_offsets` lists all three statements whereas `read_offsets` lists only the two `+=` sites, and `kinds` carries `AugAssign` next to the original `Assignment`.
'''

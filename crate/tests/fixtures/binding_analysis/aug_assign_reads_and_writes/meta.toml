previewable = false
title       = "An Augmented Assignment Counts One Read and One Write"

description = '''
`x = 0` binds `x`, and `x += 1` and `x += 2` follow. **Each `+=` records one read and one write at its offset**, so `write_offsets` lists all three statements, `read_offsets` lists only the two `+=` sites, and `kinds` carries `AugAssign` beside the original `Assignment`.
'''

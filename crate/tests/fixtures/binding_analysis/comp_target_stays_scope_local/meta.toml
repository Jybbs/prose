previewable = false
title       = "A Comprehension Target Binds in Its Own Scope"

description = '''
`vals = [x for x in xs]` reuses the name of the module-level `x = "outer"`. **The table records two separate `x` bindings, the comprehension's in a `Comprehension` scope of its own**, so the module `x` shows no read and the read inside the comprehension belongs to the scope-local `x`.
'''

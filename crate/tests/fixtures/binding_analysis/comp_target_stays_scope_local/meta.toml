[docs]
previewable = false
title       = "Comprehension Target Stays Scope-Local"

description = '''
`vals = [x for x in xs]` reuses the name of the module-level `x = "outer"`, yet the analysis records two separate `x` bindings. **The comprehension target stays in its own `Comprehension` scope and never reaches the module table**, so the module `x` shows no reads and the read inside the comprehension belongs to the scope-local `x`.
'''

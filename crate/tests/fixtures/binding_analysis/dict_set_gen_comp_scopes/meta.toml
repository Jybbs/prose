[docs]
previewable = false
title       = "Dict, Set, and Generator Comprehensions Each Open a Scope"

description = '''
`mapping` is a dict comprehension, `keys` is a set comprehension, and `total` passes a generator to `sum`, each reading `pairs`. **Each opens a `Comprehension` scope of its own under the module**, the same as a list comprehension, so the three scopes carry `k` and `v`, `k` and `_`, and `_` and `v`, and the module table carries only `pairs`, `mapping`, `keys`, and `total`.
'''

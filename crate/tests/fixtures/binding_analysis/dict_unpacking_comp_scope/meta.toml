[docs]
previewable = false
title       = "A Dict Comprehension With Only a `**` Unpacking Opens a Scope"

description = '''
`merged = {**d for d in dicts}` is a PEP 798 dict comprehension with no key expression, only the `**d` unpacking. **It opens a `Comprehension` scope of its own**, the same as a keyed dict comprehension, so the loop target `d` binds there and the module table carries only `dicts` and `merged`.
'''

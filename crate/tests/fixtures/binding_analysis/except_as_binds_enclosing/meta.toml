[docs]
previewable = false
title       = "Except-As Binds in the Enclosing Scope"

description = '''
`except FileNotFoundError as e` **binds `e` in the enclosing module scope**, recorded with the `ExceptHandler` kind rather than in any scope of its own. Both `print(e)` calls inside the handler count as reads of that binding, so its `read_offsets` lists the two sites.
'''

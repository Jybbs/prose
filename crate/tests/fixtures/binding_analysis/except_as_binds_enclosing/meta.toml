[docs]
previewable = false
title       = "An `except ... as` Name Binds in the Enclosing Scope"

description = '''
`except FileNotFoundError as e` names the caught exception, and two `print(e)` calls read it inside the handler. **`e` binds in the enclosing module scope with the `ExceptHandler` kind**, in no scope of its own, so its `read_offsets` lists both `print(e)` sites.
'''

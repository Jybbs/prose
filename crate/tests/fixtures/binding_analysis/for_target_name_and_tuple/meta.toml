[docs]
previewable = false
title       = "For-Loop Target Binds Enclosing as Name or Tuple"

description = '''
`for i in xs` binds the single name `i`, and `for a, b in xs` destructures its tuple into `a` and `b`. **All three targets bind in the enclosing module scope** with the `For` kind, and each loop header counts as a read of `xs`, so its `read_offsets` lists both.
'''

previewable = false
title       = "A `global` Write Binds at Module Scope and a `nonlocal` Write Stays Local"

description = '''
`globalized` declares `global x` before `x = 1`, and `inner` declares `nonlocal y` before `y = 1` inside `nested`. **`x` binds in the module table and `globalized`'s own scope stays empty, whereas `inner`'s `y` is a second binding in `inner`'s scope separate from the `y` in `nested`**, because the table records the names a `global` statement declares and ignores a `nonlocal` one.
'''

[docs]
previewable = false
title       = "Global and Nonlocal Declarations Are Ignored"

description = '''
`global x` inside `globalized` and `nonlocal y` inside `inner` are **ignored by the analyzer**, so each later write binds in its own function scope. `x = 1` lands in `globalized`'s scope rather than the module table, and `inner`'s `y = 1` becomes a second `y` binding separate from the one in `nested`.
'''

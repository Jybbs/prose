[docs]
previewable = false
title       = "Writes in Both Arms of an `if` Merge Into One Binding"

description = '''
`x` is assigned in both the `if cond:` arm and the `else:` arm, and `print(x)` reads it after. **The two writes merge into one module-scope binding whose `write_offsets` lists both arms**, and `first_unconditional_write` stays empty, because neither arm is guaranteed to run.
'''

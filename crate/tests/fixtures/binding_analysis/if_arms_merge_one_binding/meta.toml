title       = "Both If Arms Merge Into One Binding"

description = '''
`x` is assigned in both arms of the `if cond:` / `else:` split and then read by `print(x)`. **The two writes merge into a single module-scope binding** whose `write_offsets` lists both arms, and because neither arm is guaranteed to run, `first_unconditional_write` stays empty.
'''

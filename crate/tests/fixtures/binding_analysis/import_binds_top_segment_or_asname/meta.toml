[docs]
previewable = false
title       = "Import Binds the Top Segment or the Asname"

description = '''
`import b.c.d` **binds only the top segment `b`**, whereas `import e.f as g` binds its asname `g`. The `from` forms bind each imported name directly, so `i`, the asname `l`, and even `annotations` from `__future__` all land in the module table with the `Import` kind.
'''

previewable = false
title       = "An Import Binds Its Top Segment or Its `as` Name"

description = '''
`import b.c.d`, `import e.f as g`, `from h import i`, `from j import k as l`, and `from __future__ import annotations` follow `import a`. **`import b.c.d` binds only `b` and `import e.f as g` binds only `g`**, whereas each `from` form binds the imported name or its `as` name directly, so `a`, `b`, `g`, `i`, `l`, and `annotations` each appear in the module table with the `Import` kind.
'''

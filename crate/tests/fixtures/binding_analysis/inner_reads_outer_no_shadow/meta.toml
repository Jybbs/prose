previewable = false
title       = "An Inner Function Reads an Outer Binding Without Shadowing It"

description = '''
`inner` returns `x` and never assigns it, and `x = 1` sits in `outer`. **The `return x` records a read on the `x` bound in `outer`**, and `inner`'s own scope table stays empty, so no shadowing entry is written and `outer`'s scope carries `x` and `inner`.
'''

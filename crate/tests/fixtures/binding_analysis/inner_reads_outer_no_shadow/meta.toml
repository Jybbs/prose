[docs]
previewable = false
title       = "Inner Function Reads Outer Without Shadowing"

description = '''
`inner` reads `x` but never assigns it, so the `return x` **counts as a read of the `x` bound in `outer`**.

Only `outer`'s scope carries bindings, one for `x` and one for `inner` itself. The nested function's own scope table stays empty, with no shadowing entry recorded.
'''

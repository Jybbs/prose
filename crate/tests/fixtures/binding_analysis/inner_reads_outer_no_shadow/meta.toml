[docs]
previewable = false
title       = "Inner Function Reads Outer Without Shadowing"

description = '''
`inner` reads `x` without ever assigning it, so the `return x` **counts as a read of the `x` bound in `outer`**. Only `outer`'s scope carries bindings, for `x` and `inner` itself, leaving the nested function's scope table empty with no shadowing entry.
'''

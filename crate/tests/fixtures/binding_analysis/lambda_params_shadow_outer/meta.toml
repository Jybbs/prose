[docs]
previewable = false
title       = "A Lambda Parameter Shadows the Outer Binding"

description = '''
`f = lambda x: x` follows the module-level `x = 1`. **The parameter `x` binds in a function scope of its own with the `Parameter` kind and the read in the lambda body resolves to it**, so the module-level `x` is recorded with no read.
'''

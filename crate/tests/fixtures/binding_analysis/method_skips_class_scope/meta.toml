[docs]
previewable = false
title       = "A Read Inside a Method Skips the Class Scope"

description = '''
`get` returns `x` from inside `C`, whose body binds `x = "inner"` below the module-level `x = "outer"`. **The read resolves to the module-level `x`**, so the module `x` carries the read from `return x` and the class-body `x` carries none, because a method's lookup skips the class scope the way Python's does.
'''

[docs]
previewable = false
title       = "Method Lookup Skips the Class Scope"

description = '''
`get` returns `x` from inside a method, and a method's lookup chain skips the class scope, so **the read resolves to the module-level `x = "outer"` rather than the class-body `x = "inner"`**. The snapshot shows the module `x` carrying the read from `return x` while `C`'s own `x` has none.
'''

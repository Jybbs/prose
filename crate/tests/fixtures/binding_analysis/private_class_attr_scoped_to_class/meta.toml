previewable = false
title       = "A Private Class Attribute Binds in the Class Scope"

description = '''
`C` binds `__secret = 1` in its body, and its method `get` returns `self`. **`__secret` binds in `C`'s class scope beside `get`, and `self` binds in `get`'s function scope with the `Parameter` kind**, so `return self` records that parameter's one read and no other scope table carries either name.
'''

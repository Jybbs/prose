[docs]
previewable = false
title       = "A Walrus Binds in the Enclosing Function Scope"

description = '''
`first_one` tests `(n := len(items)) == 1` and returns `n`. **`n` binds in `first_one`'s function scope with the `Walrus` kind**, in the same table as the `items` parameter, so its `read_offsets` lists the walrus site itself and the `return n`, and `len(items)` records the parameter's read.
'''

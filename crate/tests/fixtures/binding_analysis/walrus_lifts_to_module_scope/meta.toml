[docs]
previewable = false
title       = "A Walrus Inside a Comprehension Binds at Module Scope"

description = '''
The comprehension behind `vals` writes `(y := x * 2)` inside its `if` clause. **`y` binds in the module table beside `xs` and `vals`, whereas the loop target `x` binds in the `Comprehension` scope**, so the two targets written in one expression end up in different scopes, because a walrus binds in the scope enclosing the comprehension.
'''

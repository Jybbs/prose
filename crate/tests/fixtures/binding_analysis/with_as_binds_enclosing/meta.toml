previewable = false
title       = "A `with ... as` Name Binds in the Enclosing Scope"

description = '''
`read_lines` opens `path` with `with open(path) as f` and returns `f.readlines()`. **`f` binds in `read_lines`'s function scope with the `With` kind**, in the same table as the `path` parameter, so the body's `f.readlines()` records the read and lists `readlines` under `attributes`.
'''

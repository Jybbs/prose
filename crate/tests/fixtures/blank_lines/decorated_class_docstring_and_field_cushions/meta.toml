title       = "Decorated Class Threads Docstring and Field Cushions"

description = '''
The blank line between `class Posting:` and its docstring **closes to zero**, binding the docstring to the header even under the `@final` and `@dataclass` decorators. One blank then separates the docstring from the `company` field, and another separates `title` from `def summary(self):`.

title       = "A Stacked Def's Leading Edge Is Its Topmost Decorator"

description = '''
`second` carries the stacked decorators `@first_decorator` and `@second_decorator`, so its **leading edge is the topmost decorator rather than the `def` line**. The gap after `first` widens to the canonical two blanks above `@first_decorator`, and the stack below it stays tight.
'''

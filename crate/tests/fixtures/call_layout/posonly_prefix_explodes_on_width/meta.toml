[docs]
previewable = true
title       = "A Positional-Only Prefix Explodes Positionally on Width"

description = '''
`place` declares `x` and `y` positional-only through the `/` marker, so the call cannot take full keyword form. The line overflows the cap all the same, and an over-cap call never stays inline, so it explodes positionally, one argument per line with the closing `)` back at the statement's indent.
'''

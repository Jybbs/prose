title       = "Star Unpacking Blocks the Explode"

description = '''
`*parts` unpacks an unknown number of arguments into `send`, so there is no telling which of `body` through `wrap` the trailing `extra`, `more`, and `last` bind to, and the unpacking itself can never take a `name=` form. The reshape is blocked, leaving the call inline as written.
'''

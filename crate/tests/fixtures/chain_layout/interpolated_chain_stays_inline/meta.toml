[docs]
canonical   = false
previewable = false
title       = "A Chain Inside a Replacement Field Stays Inline"

description = '''
The chain `query.filter(a).order(b).limit(c)` sits inside an f-string replacement field, where breaking it would splice a line break into a single-quoted field. That is PEP 701 syntax, parsing on Python 3.12 and later and failing everywhere earlier, so the field stays opaque to layout and the chain stays inline.
'''

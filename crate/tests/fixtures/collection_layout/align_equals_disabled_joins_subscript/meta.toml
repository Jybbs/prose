[docs]
previewable = false
title       = "An Assigned Subscript Joins Without a Reserved Column"

description = '''
With `align-equals` disabled, `collection-layout` reserves no shifted column, so `HEADER_VALIDATORS`'s subscript measures against its literal `=` column and **rejoins onto one line**, the exact contrast to the reserved case where the aligned `=` pushes the same rejoin past the budget and leaves the break standing.
'''

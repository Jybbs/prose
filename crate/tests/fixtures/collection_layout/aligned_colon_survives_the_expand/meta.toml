[docs]
previewable = false
title       = "An Aligned Colon Survives the Expand"

description = '''
Expanding the over-long list under `"mike"` re-renders every entry of `notice`, and the padding before each `:` carries through the rewrite, including on the `"alpha"` entry whose value is a parenthesized multi-line string. That padding is the column `align-colons` builds, so dropping it on the re-render would leave the two rules rewriting the same lines back and forth on every run.
'''

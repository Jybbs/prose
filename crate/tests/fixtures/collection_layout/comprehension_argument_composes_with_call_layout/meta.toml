previewable = false
title       = "A Comprehension Argument Joins or Holds Its Re-Indent"

description = '''
The comprehension under `items` fits once collapsed, so `[value for value in source]` joins onto its keyword line whole. The one under `rows` would overflow if joined, so it keeps the keyword-column indent `call-layout` gives it with its `for` and `if` lines stacked, and both shapes settle in one forward pass.
'''

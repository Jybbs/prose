[docs]
canonical   = true
previewable = true
title       = "Dict Entries Break to One Per Line Past the Threshold"

description = '''
A dict literal with non-atomic entries expands to one entry per line, and the reader reads the entries as a column of key-value pairs. A dict the author already wrote across lines holds that column rather than joining back, because `keep-multiline-literals` defaults on.
'''

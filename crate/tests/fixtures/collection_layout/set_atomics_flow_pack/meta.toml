[docs]
previewable = false
title       = "Set Atomics Flow-Pack on Overflow"

description = '''
`short_set` fits the 88-character budget and stays inline, whereas the nine-string `long_set` overflows and expands. **Inside the expanded form, atomic items flow across as few balanced lines as fit** under `code-line-length` and the `max-atomics` cap, landing the permission strings on two balanced rows. `held_set`, written one item per line, holds its break and flow-packs to `"read", "write", "execute"` rather than joining back inline.
'''

[docs]
previewable = false
title       = "Aligned Constants Carry the Reassigned-Constants Lint Past Padding"

description = '''
`DEFAULT_TIMEOUT`, `MAX_RETRIES`, `WINDOW_NAME_PREFIX`, and the two `RATE_LIMIT` writes widen onto a shared `=` column under `align-equals`. `reassigned-constants` flags `RATE_LIMIT` alone, because it is the one name rebound after its first write, leaving the write-once neighbors unreported. **The diagnostic range tracks the source offsets** rather than the post-align statement positions.
'''

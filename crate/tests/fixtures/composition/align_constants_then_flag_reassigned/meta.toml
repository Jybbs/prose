previewable = false
title       = "Aligned Constants Keep the Reassigned-Constant Report on Their Rows"

description = '''
`DEFAULT_TIMEOUT`, `MAX_RETRIES`, `WINDOW_NAME_PREFIX`, and two writes to `RATE_LIMIT` sit in one run, and `align-equals` pads every `=` into one column. `reassigned-constants` reports both `RATE_LIMIT` writes, the one name rebound after its first write, and **each finding lands on its statement's row in the padded output**, covering the whole aligned statement.
'''

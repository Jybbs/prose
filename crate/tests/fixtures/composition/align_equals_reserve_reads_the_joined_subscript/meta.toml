[docs]
previewable = false
title       = "A Reserved `=` Column Measures a Subscript at Its Joined Width"

description = '''
`HEADER_VALIDATORS` is assigned a subscript written across three lines, below `_VALID_HEADER_VALUE_RE_BYTE = 1`. `reflow-collections` joins the subscript back onto one line, and `align-equals` measures the row at that joined width, where padding its `=` out to the column `_VALID_HEADER_VALUE_RE_BYTE` sets would cross the budget. **The `=` stays tight and the subscript stays joined**, rather than the subscript breaking apart to make room for the padding.
'''

[docs]
previewable = false
title       = "Aligned Local Run Carries the Single-Use Lint Past Padding"

description = '''
The body of `compute` assigns four consecutive locals, and `align-equals` widens the `=` column across the whole run. `base`, `used_twice`, and `result` are each read once after their assignment, so **`single-use-variables` emits one diagnostic per once-used binding whose range tracks the source offset**, leaving only the twice-read `offset` unreported.
'''

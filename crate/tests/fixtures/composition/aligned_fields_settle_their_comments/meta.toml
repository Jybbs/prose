[docs]
previewable = false
title       = "Aligned Fields Settle Their Comment Column After the `=`"

description = '''
Both fields of `Config` carry a trailing comment, and `retries` is shorter than `timeout_seconds`. **`align-equals` pads the `=` of `retries` first, and `align-comments` measures the comment column against those padded widths** rather than the widths as written, so the values sit in one column and `# attempts` and `# per attempt` sit in another.
'''

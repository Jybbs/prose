[docs]
previewable = false
title       = "An Aligned Keyword Value Is Measured at Its Padded Column"

description = '''
The exploded `emit` call carries `note=helper(...)` as its last keyword, and `align-equals` pads every keyword `=` into one column, which moves the `helper` call to the right. **The `helper` call explodes**, because it fits the budget at the column the source wrote and crosses it at the padded column, and `reflow-calls` measures it at the padded one.
'''

[docs]
previewable = false
title       = "A Binding That Calls a Function Keeps the Directive"

description = '''
`Alias = build()` calls a function as it binds, so `band-constants` leaves it below `convert` rather than hoisting it with the plain constants, and `convert` names `Alias` in its annotations. **`from __future__ import annotations` stays**, because nothing moves the binding above the annotations that name it, and the unread `import os` beside the directive is removed as usual.
'''

[docs]
previewable = false
title       = "An Anchored Binding Keeps the Directive"

description = '''
`Alias = build()` calls a function as it binds, so it is held below `convert` rather than hoisted up with the plain constants.

Because nothing moves that binding above the annotations naming it, **`from __future__ import annotations` is kept**. The unread `import os` beside it drops as usual.
'''

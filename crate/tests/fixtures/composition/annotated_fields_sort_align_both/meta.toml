previewable = false
title       = "Annotated Fields Sort, Then Both `:` and `=` Align"

description = '''
The four annotated fields of `Endpoint` sit out of alphabetical order at varied name and default widths. `alphabetize-siblings` sorts them so `backend` leads and `timeout` closes, and **`align-colons` and `align-equals` then pad the `:` and the `=` into one column each across the sorted run**.
'''

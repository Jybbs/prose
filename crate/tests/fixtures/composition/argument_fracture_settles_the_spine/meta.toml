title       = "A Fracture Inside an Argument Breaks the Chain"

description = '''
The chain arrives already broken across two lines, but the break sits inside `compute(alpha, beta)` rather than between two links of the chain.

A chain segment runs from one dot to the next, so it covers the whole argument list, which means a break anywhere inside that list **counts as a break in the link itself**. The chain therefore stacks, with `.filter(flag)` and `.render()` beneath `.lookup` on a shared `.` column, while the `compute` call that was fractured rejoins onto one line.
'''

title       = "A Break Inside an Argument Counts as a Break in the Chain"

description = '''
The chain arrives written across two lines, with the break inside `compute(alpha, beta)` rather than between two links. A chain segment runs from one `.` to the next and covers the whole argument list, so **a break anywhere inside that list counts as a break in the link**, and the chain stacks with `.filter(flag)` and `.render()` under `.lookup` on one `.` column, while `reflow-calls` joins the broken `compute` call back onto one line.
'''

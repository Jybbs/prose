title       = "Match-Arm Dicts Expand, Sort Keys, and Align Colons"

description = '''
The `"alpha"` and `"beta"` arms of `dispatch` each return a long inline dict. **Each dict expands one entry per line, its keys sort alphabetically so `"comment_text"` leads, and the `:` column aligns within each arm**, while the wildcard arm's `return None` collapses back onto its `case _:` line.
'''

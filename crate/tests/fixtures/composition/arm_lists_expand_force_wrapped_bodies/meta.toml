[docs]
previewable = false
title       = "Exploded Arm Lists Keep Their Arms Wrapped"

description = '''
The `"alpha"` and `"beta"` arms of `dispatch` return inline lists that overflow the line budget, and the wildcard returns `[]`. `reflow-collections` explodes each list, and **`align-match-case` leaves those two arm bodies wrapped**, because an exploded list makes the `return` a multi-line statement the arm cannot join onto its `case` line, whereas the wildcard's `return []` joins onto `case _:`.
'''

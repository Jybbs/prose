[docs]
previewable = false
title       = "Arm Literals Drop Trailing Commas as Bodies Collapse"

description = '''
The arms of `dispatch` each return an inline list carrying a trailing comma, `[1, 2, 3,]` in the `"alpha"` arm. **`strip-trailing-commas` removes the comma and `align-match-case` collapses each `return` onto its `case` line**, aligning the arm `:` column across the run down to the wildcard.
'''

[docs]
previewable = false
title       = "Arm Literals Drop Their Trailing Commas as the Arms Join"

description = '''
Each arm of `dispatch` returns an inline list with a trailing comma, `[1, 2, 3,]` in the `"alpha"` arm. **`strip-trailing-commas` removes each comma and `align-match-case` joins every `return` onto its `case` line**, padding the arm `:` into one column down to the wildcard.
'''

[docs]
previewable = false
title       = "An Assigned Dict Holds Its Break and Takes the Aligned Equals"

description = '''
The dict assigned to `HEADER_VALIDATORS` would fit back on one line at the `=` column its author wrote, yet `keep-multiline-literals` **holds the break** and re-expands the entries in place. That leaves the assignment's opening line short, so `align-equals` shifts the `=` rightward to clear the longer `_VALID_HEADER_VALUE_RE_BYTE`, an alignment a joined dict would have pushed past the budget.
'''

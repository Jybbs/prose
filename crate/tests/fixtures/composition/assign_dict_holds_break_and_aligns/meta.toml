[docs]
previewable = false
title       = "An Assigned Dict Keeps Its Break and Takes the Aligned `=`"

description = '''
`HEADER_VALIDATORS` is assigned a dict written across several lines, below `_VALID_HEADER_VALUE_RE_BYTE = 1`, and the dict would fit on one line at the `=` column the source wrote. **The `keep-multiline-literals` facet of `reflow-collections` keeps the break, and `align-equals` pads the `=` out to the column `_VALID_HEADER_VALUE_RE_BYTE` sets**, because the opening line is short once the dict stays exploded, whereas a joined dict would have pushed that padding past the budget.
'''

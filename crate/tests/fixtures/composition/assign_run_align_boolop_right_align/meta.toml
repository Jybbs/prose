description = '''
`evaluate` opens with three `record.get` assignments and then guards on a multi-line `BoolOp`. `align-equals` settles the assignment run onto a shared `=` column, and **the `is`, `==`, and `<` comparisons right-align in their own independent column** inside the `if` below.

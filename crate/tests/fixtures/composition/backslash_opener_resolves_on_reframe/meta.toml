[docs]
previewable = false
title       = "A Backslash After the Opener Drops as the Text Moves Down"

description = '''
The module docstring opens `"""\`, the backslash suppressing the newline so the first word starts flush against the quotes. **`frame-docstrings` moves the text onto its own line and `wrap-docstrings` drops the backslash it leaves behind**, rather than wrapping it into the paragraph as a word, where it would read as the invalid escape `\ `.
'''

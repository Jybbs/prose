[docs]
previewable = false
title       = "A Band Heading Carries Off the Merge Lead"

description = '''
`group-imports` puts `import _random` first, which leaves the two-line comment block sitting directly above it rather than above the `math` rows it was written over.

That block is then carried onto `import _random` as the heading for the whole group. `reflow-imports` **reads that move before it happens**, so the gathered `math` rows land next to `itertools` and share its alignment column, rather than opening a run of their own beneath a comment that is about to leave.
'''

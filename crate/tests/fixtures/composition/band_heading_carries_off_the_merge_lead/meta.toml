previewable = false
title       = "A Band Heading Leaves With the Merge Lead"

description = '''
The two-line comment block sits directly above `import _random`, the last statement in a run of `from` imports. `group-imports` moves `import _random` to the front, and the comment block moves with it as the heading of the whole group. **The gathered `math` rows sit beside `itertools` and share its `import` column**, because `reflow-imports` measures against the order that move leaves rather than the order as written, so the rows never open a run of their own under a comment that is about to leave.
'''

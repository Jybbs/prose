description = '''
Module-scope constant banding stops at a section marker, so `ZILCH = 1` stays in its own section above the `# --- Imports ---` divider. The imports below sort within theirs, `import abc` moving ahead of `import zoo`, and the band never hoists a member across the marker that divides them.

previewable = false
title       = "A Section Banner Keeps a Constant Above the Imports Below It"

description = '''
`ZILCH = 1` sits above the `# --- Imports ---` banner, with `import zoo` and `import abc` below it. **`ZILCH = 1` stays above the banner and the imports sort beneath it**, so `import abc` moves ahead of `import zoo`, because `band-constants` stops gathering at a section divider and no statement crosses it in either direction.
'''

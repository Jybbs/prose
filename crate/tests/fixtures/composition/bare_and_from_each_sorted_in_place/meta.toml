title       = "Bare and `from` Imports Each Sort Within Their Own Group"

description = '''
Three aliased bare imports and three `from` imports arrive with each kind out of order. **`alphabetize-siblings` sorts each kind in place so `collections` leads both, `align-imports` pads the `as` keywords and the `import` keywords into a column per group, and `space-statements` writes one blank line between the bare group and the `from` group**.
'''

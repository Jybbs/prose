previewable = true
title       = "Bare Imports Reorder, Then Draw the Narrow-Use Lint"

description = '''
`import sys`, `import os`, and `import json` arrive out of order, and each module is used through a single attribute access below, `os.getcwd()`, `sys.argv`, and `json.loads`. `alphabetize` reorders the statements so `json` leads, and **`bare-imports` flags all three, each diagnostic anchored to the import as written** rather than to its post-reorder position.
'''

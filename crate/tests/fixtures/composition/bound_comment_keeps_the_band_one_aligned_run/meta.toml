[docs]
previewable = true
title       = "A Bound Comment Keeps the Band One Aligned Run"

description = '''
`band-constants` binds the trailing comment to the `DEFAULT_EPSILON` above it and carries it onto that constant's line as the band packs. `align-equals` then settles `DEFAULT_EPSILON`, `MAX_INT`, and `PENALTY_TYPES` onto **one shared `=` column**, so the documented constant stays in the run rather than dropping out of it at a comment line.
'''

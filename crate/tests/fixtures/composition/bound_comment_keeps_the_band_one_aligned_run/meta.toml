[docs]
previewable = true
title       = "A Bound Comment Keeps the Band One Aligned Run"

description = '''
The comment describes `DEFAULT_EPSILON` above it, so `band-constants` folds it onto that constant's line as a trailing note while packing the group.

`align-equals` then settles all three constants onto **one shared `=` column**. Had the comment stayed on a line of its own it would have split the run in two, and the documented constant would have dropped out of the alignment.
'''

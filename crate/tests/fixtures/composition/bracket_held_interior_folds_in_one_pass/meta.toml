title       = "A Pair Whose Breaks a Nested Bracket Holds Joins in One Pass"

description = '''
The grouping pair around the comparison holds none of the line breaks, since the `find` call's own parentheses hold them instead.

`reflow-parentheses` can therefore fold the interior onto one row and drop the redundant pair in a single pass, which leaves `reflow-calls` **a call that already fits its row** and nothing further to do.
'''

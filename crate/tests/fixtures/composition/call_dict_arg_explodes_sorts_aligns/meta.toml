[docs]
previewable = true
title       = "A Dict Call Argument Explodes, Sorts, and Aligns in One Pass"

description = '''
The one-line `configure` call carries a four-entry dict in its `settings` keyword, and the whole shape settles together, in that `reflow-collections` explodes the dict, `reflow-calls` re-indents it to the keyword column, `alphabetize-siblings` sorts the keywords and the dict entries, and `align-equals` and `align-colons` form the `=` and `:` columns. **The dict entries land at the keyword's item-indent plus a step and the `}` at the keyword column.**
'''

[docs]
previewable = true
title       = "A Dict Call Argument Explodes, Sorts, and Aligns in One Pass"

description = '''
A one-line `configure` call carries a four-entry dict in its `settings` keyword, and five rules settle the shape together. `reflow-collections` explodes the dict, `reflow-calls` re-indents it to the keyword column, `alphabetize-siblings` sorts both the keywords and the dict entries, and `align-equals` and `align-colons` build the `=` and `:` columns.

What lands is **the dict entries one indent step past the keyword's own column, with the closing `}` back at that keyword column**.
'''

[docs]
previewable = true
title       = "A Call Explodes Ahead of an Unbreakable Tail"

description = '''
The `{start}` set after the call holds one item, so `reflow-collections` never breaks it and the call's row tail counts at its full width rather than only up to its `{`. The row overflows, `deque(` explodes, and its argument lands packed on its own row where it fits, instead of the inner tuple exploding under a column the explode would have moved.
'''

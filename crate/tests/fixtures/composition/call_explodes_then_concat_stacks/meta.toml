[docs]
previewable = false
title       = "A Call Explodes before Its String Run Breaks"

description = '''
The `emit` call overruns the budget, so `call-layout` settles its argument list one entry per line first. `stack-adjacent-strings` then measures the two adjacent literals against the column they land at and breaks only that argument, stacking the opening clause over the trailing one while `alpha` keeps its single line.
'''

previewable = false
title       = "A Resolvable Call Explodes to Keyword Form, Then Its Keywords Sort"

description = '''
`draw(w, h, d, c)` passes four positional arguments to a `def draw(width, height, depth, color)` defined above it. **`reflow-calls` explodes the call to keyword form and `alphabetize-siblings` sorts the keywords so `color=c` leads**, while the signature keeps its source order, because positional parameters never reorder.
'''

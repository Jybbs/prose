[docs]
previewable = true
title       = "A Call Inside an Expanding Literal Waits for the Layout"

description = '''
The list that the `cccc` keyword carries overflows the 40-column budget, so `reflow-collections` expands it.

`reflow-calls` **leaves the `fn(100, 1000)` call inside that list alone**. Exploding it would measure against a tail the expansion is about to remove, so the call instead reshapes around wherever its entry lands and stays on one line there.
'''

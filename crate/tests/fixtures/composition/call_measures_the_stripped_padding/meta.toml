[docs]
previewable = true
title       = "A Call Measures the Stripped Padding"

description = '''
`strip-stranded-padding` removes the spaces just inside the call's parentheses, which narrows the row by two columns.

`reflow-calls` measures the argument list at **the width it will have once that strip lands**, not at the padded width in the source. The call crosses the 66-column budget by exactly that padding, so it stays on one row rather than exploding and then rejoining after the padding goes.
'''

title       = "Top-Level Classes Reorder and Gain Two-Blank Cushions"

description = '''
`Zebra`, `Alpha`, and `Mango` are written back to back with no blank lines between them.

`alphabetize-siblings` reorders the three so `Alpha` leads, and `space-statements` then opens **the standard two blank lines** between top-level definitions. It also opens a single blank line under each class header.
'''

canonical   = false
previewable = true
title       = "A Call After a Relaid Closer Hangs From the Opener's Row"

description = '''
The tuple on the left of the `=` breaks before its closing parenthesis, and `reflow-collections` moves that closer to the indent of the row its opener sits on, which here is the statement's own indent.

`reflow-calls` then explodes the `type(...)` call that follows the closer, measuring from **that same row** rather than from the continuation row the source had written. The exploded arguments therefore hang from the statement's indent.
'''

[docs]
canonical   = false
previewable = true
title       = "A Colon Run Measures Past the Delimiter Padding a Later Rule Drops"

description = '''
One key in the dict carries a stranded space before its closing parenthesis, and `strip-stranded-padding` removes it.

`align-colons` reads each row at **the width it settles to once that removal lands**. Reading the padded width instead would make the row look like it breached the 40-column budget, and the run would have skipped its shared column over a breach that never actually happens.
'''

[docs]
previewable = true
title       = "A Comma-Joined Import Splits, Then Groups and Sorts in One Pass"

description = '''
`import sys, os` and `import myapp.core, abc` each split one module per line, and [[reflow-imports]] runs ahead of [[group-imports]] and [[alphabetize-siblings]], so every split-off module **reaches its canonical group and slot**. `myapp.core`, first-party under the `first-party` config, lands in the local section rather than staying beside the stdlib `abc` it was comma-joined to.
'''

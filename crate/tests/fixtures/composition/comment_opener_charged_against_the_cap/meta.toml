title       = "An Alignment Run Measures a Comment at the Width It Settles To"

description = '''
The first row's comment opens tight against its hash run, which [[normalize-comment-spacing]] later settles to one space. [[align-equals]] counts that column before it sets its own, so the run takes no shared column that would carry the row past the budget rather than padding to one and then undoing it.
'''

[docs]
canonical   = false
previewable = true
title       = "A Commented Import Folds Across a Blank Line"

description = '''
`from pkg import a` is unread and sits directly under the `# Local imports` comment, with a blank line separating it from its `pkg` sibling.

`reflow-imports` merges the two statements across that blank line, so dropping `a` lets `from pkg import b` **take the line `a` had**, and the blank line leaves along with `b`'s old position. The comment ends up heading the import it was describing all along.
'''

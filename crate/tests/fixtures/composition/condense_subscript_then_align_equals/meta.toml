[docs]
previewable = false
title       = "A Condensed Subscript Target Joins Its Run's `=` Column"

description = '''
The assignment into `config[primary_key]` arrives with its subscript target written across three lines, above `shorter` and `the_longest_label_here`. `reflow-collections` condenses the subscript onto one line, which gives the statement a single row, and **`align-equals` pads its `=` into one column with the two assignments below**, whereas a subscript left across three lines would have kept its `=` on a continuation line outside the run.
'''

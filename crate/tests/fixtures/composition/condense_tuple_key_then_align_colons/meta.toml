previewable = false
title       = "A Condensed Tuple Key Sorts and Aligns With Its Run"

description = '''
The tuple key `(alpha, beta)` in `mapping` arrives written across two lines, above `gamma_key` and `delta_entry`. `reflow-collections` condenses it onto one line, and with every key on a single row **`alphabetize-siblings` sorts the entries and `align-colons` pads each `:` one space past the widest key**, the condensed key sorting and aligning as an ordinary member rather than one broken across lines.
'''

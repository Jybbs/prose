[docs]
previewable = false
title       = "A Condensed Tuple Key Sorts and Aligns With Its Run"

description = '''
The tuple key `(alpha, beta)` arrives split across two lines, and `reflow-collections` condenses it onto one. With every key of `mapping` on a single row, `alphabetize-siblings` sorts `(alpha, beta)`, `delta_entry`, and `gamma_key`, and `align-colons` pads each `:` one space past the widest key. Condensing first turns the split key into an ordinary member the later rules can sort and align rather than one broken across lines.
'''

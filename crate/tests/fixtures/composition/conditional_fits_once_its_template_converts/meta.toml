title       = "A Conditional Fits Once Its Template Becomes an f-string"

description = '''
`label` returns a conditional two columns past the **88-column** budget, its first operand a `%` template. **The row ends on one line with no pair added**, because [[reflow-parentheses]] measures the row as [[prefer-fstring]] leaves it once the template becomes an f-string, and that row fits.
'''

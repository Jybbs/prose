previewable = false
title       = "Imports Split by a Constant Gather and Sort Into Their Groups"

description = '''
`from . import shared` and `import os` are separated by the constant `x = 1`. `band-constants` moves the constant below both imports, and once they are adjacent **`group-imports` puts the bare `import os` ahead of the relative `from . import shared` with a blank line between them**, and `x = 1` follows below.
'''

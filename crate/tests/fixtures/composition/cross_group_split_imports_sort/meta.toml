title       = "A Cross-Group Import Run Sorts as the Band Consolidates It"

description = '''
`from . import shared` and `import os` arrive separated by the constant `x = 1`, so the two imports start out split across the module. **Banding gathers both to the top, and they sort into their canonical groups so the bare `import os` lands ahead of the relative `from . import shared`**, with the standard blank line between the groups and `x = 1` following below.

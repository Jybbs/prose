[docs]
previewable = false
title       = "A Dict Entry Leaves Its Break to the String Run"

description = '''
`table` holds one entry too long for the line, so `reflow-collections` expands the dict onto multiple rows. **The entry does not break at its `:`**, because its key is an implicitly concatenated pair of string literals that `stack-adjacent-strings` splits instead, leaving `"and the trailing part": 1` intact on the second fragment's line.
'''

[docs]
previewable = true
title       = "Overflowing Dict Expands, Sorts, and Aligns"

description = '''
`CONFIG` arrives as one overlong line with its keys out of order. **The dict expands onto one row per entry, the keys sort alphabetically, and every `:` pads into a single column** one space past the widest key, `"beta_extended"`. Even the short `"zeta"` row joins that column, its `:` padded the full ten spaces to reach it.
'''

title       = "Dropped Future Import Leaves a Blank Before Aligned Aliases"

description = '''
A module opens with `from __future__ import annotations` ahead of aliased imports that need no future. **`prune-inert-imports` removes the import, leaving a residual blank line, and `align-imports` aligns the `as` column** across the remaining run.
'''

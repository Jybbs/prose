[docs]
previewable = false
title       = "A Future Import Is Removed With Its Blank Line Above Aligned Aliases"

description = '''
The module opens with `from __future__ import annotations` above a blank line and three aliased imports. **`prune-inert-imports` removes the directive together with the blank line below it, so the imports open the file, and `align-imports` pads the `as` keywords of `numpy`, `collections`, and `functools` into one column.** The imports keep their source order, because this case runs without `alphabetize-siblings`.
'''

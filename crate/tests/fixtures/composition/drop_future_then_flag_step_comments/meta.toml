`process` narrates its steps with `# 1. Filter empties.` and `# 2. Sort ascending.`, and the module opens with `from __future__ import annotations` above two blank lines. `prune-inert-imports` removes the directive together with those blank lines, shifting the file up by three lines, and `step-narration` reports both comments without rewriting them, **each finding landing on the comment's row in the output**.

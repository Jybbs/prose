[docs]
previewable = true
title       = "Dunder List Rows Pack as the Sort Leaves Them"

description = '''
Two rules run here. `alphabetize-siblings` sorts the six entries so the three short ones lead, and `reflow-collections` packs them onto rows that fit the 88-column budget.

The packing measures **the widths the sort will leave**, not the widths as written. That is why `"cc"` shares a row with the first thirty-character name rather than joining the two short entries above it, and why the six entries settle onto three rows of two with no row needing to widen afterward.
'''

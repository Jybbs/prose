[docs]
previewable = true
title       = "`__all__` Rows Pack at the Widths the Sort Leaves"

description = '''
`__all__` lists six entries on one overlong line, three short names interleaved with three thirty-character ones. `alphabetize-siblings` sorts them so the short names lead, and `reflow-collections` packs them onto rows within the 88-column budget. **The packing measures the widths the sort leaves, not the widths as written**, which is why `"cc"` shares a row with the first long name rather than joining the two short entries above it, and the six entries settle onto three rows of two with no row widening afterward.
'''

title       = "A Dict Entry Is Measured Where the Sort Leaves It"

description = '''
[[alphabetize-siblings]] settles which entry ends the dict, so [[reflow-collections]] measures each entry with the separator that order leaves after it rather than the one it carries in source order. The entry the sort moves last sheds the comma it carried, fits its row, and the layout holds once the sort lands.
'''

[docs]
previewable = true
title       = "A List Value Expands Into Its `=` Column"

description = '''
`c`'s row reaches 79 columns on one line, inside the 80-column budget where it stands, but 90 padded out to the column `bbbbbbbbbbbb` sets. **[[reflow-collections]] expands the list so its opening row joins that column**, because expanding it leaves the three rows in one column, whereas keeping it on one row would leave `c` unpadded beneath the other two.
'''

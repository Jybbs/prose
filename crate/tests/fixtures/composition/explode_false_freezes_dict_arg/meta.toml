[docs]
previewable = true
title       = "A Cleared `explode` Knob Freezes a Dict Argument"

description = '''
The same call and dict as the canonical case, but with `reflow-collections`'s `explode` knob cleared. `reflow-collections` leaves the multi-entry dict inline rather than exploding it, so `reflow-calls` finds no multi-line block to re-indent and the dict stays on its keyword line whole. The freeze reaches the dict argument the canonical shape would otherwise expand to its own column.
'''

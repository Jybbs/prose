[docs]
previewable = false
title       = "External `from` Imports Lead Local Ones With No Bare Group"

description = '''
Every import in the file uses the `from` form, and `first-party = ["myapp"]` marks `myapp` as local, so there is no bare `import x` group at the top. `group-imports` puts `collections` and `typing` ahead of `myapp` and the relative `.`, `space-statements` writes one blank line between the two groups, and **`align-imports` pads `import` into a column per group** rather than one column spanning both.
'''

previewable = true
title       = "Class Fields and Methods Sort, Align, and Gain Cushions"

description = '''
`Service` declares three fields out of order and three methods in no particular order either, and four rules settle the class together.

The fields sort alphabetically and align **both their `:` and their `=` columns** as one group. The methods sort separately, so `_cleanup` leads `restart` and `shutdown`, and `space-statements` opens a single blank line between every member, including one directly under the `class Service:` header.
'''

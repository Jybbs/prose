previewable = true
title       = "Class Fields and Methods Sort, Align, and Gain Cushions"

description = '''
`Service` declares the fields `timeout`, `host`, and `retry_count` out of order, followed by three methods in no order either. **The fields sort alphabetically and align both their `:` and `=` columns as one group, the methods sort separately so `_cleanup` leads `restart` and `shutdown`, and `space-statements` inserts a single blank line between every member**, including one after the `class Service:` header.
'''

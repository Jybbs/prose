[docs]
previewable = false
title       = "Configured First-Party Imports Move Into the Local Group"

description = '''
`first-party = ["myapp"]` names `myapp` in the config, and its imports are scattered among `import os`, `from collections import Counter`, and `from . import shared`. **Every `myapp` import moves into the local group beside the relative `from . import shared`**, with the bare `import myapp.core` ahead of `from myapp import app` and `from myapp.db import Session`, while `import os` and `from collections import Counter` stay in the bare and external groups. No blank lines separate the groups, because this case runs without `space-statements`.
'''

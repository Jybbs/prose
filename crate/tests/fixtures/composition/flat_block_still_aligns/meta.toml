[docs]
previewable = false
title       = "With Grouping Off, One Flat Import Block Still Aligns"

description = '''
With `group-imports = false`, the four imports sort as **one flat block with no blank lines between them**, `alphabetize-siblings` putting the bare `import os` and `import sys` ahead of the `from` lines, and `align-imports` still pads `import` into one column across `from collections` and `from typing`.
'''

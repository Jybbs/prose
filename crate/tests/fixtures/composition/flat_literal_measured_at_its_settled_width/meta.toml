title       = "A Flat Literal Measures at the Width Its Padding Settles To"

description = '''
`strip-stranded-padding` touches both dicts, though in opposite directions. It removes the spaces inside the braces of the first and adds a space after each `:` in the second.

`reflow-collections` measures each literal at **the width it settles to once those edits land**. The first ends up narrow enough to stay on its row, and the second ends up wide enough to cross the 40-column budget, so only the second expands.
'''

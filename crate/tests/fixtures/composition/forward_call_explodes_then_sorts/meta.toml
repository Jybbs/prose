[docs]
previewable = false
title       = "A Forward Call Explodes Before Its Callee Sorts Above It"

description = '''
`parse` calls `build(r, g, b, a)` above the `def build(red, green, blue, alpha)` it refers to. `reflow-calls` resolves the callee from the module's completed bindings, so **the call explodes to keyword form with each positional named after its parameter, `r` becoming `red=r`, and the keywords sort**, while `alphabetize-siblings` moves `build` above `parse`.
'''

title       = "A Fractured Element Sorts by Its Joined Form"

description = '''
[[alphabetize-siblings]] keys a set element by the text its join writes onto one row, so the element [[reflow-collections]] joins in the same pass sorts where its joined form lands rather than where its fractured source text sits. The forecast then charges that element the comma its sorted position gains, and the extra column carries it past the cap, so it expands instead of holding one row.
'''

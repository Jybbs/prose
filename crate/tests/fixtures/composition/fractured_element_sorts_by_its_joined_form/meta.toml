[docs]
canonical   = false
previewable = true
title       = "A Fractured Element Sorts by Its Joined Form"

description = '''
The first set element is written across two lines. `alphabetize-siblings` keys each element by **the text it would occupy once joined onto one row**, not by the fractured text in the source, so that element sorts where its joined form belongs.

Sorting puts the long element first, which gives it a trailing comma. Measuring it with that comma takes it one column past the 40-column budget, so it expands rather than holding a single row.
'''

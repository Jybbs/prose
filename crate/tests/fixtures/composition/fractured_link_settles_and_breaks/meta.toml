description = '''
The author hand-wrapped `base.first(alpha,` mid-call, and [[reflow-calls]] rejoins `first(alpha, beta)` onto one row. That settles the chain's width before `stack-method-chains` counts its links, so the link-count trigger breaks the chain, wrapping the expression in parentheses and stacking `.second(gamma)` and `.third(delta)` under `.first(alpha, beta)`.

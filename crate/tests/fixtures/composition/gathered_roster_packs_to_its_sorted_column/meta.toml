[docs]
previewable = false
title       = "A Gathered Roster Packs to the Column Its Sorted Run Settles"

description = '''
The three `from email` statements gather into one roster that overruns the `import-line-length` budget of `40` and packs onto two rows, and [[alphabetize-siblings]] then seats the wider `email._encoded_words` and `email._policybase` rows beneath them. [[reflow-imports]] forecasts that sorted run rather than the order as written, so **the roster packs to the column its own rows settle on** instead of the wider column the source-order neighbor would have named.
'''

[docs]
previewable = false
title       = "A Gathered Roster Packs to the Column Its Sorted Run Settles"

description = '''
The three `from email` statements gather into one roster that overruns the 40-column import budget and packs onto two rows.

`alphabetize-siblings` then sorts the run, which moves the wider `email._encoded_words` and `email._policybase` rows below the gathered ones. `reflow-imports` forecasts that sorted order rather than the order as written, so **the roster packs to the column its own rows settle on** instead of the wider column its source-order neighbour would have set.
'''

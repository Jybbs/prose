[docs]
previewable = false
title       = "A Gathered Roster Packs to the Column Its Sorted Run Settles On"

description = '''
Three `from email import` statements sit among `from email._policybase` and `from email._encoded_words`, and the three gather into one roster that crosses the 40-column import budget and packs onto two rows. `alphabetize-siblings` then sorts the run, which moves the wider `email._encoded_words` and `email._policybase` rows below the gathered ones, and **the roster packs to the column its own rows settle on** rather than the wider column its source-order neighbor would have set, because `reflow-imports` measures against the sorted order rather than the order as written.
'''

title       = "A Hand-Wrapped `super()` Call Rejoins Before It Sheds"

description = '''
The author wrapped the `__init__` call's arguments under its open parenthesis, one per line. [[call-layout]] rejoins `host`, `port`, and `timeout` onto one row, and [[shed-super-args]] then sheds `SecureConnection` and `self` from the call, leaving `super().__init__(host, port, timeout)`. Rejoining first is what makes the shed reachable, because the hand-aligned continuation lines are gone by the time the shortened call is measured.
'''

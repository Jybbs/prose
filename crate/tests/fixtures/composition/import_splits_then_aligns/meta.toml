[docs]
previewable = false
title       = "An Over-Budget Import Splits, Then Aligns Within the Cap"

description = '''
Padding `from apps.io` out to the wider `apps.registry.longpath` prefix would push its three-name list past the `import-line-length` cap. `import-layout` measures against that aligned prefix ahead of the split, so `beta_helper`, `delta`, and `gamma_helper` land on one line each, and `align-imports` then pads every `import` into the shared column with each row inside the cap rather than one member overflowing.
'''

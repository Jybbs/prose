previewable = false
title       = "An Import Splits at Its Padded Width, Then Aligns Within the Budget"

description = '''
`from apps.io import beta_helper, delta, gamma_helper` sits above `from apps.registry.longpath import alpha`, and `align-imports` pads `from apps.io` out to the wider prefix, where the three-name list would cross the 52-column import budget. **`reflow-imports` measures against the padded prefix and splits the statement to one name per line**, and `align-imports` then pads every `import` into one column with every row inside the budget.
'''

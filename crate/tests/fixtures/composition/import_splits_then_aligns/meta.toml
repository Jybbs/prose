[docs]
previewable = false
title       = "An Over-Budget Import Splits, Then Aligns Within the Cap"

description = '''
`align-imports` pads `from apps.io` out to match the wider `apps.registry.longpath` prefix, and at that padded width the three-name list on the `apps.io` line would cross the 52-column import budget.

`reflow-imports` measures against **the padded prefix rather than the unpadded one**, so it splits first and lands `beta_helper`, `delta`, and `gamma_helper` one per line. `align-imports` then pads every `import` into the shared column with every row still inside the budget.
'''

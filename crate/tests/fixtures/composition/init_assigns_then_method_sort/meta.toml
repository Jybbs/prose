title       = "`__init__` Assignments Align and the Methods Sort"

description = '''
`Service.__init__` opens with three `self` assignments, and the methods after it arrive out of order. **The assignments pad their `=` into one column inside `__init__`, and the methods sort so `alpha`, `beta`, and `zeta` follow in order**, with `space-statements` writing one blank line between every member. The assignments keep their source order, because the sort reorders the methods and not the statements inside one.
'''

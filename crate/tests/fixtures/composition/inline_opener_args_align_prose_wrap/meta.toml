[docs]
previewable = true
title       = "Inline-Opener Docstring Splits, Aligns Args, Wraps Prose"

description = '''
`render`'s docstring starts its summary on the `"""` line itself and carries an `Args:` section. **`docstring-frame` moves the summary off the opener line, `align-colons` pads the `:` after `template`, `context_map`, and `escape_html` into one column, and `docstring-wrap` re-wraps the summary to the docstring budget**, breaking it across two lines.
'''

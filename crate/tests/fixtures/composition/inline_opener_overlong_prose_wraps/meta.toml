[docs]
previewable = false
title       = "A Docstring Moves Off Its Opener and Its Overlong Line Wraps"

description = '''
`render`'s docstring starts on the `"""` line, and its second source line runs past the docstring budget. **`frame-docstrings` moves the text off the opener line and `wrap-docstrings` reflows the paragraph**, so the overlong line breaks after `omit` and `per-call overrides.` sits on its own line within the budget.
'''

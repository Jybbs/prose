[docs]
previewable = false
title       = "Inline-Opener Docstring Splits and Rewraps Overlong Prose"

description = '''
`render`'s docstring starts its prose on the `"""` line, and its second source line runs past the docstring budget. **`docstring-frame` moves the prose off the opener line and `docstring-wrap` reflows the paragraph**, so the overlong line breaks after `omit` and `per-call overrides.` lands on its own line within the budget.
'''

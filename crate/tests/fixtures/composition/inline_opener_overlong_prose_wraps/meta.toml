[docs]
previewable = true
title       = "Inline-Opener Docstring Splits and Rewraps Overlong Prose"

description = '''
A multi-line docstring opens on the triple-quote line and carries a single overlong prose line. **`frame-docstrings` moves the opener to its own line and `wrap-docstrings` reflows the prose** to fit the docstring budget.
'''

previewable = false
title       = "Nested Class Fields Sort and Align Per Scope"

description = '''
`Order` and its nested `LineItem` each declare three annotated fields out of order. **Sorting and alignment run independently within each scope**, so `customer_id`, `placed_on`, and `total` sort and share `:` and `=` columns inside `Order`, while `price`, `quantity`, and `sku` sort against separate columns of their own inside `LineItem`.
'''

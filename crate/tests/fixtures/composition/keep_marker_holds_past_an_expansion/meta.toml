[docs]
canonical   = false
previewable = true
title       = "A Keep Marker Holds Past an Expansion"

description = '''
`# prose: keep` attaches to the line holding either the dict's `{` or its `}`.

The dict expands, which carries the marker down onto the closing line, and it still counts there. The dict is therefore **held against `alphabetize-siblings`**, so `"b"` stays ahead of `"a"` and the entries keep both their source order and their separators.
'''

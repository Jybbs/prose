[docs]
previewable = false
title       = "A Keyword Dict Explodes at the Width the `=` Buffer Adds"

description = '''
The line carrying `KW={...}` in the `d` call sits exactly at the budget, and `align-equals` writes `KW = ` in place of `KW=`, two characters wider. **`reflow-collections` counts those two columns and explodes the dict once**, its `"migrations"` entry moving to its own line, rather than fitting inline and then exploding on a later run.
'''

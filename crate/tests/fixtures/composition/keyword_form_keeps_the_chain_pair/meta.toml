[docs]
previewable = true
title       = "Keyword Form Keeps the Chain Pair"

description = '''
`stack-method-chains` wraps the positional argument in a grouping pair and stacks `.text.replace(...)` beneath `tokenizer.read()`.

`reflow-calls` then renders that argument in keyword form as `env_var = ...`, and **it keeps the pair around the value** because the value spans rows. The stacked chain holds its shape through the `=` alignment instead of being re-wrapped.
'''

[docs]
canonical   = false
previewable = true
title       = "A Keyword Sort Run Spans a Positional Argument"

description = '''
The forecast [[reflow-calls]] reads runs the keywords between `**` unpackings the way [[alphabetize-siblings]] sorts them, a positional argument pinning in place inside the run rather than bounding it, so the keyword the sort would move first is charged the comma it would gain and its value explodes in the same pass. The sort then holds the group, since a value spanning rows never swaps slices in place, and the positional row stays where it was written.
'''

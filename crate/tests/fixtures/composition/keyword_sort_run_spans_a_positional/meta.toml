[docs]
canonical   = false
previewable = true
title       = "A Keyword Sort Run Spans a Positional Argument"

description = '''
Keywords sort within runs bounded by a `**` unpacking, and a positional argument like `*args` opens no such boundary, so it **stays pinned inside a run** rather than splitting it in two.

`reflow-calls` measures the keyword the sort would move first with the comma it would gain, and that takes it past the 40-column budget, so its `lambda` value explodes. Once a value spans several rows the sort will not swap it in place, so the group holds and `*args` stays exactly where it was written.
'''

canonical   = false
previewable = true
title       = "A Keyword Sort Run Spans a Positional Argument"

description = '''
The forecast that [[reflow-calls]] reads groups the keywords into the same runs [[alphabetize-siblings]] sorts within, bounded by a `**` unpacking rather than by a positional argument, which stays pinned inside a run instead. The keyword the sort would move first is measured with the comma it gains, so its value explodes. The sort then holds the group, since a value spanning rows never swaps slices in place, and the positional row stays where it was written.
'''

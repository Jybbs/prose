[docs]
previewable = true
title       = "A Literal Tail Measures the Stripped Padding"

description = '''
`strip-stranded-padding` removes two separate paddings on this row, the space just after `append(` and the space just before its closing `)`.

The first narrows the column the tuple starts at and the second narrows the text trailing it. `reflow-collections` reads **both settled widths**, and since the padded row crosses the 40-column budget by exactly that pair of spaces, the tuple stays on its row where the stripped version fits.
'''

[docs]
previewable = true
title       = "A Literal Tail Measures the Stripped Padding"

description = '''
`reflow-collections` reads the literal at the column and the trailing width its row settles to once `strip-stranded-padding` drops the padding behind the call's opener and the padding ahead of its closer, the first narrowing the column the tuple lands at and the second the text trailing it. The padded row crosses the budget by exactly that pair, so the tuple stays on its row where the stripped row fits.
'''

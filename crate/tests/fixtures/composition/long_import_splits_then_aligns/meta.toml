[docs]
previewable = false
title       = "A Split Import Needs No Realignment"

description = '''
`from package import alpha, beta, delta, epsilon, gamma` crosses the 40-column import budget. `reflow-imports` splits it into two `from package import` lines, `alpha, beta, delta` on the first and `epsilon, gamma` on the second, and **`align-imports` changes nothing**, because both lines open with the same prefix and their `import` keywords already share a column.
'''

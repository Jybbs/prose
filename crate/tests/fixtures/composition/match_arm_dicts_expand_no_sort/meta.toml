[docs]
previewable = false
title       = "Arm Dicts Explode and Align Their Colons With Keys Unsorted"

description = '''
The `"alpha"` and `"beta"` arms of `dispatch` each return an inline dict too long for its line. **Each dict explodes to one entry per row and pads its `:` into one column, while `"name"`, `"weight"`, `"extra_field"`, and `"comment_text"` keep their source order**, because this case runs without `alphabetize-siblings`. The wildcard arm carries only `return None`, so `align-match-case` joins it onto the `case _:` line.
'''

[docs]
canonical   = false
previewable = true
title       = "A Merge Gathers Across a Hoisted Constant"

description = '''
`LIMIT = 3` sits between the two `pkg` imports in the source, which would ordinarily keep them apart.

`band-constants` is about to move that constant below the imports, and `reflow-imports` **reads that move before it happens**. It treats the two `pkg` statements as already adjacent and gathers them onto one line, rather than waiting for a second pass once the constant has actually moved.
'''

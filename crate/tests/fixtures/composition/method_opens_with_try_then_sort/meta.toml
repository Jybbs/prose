previewable = false
title       = "Methods Sort Around One That Opens With `try`"

description = '''
`Validator`'s three methods arrive out of order, and `validate_alpha` opens its body with a `try`/`except` block. **`alphabetize-siblings` sorts the methods and `space-statements` writes one blank line between them**, plus one between the `def validate_alpha` line and its opening `try`, and the `try`/`except` body moves whole with its statements as written.
'''

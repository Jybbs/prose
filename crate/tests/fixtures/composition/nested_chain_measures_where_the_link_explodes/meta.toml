[docs]
previewable = true
title       = "A Nested Chain Measures Where the Link Explodes"

description = '''
`stack-method-chains` wraps the outer chain in a grouping pair, and the row holding `o.first_link_that_is_quite_long(` crosses the 60-column budget, so `reflow-calls` explodes that argument list.

The inner chain is then measured **from the column it lands at**, one indent step past that row, rather than from the wider column the joined row would have given it. It fits on a single line there, so it stays joined instead of stacking the way the outer chain does.
'''

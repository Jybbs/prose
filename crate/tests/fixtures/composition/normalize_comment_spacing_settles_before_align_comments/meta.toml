[docs]
previewable = false
title       = "Comment Spacing Settles Before the Comment Column Is Set"

description = '''
`warm()` and `a_name_that_is_far_longer_here()` each carry a trailing comment written at the same column with a padded `#     ` opener. `normalize-comment-spacing` collapses each opener to `# ` first, and `align-comments` then measures the two rows, whose widths differ by more than `max-shift` allows, so the run splits and **each `#` sits at the two-space minimum after its code**, each opener settled against the column its comment ends up at rather than the one it was written at.
'''

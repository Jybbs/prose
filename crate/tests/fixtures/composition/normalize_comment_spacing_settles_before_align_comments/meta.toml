[docs]
previewable = false
title       = "Comment Spacing Settles an Opener Before the Column Moves"

description = '''
Both comments are written at the same column with a padded `#     ` opener.

`normalize-comment-spacing` collapses each opener to a single `# ` first. `align-comments` then tries to share a column, but the two call names differ in width by more than `max-shift` allows, so the run splits and **each hash lands at the two-space minimum instead**. Each opener is settled against the column its comment finally reaches rather than against the one it was written at.
'''

[docs]
previewable = false
title       = "Old `Args:` Continuation Lines Reflow at the Aligned Column"

description = '''
The `host` entry in the `Args:` section continues on a second line indented to the section body rather than under its description, above `encoding`. `align-colons` pads both `:` one space past `encoding`, the longer name, and **`wrap-docstrings` reflows `host`'s continuation lines to hang at the aligned description column**, so every wrapped line starts directly under `A descriptive parameter`.
'''

[docs]
previewable = false
title       = "Optional and Union Field Annotations Align in Width Groups"

description = '''
`Endpoint`'s four fields carry `Optional` and `Union` annotations of differing widths.

**Every `:` pads to one column past the widest field name, `fallback_host`, and every `=` to one column past the widest annotation, `Union[int, None]`.** The short `host` takes ten spaces of padding as a result, and all four defaults still land in a single column.
'''

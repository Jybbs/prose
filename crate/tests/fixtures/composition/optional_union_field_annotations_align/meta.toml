[docs]
previewable = false
title       = "`Optional` and `Union` Field Annotations Align in Two Columns"

description = '''
`Endpoint`'s four fields carry `Optional` and `Union` annotations of different widths. **Every `:` pads to one column past the widest name, `fallback_host`, and every `=` to one column past the widest annotation, `Union[int, None]`**, so the short `host` takes ten spaces of padding and all four defaults sit in one column.
'''

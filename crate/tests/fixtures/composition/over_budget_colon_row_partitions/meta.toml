[docs]
previewable = false
title       = "An Over-Budget Row Leaves the Colon Run"

description = '''
Both entries of `x` fit on their own lines as written, and padding the `:` of `"b"` out to match the wider `"aaaaaaaaaaaaa"` would push that row past `code-line-length`. **The over-budget row is dropped from the run and left unpadded**, the same treatment a row past `max-shift` takes, and with `"aaaaaaaaaaaaa"` left alone a single entry forms no group, so the dict keeps tight `:` spacing throughout.
'''

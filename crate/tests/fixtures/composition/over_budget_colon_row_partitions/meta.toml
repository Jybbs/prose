[docs]
previewable = false
title       = "An Over-Budget Colon Row Partitions Out of the Run"

description = '''
Both entries of `x` fit inline, but padding `"b"`'s `:` out to the wider `"aaaaaaaaaaaaa"` column would push its row past `code-line-length`. **`align-colons` partitions the over-budget row out of the run unpadded**, the same break an outlier past `max-shift` takes, and the lone `"aaaaaaaaaaaaa"` left behind forms no group, so the dict keeps tight `:` spacing everywhere rather than padding past the cap.
'''

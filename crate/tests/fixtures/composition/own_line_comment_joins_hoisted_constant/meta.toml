[docs]
previewable = false
title       = "An Own-Line Comment Moves Into the Band With Its Constant"

description = '''
The comment `# the request ceiling shared across workers` sits a blank line above `MAX_WORKERS = 8`, both below `configure`, and the comment binds to the constant rather than to the file around it. `band-constants` moves `MAX_WORKERS` above `configure`, and **the comment moves with it**, sitting tight above its constant with two blank lines before the `def`, so a second run has nothing left to move.
'''

[docs]
canonical   = false
previewable = true
title       = "A Packed Dict With a Comment Keeps Its Written Commas"

description = '''
`d` opens with `{  # note` and lists `"zz"` before `"a": 1, "b": 2` packed on one row. The comment on the `{` row keeps `reflow-collections` from splitting that row, and a packed row is never reordered, so the dict keeps its source order under `alphabetize-siblings`. **The `"zz"` entry is measured with the comma it carries as written** rather than one a sort would have moved, its value is too wide for the 40-column budget, so that value explodes while `"a": 1, "b": 2` stay packed on their shared row.
'''

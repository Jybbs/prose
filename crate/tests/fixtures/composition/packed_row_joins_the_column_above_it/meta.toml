[docs]
previewable = false
title       = "A Packed Row Joins the Column Above It"

description = '''
The `tkinter.ttk` roster is too wide for the 40-column budget at the column `tkinter.simpledialog` sets, so it packs at its own narrower column instead.

`align-imports` then reads each packed row separately, and **only the `Button` row is short enough to fit the wider column above it**, so that row alone joins it. The rows beneath keep the column they packed to, and `reflow-imports` seats every row where the aligner settles it.
'''

previewable = false
title       = "Only the Packed Row That Fits Joins the Column Above"

description = '''
`from tkinter.ttk import Button, Checkbutton, Entry, Frame, Label, Scrollbar` sits under `from tkinter.simpledialog import _setup_dialog`, and the roster is too wide for the 40-column import budget at the column `tkinter.simpledialog` sets, so it packs at its own narrower column. `align-imports` then reads each packed row on its own, and **only the `Button` row is short enough to take the wider column above it**, so that row alone joins it, the rows beneath keep the column they packed to, and `reflow-imports` writes every row where the aligner settles it.
'''

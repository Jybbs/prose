[docs]
previewable = true
title       = "A Padded Member Measures on Its Settled Row"

description = '''
The list is written with padding inside its brackets, so `strip-stranded-padding` drops a column the expansion has already carried away. The member call lands on its own row at the literal's indent, where that padding sits nowhere ahead of it, so its `(` measures from the row the expansion leaves rather than from the source row, and the call explodes in the same pass that moves it.
'''

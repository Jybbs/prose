[docs]
previewable = true
title       = "A Padded Member Measures on Its Settled Row"

description = '''
The list is written with padding just inside its brackets, so `strip-stranded-padding` reports both of those columns. The expansion rebuilds the bracket interior and carries that padding away before the strip ever lands.

The first member call ends up alone on its own row at the literal's indent, where none of that padding sits ahead of it. Its `(` is therefore measured **from the row the expansion leaves**, not from the row the source wrote, and at that column the call is over budget and explodes as it moves.
'''

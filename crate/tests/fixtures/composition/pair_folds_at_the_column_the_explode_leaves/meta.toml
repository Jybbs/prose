[docs]
previewable = true
title       = "A Pair Folds at the Column the Explode Leaves"

description = '''
Both grouping pairs here are redundant, and the row they sit on crosses the 60-column budget.

`reflow-calls` explodes the first call, dropping its closing `)` back to the statement's indent. `reflow-parentheses` measures the second pair **from the column that closer leaves it at**, where it fits, so the pair folds onto that row instead of staying wrapped for a width the explode has already removed.
'''

[docs]
previewable = false
title       = "A Parameter Default Joins and the Run Skips the `=` Column"

description = '''
The list default of `a` in `f` is written across two lines, above `bbbbbbbbbbbbbb: int = 2`. Measured at its joined width, padding the `=` of `a` out to the column `bbbbbbbbbbbbbb` sets would take the row past the 44-column budget, so **`align-equals` reserves no padding and the `=` stays tight**, and `reflow-collections` reads that reservation before it joins the list, so the list joins where it stands rather than breaking apart to make room for padding.
'''

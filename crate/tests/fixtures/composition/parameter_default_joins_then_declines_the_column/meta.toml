[docs]
previewable = false
title       = "A Parameter Default Joins and the Run Declines the Column"

description = '''
`a`'s fractured list default rejoins on one line at the column its row writes. The reservation `reflow-collections` reads measures that row at its joined width, finds the column `bbbbbbbbbbbbbb` would set carries it past the budget, and reserves no shift, so the list joins where it stands and `align-equals` declines the column rather than breaking the list to take the padding.
'''

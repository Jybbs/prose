[docs]
previewable = false
title       = "A Parameter Default Joins and the Run Skips the Column"

description = '''
`a`'s fractured list default rejoins on one line at the column its row writes. Measured at that joined width, the row runs past the budget under the column `bbbbbbbbbbbbbb` would set, so `align-equals` reserves no shift. `reflow-collections` reads that reservation, the list joins where it stands, and the `=` stays unpadded rather than the list breaking to take the padding.
'''

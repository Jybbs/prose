title       = "Each Method's Assignment Run Aligns Its Own `=` Column"

description = '''
`render` and `configure` arrive out of order in `Builder`, each opening with three assignments. `alphabetize-siblings` puts `configure` first and `space-statements` writes one blank line between the two methods, and **each body pads its own `=` column independently**, `configure`'s out to `port_id` and `retries` and `render`'s out to the wider `markup_text`.
'''

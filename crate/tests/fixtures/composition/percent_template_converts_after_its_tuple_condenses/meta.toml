[docs]
previewable = true
title       = "An Exploded Tuple Condenses Before Its `%` Template Converts"

description = '''
`total` is assigned a `%` template whose tuple arrives exploded, `first` and `second` each on their own line. **`reflow-collections` condenses the tuple onto one line first, and `prefer-fstring` then measures the conversion against the budget and rewrites `"%s and %s" % (first, second)` to `f"{first} and {second}"**, each member inline in the template.
'''

[docs]
previewable = true
title       = "A Fractured Tuple Condenses Before Its Template Converts"

description = '''
The `%` template's tuple arrives exploded, `first` and `second` each on their own line. **`reflow-collections` condenses the tuple back onto one line first, and `prefer-fstring` then measures the conversion against the budget**, rewriting `"%s and %s" % (first, second)` into `f"{first} and {second}"` with each member inline in the template.
'''

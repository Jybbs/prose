[docs]
canonical   = false
previewable = true
title       = "A Relocated Block Remeasures the Calls Inside It"

description = '''
`reflow-calls` explodes `tuple(` at the indent its row holds before anything around it has moved.

`reflow-collections` then expands the tuple surrounding it, which pushes that whole block one indent step deeper. The `_mapdict_values` call inside is **re-measured at the column it lands at**, not at the one it started from, and at that deeper column it no longer fits the 40-column budget, so it explodes as well.
'''

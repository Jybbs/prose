[docs]
canonical   = false
previewable = true
title       = "A Reorder Measures Against the Widest Source Row"

description = '''
Sorting the keywords produces rows no wider than the widest row already present in the source, so `alphabetize-siblings` is free to reorder them.

`align-equals` afterwards opens a buffer around the `=` of `option_strings`, the keyword left alone on its row. **That buffer does not reopen the width question**, since the reorder was already settled against the source's own widest row.
'''

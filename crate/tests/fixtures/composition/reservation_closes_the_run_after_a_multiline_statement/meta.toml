title       = "The Reservation Closes Its Run Where the Aligner Does"

description = '''
The [[align-equals]] reservation builds its runs the way the rule itself does, so the statement whose value spans rows closes the run after it and predicts no shift for the rows below. [[reflow-collections]] then joins the tuple onto the cap rather than exploding it from a column the aligner never seats.
'''

title       = "The Reservation Closes Its Run Where the Aligner Does"

description = '''
`align-equals` builds its runs exactly as it will when it comes to align them, so the `cmd %= (...)` statement, whose value spans rows, closes the run above it.

The two assignments below therefore settle to **a narrow column of their own** rather than the wider one `fds_to_pass` and `main_kws["authkey_r"]` set. `reflow-collections` reads that same run boundary and joins the tuple to the 80-column budget, instead of exploding it from a column the aligner was never going to use.
'''

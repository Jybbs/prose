[docs]
previewable = false
title       = "A Class Defined Above Its Use Still Keeps the Directive Under the Sort"

description = '''
`class Node` is defined above the `visit` that names it in annotations, which on its own would let `prune-inert-imports` remove `from __future__ import annotations`. **The directive stays**, because `alphabetize-siblings` sorts definitions in the same pipeline and the class is a binding the sort can move, so the directive is kept whichever side of `visit` the class ends up on.
'''

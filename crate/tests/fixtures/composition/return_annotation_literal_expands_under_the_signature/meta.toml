[docs]
previewable = true
title       = "A Return Annotation Literal Expands Under the Signature"

description = '''
The return annotation crosses the 50-column budget, and the widest thing on that row is the `[Values, list[str]]` literal inside it, which `reflow-collections` expands.

`reflow-signatures` reads the opening row as ending at that literal's bracket, so it **keeps `self` inline** rather than exploding a lone parameter to recover width the expansion is about to give back.
'''

previewable = false
title       = "A One-Line Class Stub Sorts and Takes Two Blank Lines on Each Side"

description = '''
`class Beta: ...` is a one-line stub written after the block-bodied `Gamma` and `Alpha`. `alphabetize-siblings` sorts the three into `Alpha`, `Beta`, `Gamma`, and **`space-statements` writes two blank lines on both sides of `Beta`**, the stub taking the same gap a block-bodied class takes.
'''

[docs]
previewable = true
title       = "Set Rows Pack at the Widths the Sort Leaves"

description = '''
`y` is a four-element set on one line past the 30-column budget. **`reflow-collections` packs the rows at the widths `alphabetize-siblings` leaves in each slot**, not the widths the source wrote, so the rows fill the budget as densely as a list's would and the sort is written without widening any row.
'''

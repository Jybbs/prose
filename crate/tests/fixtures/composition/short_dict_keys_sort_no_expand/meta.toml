title       = "Short Dict Keys Sort in Place Without Exploding"

description = '''
`config` is a short inline dict listing `zeta`, `alpha`, `mango`, and `beta` out of order on a line that already fits. **`alphabetize-siblings` reorders the keys in place and the dict stays inline**, because the reorder leaves the total width unchanged, so the line still fits.

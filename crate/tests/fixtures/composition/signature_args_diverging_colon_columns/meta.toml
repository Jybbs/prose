[docs]
previewable = false
title       = "Signature and `Args:` Colons Align as Independent Columns"

description = '''
`write` names its parameters `destination`, `contents`, and `overwrite`, while its docstring's `Args:` section names `dst`, `body`, and `force`. **`align-colons` treats the signature and the section as separate groups, so each pads a `:` column of its own**, and `wrap-docstrings` wraps the `Args:` descriptions at the section's own hanging column rather than the wider column the signature's longer names would set.
'''

[docs]
previewable = true
title       = "A Signature Measures the Stripped Padding"

description = '''
`strip-stranded-padding` removes the space before the `:` in `ttl : int`, which narrows the signature by one column.

`reflow-signatures` measures the one-line form at **the width it settles to once that strip lands**. The signature fits the 40-column budget only after the padding goes, so it stays on one line rather than exploding and then rejoining on a later pass.
'''

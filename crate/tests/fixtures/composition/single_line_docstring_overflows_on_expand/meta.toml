[docs]
previewable = false
title       = "Expanded Single-Line Docstring Overflows and Rewraps"

description = '''
`render` carries a one-line docstring whose text runs past the line budget once the quotes move to their own lines. **`docstring-expand` rewrites it to the multi-line form and `docstring-wrap` reflows the text** across three lines that fit within the budget.
'''

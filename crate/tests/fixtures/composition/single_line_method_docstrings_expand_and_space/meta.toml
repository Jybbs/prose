title       = "One-Line Method Docstrings Expand and the Methods Take Blank Lines"

description = '''
`Service` contains `primary` and `secondary`, each opening with a one-line docstring and written with no blank line between them. **`expand-docstrings` rewrites each docstring to the three-line form and `space-statements` writes one blank line** under the class header and between the methods.
'''

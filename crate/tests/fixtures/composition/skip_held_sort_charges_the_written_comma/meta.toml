[docs]
previewable = true
title       = "A Skipped Sort Leaves Each Comma Measured as Written"

description = '''
`table` carries `# prose: skip[alphabetize-siblings]` on its closing line, listing `"bb"` before `"aa"`. `reflow-collections` ordinarily measures each entry with the comma the sort is about to write, and **the skip directive turns the sort off, and with it the measurement against the sorted order**, so every entry is measured with the comma it already carries, and `"bb"` counts a trailing comma and breaks after its `:` rather than being measured as the last entry.
'''

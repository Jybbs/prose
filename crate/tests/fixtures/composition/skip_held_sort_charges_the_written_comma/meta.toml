[docs]
previewable = true
title       = "A Skipped Sort Measures the Comma as Written"

description = '''
`reflow-collections` normally forecasts which entry `alphabetize-siblings` will leave last, so the comma it measures matches the one the sort is going to write.

The `# prose: skip[alphabetize-siblings]` over this dict turns the sort off, and **the forecast turns off with it**. Every entry is then measured with the comma it already carries, which is why `"bb"` counts a trailing comma and breaks after its `:` instead of being measured as the last entry.
'''

[docs]
previewable = true
title       = "A Sole Dict Argument Explodes the Call Around It"

description = '''
`collection-layout` lays the dict passed to `foo` out one entry per row, and an argument that spans rows makes `call-layout` explode the call around it rather than opening the `{` on the calling row and closing `})` as a pair. The row break alone is the trigger, whatever the argument count and however short the one-line form would have measured. Inside the block `alphabetize` sorts the keys, moving `"delta"` ahead of `"gamma"`, and `align-colons` pads each `:` into a shared column.
'''

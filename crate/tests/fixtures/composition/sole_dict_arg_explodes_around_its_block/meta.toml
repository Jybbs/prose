[docs]
previewable = true
title       = "A Sole Dict Argument Explodes the Call Around It"

description = '''
`reflow-collections` lays the dict out one entry per row, and **an argument that spans rows makes the call explode around it** rather than opening the `{` on the calling row and closing with `})` as a pair. The row break alone is the trigger, whatever the argument count and however short the one-line form would have been.

Inside the block, `alphabetize-siblings` sorts the keys so `"delta"` moves ahead of `"gamma"`, and `align-colons` pads each `:` into a shared column.
'''

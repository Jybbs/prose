[docs]
previewable = true
title       = "A Sorted Dict With Two Overflowing Values Expands Neither"

description = '''
Both `"pr"` and `"qq"` cross the budget at the column `"variable"` sets. [[alphabetize-siblings]] sets a blank line on either side of each entry spanning rows once two do, so expanding both would leave each alone in a run of its own. **[[reflow-collections]] therefore expands neither**, and the two rows stay inline, aligned as a pair on the narrower column their own keys set.
'''

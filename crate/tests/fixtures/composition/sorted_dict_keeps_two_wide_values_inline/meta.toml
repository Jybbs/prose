[docs]
previewable = true
title       = "Two Values Too Wide for a Sorted Dict's Column Both Stay on One Row"

description = '''
The rows of `"pr"` and `"qq"` would both cross the budget at the column `"variable"` sets. Wherever [[alphabetize-siblings]] reorders a dict, it sets a blank line on either side of each entry spanning rows once two do, which would leave each expanded entry alone in a run of its own, and a dict already in order like this one holds to the same limit so the layout a reorder leaves stays put on the next run. **[[reflow-collections]] therefore expands neither**, and the two sets stay on their rows, aligned as a pair on the narrower column their own keys set, with `"cache"` above and `"variable"` below left unpadded.
'''

[docs]
previewable = false
title       = "Reordered Entries Settle Their Comment Column Behind the Sort"

description = '''
Each `#` comment in `COUNTS` moves with its entry when `alphabetize-siblings` sorts the keys, so `# last alphabetically` follows `"zulu"` to the bottom and the rows end at new widths. **`align-comments` then pads every trailing comment into one column measured against the sorted rows** rather than against the order the author wrote.
'''

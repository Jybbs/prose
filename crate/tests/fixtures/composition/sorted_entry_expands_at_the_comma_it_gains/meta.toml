[docs]
previewable = true
title       = "An Entry the Sort Moves Up Expands at the Comma It Gains"

description = '''
`"pr"` is the last entry as written, so it carries no comma, and at the column `"variable"` sets its row lands exactly on the budget. [[alphabetize-siblings]] moves it ahead of `"variable"`, where it gains a comma that carries the row one column past. **[[reflow-collections]] reads the order and the comma the sort leaves, so it expands the `"pr"` set** in the same pass rather than leaving [[align-colons]] a row it cannot pad.
'''

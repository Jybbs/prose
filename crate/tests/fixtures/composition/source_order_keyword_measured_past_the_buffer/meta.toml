title       = "A Source-Order Keyword Measures Its Buffer and Its Separator"

description = '''
`screen._drawpoly` is a method call whose signature the rule cannot resolve, so it cannot rename the positionals and explodes the arguments in source order instead.

Each keyword value is still measured **from the column the `align-equals` buffer settles it at**, counting the comma that closes its own row. Those two together take the `outline` value past the 40-column budget, so it explodes while the shorter keywords stay on their rows.
'''

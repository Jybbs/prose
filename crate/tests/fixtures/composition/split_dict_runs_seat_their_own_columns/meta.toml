[docs]
previewable = true
title       = "Each Run of an Expanded Dict Aligns on Its Own Column"

description = '''
The `**SHARED` unpacking stays transparent to the `:` run, so `"cache"`, `"pr"`, and `"variable"` share one column, whereas the blank line above `"a"` starts a run of its own. **[[reflow-collections]] measures each value at the column [[align-colons]] shifts it to within its own run**, so the `"pr"` set expands because its row crosses the budget at the column `"variable"` sets, while `"a"` and `"bb"` align on a narrower column beneath the blank line.
'''

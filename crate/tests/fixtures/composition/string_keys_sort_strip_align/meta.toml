[docs]
previewable = false
title       = "A Multi-Line Dict Sorts Its Keys, Drops Its Comma, and Aligns Its Colons"

description = '''
`config` already sits one entry per row, with its string keys out of order and a comma after the last entry. **`alphabetize-siblings` sorts the keys so `"alpha"` through `"zeta"` read in order, `strip-trailing-commas` removes the comma after the final entry, and `align-colons` pads each `:` into one column**.
'''

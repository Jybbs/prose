[docs]
previewable = false
title       = "Multi-Line Dict Sorts Keys, Strips Comma, Aligns `:`"

description = '''
The `config` dict already sits one entry per row, its string keys out of order and a comma left after the last entry. **`alphabetize` sorts the keys so `"alpha"` through `"zeta"` read in order, `strip-trailing-commas` drops the comma after the final entry, and `align-colons` pads each key to a shared `:` column**.
'''

[docs]
previewable = false
title       = "An Aligned Column Is Set at the Width the Strip Leaves Beneath It"

description = '''
`x[ 0 ] = 2` carries a space just inside each bracket, below `ab = 1`. `strip-stranded-padding` removes both spaces, leaving `x[0]`, and **`align-equals` pads the `=` column against that stripped width** rather than the wider one the source wrote, so the column sits where the finished rows put it.
'''

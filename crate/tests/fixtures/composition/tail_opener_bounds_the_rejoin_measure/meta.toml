[docs]
previewable = false
title       = "A Tail Bracket Bounds the Rejoin Measure"

description = '''
`helper(alpha, beta)` arrives broken across two rows with `+ [gamma_value, ...]` trailing its `)`, a list long enough that the full row would overflow the budget. **`reflow-calls` rejoins the call onto one row and `reflow-collections` expands the list from its `[`**, because the rejoin measure runs only as far as that `[`, the bracket where the expanded list ends the row.
'''

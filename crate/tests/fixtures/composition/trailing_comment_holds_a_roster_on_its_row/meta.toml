[docs]
previewable = false
title       = "A Trailing Comment Keeps a Roster on Its Own Row"

description = '''
`from sys import executable, platform` carries a trailing comment, above a `tkinter` roster and `from tkinter.font import Font`. The `sys` roster would fit the column `tkinter.font` sets if its last row carried only its widest name, but that row also carries the comment, which crosses the 40-column import budget at any column. **The `sys` statement keeps the single row it occupies and stays out of the shared column**, because `reflow-imports` measures the roster by its last row, while the `tkinter` roster, with no comment, packs to that column across three rows.
'''

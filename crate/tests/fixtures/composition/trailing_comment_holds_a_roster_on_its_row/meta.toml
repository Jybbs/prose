[docs]
previewable = false
title       = "A Trailing Comment Holds a Roster on Its Row"

description = '''
The `sys` roster would fit the column `tkinter.font` sets if its widest name were all its last row carried, but that row also keeps the trailing comment, which overruns the cap at any column. [[reflow-imports]] measures the roster by that last row, so **the statement holds the single row it already occupies** and stays out of the column [[align-imports]] seats the rows beneath it in, while the `tkinter` roster packs to that shared column.
'''

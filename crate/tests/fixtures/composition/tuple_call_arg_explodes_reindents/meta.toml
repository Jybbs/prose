[docs]
previewable = true
title       = "A Tuple Call Argument Explodes and Re-Indents in One Pass"

description = '''
A one-line call carrying an over-wide tuple argument settles in one forward pass, where `reflow-collections` explodes the tuple, `reflow-calls` re-indents it to the keyword column, and `alphabetize-siblings` orders the keywords it can move with `align-equals` aligning their `=`, the tuple-valued `coords` holding its source slot since evaluating its calls runs code. **The tuple elements land at the keyword's item-indent plus a step and the `)` at the keyword column**, the same seating a `list` or `dict` argument takes.
'''

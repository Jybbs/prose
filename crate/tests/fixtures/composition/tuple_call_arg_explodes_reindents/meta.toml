[docs]
previewable = true
title       = "A Tuple Call Argument Explodes and Re-Indents in One Pass"

description = '''
The one-line `configure` call carries a tuple too wide to keep, so `collection-layout` explodes it and `call-layout` re-indents the pieces under the `coords` keyword. `alphabetize` sorts `more`, `name`, and `other` while `coords` keeps its source position, because its tuple runs calls like `compute_alpha_coordinate()` and an entry whose value runs code never moves, and `align-equals` pads each `=` into one column. **The tuple elements land one indent step deeper than the keyword rows and the tuple's `)` closes at the keyword column**, the same shape a `list` or `dict` argument takes.
'''

[docs]
previewable = false
title       = "A Widened Head Carries Its Continuation Column With It"

description = '''
`align-colons` pads `host` and `(str)` so the two `Args:` entries share a type column and a `:` column, which pushes the start of `host`'s description to the right. `docstring-wrap` then reflows the overflowing description from that padded position, so the continuation line hangs under `The remote hostname` rather than under the narrower column the source wrote.
'''

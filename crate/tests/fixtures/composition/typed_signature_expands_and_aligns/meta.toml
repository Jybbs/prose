[docs]
previewable = true
title       = "A Typed Signature Expands and Aligns Its Columns"

description = '''
`configure`'s five typed parameters keep their source order even with `alphabetize` in the run, because reordering parameters would change every positional call. **`signature-layout` expands the signature to one parameter per line, `align-colons` pads each name to a shared annotation `:` column, and `align-equals` aligns the `=` across `mango` and `delta`**, the two parameters carrying defaults.
'''

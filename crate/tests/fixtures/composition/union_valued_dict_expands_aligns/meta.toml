[docs]
previewable = false
title       = "Union-Valued Dict Expands, Sorts, and Aligns Colons"

description = '''
The one-line `ALIASES` dict overflows the budget, and its values are written as `Optional` and `Union` expressions.

`reflow-collections` explodes it to one entry per row, `alphabetize-siblings` sorts the keys so `"extended_label"` leads, and `align-colons` pads every key out to a shared `:` column. **The legacy union values on the right pass through untouched**, since no rule in this set rewrites annotation syntax.
'''

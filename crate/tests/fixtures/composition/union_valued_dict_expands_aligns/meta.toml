previewable = false
title       = "A Union-Valued Dict Explodes, Sorts, and Aligns Its Colons"

description = '''
`ALIASES` overflows its line with values written as `Optional` and `Union` expressions. `reflow-collections` explodes it to one entry per row, `alphabetize-siblings` sorts the keys so `"extended_label"` leads, and `align-colons` pads every key out to one `:` column, and **the `Optional` and `Union` values pass through as written**, because no rule in this set rewrites annotation syntax.
'''

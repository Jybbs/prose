title       = "An Over-Cap Member the Rule Cannot Name Rejoins Inside Its Literal"

description = '''
The `helper(one, two, three, four)` call arrives fractured across four lines and passes more arguments than `max-args` allows.

`helper` resolves to no definition the rule can read, so it cannot name the positionals, and **it rejoins the fracture rather than exploding the call**. `reflow-collections` then sees a list whose members all sit on one row and leaves `hanging` on its single line.
'''

title       = "An Over-Cap Call the Rule Cannot Name Joins Inside Its Literal"

description = '''
`helper(one, two, three, four)` arrives written across four lines inside the list `hanging`, passing more arguments than `max-args` allows. `helper` resolves to no definition the rule can read, so `reflow-calls` cannot name the positionals, and **it joins the call onto one line rather than exploding it**, leaving `reflow-collections` a list whose members all sit on one row, so `hanging` stays on a single line.
'''

[docs]
canonical   = false
previewable = true
title       = "An Unread Import Lands Past a Hoisted Constant"

description = '''
`from pkg import a` is never read, and it is also the line the `# Local imports` comment heads, so dropping it risks stranding that comment.

`band-constants` hoists `X = 1` below the imports, which brings the two `pkg` statements together as one band. With them adjacent, dropping `a` lets `from pkg import b` **move up onto the line `a` vacated**, leaving the comment heading a real import rather than a gap.
'''

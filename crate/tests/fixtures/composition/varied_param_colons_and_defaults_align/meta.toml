[docs]
previewable = true
title       = "Param Colons and Defaults Align in Width Groups"

description = '''
The `configure` signature arrives already expanded, its four typed parameters carrying defaults at widths from `host` to `timeout_seconds`. **`align-colons` pads every name to one shared `:` column set by `timeout_seconds`, and `align-equals` pads every annotation to one shared `=` column set by `float`**, so all four rows read as name, type, default.
'''

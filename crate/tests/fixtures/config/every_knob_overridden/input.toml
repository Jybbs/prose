code-line-length            = 100
docstring-line-length       = 60
docstring-structured-policy = "docstring-line-length"
import-line-length          = 99
target-version              = "3.14"

[cache]
enabled      = false
max-size-mib = 250

[imports]
first-party = ["acme", "internal"]

[rules]
align-colons                 = { enabled = false, max-shift = 4 }
align-comments               = { enabled = false, max-shift = 4 }
align-comparisons            = { enabled = false, max-shift = 4 }
align-equals                 = { enabled = false, max-shift = 4 }
align-imports                = { enabled = false, max-shift = 4 }
align-match-case             = { enabled = false, max-shift = 4 }
alphabetize                  = { enabled = false, group-methods = false, sort-definitions = false, sort-dict-keys = false, sort-docstring-entries = false, sort-dunder-lists = false }
band-constants               = { enabled = false, group-subcategories = false, max-tiers = 4 }
bare-imports                 = { allow = ["scipy", "torch"], enabled = false, exempt-aliased = false, max-attributes = 2 }
bare-super                   = false
blank-lines                  = false
call-layout                  = { enabled = false, max-args = 6 }
chain-layout                 = { enabled = false, max-links = 4, max-shift = 8 }
collection-layout            = { enabled = false, explode = false, keep-multiline-literals = false, max-atomics = 3, max-dict-entries = 5, wrap-dict-entries = false }
comment-spacing              = false
docstring-expand             = false
docstring-frame              = false
docstring-wrap               = false
group-imports                = false
import-layout                = { enabled = false, merge-members = false, split-multi-module = false }
line-overflow                = { enabled = false, suggest-string-splits = false }
miscased-constants           = { allow-pattern = "^_", enabled = false }
modernize-annotations        = { enabled = false, rewrite-generics = false, rewrite-unions = false }
normalize-comparisons        = { enabled = false, rewrite-identity = false, rewrite-negation = false, rewrite-operand-order = false }
normalize-literals           = { enabled = false, unify-numerics = false, unify-prefixes = false, unify-quotes = false }
prune-inert-imports          = { drop-duplicates = false, drop-unreferenced = false, enabled = false }
reassigned-constants         = { allow = ["LOG_LEVEL"], enabled = false }
shed-backslash-continuations = false
shed-parentheses             = false
signature-annotations        = false
signature-layout             = { enabled = false, max-params = false }
simplify-comprehensions      = false
single-use-variables         = { allow-pattern = "^tmp_", enabled = false }
stack-adjacent-strings       = false
step-narration               = false
strip-align-padding          = false
strip-none-return            = false
strip-trailing-commas        = false
unsorted-positionals         = false

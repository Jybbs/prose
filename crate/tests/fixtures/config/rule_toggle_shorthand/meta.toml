title       = "Rule Toggles Accept Bool Shorthand and Inline Tables"

description = '''
The `[rules]` table disables `alphabetize-siblings` with a bare `false`, sets the `align-equals` `max-shift` knob through an inline table while leaving the rule enabled, and resolves the nested `reflow-signatures` `max-params` toggle. Every unlisted rule stays at its default.
'''

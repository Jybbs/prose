[docs]
previewable = false
title       = "Rule Toggles Accept a Bare Bool and an Inline Table"

description = '''
The `[rules]` table writes each override form the loader accepts. A bare `false` disables `alphabetize-siblings`, the inline table `{ max-shift = 4 }` sets `align-equals`'s cap to `4` **while leaving the rule enabled**, because an inline table configures a rule rather than toggling it, and `max-params = false` removes `reflow-signatures`'s parameter budget without disabling the rule.

Every rule the table does not name resolves to its default.
'''

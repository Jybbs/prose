[docs]
previewable = false
title       = "Rule Toggles Accept Bool Shorthand and Inline Tables"

description = '''
The `[rules]` table exercises each override shape the loader accepts.

A bare `false` disables `alphabetize-siblings` outright. The inline table `{ max-shift = 4 }` tightens `align-equals`'s cap **while leaving the rule enabled**, since an inline table configures rather than toggles. And `max-params = false` switches off `reflow-signatures`'s parameter budget without disabling the rule itself.

Every rule the table does not name resolves to its own default.
'''

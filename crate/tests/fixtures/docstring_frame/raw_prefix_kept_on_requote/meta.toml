[docs]
previewable = true
title       = "Raw Prefix Survives the Requote"

description = '''
`escape_pattern`'s docstring pairs an `r` prefix with plain `"..."` quotes because its body holds the `\d` escape. **The requote to `r"""..."""` keeps the prefix verbatim on the opener**, the raw form PEP 257 sanctions for a docstring carrying a backslash.
'''

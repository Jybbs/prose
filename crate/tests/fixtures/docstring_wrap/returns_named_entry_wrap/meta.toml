title       = "Named Returns Entries Wrap Like Args Entries"

description = '''
`record` and `cached` under `Returns:` each take the `name: description` entry shape, and both run past the budget. **Each wraps at the docstring budget with a hanging indent at the description column**, so the continuation lines land under the text after the `:` exactly as a parameter entry's would.

[docs]
previewable = true
title       = "Nested Function Docstrings Expand at Each Scope"

description = '''
`outer` and the `inner` def nested inside it each carry a single-line docstring, and the rewrite **fires independently at every nesting level**. Each expanded body line settles at the indent of its own def, so `Inner docstring.` sits one step deeper than `Outer docstring.`.
'''

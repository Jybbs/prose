title       = "Single-Quoted Docstrings Canonicalize to Triple Quotes"

description = '''
`summarize`'s docstring sits in single quotes as `'A single-quoted summary.'` **It re-delimits to the canonical `"""` form**, because the rule recognizes a docstring by its position in the def and emits `"""` whatever quotes the source carried.
'''

[docs]
previewable = false
title       = "An Aliased `__future__` Import Stays First"

description = '''
`from __future__ import annotations as _annotations` aliases the directive, above `from collections import Counter` and `import os`. **The aliased statement stays at the front**, because `group-imports` reads the `__future__` module name and not the alias, and below it the bare `import os` moves above the external `from collections import Counter` as usual.
'''

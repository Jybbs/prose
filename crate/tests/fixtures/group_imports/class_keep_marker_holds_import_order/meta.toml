[docs]
previewable = true
title       = "`# prose: keep` on a Class Holds Its Imports Too"

description = '''
`Kept` and `Grouped` each import `from collections import abc` above `import sys`, and only `Kept` carries `# prose: keep` on its header. **`group-imports` moves `import sys` above the `from` import in `Grouped` and leaves `Kept` as written**, because the marker holds every statement of the class body against each rule that reorders one. The imports inside the `if TYPE_CHECKING:` arm of `Kept` keep their order too, since an `if` opens no scope, whereas the imports inside `load` still group, because a method body is a scope of its own.
'''

[docs]
previewable = false
title       = "A `__future__` Import Stays Ahead of Every Section"

description = '''
The module opens with `from __future__ import annotations` above a mix of bare, external, and first-party imports, with `myapp` named in `first-party`. **The directive stays first while the rest partition into their sections**, so `import os` moves above `from collections import Counter` and `from myapp import helper` closes the run, because Python requires the directive ahead of every other statement.
'''

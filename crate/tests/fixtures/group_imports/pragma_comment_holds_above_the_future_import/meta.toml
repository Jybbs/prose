[docs]
previewable = false
title       = "A Pragma Comment Stays Above the `__future__` Import"

description = '''
The `# type: ignore` pragma sits directly above `from __future__ import annotations`, with `from collections import Counter` and `import os` below.

**The pragma stays at the top of the file with the directive**, because a comment attached to a statement moves with that statement and the directive stays first, while `import os` and `from collections import Counter` partition into their groups beneath.
'''

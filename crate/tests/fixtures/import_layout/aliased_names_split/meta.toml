[docs]
previewable = true
title       = "An `as`-Aliased Name Carries Its Alias across the Split"

description = '''
With `import-line-length` set to `40`, `from pkg import alpha as a, beta as b, gamma as g` overflows and splits. Each aliased name **keeps its alias across the split**, so both statements repeat the `from pkg import` prefix and `gamma as g` moves whole to the second line.
'''

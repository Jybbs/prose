[docs]
previewable = true
title       = "`merge-members = false` Leaves Each Statement Its Own Line"

description = '''
With `merge-members = false`, the two `from pkg` statements **stay apart**, `beta` and `alpha` each keeping their own line. Turning off one facet leaves the others running, so `split-multi-module` still breaks `import os, sys` into one statement per module.
'''

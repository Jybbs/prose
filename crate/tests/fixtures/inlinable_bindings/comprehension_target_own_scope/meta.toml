[docs]
previewable = true
title       = "Comprehension Targets Stay outside the Rule's Reach"

description = '''
`x` in `[x * x for x in xs]` lives in the comprehension's own scope, not `squares`'s function scope, even though it is read only once. `inlinable-bindings` enumerates bindings at function scope, **so a comprehension target never enters that enumeration** and stays unflagged.
'''

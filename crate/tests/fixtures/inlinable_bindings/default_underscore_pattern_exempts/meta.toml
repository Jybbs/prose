[docs]
previewable = false
title       = "An Underscore-Prefixed Name Is Exempt by Default"

description = '''
`_hidden` in `explainer` is written once and read once, the case the rule reports, but its name matches the default `allow-pattern` of `_*`. **`_hidden` is not reported, with no configuration at all**, because a leading underscore is the Python convention for a name the author keeps on purpose, so the rule exempts it rather than treating it as a candidate.
'''

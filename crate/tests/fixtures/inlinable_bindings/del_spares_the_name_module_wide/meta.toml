[docs]
previewable = false
title       = "A `del` in One Function Exempts the Name Across the Module"

description = '''
`handle` in `rebuild` is written once from `source.build()` and read once in `return handle.name`, and nothing in `rebuild` deletes it, whereas `release` binds its own `handle` and then runs `del handle`. **Neither binding is reported**, because the binding table records a deletion per module name rather than per binding, so the `del` in `release` exempts the `handle` in `rebuild` too, and removing that `del` would report `rebuild`'s `handle` alone, since `release`'s is never read.
'''

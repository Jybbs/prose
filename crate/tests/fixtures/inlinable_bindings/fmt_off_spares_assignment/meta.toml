[docs]
previewable = true
title       = "A `# fmt: off` Block Suppresses the Lint"

description = '''
`x` in `basic` is bound once and read once, the shape `inlinable-bindings` normally flags, but the whole function sits inside a `# fmt: off` block. **The diagnostic is dropped for anything inside a suppressed span**, because the pipeline filters diagnostics by range the same way it filters edits, so lint output and rewrites are suppressed together.
'''

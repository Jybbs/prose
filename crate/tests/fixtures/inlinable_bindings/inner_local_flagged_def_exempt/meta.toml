[docs]
previewable = false
title       = "Inner Local Flagged While the `def` Stays Exempt"

description = '''
`x` inside `inner` **is flagged**. `inner` itself is bound once by its `def` and read once in `return inner`, yet it is not.

The rule reports assignments and walrus bindings only, and **a `def` is neither**. The function binding falls outside what the rule tracks, even though it is bound once and read once exactly like the names the rule does report.
'''

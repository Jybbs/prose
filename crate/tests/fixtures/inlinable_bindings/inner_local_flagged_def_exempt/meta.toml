[docs]
previewable = false
title       = "A Local Inside a Nested `def` Is Reported While the `def` Itself Is Not"

description = '''
`x` inside `inner` is written once from `compute()` and read once in `return x + 1`, and `inner` itself is bound once by its `def` and read once in `return inner`. **`x` is reported and `inner` is not**, because the rule reports assignments and walrus bindings only, and a `def` is neither, even though it is bound once and read once exactly like the names the rule does report.
'''

[docs]
previewable = false
title       = "Inner Local Flagged While the `def` Stays Exempt"

description = '''
`x` inside `inner` **is flagged**, while `inner` itself, bound once by `def inner` and read once in `return inner`, is not. `inlinable-bindings` only reports assignments and walrus bindings, and a `def` is neither, so the function binding falls outside what the rule tracks even though it fits the same bind-once-read-once shape.
'''

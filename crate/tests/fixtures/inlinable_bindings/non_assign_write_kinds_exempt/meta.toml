[docs]
previewable = false
title       = "A Binding That Is Not an Assignment Is Exempt"

description = '''
`fp`, `err`, and `os` are each written once and read once, the case the rule reports on a plain assignment, and `arg` and `value` are each read twice. **None of the five is reported**, because the rule reports assignments and walrus bindings only, and a function parameter, a `for` target, a `with` target, an `except` handler name, and an `import` are none of those, so none carries a right-hand side inlining could move.
'''

[docs]
previewable = false
title       = "Non-Assignment Write Kinds Are Exempt"

description = '''
`arg`, `value`, `fp`, `err`, and `os` are each written once and read once, which is exactly the shape the rule flags on a plain assignment. None of them is reported.

**The rule reports assignments and walrus bindings only.** A function parameter, a `for` target, a `with` target, an `except` handler name, and an `import` binding are none of those, and none of them carries a right-hand side that inlining could move.
'''

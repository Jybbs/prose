[docs]
previewable = false
title       = "A `nonlocal` Declaration Skips the Whole Function"

description = '''
`inner` declares `nonlocal counter`, then writes `bumped` once from `counter + 1` and reads it once in `return bumped`. **Nothing in `inner` is reported**, because a `nonlocal` declaration skips the whole function rather than the one line, since counting the uses of `counter` would mean following the binding along the closure chain into `outer`, which the rule does not do.
'''

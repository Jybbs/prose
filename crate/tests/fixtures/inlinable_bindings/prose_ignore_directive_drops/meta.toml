[docs]
previewable = false
title       = "A `# prose: ignore` Comment Drops the Report"

description = '''
`x = expensive(arg)` in `basic` ends with a `# prose: ignore[inlinable-bindings]` comment, and `x` is read once in `return x + 1`. **The diagnostic that line would otherwise carry is dropped**, because the suppression is applied after the rule runs, filtering its output by line rather than changing what the rule detects.
'''

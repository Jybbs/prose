[docs]
previewable = false
title       = "A Sibling Read Twice Exempts Its Unpack Partner"

description = '''
`head, tail = pair` unpacks two names, `head` is read once in `return head + tail`, and `tail` is read twice, in `record(tail)` and in the same `return`. **`head` is not reported**, because removing it would split the tuple unpack into an indexed read plus a one-name remainder, a form worse than the unpack it replaces.
'''

[docs]
previewable = true
title       = "A Call in a Sibling Arm Is Still Reported"

description = '''
`balance` is read in the `else` arm, and `ledger.archive()` runs only in the `if` arm beside it. **The binding is reported**, because the path reaching the read never runs the call, whereas a call in an `elif` test ahead of the read, or in a branch that falls through to a read after the `if`, still spares the binding.
'''

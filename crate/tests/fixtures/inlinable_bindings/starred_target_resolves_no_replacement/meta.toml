[docs]
previewable = false
title       = "A Starred Unpack Target Is Not Reported"

description = '''
`head, *rest = items` unpacks with a starred target, and `wrap(head, rest)` reads each name once. **Neither target is reported**, because a starred target leaves no fixed subscript for itself or the names after it, and the binding table resolves no replacement for any target of such an unpack, `head` included.
'''

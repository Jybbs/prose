[docs]
previewable = false
title       = "A Walrus Expression's Own Value Counts as a Use"

description = '''
`total := len(items)` passes its value to the `print` call around it, and `return total` reads `total` again. **`total` reaches two uses and is not reported**, because a walrus expression's own value counts as a use wherever something consumes it, so the later read is the second use rather than the first.
'''

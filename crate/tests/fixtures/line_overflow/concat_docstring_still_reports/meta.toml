[docs]
previewable = false
title       = "A Concatenated Docstring Still Reports"

description = '''
`handler`'s docstring is two adjacent string literals on one 50-column line, over the 40-column budget. `stack-adjacent-strings` holds a concatenation that fills a docstring slot rather than stacking it, so no reshape will shorten the line and `line-overflow` **reports it as a finding** with no legal reshape.
'''

[docs]
previewable = true
title       = "A Whitespace-Free Literal Is Offered No Break"

description = '''
`ENDPOINT`'s URL carries no interior whitespace, so no pair of adjacent literals can reproduce its value with a break between them. The 52-column line still overflows the 40-column budget, leaving a bare report that ends `with no legal reshape`, and the same holds for a hash or a dense regex, where the message means exactly what it says.
'''

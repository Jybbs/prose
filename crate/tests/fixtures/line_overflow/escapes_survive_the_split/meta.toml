[docs]
previewable = true
title       = "An Escape Is Never Cut Down the Middle"

description = '''
The suggested split cuts `BANNER`'s string only after a run of literal whitespace, landing between `over` and `the`, so the `\\t` and the escaped quotes around `\"lazy\"` each travel whole inside one part. A backslash sits flush against the character it escapes with no whitespace between them, which is what keeps every cut out of an escape.
'''

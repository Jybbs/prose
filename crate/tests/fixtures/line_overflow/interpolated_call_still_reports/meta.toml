[docs]
previewable = false
title       = "A Call Inside a Replacement Field Is Still Reported"

description = '''
`result = f"{compute(alpha, beta)} and the remainder"` is 52 columns, over the 40-column budget, and its only call sits inside an f-string replacement field. **The line is reported with no legal reshape**, because no layout rule reads inside a replacement field, so the call is not left to `reflow-calls`.
'''

[docs]
previewable = false
title       = "A Call Inside a Format Spec Is Still Reported"

description = '''
The format spec after the `:` in `f"{amount:{compute(width, pad)}}"` is itself a replacement field, and the 62-column line overflows the 40-column budget. **The line is reported with no legal reshape**, because the `compute(width, pad)` call inside the spec is as far out of any layout rule's reach as one in the outer field, so it is not left to `reflow-calls`.
'''

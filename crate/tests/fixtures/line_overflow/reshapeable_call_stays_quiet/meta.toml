[docs]
previewable = false
title       = "A Line Carrying a Splittable Call Is Not Reported"

description = '''
`result = compute(alpha, beta, gamma, delta)` runs to 43 columns, over the 40-column budget. **`line-overflow` emits nothing**, because the line carries a call `reflow-calls` can still explode, so the overflow is left to that rule, and only a line no reshape can shorten becomes a finding.
'''

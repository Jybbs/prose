previewable = false
title       = "A Line Carrying a Splittable Collection Is Not Reported"

description = '''
The `data` assignment runs to 44 columns, over the 40-column budget, and carries a three-entry dict. **`line-overflow` emits nothing**, because the dict is a collection `reflow-collections` can still explode one entry per line, so the overflow is left to that rule.
'''

description = '''
`"a leading part "` and `f"{compute(alpha)} tail"` join as one implicitly concatenated run on a line over the 40-column budget. **`line-overflow` emits nothing**, because `stack-adjacent-strings` can break the run one literal per line, so the overflow is left to that rule, and the split suggestion covers a single literal whereas this line already carries two.

description = '''
`"a leading part "` and `f"{compute(alpha)} tail"` join as one implicitly concatenated run, a shape `stack-adjacent-strings` can break one literal per line, so `line-overflow` leaves the over-budget line to that rule and emits nothing. The split suggestion covers a single literal, whereas this line already carries two adjacent ones, so the shape falls to the layout rule either way.

[docs]
previewable = false
title       = "A Comma-Joined Import Stays Quiet"

description = '''
`import collections, itertools` runs to 29 columns against the 20-column import budget, yet `line-overflow` emits nothing. The comma join is a form `import-layout` can split into one statement per module, and the shape still counts as reshapeable even here, where `import-layout = false` turns that rule off entirely.
'''

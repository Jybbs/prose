[docs]
previewable = false
title       = "A Single-Statement Match Arm Is Not Reported"

description = '''
The `case "begin"` arm packs `run_the_initial_setup_routine()` onto its pattern line, past the 40-column budget. **`line-overflow` emits nothing**, because the arm carries a single statement `align-match-case` can still move onto its own line, so the overflow is left to that rule.
'''

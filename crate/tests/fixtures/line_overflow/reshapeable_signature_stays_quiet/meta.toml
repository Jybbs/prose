title       = "A Line Carrying a Splittable Signature Is Not Reported"

description = '''
`def configure(first, second, third, fourth):` runs to 44 columns, over the 40-column budget. **`line-overflow` emits nothing**, because the signature carries parameters `reflow-signatures` can still explode one per line, so the overflow is left to that rule.

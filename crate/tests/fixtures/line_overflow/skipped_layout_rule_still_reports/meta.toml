[docs]
previewable = false
title       = "A Line Skipped From the Rule That Would Split It Is Still Reported"

description = '''
Each long line here carries a `# prose: skip[...]` naming the one rule that would split it: `reflow-imports` for the import, `reflow-calls` for `TOTAL`'s call, `reflow-collections` for `TABLE`'s dict, `reflow-signatures` for the signature of `configure`, `wrap-docstrings` for the docstring of `describe`, `stack-adjacent-strings` for `MESSAGE`'s two literals, and `align-match-case` for the `"halt"` arm in `dispatch`. The code on each line runs past its budget on its own. **Every one of those lines is reported**, because each skip holds the rule that would split its line and that rule then leaves the line as written. Each report names the held rule, except the docstring's, which offers the split `line-overflow` suggests for a long string literal.
'''

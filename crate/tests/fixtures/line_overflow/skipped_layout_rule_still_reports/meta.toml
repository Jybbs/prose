[docs]
previewable = false
title       = "A Line Skipped From the Rule That Would Split It Is Still Reported"

description = '''
Each long line here carries a `# prose: skip[...]` naming the one rule that would split it: `reflow-imports` for the import, `reflow-calls` for `TOTAL`'s call and for `RESULT`'s, whose skip sits on the row closing it, `reflow-collections` for `TABLE`'s dict, `reflow-signatures` for the signature of `configure`, `wrap-docstrings` for the prose row of `locate`'s docstring, whose skip also trails its closing row, `stack-adjacent-strings` for `MESSAGE`'s two literals, and `align-match-case` for the `"halt"` arm in `dispatch`. The code on each line runs past its budget on its own, `RESULT`'s argument row included. **Every one of those lines is reported**, because each skip holds the rule that would split its line and that rule then leaves the line as written. Each report names the held rule.
'''

[docs]
canonical   = true
previewable = true
title       = "A Splittable String Carries the Concatenated Form"

description = '''
`BANNER`'s 54-column line overflows inside one string literal, and the literal's interior spaces give the break somewhere legal to land, so the finding carries the parenthesized adjacent-literal form as a suggestion. Python joins the parts back into the identical value at compile time, yet **`prose format` never writes them**, because the chosen break points would become source a later edit has to reflow by hand.
'''

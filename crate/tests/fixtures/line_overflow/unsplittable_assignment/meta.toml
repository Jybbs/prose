[docs]
previewable = true
title       = "An Unsplittable Line Surfaces as a Finding"

description = '''
`metrics.rolling.window.average = previous_value` carries no call, collection, import, or signature a layout rule could split, so once the 47-column line crosses `code-line-length` **no legal form brings it within the cap**. `line-overflow` reports it with `with no legal reshape`, turning an unsatisfiable cap into a finding rather than a setting that silently did nothing.
'''

title       = "A camelCase Constant Suggests the SCREAMING_CASE Form"

description = '''
The module constant `maxRetries` is flagged, and the suggested rename splits the name at its case boundary to produce `MAX_RETRIES`, where a naive uppercasing would produce `MAXRETRIES`. The same word-boundary fold would cover a PascalCase `MaxRetries`.
'''

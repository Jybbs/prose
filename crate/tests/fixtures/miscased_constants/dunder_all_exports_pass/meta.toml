[docs]
previewable = true
title       = "Names the Module's `__all__` Lists Pass"

description = '''
`project`, `retries`, and `timeout` are listed in the module's `__all__` through an assignment and an augmented assignment, so each one is the spelling importers use. **None of the three is reported**, because a `SCREAMING_CASE` rename would break every importer, and a `from … import *` of the module would raise `AttributeError` on the `__all__` entry left naming nothing. `verbose` sits outside the list and is still reported with the suggested `VERBOSE` rename.
'''

[docs]
canonical   = true
previewable = true
title       = "A Lowercase Module Constant Draws a SCREAMING_CASE Rename"

description = '''
`max_retries = 5` binds an inert literal nothing in the module reassigns, so the name is a constant whose casing never says so. The lint reports it and suggests `MAX_RETRIES` without rewriting anything, because renaming a module constant breaks importers outside the file.
'''

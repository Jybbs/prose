[docs]
previewable = true
title       = "A Module-Level Conditional Is Still Module Scope"

description = '''
`default_encoding` sits behind the `sys.platform == "win32"` guard, yet a top-level `if` is still module scope, so the scan descends into it and flags the name with the suggested `DEFAULT_ENCODING` rename. Only a `def`, a `class`, or an `if TYPE_CHECKING:` block ends the descent.
'''

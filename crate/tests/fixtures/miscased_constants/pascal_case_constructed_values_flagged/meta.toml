[docs]
previewable = true
title       = "A PascalCase Name Building Data Still Draws the Rename"

description = '''
The classification follows the value rather than the target's casing, and `Palette`, `Timeout`, `Banner`, and `Ceiling` bind a dict display, a literal, an f-string, and an arithmetic expression, each constructing new data. All four count as constants and are flagged with `SCREAMING_CASE` renames, the converse of the carve-out that spares a bare class alias, which is what keeps dispatch tables and derived strings within the lint's reach.
'''

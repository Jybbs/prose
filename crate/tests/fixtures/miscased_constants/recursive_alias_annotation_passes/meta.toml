[docs]
previewable = true
title       = "A Recursive Alias Rests on Its Annotation Alone"

description = '''
`Tree` forward-references itself as the string `"list[Tree]"`, because the name is unbound while its own value evaluates. A string literal constructs data, so reading the value's shape alone would flag the name, leaving the `TypeAlias` annotation as the one signal that marks `Tree` a type and spares it.
'''

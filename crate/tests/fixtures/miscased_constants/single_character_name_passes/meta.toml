[docs]
previewable = true
title       = "Single-Character Names Are Spared"

description = '''
`x = 3` and `n = 100` assign single-letter names at module scope, the shape that usually names a mathematical scalar. Uppercasing one leaves a lone capital, which by mathematical convention reads as a matrix rather than a constant, so the lint exempts single-character names instead of suggesting a rename that would mislead.
'''

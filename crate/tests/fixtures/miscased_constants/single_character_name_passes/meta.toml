[docs]
previewable = true
title       = "Single-Character Names Are Spared"

description = '''
`x = 3` and `n = 100` assign single-letter names at module scope, which is the shape that usually names a mathematical scalar.

Uppercasing one leaves a lone capital, and by mathematical convention **a lone capital reads as a matrix rather than a constant**. The lint exempts single-character names rather than suggesting a rename that would mislead.
'''

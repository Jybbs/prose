[docs]
previewable = true
title       = "A TypeAlias-Annotated Target Is Exempt"

description = '''
`Vector: TypeAlias = list[float]` carries a `TypeAlias` annotation, which marks the target as a type rather than a constant. The annotation alone exempts `Vector`, before the rule ever reads the assigned value, whose `list[float]` type expression would exempt it anyway.
'''

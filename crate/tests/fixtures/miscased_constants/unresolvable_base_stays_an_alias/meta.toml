[docs]
previewable = false
title       = "A Base the File Cannot Resolve Stays a Type"

description = '''
`SETTINGS` arrives through an import and `registry` is bound by a `build_registry()` call, so nothing in this file says what either name binds. **`database` and `handler` both pass as type aliases rather than being reported**, because a string subscript on such a base reads exactly the way `Literal["db"]` does. Telling them apart would take a cross-file import map, machinery this rule does without.
'''

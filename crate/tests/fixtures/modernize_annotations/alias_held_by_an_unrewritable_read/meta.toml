title       = "An Import Holds While Any Read Survives"

description = '''
`first`'s `Optional[int]` rewrites to `int | None`, whereas `parent`'s `Optional["Node"]` holds because its member is the forward-reference string `"Node"`. That surviving annotation still reads `Optional` once, so the `from typing import Optional` line stays.

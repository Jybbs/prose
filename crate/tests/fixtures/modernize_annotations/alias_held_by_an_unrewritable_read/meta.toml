[docs]
previewable = false
title       = "An Import Stays While Any Read Survives"

description = '''
With `target-version = "3.10"`, `Node` annotates `first` as `Optional[int]` and `parent` as `Optional["Node"]`. **`first` rewrites to `int | None` and `parent` stays as written**, because its member is the forward-reference string `"Node"`, and that surviving annotation still reads `Optional`, so the `from typing import Optional` line stays.
'''

[docs]
previewable = false
title       = "An Unsubscripted Generic Converts Too"

description = '''
With `target-version = "3.9"`, `values: List` carries no subscript. **It rewrites to the builtin `list` all the same**, because a bare `List` names the same object its subscripted form does, and with that only read gone the `from typing import List` line is removed.
'''

[docs]
previewable = true
title       = "`rewrite-generics = false` Leaves the `typing` Generic"

description = '''
With `rewrite-generics = false`, the generic facet stops applying while the union facet still runs. `limit`'s `Optional[int]` becomes `int | None` and the now-unread `Optional` import is removed, whereas `names: List[str]` keeps both its spelling and its `List` import.
'''

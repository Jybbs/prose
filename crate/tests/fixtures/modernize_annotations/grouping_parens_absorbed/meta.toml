title       = "Grouping Parentheses Are Absorbed Into the Rewrite"

description = '''
`x`'s annotation arrives as `(Optional[int])`, wrapped in grouping parentheses. The rewrite replaces the whole parenthesized span, so `int | None` lands bare rather than re-wrapped, and the now-unread `Optional` import is removed.

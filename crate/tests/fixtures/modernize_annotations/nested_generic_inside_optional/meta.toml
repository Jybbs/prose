title       = "A Legacy Annotation Comes Back in Its Modern Form"

description = '''
`x`'s annotation stacks both legacy spellings, with `typing.List[int]` sitting inside `typing.Optional[...]`.

**Both settle together in one pass.** The inner generic becomes `list[int]` and the `Optional` wrapper becomes the PEP 604 `| None`, so `x` lands as `list[int] | None`. Nothing reads `typing` once those rewrites land, so `import typing` is removed as well.
'''

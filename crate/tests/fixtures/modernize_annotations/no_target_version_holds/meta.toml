[docs]
previewable = true
title       = "An Unset `target-version` Holds Every Rewrite"

description = '''
No `target-version` is declared for this case, and each rewrite runs only when the target sits at or above its version floor. An unset field clears neither floor, so `x: Optional[int] = None` and its `Optional` import pass through untouched.
'''

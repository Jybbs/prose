[docs]
previewable = true
title       = "`Optional[X]` Becomes `X | None`"

description = '''
With `target-version = "3.10"`, the `|` union spelling is available, so `x: Optional[int]` rewrites to `x: int | None`. That was the only read of `Optional`, so the `from typing import Optional` line is removed with it.
'''

[docs]
previewable = false
title       = "An Aliased Import Resolves to the Name It Binds"

description = '''
`from typing import Optional as Opt` binds the local name `Opt` to `typing.Optional`, and `x: Opt[int]` reads it. **`Opt[int]` rewrites to `int | None` all the same**, because the rule resolves the alias to the name it binds, and with nothing reading `Opt` afterward the aliased import line is removed.
'''

previewable = false
title       = "A Module-Qualified `typing.Optional` Rewrites the Same Way"

description = '''
`import typing` binds the module itself rather than any one member, and `x: typing.Optional[int]` reads it through attribute access. **The annotation rewrites to `int | None` exactly as the imported-name form does**, and with nothing reading `typing` afterward the import is removed.
'''

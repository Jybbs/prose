[docs]
previewable = false
title       = "A Skipped Line Keeps the Import Its Neighbor Would Drop"

description = '''
`x: Optional[int]` carries a `# prose: skip` comment, and `y: Optional[str]` sits below it. **`x` stays as written and `y` becomes `str | None`**, because the directive suppresses the rewrite on its own line alone, and the suppressed annotation still reads `Optional`, so the import survives a rewrite that would otherwise have removed it.
'''

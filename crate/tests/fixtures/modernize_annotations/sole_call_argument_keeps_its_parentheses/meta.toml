[docs]
previewable = false
title       = "A Sole Call Argument Keeps the Call's Parentheses"

description = '''
In `narrow`, `Optional[int]` is the only argument to `cast`, so the parentheses around it belong to the call rather than grouping the annotation.

**The rewrite replaces only the argument**, producing `cast(int | None)` with the call's own parentheses intact, and the two-argument `cast(Optional[int], value)` in `widen` rewrites the same way. Only `Optional` drops from the import, because `cast` is still read.
'''

[docs]
previewable = false
title       = "A Sole Call Argument Keeps the Call's Parentheses"

description = '''
In `narrow`, `Optional[int]` stands as `cast`'s only argument, so the parentheses around it belong to the call rather than being grouping parentheses of the annotation.

The rewrite replaces **only the argument**, producing `cast(int | None)` with the call's own parentheses intact, and the two-argument `cast(Optional[int], value)` in `widen` rewrites the same way. Only `Optional` drops from the import, since `cast` is still read.
'''

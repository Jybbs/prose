[docs]
previewable = true
title       = "The Union Rewrite Waits for Python 3.10"

description = '''
Builtin generics are subscriptable from Python 3.9, whereas the `|` union is runtime-valid only from 3.10. With `target-version = "3.9"`, `names: List[str]` converts to `list[str]` while `limit: Optional[int]` holds, and the `typing` import shrinks to `Optional`, the one name still read.
'''

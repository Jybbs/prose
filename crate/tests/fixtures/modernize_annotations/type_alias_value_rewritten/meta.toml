[docs]
previewable = false
title       = "A Type Alias Rewrites Like an Annotation"

description = '''
`MaybeInt = Optional[int]` is a plain assignment rather than an annotation. **Its value rewrites to `MaybeInt = int | None` all the same**, because the right-hand side is the same legacy spelling, and with `Optional`'s only read gone the import is removed with it.
'''

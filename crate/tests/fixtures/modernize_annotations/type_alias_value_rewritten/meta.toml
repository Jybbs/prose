[docs]
previewable = false
title       = "A Type Alias Rewrites Like an Annotation"

description = '''
`MaybeInt = Optional[int]` is a plain assignment rather than an annotation, yet its value is the same legacy spelling, so it rewrites to `MaybeInt = int | None` all the same. That was `Optional`'s only read, so the import is removed with it.
'''

[docs]
previewable = true
title       = "Every `typing` Generic Reaches Its Builtin"

description = '''
PEP 585 gave each of these generics a builtin spelling on Python 3.9, and `target-version = "3.9"` allows them.

Every annotation in `sizes` converts in place, so `List`, `Dict`, `Set`, `Tuple`, `FrozenSet`, and `Type` become `list`, `dict`, `set`, `tuple`, `frozenset`, and `type`. Once the last one converts **nothing reads the `typing` import at all**, so the whole line is removed.
'''

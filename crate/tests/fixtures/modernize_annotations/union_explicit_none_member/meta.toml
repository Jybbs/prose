title       = "An Explicit `None` Member Joins the Pipe Run"

description = '''
`Union[int, str, None]` names `None` outright as its last member, so the rewrite simply joins all three members with `|`, landing on `int | str | None` with no extra `| None` appended. The `Union` import is removed once nothing reads it.
'''

[docs]
previewable = true
title       = "`rewrite-unions = false` Leaves the Legacy Union"

description = '''
With `rewrite-unions = false`, the union facet stops applying while the generic facet still runs. `names: List[str]` becomes `list[str]` and the now-unread `List` import is dropped, whereas `limit: Optional[int]` keeps both its spelling and its `Optional` import.
'''

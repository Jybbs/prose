[docs]
previewable = true
title       = "A Comment Fused onto Its Code Is Pushed Two Columns Clear"

description = '''
The comment on `value = 1` opens with no whitespace at all between the `1` and the `#`.

The two-column minimum before a trailing comment therefore arrives as **an insertion rather than a rewrite of an existing gap**. The `# right` opener already carries its single space, which leaves that insertion as the only edit the comment takes.
'''

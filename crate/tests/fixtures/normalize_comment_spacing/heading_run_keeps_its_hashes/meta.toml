[docs]
previewable = true
title       = "A Multi-Hash Heading Keeps Its Run and Gains the Space"

description = '''
The space lands after the whole hash run rather than flattening it, so `##notes` becomes `## notes` and `####deeper` becomes `#### deeper`, each surviving as the section marker it was written as. `### Section` already carries its space, so it passes through as written.
'''

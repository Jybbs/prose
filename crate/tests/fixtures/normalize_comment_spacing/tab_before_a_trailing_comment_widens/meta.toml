[docs]
previewable = false
title       = "A Tab Ahead of a Trailing Comment Becomes Two Spaces"

description = '''
A single tab separates `value = 1` from its trailing comment. **The tab is replaced with two spaces**, because the gap is measured in characters rather than rendered columns, so the tab counts as one and falls short of the two-space minimum, and the replacement keeps the gap the same width on every viewer's tab setting.
'''

[docs]
previewable = false
title       = "A Hash Followed by Whitespace Alone Sheds It"

description = '''
The comment between `value = 1` and `other = 2` carries three spaces after its hash and no text. **The trailing whitespace is removed, leaving a bare `#`**, because there is no text to put a space ahead of, so a spacer line reads identically to the bare `#` an author types on purpose.
'''

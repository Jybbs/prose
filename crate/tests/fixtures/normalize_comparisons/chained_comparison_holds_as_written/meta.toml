title       = "A Chained Comparison Stays as Written"

description = '''
Both comparisons chain more than two operands, the range check `0 < n < 10` and the `value == low == None` chain. **Both stay as written**, the `None` included under `==`, because the rule never rewrites one link of a chain, so a chain never comes back mixing `==` with `is`.
'''

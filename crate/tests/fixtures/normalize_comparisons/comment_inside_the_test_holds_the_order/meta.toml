[docs]
previewable = false
title       = "A Comment Inside the Test Holds the Operand Order"

description = '''
`42 == count` leads with the constant, the shape the rule normally flips, but the `# the answer` comment sits inside the comparison. Swapping the operands would leave that comment attached to whichever operand landed on its line, so a comment anywhere inside the test blocks the flip and the order holds.
'''

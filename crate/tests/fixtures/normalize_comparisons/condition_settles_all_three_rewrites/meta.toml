previewable = true
title       = "One Condition Settles Every Rewrite in a Single Pass"

description = '''
One `if` carries all three shapes this rule rewrites, and all three settle together. The constant-lead `0 == n` flips to `n == 0`, the equality `x == None` becomes the identity test `x is None`, and `not y in ys` folds into `y not in ys`.
'''

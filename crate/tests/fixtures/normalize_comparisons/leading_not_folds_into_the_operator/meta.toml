[docs]
previewable = true
title       = "A Leading Not Folds Into the Operator It Negates"

description = '''
`not key in table` folds into `key not in table`, and `not key is sentinel` folds into `key is not sentinel`. Both `not in` and `is not` are operators the language grammar defines, so each fold restates the test exactly rather than approximating it.
'''

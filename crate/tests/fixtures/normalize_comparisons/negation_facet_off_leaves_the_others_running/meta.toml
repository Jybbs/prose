[docs]
previewable = false
title       = "The Negation Facet Off Leaves the Other Rewrites Running"

description = '''
With `rewrite-negation = false` set, **`not key in table` keeps its leading `not` rather than folding into `not in`**, whereas the other facets keep running, so `value == None` still becomes `value is None`, `0 == len(table)` still flips to `len(table) == 0`, and `flag == True` is still reported as a boolean-literal comparison.
'''

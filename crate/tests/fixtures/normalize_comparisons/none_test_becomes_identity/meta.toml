canonical   = true
previewable = true
title       = "A Test Against None Reads as an Identity Check"

description = '''
`value == None` becomes `value is None`, and `fallback != None` becomes `fallback is not None`. `None` is a singleton, so PEP 8 prescribes the identity form for any comparison against it, and the rule rewrites both operators to match.
'''

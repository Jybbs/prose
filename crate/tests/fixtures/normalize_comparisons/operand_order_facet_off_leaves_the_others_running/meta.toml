[docs]
previewable = false
title       = "The Operand-Order Facet Off Leaves the Other Rewrites Running"

description = '''
With `rewrite-operand-order = false`, the constant-led `0 == len(table)` stays exactly where its author put it. The other facets keep running, so `value == None` still becomes `value is None`, `not key in table` still folds into `key not in table`, and `flag == True` is still flagged as a boolean-literal comparison.
'''

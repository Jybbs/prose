[docs]
previewable = false
title       = "The Operand-Order Facet Off Leaves the Other Rewrites Running"

description = '''
With `rewrite-operand-order = false` set, **the constant-led `0 == len(table)` stays exactly as its author wrote it**, whereas the other facets keep running, so `value == None` still becomes `value is None`, `not key in table` still folds into `key not in table`, and `flag == True` is still reported as a boolean-literal comparison.
'''

previewable = false
title       = "A Parenthesized Operand Keeps Its Parentheses Across the Flip"

description = '''
`42 == (a + b)` leads with the constant, and the right operand is wrapped in parentheses. **The operands flip and the parentheses travel with `a + b`**, so the condition is written as `(a + b) == 42`, which parses exactly as the authored form did.
'''

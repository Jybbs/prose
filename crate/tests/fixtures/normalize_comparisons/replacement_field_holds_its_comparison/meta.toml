description = '''
`label`'s f-string carries `x == None` inside a replacement field, and `other`'s carries `not k in table`. **Both stay as written**, because an f-string replacement field is opaque to this rule, the same way it is to the layout rules, so a comparison written inside one keeps the form its author gave it.

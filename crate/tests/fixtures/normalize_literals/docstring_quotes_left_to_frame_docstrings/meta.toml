description = '''
`render`'s docstring `'Summary.'` keeps its single quotes, whereas `'body'` in the return below it swaps to `"body"`. **The quotes facet skips the docstring position entirely**, because reframing a docstring is `frame-docstrings`'s job rather than this rule's.

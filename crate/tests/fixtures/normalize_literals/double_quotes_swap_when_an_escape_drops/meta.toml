[docs]
previewable = true
title       = "A Double-Quoted Body Swaps When That Sheds an Escape"

description = '''
Rewriting `quoted` as `'already " escaped'` sheds the backslash in `\"`, so the swap runs even though it moves away from the preferred double quote. The neighbouring `apostrophe` keeps its double quotes, because single-quoting `it's fine` would only trade one escape for another.
'''

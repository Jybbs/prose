[docs]
previewable = false
title       = "An F-String Keeps Its Quotes When the Target Quote Appears Inside"

description = '''
`row = f'{data["key"]}'` carries `"key"` inside its replacement field, and `shout = f'say "hi" to {name}'` carries `"hi"` in its literal text. **Both f-strings keep their single quotes**, because swapping `row` would set its outer quote against the `"` inside the field, a nesting Python accepts only from 3.12, and swapping `shout` would add two escapes instead.
'''

[docs]
previewable = false
title       = "An F-String Holds When the Target Quote Appears Inside"

description = '''
Swapping `row` to double quotes would set its outer quote against the `"key"` inside its replacement field, a nesting Python only accepts from 3.12. `shout` carries `"hi"` in its literal text, where the swap would add two escapes instead, so both f-strings hold their single quotes.
'''

previewable = true
title       = "An F-String Swaps When No Field Carries the Target Quote"

description = '''
Neither f-string carries a `"` anywhere inside it, so both settle on double quotes, `label` bringing its `:>8` format spec through the swap untouched and `plain` holding no replacement field at all. The opener, the closer, and the literal text between them swap in a single edit.
'''

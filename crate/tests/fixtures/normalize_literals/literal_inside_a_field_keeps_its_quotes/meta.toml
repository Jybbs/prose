[docs]
previewable = true
title       = "A Literal Inside a Field Keeps Its Quotes and Loses Its Prefix"

description = '''
Inside `picked`'s replacement field, `u'inner'` drops its no-op `u` prefix but keeps its single quotes, since a `"` nested inside the double-quoted f-string only parses from Python 3.12. **The prefixes and numerics facets reach inside a replacement field, whereas the quotes facet does not**, because only the quote choice is version-sensitive.
'''

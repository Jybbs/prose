[docs]
previewable = false
title       = "A Literal Run Ending in a Lone Backslash Survives the Swap"

description = '''
In `traced`, `\{` is not an escape sequence, so the literal text `path\` before the replacement field genuinely ends in a lone backslash. **That backslash escapes nothing in either spelling**, so the surrounding quotes still settle from `'` to `"`.
'''

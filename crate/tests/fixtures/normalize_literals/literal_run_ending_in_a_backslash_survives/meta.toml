[docs]
previewable = false
title       = "A Literal Run Ending in a Lone Backslash Survives the Swap"

description = '''
`traced = f'path\{x}'` ends its literal text in a lone backslash, because `\{` is not an escape sequence. **The quotes still swap from `'` to `"`, giving `f"path\{x}"`**, because that backslash escapes nothing in either spelling.
'''

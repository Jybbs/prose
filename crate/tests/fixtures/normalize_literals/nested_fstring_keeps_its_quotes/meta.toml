[docs]
previewable = false
title       = "An F-String Nested in a Field Keeps Its Quotes"

description = '''
`row = f"{f'{inner}'}"` nests the f-string `f'{inner}'` inside the replacement field of a double-quoted one. **The inner f-string keeps its single quotes**, because swapping them would put a bare `"` inside the outer string's field, a nesting Python rejects before 3.12, so the quotes facet passes over it exactly as it passes over a plain literal in a field.
'''

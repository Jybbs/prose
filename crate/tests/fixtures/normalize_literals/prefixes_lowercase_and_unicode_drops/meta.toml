[docs]
previewable = true
title       = "String Prefixes Lowercase and the No-Op `u` Drops"

description = '''
The `U` on `U"unicode"` disappears outright, because every Python 3 string is already unicode. `R"a\d"` and `B"bytes"` fall to lowercase `r` and `b`, and the combined `BR"z\d"` settles raw-first as `rb"z\d"`.
'''

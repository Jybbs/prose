[docs]
previewable = true
title       = "Turning Off `unify-quotes` Leaves the Other Facets Running"

description = '''
`unify-quotes = false` turns off one spelling axis and leaves the rest of the rule running.

The single-quoted `'ada'` therefore stands exactly as written, while **the other facets still fire**. `0XABC` lowercases its marker to `0xABC`, `U"y"` drops its no-op prefix, and `R"a\d"` falls to `r"a\d"`. Each facet gates one axis on its own.
'''

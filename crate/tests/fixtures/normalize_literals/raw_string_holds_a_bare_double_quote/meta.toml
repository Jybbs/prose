[docs]
previewable = false
title       = "A Raw String Carrying a Bare Double Quote Keeps Its Delimiters"

description = '''
`pattern = r'"\d+"'` is a raw string whose body carries two bare `"` characters. **Its delimiters stay where they are**, because swapping to double quotes would need an escape on each `"` and a raw string cannot gain a backslash.
'''

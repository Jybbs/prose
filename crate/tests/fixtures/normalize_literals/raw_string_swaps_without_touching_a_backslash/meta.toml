[docs]
previewable = true
title       = "A Raw String Swaps Only Its Delimiters"

description = '''
`digits` swaps from `r'\d+'` to `r"\d+"` with its body left byte-for-byte, since a raw string carries every backslash into its value and only the delimiters are the rule's to rewrite. `guarded` swaps too, because each `"` in `r'\"exact\"'` already sits behind a backslash and needs none added.
'''

[docs]
previewable = true
title       = "A Redundant Escape Sheds Even When the Quote Holds"

description = '''
A `\"` inside single quotes needs no backslash, so `traced` and `spare` shed those escapes while their `'` delimiters stay put, and `mirror` sheds its needless `\'` the same way inside double quotes. **A quote character counts once wherever it appears, escaped or not**, which is what keeps the delimiter choice stable rather than flipping it on every run.
'''

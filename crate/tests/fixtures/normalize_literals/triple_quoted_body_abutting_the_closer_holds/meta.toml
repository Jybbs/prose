previewable = false
title       = "A Triple-Quoted Body Abutting the Closer Keeps Its Delimiters"

description = '''
`sentinel` carries a `"""` run in its body and `trailing` ends in a bare `"`, both written in triple single quotes. **Both keep their triple-single delimiters**, because either body would collide with the `"""` closer a swap would install and corrupt the literal.
'''

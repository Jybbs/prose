[docs]
previewable = true
title       = "A T-String Settles Its Quotes the Way an F-String Does"

description = '''
`label` swaps to `t"{mask:>8}"`, while `shout` holds its single quotes because double-quoting `say "hi"` would add two escapes. That is what the f-string pair does, entry for entry.

**The quotes facet reads a t-string through its own token kinds rather than assuming it behaves like an f-string**, so this case pins the behaviour against the tokens that actually differ.
'''

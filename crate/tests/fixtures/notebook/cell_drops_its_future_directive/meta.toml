[docs]
previewable = false
title       = "A Cell Drops Its `__future__` Directive"

description = '''
The first cell opens on `from __future__ import annotations` above `value = 1`, which carries no annotation the directive would change, and the second cell contains `total = value + 1`. **[[prune-inert-imports]] removes the directive inside its own cell**, and the deletion stops at the boundary between the two cells, leaving the second cell as written.
'''

[docs]
previewable = false
title       = "Constants Band Within Each Cell"

description = '''
Each cell interleaves a definition, an import, and a constant that reads the definition, `helper` with `import os` and `CONFIG = helper` in the first, and `runner` with `import sys` and `MODE = runner` in the second. **Each import moves to the top of its own cell and each constant stays below the definition it reads**, and nothing from the second cell is drawn into the first, because `band-constants` reads each cell as its own module-level region.
'''

[docs]
previewable = false
title       = "Band Constants Within Each Cell"

description = '''
Each cell interleaves a definition, an import, and a constant. The first holds `helper` with `import os` and `CONFIG`, and the second holds `runner` with `import sys` and `MODE`.

Grouping runs **inside each cell separately**. Each import hoists to the front of its own cell and each constant pools below the definition it reads, and nothing from the second cell is ever drawn into the first cell's group.
'''

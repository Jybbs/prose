[docs]
previewable = false
title       = "A Comment in the Cell Above Does Not Keep an Unread Import"

description = '''
The first cell closes on the comment `# Sampling knobs`, and the second opens on `import statistics`, which no cell reads. **The import is removed**, because an own-line comment directly above an import ordinarily keeps the statement in place, and a cell boundary separates the two, so the comment in the cell above does not count as the leading comment of the import.
'''

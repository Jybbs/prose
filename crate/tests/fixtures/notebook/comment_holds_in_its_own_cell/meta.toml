[docs]
previewable = false
title       = "A Trailing Comment Stays in the Cell That Carries It"

description = '''
The first cell closes on the own-line comment `# Sampling knobs`, and the second opens on `WINDOW = 32` and `BATCH = 8`, the constants the comment describes. **The comment stays in the first cell while `BATCH` and `WINDOW` sort and align in the second**, because a comment above a constant ordinarily moves with it, and that tie stops at the cell boundary.
'''

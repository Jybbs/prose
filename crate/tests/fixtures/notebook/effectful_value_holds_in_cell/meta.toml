[docs]
previewable = false
title       = "A Constant Calling a Function Stays in Place Within a Cell"

description = '''
The cell interleaves `helper` with `SEED = 42` and `CACHE = build_cache(size=10)`. **`SEED` moves above the definition and `CACHE` stays below it**, because a call runs code the moment the cell executes, so moving it would change what that run computes, whereas a literal moves freely.
'''

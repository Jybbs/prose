[docs]
previewable = false
title       = "Hold an Effectful Constant Within a Cell"

description = '''
The cell interleaves `helper` with two constants.

The inert `SEED = 42` hoists above the definition as usual. `CACHE = build_cache(size=10)` **holds its place**, because a call runs code the moment the cell executes and moving it would change what that run computes.
'''

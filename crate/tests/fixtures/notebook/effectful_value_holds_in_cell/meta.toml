previewable = false
title       = "Hold an Effectful Constant Within a Cell"

description = '''
The cell interleaves `helper` with two constants. The inert `SEED = 42` hoists into the leading band above the definition, whereas the effectful `CACHE = build_cache(size=10)` holds its place, because a call runs code when the cell executes and moving it would change what the run computes.
'''

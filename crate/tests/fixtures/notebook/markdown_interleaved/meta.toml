[docs]
previewable = false
title       = "Interleaved Markdown Cells Are Skipped in the Cell Count"

description = '''
The markdown cells `Intro` and `Middle` interleave with three code cells, two of which contain an assignment pair and one a bare `pass`. **Both pairs align inside their own cells, the `pass` cell passes through unchanged, and neither markdown cell enters the formatted stream**, so the cell banners in the output count code cells alone.
'''

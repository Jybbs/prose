[docs]
previewable = false
title       = "Same-Module Imports in Two Cells Hold Their Own Statements"

description = '''
Both cells import from `pkg`, `beta` in the first and `alpha` in the second, and folding the two into one `from pkg import ...` would move code across a cell boundary. [[import-layout]] **gathers only within a single cell**, so each statement stays where its author put it.
'''

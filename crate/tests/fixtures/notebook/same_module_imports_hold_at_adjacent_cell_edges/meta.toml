[docs]
previewable = false
title       = "Same-Module Imports at Adjacent Cell Edges Stay Apart"

description = '''
The first cell closes on `from pkg import alpha` and the second opens on `from pkg import beta`, so the two read as an adjacent import run. **Each cell keeps its own statement**, because a module-level gather would merge them and empty the first cell of the import it declares, and the cell boundary keeps them apart.
'''

[docs]
previewable = false
title       = "Same-Module Imports Hold at Adjacent Cell Edges"

description = '''
Cell one closes on `from pkg import alpha` and cell two opens on `from pkg import beta`, which makes the two an adjacent import run.

A module-level gather would merge them and **empty the first cell of the import it declares**. The cell wall holds them apart instead, so each cell keeps its own statement.
'''

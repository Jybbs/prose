[docs]
previewable = false
title       = "A Bare Dot Precision Is Written as `.0`"

description = '''
`"%.f" % (measure,)` writes a bare `.` for its precision, which `%` reads as zero decimal places. **The rewrite spells that precision out as `.0`**, so `rounded` becomes `f"{measure:.0f}"`, because a format spec writes the precision digit explicitly.
'''

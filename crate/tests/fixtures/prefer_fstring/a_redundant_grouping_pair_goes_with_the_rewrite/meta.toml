[docs]
previewable = true
title       = "A Redundant Grouping Pair Goes With the Rewrite"

description = '''
The parentheses around `"%s" % (value,)` group a binary expression, whereas the f-string that replaces it is a single atom needing no grouping. The rewrite widens the replaced span to include those parentheses, so the line lands as `label = f"{value}"` rather than leaving a redundant pair for a later rule.
'''

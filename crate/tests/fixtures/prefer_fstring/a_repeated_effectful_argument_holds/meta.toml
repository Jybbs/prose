[docs]
previewable = true
title       = "A Repeated Effectful Argument Holds"

description = '''
The template reads `x` twice, and `x` is bound to a call. `"{x} {x}".format(x=build())` evaluates `build()` once, whereas the f-string `f"{build()} {build()}"` would call it twice, so the rewrite would change behavior and the line holds.
'''

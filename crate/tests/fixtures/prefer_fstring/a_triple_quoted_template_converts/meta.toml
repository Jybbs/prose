[docs]
previewable = true
title       = "A Triple-Quoted Template Keeps Its Delimiters"

description = '''
The rewrite reuses the `"""` delimiters the source wrote, so the two-line body converts in place with `%s` becoming `{name}` on its first line. Nothing else moves, and each physical line of the triple-quoted body is measured against the line budget on its own.
'''

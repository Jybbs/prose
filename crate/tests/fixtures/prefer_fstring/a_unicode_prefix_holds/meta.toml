[docs]
previewable = false
title       = "A `u` Prefix Keeps the Template"

description = '''
`legacy = u"%s" % (value,)` carries a `u` prefix. **The line stays as written**, because Python accepts `u"..."` but no `uf"..."`, so the template cannot become an f-string. In the full pipeline `normalize-literals` removes the prefix before this rule runs, so this form arises only with `unify-prefixes` off.
'''

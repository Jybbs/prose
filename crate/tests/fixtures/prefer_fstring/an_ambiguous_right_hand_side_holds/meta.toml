[docs]
previewable = true
title       = "A Bare Right-Hand Side Holds"

description = '''
Nothing here changes. The right-hand side of `%` is the bare name `value` rather than a tuple literal, so nothing in the source pins down what it holds at runtime.

If `value` turns out to be a one-element tuple, `%` unpacks it and renders the element, whereas `f"{value}"` would render the tuple itself. **The line holds rather than risk changing what prints.**
'''

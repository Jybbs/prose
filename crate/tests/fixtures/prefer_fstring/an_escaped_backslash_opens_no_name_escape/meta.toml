[docs]
previewable = false
title       = "Braces After an Escaped Backslash Double as Literal Text"

description = '''
In `"\\N{token} %s"` the `\\` pair renders one literal backslash, so the `N{token}` after it is plain text rather than a `\N{...}` name escape. **The rewrite doubles the braces to `{{token}}`** while `%s` becomes `{name}`, because a bare `{` in an f-string would open a replacement field.
'''

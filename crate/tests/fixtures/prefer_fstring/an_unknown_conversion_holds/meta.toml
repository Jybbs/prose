[docs]
previewable = false
title       = "An Unknown Conversion Keeps the Call"

description = '''
The conversion `!b` names no converter `str.format` defines, the known set being `!s`, `!r`, and `!a`, so the call raises `ValueError` at runtime. The template grammar parses the character, and **the call stays as written to raise at runtime** rather than becoming an f-string that does not compile.
'''

[docs]
previewable = true
title       = "Mapping Keys Bind Their Entries by Name"

description = '''
Each `%(...)s` spec names the dict entry it reads, `%(name)s` resolving to `who` and `%(age)s` to `years`, regardless of the order the dict lists them. The rewrite splices each entry's value into its field and drops the mapping, landing on `f"{who} is {years}"`.
'''

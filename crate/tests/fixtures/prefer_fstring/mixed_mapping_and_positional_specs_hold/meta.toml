[docs]
previewable = false
title       = "A Template Mixing Mapping Keys and Positional Specs Keeps Its Line"

description = '''
The template mixes the mapping spec `%(named)s` with the positional `%s`, whereas the right-hand side of `%` binds either by name from a dict or by position from a tuple, never both at once. **The line stays as written**, because neither reading settles which of `table` and `extra` fills which spec.
'''

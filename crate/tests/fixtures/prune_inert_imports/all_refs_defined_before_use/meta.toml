[docs]
previewable = false
title       = "A Module-Scope Annotation Keeps the Directive Even When Every Name Resolves"

description = '''
Every annotation in the file names `Node`, and `class Node` is defined above the first annotation that reads it, so each annotation would evaluate without the directive. **`from __future__ import annotations` stays as written**, because `root: Node = Node()` carries an annotation at module scope, whose entry in the module's `__annotations__` the directive stores as the string `'Node'` rather than the class object, so removing the import would change what the module exposes rather than only shorten the file.
'''

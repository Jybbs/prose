previewable = false
title       = "An Annotation Inside a Module-Level Loop Keeps the Directive"

description = '''
The annotated assignment `y: Item = Item()` sits inside a `for` loop body at module level, and `Item` is the class defined above the loop. **The directive stays**, because a `for` loop body at module level runs in module scope, so the rule counts the nested annotation as one written into the module's `__annotations__`, where the directive stores it as the string `'Item'` rather than the class object.
'''

previewable = false
title       = "A Loop-Body Annotation Runs at Module Scope and Holds the Directive"

description = '''
Nothing here changes. The annotated assignment `y: Item` sits inside a `for` loop body, and a nested annotation still counts when the file is checked.

`Item` resolves to the class written above the loop, so eager evaluation would succeed and the directive looks unnecessary. It is kept anyway, because **a `for` loop body runs at module scope** and its annotation reaches `__annotations__` only while the directive stands.
'''

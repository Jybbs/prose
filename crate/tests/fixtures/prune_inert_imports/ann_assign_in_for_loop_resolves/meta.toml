[docs]
previewable = false
title       = "A Loop-Body Annotation Runs at Module Scope and Holds the Directive"

description = '''
The annotated assignment `y: Item` sits inside a `for` loop body, and a nested annotation still counts when the file is checked for annotations to resolve. `Item` resolves to the class above the loop, so eager evaluation would succeed, whereas **the loop body runs at module scope** and its annotation reaches `__annotations__` only while the directive stands, leaving the directive in place.
'''

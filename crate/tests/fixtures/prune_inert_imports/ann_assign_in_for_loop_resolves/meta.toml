[docs]
previewable = false
title       = "A Loop-Body Annotation Resolves, So the Import Is Removed"

description = '''
The annotated assignment `y: Item` sits inside a `for` loop body, and a nested annotation still counts when the file is checked for annotations to resolve. `Item` resolves to the class defined above the loop, so **the annotation would survive eager evaluation and the `from __future__ import annotations` directive is removed**.
'''

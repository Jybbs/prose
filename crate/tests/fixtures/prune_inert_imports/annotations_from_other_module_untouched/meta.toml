[docs]
previewable = false
title       = "A Lookalike Import from Another Module Is Untouched"

description = '''
`from typing import annotations` imports a name that matches the future directive's, yet the module it comes from is `typing` rather than `__future__`. The removal applies **only to `from __future__ import annotations`**, and the imported name is read by `x = annotations` besides, so the line is untouched.
'''

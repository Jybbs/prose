[docs]
previewable = false
title       = "An Import Named `annotations` From Another Module Is Left Alone"

description = '''
`from typing import annotations` imports a name spelled the same as the future directive's, from `typing` rather than `__future__`, and `x = annotations` reads it. **The line is left as written**, because the directive branch matches only `from __future__ import annotations`, and the name is read besides.
'''

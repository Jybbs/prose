[docs]
previewable = true
title       = "An Aliased Directive Is Recognized Through the `as` Form"

description = '''
`from __future__ import annotations as legacy` enables the same `annotations` feature whatever local name the `as` clause binds. The body holds only `x = 1`, no annotation in sight, so **the rule recognizes the directive through the `as` form and deletes the line**.
'''

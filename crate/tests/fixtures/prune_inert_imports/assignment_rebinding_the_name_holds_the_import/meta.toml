[docs]
previewable = false
title       = "An Assignment That Rebinds the Name Keeps the First Import"

description = '''
`import os` appears twice and `os = None` rebinds the name below them. **The repeat is removed and the first `import os` stays**, because `os = None` is a write the rule leaves in place, and a name a surviving write rebinds keeps its first import.
'''

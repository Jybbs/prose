[docs]
previewable = false
title       = "An `async def` Return Annotation Is Read Too"

description = '''
`async def fetch() -> Result` carries a return annotation, and `Result` is the class defined above it. **The directive is removed**, because the rule reads the annotation on an `async def` the same as one on a plain `def`, and `Result` resolves to an unconditional module-scope binding written before it.
'''

[docs]
previewable = false
title       = "A Backslash on the Row Above Keeps an Unread Import"

description = '''
`import os` binds a name nothing reads, and a lone `\` sits on the row above it, joining the two physical rows into one logical line. **The import stays as written**, because removing its rows would leave the `\` joining onto whatever came next, and the file would no longer parse.
'''

[docs]
previewable = false
title       = "Resolved Annotations Remove the Directive on a 3.13 Target"

description = '''
`target-version = "3.13"` names a Python where annotations evaluate eagerly once the directive is gone, so the version branch does not run, and each annotation on `visit` names `Node`, the class defined above it. **The `from __future__ import annotations` line is removed**, because every annotated name resolves to an unconditional module-scope binding written before it and no annotation runs at module scope.
'''

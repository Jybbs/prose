previewable = false
title       = "Binding Resolution Removes the Directive on a 3.13 Target"

description = '''
The `target-version = "3.13"` config names a Python where annotations evaluate eagerly once the directive is gone, so removal is safe only when every annotation reference already resolves. Each annotation here names `Node`, defined above `visit`, so no `NameError` can appear and the `from __future__ import annotations` line goes.
'''

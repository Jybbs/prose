[docs]
previewable = false
title       = "A Class-Body Annotation Naming a Builtin Removes the Directive"

description = '''
The class-body annotations `x: int` and `y: int` name the builtin `int`, which no statement in the file writes. **The directive goes**, because a builtin the module never writes resolves under every target, so each annotation evaluates as it did.
'''

[docs]
previewable = false
title       = "A Conditionally Bound Name Keeps the Directive"

description = '''
`Bar` is imported only under `if TYPE_CHECKING:`, and `Alias` is assigned only inside a `sys.version_info` guard, so neither is bound unconditionally. **`from __future__ import annotations` stays**, because the annotations on `use` name both, and evaluating either eagerly on a runtime where its guard is false would raise `NameError`.
'''

previewable = false
title       = "A Dotted Alias Is Counted Under the Name It Binds"

description = '''
`import os.path as p` imports the module `os.path` and binds only `p`, and the body below it is `value = 1`. **Nothing reads `p`, so the line is removed**, because the rule counts references against the alias rather than against `os`.
'''

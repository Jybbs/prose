[docs]
previewable = false
title       = "A Dotted Import Is Not a Repeat of Its Root"

description = '''
`import os` and `import os.path` both bind the name `os`, and `os.path.join("a", "b")` reads it. **Both lines stay**, because a repeat matches on the path an import names as well as the name it binds, and `os` and `os.path` are different paths.
'''

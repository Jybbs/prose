[docs]
previewable = false
title       = "With `drop-duplicates` Off a Repeat Stays"

description = '''
`drop-duplicates = false` is set, `import os` appears twice, and `os.getcwd()` reads the name. **The second `import os` stays as written**, because the facet that removes a repeat is off, and `drop-unreferenced` still runs but has nothing to remove with `os` read.
'''

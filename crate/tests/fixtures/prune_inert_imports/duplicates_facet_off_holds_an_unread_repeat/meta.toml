[docs]
previewable = false
title       = "With `drop-duplicates` Off an Unread Repeat Keeps Both Lines"

description = '''
`drop-duplicates = false` is set, `import os` appears twice, and nothing reads `os`. **Both lines stay**, because with the repeat no longer a removal its second write still counts as a rebinding of `os`, and `drop-unreferenced` keeps a name a surviving write rebinds.
'''

[docs]
previewable = true
title       = "A `# fmt: off` Block Suppresses the Rewrite"

description = '''
The `from __future__ import annotations` line sits between `# fmt: off` and `# fmt: on`, so the edit that would remove it lands inside a suppressed span. The pipeline **drops any edit whose range overlaps a suppressed span**, so suppression is handled centrally rather than re-implemented in each rule.
'''

[docs]
previewable = false
title       = "A Trailing `# fmt: skip` Holds the Directive in Place"

description = '''
The file holds no annotations, so the `from __future__ import annotations` directive would normally be removed. The trailing `# fmt: skip` marks that line as suppressed, and the pipeline's central filter **drops the edit whose range overlaps the suppressed line**, leaving the import in place.
'''

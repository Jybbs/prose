[docs]
previewable = false
title       = "A Forward Reference to a Later Class Keeps the Directive"

description = '''
The annotations on `visit` name `Node`, and `class Node` is defined below the function. **`from __future__ import annotations` stays**, because `Node` does not resolve to a binding written before the annotation, and evaluating the annotations eagerly would raise `NameError` on the forward reference.
'''

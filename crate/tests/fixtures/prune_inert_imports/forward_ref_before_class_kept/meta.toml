[docs]
previewable = false
title       = "A Forward Reference Before Its Class Keeps the Directive"

description = '''
The annotations on `visit` name `Node` before the `class Node` definition appears at module scope. Evaluating them eagerly on Python 3.13 would raise `NameError` on the forward reference, so **the `from __future__ import annotations` directive stays** and the annotations remain deferred.
'''

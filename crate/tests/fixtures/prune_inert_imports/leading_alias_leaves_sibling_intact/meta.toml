title       = "The Import Removes Cleanly from a Mixed Import Block"

description = '''
`annotations` sits first in the two-name `from __future__ import annotations, division`, and the file holds no annotations that would justify it. **Only the `annotations` entry is removed**, taking the `,` after it along, leaving `from __future__ import division` as the surviving line.

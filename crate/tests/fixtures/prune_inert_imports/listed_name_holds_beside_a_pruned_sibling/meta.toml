[docs]
previewable = true
title       = "A Listed Name Holds While Its Sibling Prunes"

description = '''
Neither `dumps` nor `loads` is read inside the module, but `__all__ = ["dumps"]` marks `dumps` as a re-export. **The listed name holds its place on the import line while the unlisted `loads` is pruned off it**, leaving `from json import dumps`.
'''

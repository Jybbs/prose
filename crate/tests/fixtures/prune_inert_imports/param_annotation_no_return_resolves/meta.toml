[docs]
previewable = false
title       = "A Parameter Annotation Without a Return Annotation Is Read"

description = '''
`fetch` annotates its parameter as `target: Result` and declares no return annotation, and `Result` is the class defined above it. **The directive is removed**, because the rule reads the parameter annotation on its own, and `Result` resolves to an unconditional module-scope binding written before it.
'''

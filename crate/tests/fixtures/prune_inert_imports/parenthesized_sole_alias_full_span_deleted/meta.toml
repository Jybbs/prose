previewable = false
title       = "Parenthesized Sole Alias Deletes the Whole Statement"

description = '''
`annotations` is the only name inside the parenthesized `from __future__ import`, which spans three lines. **The deletion covers every line of the statement**, so removing `annotations` takes the parentheses with it rather than leaving an empty pair behind, and only `x = 1` remains.
'''

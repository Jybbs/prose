[docs]
previewable = false
title       = "A 3.14 Target Makes the Directive a No-Op"

description = '''
With `target-version = "3.14"` configured, PEP 749 makes annotation evaluation deferred by default. **`from __future__ import annotations` is dropped even though `add`'s parameters and return type carry annotations**, because the directive carries no runtime weight once 3.14 defers evaluation on its own.
'''

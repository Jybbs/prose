[docs]
previewable = true
title       = "A Quoted Annotation Holds the Import It Names"

description = '''
`List` is read nowhere in the module except inside the quoted annotation `"List[int]"`, which is a plain string literal that the ordinary reference count passes over. **The import holds** because `prune-inert-imports` parses every quoted annotation for the names it names, so `List` counts as read.
'''

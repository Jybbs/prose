previewable = true
title       = "A Rebound Name Holds Its First Import"

description = '''
The module imports `loads` from `_pyjson`, then a `try` block rebinds it from `_speedups`, so the module-scope binding for `loads` carries two writes. **The first import holds** because the `except ImportError: pass` branch leaves the original binding in place when the second import fails.
'''

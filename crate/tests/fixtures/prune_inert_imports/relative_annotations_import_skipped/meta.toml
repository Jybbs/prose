[docs]
previewable = false
title       = "A Relative Import Named `annotations` Is Left Alone"

description = '''
`from . import annotations` binds a name spelled `annotations` through a relative import from the current package, and `x = annotations` reads it. **The line is left as written**, because the directive branch matches only the absolute `from __future__ import annotations` form, and the name is read besides.
'''

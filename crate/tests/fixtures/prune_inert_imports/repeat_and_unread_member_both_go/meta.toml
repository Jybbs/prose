title       = "A Repeated Import and an Unread Member Both Go"

description = '''
The module imports `os` twice and imports `Any` alongside `Final` from `typing`, though only `os.getcwd()` and `Final` are read. **The second `import os` drops because it repeats a binding the first import already made, and `Any` drops off its line** for going unread, leaving the surviving `os` import and `Final` in place.
'''

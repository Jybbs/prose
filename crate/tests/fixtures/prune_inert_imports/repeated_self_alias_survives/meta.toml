previewable = false
title       = "A Repeated Self-Alias Survives the Duplicate Prune"

description = '''
Both lines read `from json import loads as loads`, the PEP 484 redundant-alias form that marks `loads` as a re-export. **The second line survives rather than dropping as a repeat**, because `drop-duplicates` reads the same re-export guard `drop-unreferenced` does.
'''

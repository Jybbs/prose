[docs]
previewable = false
title       = "A Repeated Self-Alias Keeps Both Lines"

description = '''
`from json import loads as loads` appears twice, the PEP 484 redundant-alias form that marks `loads` as a re-export, and nothing reads the name. **Both lines stay**, because `drop-duplicates` reads the same re-export markers `drop-unreferenced` does.
'''

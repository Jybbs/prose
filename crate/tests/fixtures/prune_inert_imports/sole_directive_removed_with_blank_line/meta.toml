title       = "A Sole Directive Is Removed With the Blank Line Below It"

description = '''
Neither `x = 1` nor `main` carries an annotation, so `from __future__ import annotations` defers nothing. **The import line and the blank line below it are both removed**, because the rule clears the blank lines beneath a statement that opens the module, leaving `x = 1` as the file's first line.
'''

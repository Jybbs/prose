title       = "A Sole Directive Is Removed and Its Blank Line Stays"

description = '''
Neither `x = 1` nor `main` carries an annotation, so `from __future__ import annotations` defers nothing. **The import line is removed and the blank line below it stays as the file's first line**, because the rule removes the statement's own rows and nothing else.
'''

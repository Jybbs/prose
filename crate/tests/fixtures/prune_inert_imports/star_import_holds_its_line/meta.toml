[docs]
previewable = true
title       = "A Star Import Keeps Its Line"

description = '''
`from os.path import *` binds a set of names the rule cannot enumerate, and the module writes an empty `__all__`, so nothing but the star itself holds the line. **The import stays and nothing is reported**, because the rule cannot count references to names it cannot enumerate, so it never removes or reports a star import.
'''

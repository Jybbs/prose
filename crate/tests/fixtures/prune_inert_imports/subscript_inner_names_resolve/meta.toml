[docs]
previewable = false
title       = "Both Names in a Subscripted Annotation Are Read"

description = '''
`x: Container[Item]` is a subscripted annotation at module scope, and both `Container` and `Item` are classes defined above it. **The rule reads both names, `Item` inside the brackets as well as `Container` outside them**, and the directive still stays, because the annotation runs at module scope and the directive stores it in the module's `__annotations__` as the string `'Container[Item]'` rather than the evaluated subscript.
'''

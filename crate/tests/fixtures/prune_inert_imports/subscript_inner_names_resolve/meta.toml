[docs]
previewable = false
title       = "Subscripted Generic Inner Names Resolve"

description = '''
`x: Container[Item]` is a subscripted annotation, so **both names inside it are read**, `Container` as well as `Item`, rather than the outer one alone.

Each is defined by a `class` written above the annotation, so evaluating it eagerly would resolve. The directive is still kept, because the annotation runs at module scope and reaches `__annotations__` only while it stands.
'''

[docs]
previewable = false
title       = "An Optional Import Keeps the Directive"

description = '''
`Bar` is imported inside a `try` block whose `except ImportError: pass` leaves the name unbound whenever the import fails, so `value: Bar` never resolves to an unconditional binding written before it. **The directive stays** because evaluating that annotation eagerly, without a `target-version` deferring it, could raise `NameError` when the import fails.
'''

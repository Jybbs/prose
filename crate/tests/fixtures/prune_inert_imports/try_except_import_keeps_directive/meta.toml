[docs]
previewable = false
title       = "An Import Inside `try` Keeps the Directive"

description = '''
`Bar` is imported inside a `try` block whose `except ImportError: pass` leaves the name unbound when the import fails, and `use` annotates a parameter as `value: Bar`. **The directive stays**, because `Bar` never resolves to an unconditional binding written before the annotation, and evaluating it eagerly could raise `NameError`.
'''

[docs]
previewable = false
title       = "Two `__future__` Lines Are Read One at a Time"

description = '''
`from __future__ import annotations` and `from __future__ import division` sit on two lines, and the file carries no annotation. **The `annotations` line is removed and the `division` line stays**, because each import statement is read on its own and only the `annotations` feature is ever removed.
'''

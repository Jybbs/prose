[docs]
previewable = false
title       = "An `__all__` Built From a Call Keeps Every Import"

description = '''
`__all__ = build_exports()` builds the export list from a call rather than a literal list or tuple of strings, and nothing reads `dumps` or `loads`. **Both imports stay and nothing is reported**, because the rule reads an `__all__` only when it is a literal list or tuple of strings, and one it cannot read keeps every import in the module.
'''

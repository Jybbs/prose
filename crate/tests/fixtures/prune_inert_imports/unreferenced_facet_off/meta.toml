[docs]
previewable = false
title       = "With `drop-unreferenced` Off an Unread Member Stays"

description = '''
`drop-unreferenced = false` is set, and `label: Final = "x"` reads `Final` whereas nothing reads `Any`. **`Any` stays on the line**, because turning the facet off disables the removal, along with the report a package `__init__.py` would make in its place.
'''

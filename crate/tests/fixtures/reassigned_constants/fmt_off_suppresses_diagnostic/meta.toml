[docs]
previewable = true
title       = "A `# fmt: off` Block Suppresses the Lint"

description = '''
`RETRIES` is reassigned from `3` to `5` inside a `# fmt: off` … `# fmt: on` block. **No diagnostic is emitted**, because a block marker suppresses lint diagnostics the same way it suppresses rewrites, unlike a line-level `# prose: skip` which reaches only rewrites.
'''

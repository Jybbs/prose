title       = "Function-Local Constants Fall Outside Module Scope"

description = '''
`PI` is assigned inside `compute`'s body, a function-local binding rather than a module-level one. **The rule leaves it alone**, `reassigned-constants` weighing only module-level `SCREAMING_CASE` assignments and stopping at `def` and `class` boundaries by design.
'''

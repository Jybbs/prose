[docs]
previewable = false
title       = "A `NewType` Binding Is Not Reported"

description = '''
`UserId = NewType("UserId", int)` binds a `PascalCase` name to a `NewType` call. **No diagnostic is reported**, because the name falls outside the `SCREAMING_CASE` pattern, and a `NewType` binding declares a type rather than storing a value, a typing construct the rule exempts.
'''

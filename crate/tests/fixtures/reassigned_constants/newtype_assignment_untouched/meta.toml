[docs]
previewable = false
title       = "NewType Bindings Pass Through Untouched"

description = '''
`UserId = NewType("UserId", int)` binds a `PascalCase` name rather than the `SCREAMING_CASE` shape the rule targets. A `NewType` binding is also **structural by definition**, declaring a type rather than storing a value, so it passes through without a diagnostic.
'''

[docs]
previewable = false
title       = "A `ParamSpec` Binding Is Not Reported"

description = '''
`P = ParamSpec("P")` binds a single uppercase letter, a name inside the `SCREAMING_CASE` pattern, to a `ParamSpec` call. **No diagnostic is reported**, because a `ParamSpec` binding declares a parameter specification rather than storing a value, a typing construct the rule exempts, and the name is written only once besides.
'''

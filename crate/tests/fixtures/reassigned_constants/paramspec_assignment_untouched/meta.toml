[docs]
previewable = false
title       = "ParamSpec Bindings Pass Through Untouched"

description = '''
`P = ParamSpec("P")` binds a single-letter type-parameter name rather than the `SCREAMING_CASE` shape the rule targets. A `ParamSpec` binding is also **structural by definition**, declaring a parameter specification rather than storing a value, so the rule emits no diagnostic.
'''

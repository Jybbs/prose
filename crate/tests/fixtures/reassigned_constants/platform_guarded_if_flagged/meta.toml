[docs]
previewable = false
title       = "A Write Inside a Top-Level `if` Counts as a Module-Scope Write"

description = '''
`DEFAULT_BACKEND = "memory"` is assigned at module level and assigned again inside `if sys.platform == "win32":`. **Both lines are reported**, because the body of a top-level `if` still runs at module scope, so the rule reads through `if`, `for`, and `try` bodies and counts the write inside the guard.
'''

[docs]
previewable = false
title       = "A Trailing `# prose: ignore` Directive Drops the Diagnostic"

description = '''
`RETRIES = 3` ends in `# prose: ignore[reassigned-constants]`, and `RETRIES += 1` marks the name reassigned. **No diagnostic is reported**, because the directive drops the finding on its line through the per-line suppression filter, leaving nothing for the run to report.
'''

[docs]
previewable = false
title       = "A Trailing prose: ignore Directive Drops the Diagnostic"

description = '''
`RETRIES += 1` marks `RETRIES` as reassigned, so the initial `RETRIES = 3` write would be flagged. The trailing `# prose: ignore[reassigned-constants]` directive on that line **drops the diagnostic** through the per-line suppression filter, leaving nothing reported.
'''

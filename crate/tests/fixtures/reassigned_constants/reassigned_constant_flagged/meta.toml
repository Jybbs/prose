title       = "Reassigned SCREAMING_CASE Constant Draws the Diagnostic"

description = '''
`RETRIES = 3` followed by `RETRIES = 5` reassigns a `SCREAMING_CASE` name at module scope, breaking the write-once contract the casing announces. **Each write line is flagged**, whereas a constant written exactly once stays silent.
'''

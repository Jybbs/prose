[docs]
previewable = false
title       = "A Write Under `if TYPE_CHECKING` Is Not Reported"

description = '''
`DEFAULT_BACKEND = "memory"` is assigned inside `if TYPE_CHECKING:`, a block that runs under a type checker and never at runtime. **No diagnostic is reported**, because a binding there belongs to the type system rather than to runtime configuration, so the rule skips the whole block.
'''

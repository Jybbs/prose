description = '''
Nothing here is flagged. `DEFAULT_BACKEND` is assigned inside `if TYPE_CHECKING:`, a block that runs under a type checker and never at runtime.

A binding there is **type-system-only rather than a runtime constant**, so the block is skipped entirely and the write is left alone.

[docs]
previewable = false
title       = "A `TypeVar` Binding Is Not Reported"

description = '''
`T = TypeVar("T")` binds an all-uppercase name to a `TypeVar` call, a name that matches the `SCREAMING_CASE` pattern. **No diagnostic is reported**, because a `TypeVar` binding declares a type variable rather than storing a value, a typing construct the rule exempts.
'''

[docs]
previewable = true
title       = "A Reassigned TypeVar Is Spared"

description = '''
`T` is written twice at module scope, first as `TypeVar("T")` and again as `TypeVar("T", bound=int)`, so the reassignment count alone would flag it. Each write binds a `TypeVar` call, the structural shape the carve-out exempts, so the rule reports nothing.
'''

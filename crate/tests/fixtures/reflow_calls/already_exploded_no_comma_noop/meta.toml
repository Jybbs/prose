title       = "An Exploded Call Without a Trailing Comma Passes Through Unchanged"

description = '''
The `fetch` call arrives already exploded, one keyword argument per line from `headers=h` to `url=u`, with no comma after the last. **The rule emits no edit**, because that layout is exactly the one the explode writes, so the call comes through unchanged.
'''

[docs]
previewable = false
title       = "An Already Parenthesized Value Takes No Second Pair"

description = '''
`bundle((row for row in rows), (seen := 1), start, rows)` passes a parenthesized generator and a parenthesized `:=` expression as positionals to a function defined above it. **The exploded rows read `entries=(row for row in rows)` and `marker=(seen := 1)` with the source's single pair of parentheses kept**, because a generator expression and a `:=` expression each need parentheses as a keyword value, and the pair each one arrives with already satisfies that, so the rewrite wraps no second pair around it.
'''

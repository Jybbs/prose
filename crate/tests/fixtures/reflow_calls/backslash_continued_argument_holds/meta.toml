[docs]
previewable = true
title       = "A Backslash-Continued Argument Keeps Its Break"

description = '''
A backslash continues the row inside the call's argument, and a backslash is a line break rather than a token.

Closing the row behind it would strand the backslash in front of a space and **the text would stop parsing**. The argument therefore keeps its break, leaving the backslash itself to `shed-backslash-continuations`, which runs ahead of this rule in the default pipeline.
'''

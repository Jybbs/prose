[docs]
previewable = false
title       = "A Closer Row Follows the Outermost Bracket It Closes"

description = '''
The `.get` call opens on a row that closes both the tuple and the dict around it, so several candidate rows could set the indent its exploded arguments hang from.

They hang from **the row the dict's `{` sits on**, which is the outermost bracket that row closes. The balanced `bar(1)` pair ahead of the tuple is stepped over, since a pair opening and closing on the same row sets no indent of its own.
'''

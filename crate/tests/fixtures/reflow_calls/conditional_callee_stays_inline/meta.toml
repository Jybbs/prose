[docs]
previewable = false
title       = "A Conditional Callee Keeps Its Trailing Link Inline"

description = '''
The callee is a parenthesized conditional choosing `alpha_fn` or `beta_fn` on `check_fn`'s result, with `.method(aa, bb)` following the closing parenthesis, under `code-line-length = 30`. **All three inner calls explode and `.method(aa, bb)` stays inline**, because the trailing link is measured from the `))` row the explode writes, where it fits.
'''

title       = "A Doubly Nested Break Is Measured Joined Throughout"

description = '''
`inner_helper` arrives broken across two rows, inside an `outer_helper` call that is itself broken inside `TypeError`. **`TypeError` and `outer_helper` explode and `inner_helper(alpha_value_name, beta_value_name)` rejoins onto one row**, because measuring any one level first joins every break nested beneath it, so each span is read at the width it settles to rather than the width the source shows, and only the innermost call is narrow enough to rejoin.
'''

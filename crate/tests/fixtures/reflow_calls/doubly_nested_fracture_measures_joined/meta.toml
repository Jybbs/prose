title       = "A Doubly Nested Fracture Measures Joined Throughout"

description = '''
`inner_helper` arrives fractured across two lines, inside an `outer_helper` call that is itself fractured inside `TypeError`.

Measuring any one level **joins every fracture nested underneath it first**, so each span is read at the width it would settle to rather than the width the source happens to show. `TypeError` and `outer_helper` are both too wide once measured that way and explode, while `inner_helper(alpha_value_name, beta_value_name)` proves narrow enough to rejoin onto one line.
'''

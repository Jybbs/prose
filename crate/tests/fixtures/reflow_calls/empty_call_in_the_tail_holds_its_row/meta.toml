[docs]
previewable = false
title       = "An Empty Call in the Tail Leaves the Earlier Call to Explode"

description = '''
`getattr(formatter_instance, "encoding", None)` opens a 92-column row whose tail calls `BytesIO()` and `StringIO()`, neither carrying an argument. **`getattr` explodes one argument per row**, because an empty argument list has nothing to lay out and never breaks, so the whole tail counts against the call's row.
'''

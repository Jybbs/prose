[docs]
canonical   = true
previewable = true
title       = "Explode a Call Above the Argument Threshold"

description = '''
`connect(h, p, t, u)` passes four positionals, which is past the threshold, and `connect` is defined in the same module so its signature can be read.

The call explodes to one argument per line, and **each positional gains its parameter name** from that resolved signature, so the rows read `host=h` through `user=u`. The closing `)` drops to the indent of the row the call starts on.
'''

[docs]
previewable = true
title       = "A Final Row Comment Closes the Tail"

description = '''
The trailing comment sits on the module's very last row, with no line terminator after it.

**That closes the tail measure exactly as a comment on any other row would**, so the comment's own width never counts toward whether the call ahead of it may rejoin. The call joins onto one line and the comment follows it, even though the finished row runs past the 57-column budget.
'''

[docs]
previewable = false
title       = "Resolve a Callee Defined Below the Call"

description = '''
`parse_str` calls `ints_to_rgba` before that function's `def` appears in the file.

**Signature resolution reads the module's completed bindings rather than only the lines above the call**, so the signature is available anyway. The four-positional call explodes with each argument named, from `red_channel=red_channel` through `alpha_channel=alpha_channel`, without waiting for a reorder to move the definition up.
'''

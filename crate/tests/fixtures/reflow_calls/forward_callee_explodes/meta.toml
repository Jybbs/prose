[docs]
previewable = false
title       = "A Callee Defined Below the Call Still Resolves"

description = '''
`parse_str` calls `ints_to_rgba` with four positionals before that function's `def` appears in the file. **The call explodes with each argument named, from `red_channel=red_channel` through `alpha_channel=alpha_channel`**, because signature resolution reads the module's completed bindings rather than only the rows above the call, so the definition need not move up first.
'''

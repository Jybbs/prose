title       = "A Fractured Call Whose Joined Row Overflows Explodes"

description = '''
The fractured `ValueError` call is measured as though it had been rejoined, and that measure counts both the column the call starts at and the `from underlying_cause_error` trailing it.

The joined row would overflow the budget, so **the call explodes to one argument per line** rather than keeping the break the author wrote. The `from` clause follows the closing `)`.

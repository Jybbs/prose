title       = "A Broken Call Whose Joined Row Overflows Explodes"

description = '''
The `ValueError` call arrives broken across two rows with `from underlying_cause_error` trailing its `)`. **The call explodes to one argument per line and the `from` clause follows the closing `)`**, because the rejoin is measured across the whole row, counting the column the call starts at and the `from` clause after it, and that joined row would overflow the budget.
'''

title       = "A Fractured Argument List Rejoins"

description = '''
`helper(alpha, beta, gamma)` and `session.record(first, second)` arrive broken across lines, each continuation aligned to the callee's `(` rather than opening a flush column. Both joined forms fit inside the line limit, so each fracture rejoins onto one row, leaving the reader a single line instead of a hanging indent.
'''

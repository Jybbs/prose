title       = "A Rejoin Landing One Column Over Budget Explodes"

description = '''
Whether `helper(alpha, beta)` may rejoin depends on the full row a join would produce, counting the `+` and the long operand trailing the closing `)`.

That joined row would land **exactly one column past the budget**, so the call explodes rather than joining, and the operand follows the `)` on the closing row.
'''

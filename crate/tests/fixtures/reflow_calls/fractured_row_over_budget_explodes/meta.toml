title       = "A Rejoin Ending One Column Over Budget Explodes"

description = '''
`helper(alpha, beta)` arrives broken across two rows with `+` and a long operand trailing its `)`. **The call explodes rather than rejoining, and the operand follows the `)` on the closing row**, because the rejoin is measured across the full row a join would produce, counting the `+` and the operand, and that row would end exactly one column past the budget.
'''

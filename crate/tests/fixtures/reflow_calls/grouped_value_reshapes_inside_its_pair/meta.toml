[docs]
previewable = false
title       = "A Grouped Value Reshapes Inside Its Pair"

description = '''
`collect(transform(alpha, beta, gamma) for alpha in rows)` passes a bare generator to a `collect` defined above it, under `code-line-length = 40`. **The generator gains its parameter name `entries=` and a pair of parentheses, and the `transform` call inside it explodes within that pair**, because a named generator argument must sit in parentheses and the new pair wraps the exploded form rather than the one-line form it enclosed.
'''

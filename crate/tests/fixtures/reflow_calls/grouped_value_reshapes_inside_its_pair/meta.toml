[docs]
previewable = false
title       = "A Grouped Value Reshapes Inside Its Pair"

description = '''
The bare generator passed to `collect` gains its parameter's name, `entries=`, and a named generator argument must sit in parentheses. The `transform` call inside it explodes in the same pass, so the new parentheses wrap the exploded form rather than preserving the one-line shape they enclosed.
'''

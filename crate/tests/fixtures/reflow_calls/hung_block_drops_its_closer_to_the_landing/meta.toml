[docs]
previewable = false
title       = "A Hung Block Drops Its Closing Bracket to the Argument Indent"

description = '''
`report_invalid_enum_member_names` takes one argument, a `%` format expression whose first row leaves a `(` open while the `", ".join(...)` row already sits one step inside it. **The call explodes, the argument moves onto its own row, and the hung group's closing `)` drops to the indent the argument starts at**, leaving the interior `join` row where it sits.
'''

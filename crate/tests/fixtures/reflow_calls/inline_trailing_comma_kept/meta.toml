[docs]
canonical   = false
previewable = false
title       = "An Inline Trailing Comma Carries Through the Explode"

description = '''
`render(alpha=1, beta=2, gamma=3, delta=4,)` ends with a trailing comma after `delta=4`, and its four keywords pass `max-args`. **The explode lays out one argument per line and keeps the comma unchanged**, because adding or dropping a trailing comma belongs to `strip-trailing-commas`.
'''

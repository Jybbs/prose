title       = "An Exploded Comprehension Value Re-Indents to the Keyword Column"

description = '''
`configure` explodes to one keyword per line, and `picks=` carries a multi-line list comprehension.

That block is **re-indented to the keyword column**, exactly as a dict or list value would be. The `for value in source` and `if value` rows land one step past `picks=[`, and the `]` closes back at the keyword column, rather than the block being spliced in at whatever indentation the source gave it.
'''

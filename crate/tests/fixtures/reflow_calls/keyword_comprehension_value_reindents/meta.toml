title       = "An Exploded Comprehension Value Re-Indents to the Keyword Column"

description = '''
`configure` passes `name`, `other`, `more`, and a `picks=` list comprehension written across several rows. **`configure` explodes to one keyword per line and the comprehension re-indents to the keyword column**, exactly as a dict or list value does, so the `for value in source` and `if value` rows sit one step past `picks=[` and the `]` closes at the keyword column rather than the block being spliced in at the indentation the source gave it.
'''

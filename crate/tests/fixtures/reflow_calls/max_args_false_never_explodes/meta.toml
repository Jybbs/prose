canonical   = false
previewable = false
title       = "Setting `max-args` to `false` Disables the Explode"

description = '''
The four-keyword `fetch` call would explode under the default cap, but `max-args = false` turns the count trigger off. The line also fits inside the default `code-line-length`, so with neither trigger firing the call keeps its one-line shape.
'''

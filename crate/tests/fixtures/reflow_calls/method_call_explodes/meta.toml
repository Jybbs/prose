title       = "Explode a Keyword Method Call"

description = '''
`client.request` is a method call, so no signature in this module resolves for it. Its four arguments already name their parameters, `headers=h` through `url=u`, so the call explodes to one keyword per line exactly as a free function's would, with no signature lookup needed.

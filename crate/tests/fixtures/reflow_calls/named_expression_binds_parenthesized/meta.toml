[docs]
previewable = false
title       = "A Named Expression Argument Takes a Grouping Pair"

description = '''
`window(seen := len(rows), page_size, start, rows)` passes a bare walrus as its first positional to a `window` defined above it. **The explode names each positional from the resolved signature and wraps the walrus as `anchor=(seen := len(rows))`**, keeping the binding intact, because a bare walrus cannot follow the `=` of a keyword argument, whereas `count`, `offset`, and `source` bind plainly.
'''

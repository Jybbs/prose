title       = "A Nested Call's Generator Takes Its Own Grouping Pair"

description = '''
`outer(inner(row for row in rows if row.enabled))` passes a bare generator to `inner`, both functions defined above, under `code-line-length = 40`. **`outer` and `inner` both explode, each argument gains its parameter name, and the generator becomes `beta=(row for row in rows if row.enabled)` with its own pair of parentheses**, because the row overflows the budget and a named generator argument must sit in parentheses.
'''

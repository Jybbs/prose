[docs]
previewable = true
title       = "A Nested Call Answers the Column It Lands At"

description = '''
The `configure` call overflows the 56-column budget, so it explodes to one keyword per line.

The nested `fn(1)` is measured **at the column it lands at inside the exploded row**, not at the column it occupied in the source. `gamma=fn(1)` sits well inside the budget there, so the short call stays inline.
'''

[docs]
previewable = true
title       = "An Exploded Closing Bracket Drops to the Row Its `(` Sits On"

description = '''
The `format` call's `(` sits on the second row of the concatenated string, one row below where the statement opened. Exploding the call works against that row, so `alpha` through `zeta` hang one step inside its indent and the `)` drops back to that row's own indent rather than to the row the statement opened on.
'''

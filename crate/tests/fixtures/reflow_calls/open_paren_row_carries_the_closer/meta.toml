[docs]
previewable = true
title       = "An Exploded Closing Bracket Drops to the Row Its `(` Sits On"

description = '''
The `format` call's `(` sits on the second row of the concatenated string, one row below where the statement opened.

Exploding the call works against **that row**, not against the statement's own. `alpha` through `zeta` hang one indent step inside it, and the closing `)` drops back to that row's indent rather than to the column the statement started at.
'''

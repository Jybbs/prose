title       = "The Explode Keeps Argument Order"

description = '''
`draw(w, h, d, c)` passes four positionals to a `draw` defined above it with the parameters `width`, `height`, `depth`, and `color`. **The arguments explode to one per line in signature order, `width=w` then `height=h` then `depth=d` then `color=c`**, because the rule writes arguments in the order it receives them, leaving alphabetization to `alphabetize-siblings`, which runs after it.
'''

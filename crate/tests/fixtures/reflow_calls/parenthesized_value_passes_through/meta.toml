title       = "A Parenthesized Value Passes Through Whole"

description = '''
The `emit` call overflows the cap and explodes to one keyword per line, and `gamma`'s value keeps the grouping parentheses it arrived in, the pair passing through outside whatever reshape the value takes. The full pipeline sheds a redundant pair like this one before this rule runs, so the wrapped form is only visible when the rule runs in isolation.

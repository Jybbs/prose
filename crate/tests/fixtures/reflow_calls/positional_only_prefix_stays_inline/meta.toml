title       = "A Positional-Only Prefix Blocks the Explode"

description = '''
`render(d, h, w, c)` calls a `render` that declares `data` positional-only through the `/` marker, so `d` can never be written `data=d`. **The four-argument call stays inline unchanged**, whatever its argument count, because an argument that cannot take keyword form blocks the count trigger.
'''

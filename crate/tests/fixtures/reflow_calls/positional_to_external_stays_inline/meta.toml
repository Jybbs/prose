title       = "A Positional Call to an Unresolved Callee Stays Inline"

description = '''
`compute(alpha, beta, gamma, delta)` calls a `compute` that resolves to no function defined in this module, so no signature names `alpha` through `delta`. **The four-positional call stays inline exactly as written**, because the count trigger fires only where every argument can be written as a keyword, and the row fits inside the budget.
'''

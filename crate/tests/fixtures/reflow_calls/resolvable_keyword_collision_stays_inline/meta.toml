[docs]
previewable = false
title       = "A Call Binding One Name Twice Stays Inline"

description = '''
`f(width, height, depth, c, color=1)` binds its fourth positional `c` to `f`'s `color` parameter, the same parameter the trailing `color=1` keyword already names. **The call stays inline as written**, because the keyword form would write `color=` twice.
'''

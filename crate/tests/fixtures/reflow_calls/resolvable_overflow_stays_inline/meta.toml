[docs]
previewable = false
title       = "A Call Overflowing the Named Parameters Stays Inline"

description = '''
`f` names only `b` and `a` before its `*rest`, so of the five positionals passed, `three` through `five` land in `*rest` and can never take keyword form. Rather than exploding a list where only the first two arguments would carry names, the rule leaves the call inline.
'''

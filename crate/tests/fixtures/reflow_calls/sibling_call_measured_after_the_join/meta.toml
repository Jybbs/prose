previewable = false
title       = "A Sibling Call Is Measured on the Row Its Neighbor's Join Leaves"

description = '''
The `group` call arrives broken across two rows with `+ maybe(Exponent)` trailing its `)`, under `code-line-length = 100`. **`group` rejoins onto one row and `maybe` explodes**, because joining the first call pulls `maybe` up onto the same row, and the width check then reads `maybe` at the column that join puts it at rather than the column it occupied in the source, where it crosses the budget.
'''

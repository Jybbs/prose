previewable = false
title       = "The Same Call Explodes With No Star Import in Scope"

description = '''
`bisect_left(data, target, low, high)` calls the `def` above it in a module with no `from x import *`. **The four positionals bind to `a`, `x`, `lo`, and `hi` and the call explodes to keyword form**, because the lookup resolves that `def` with nothing able to rebind it, so the star-import guard blocks the rewrite only when a star import is present.
'''

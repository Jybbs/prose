title       = "Star Unpacking Blocks the Explode"

description = '''
`send(*parts, extra, more, last)` unpacks an unknown number of arguments into `send` ahead of three positionals. **The call stays inline exactly as written**, because there is no way to tell which of `body` through `wrap` the trailing `extra`, `more`, and `last` bind to, and the unpacking itself can never take a `name=` form, so the count trigger passes the call over.
'''

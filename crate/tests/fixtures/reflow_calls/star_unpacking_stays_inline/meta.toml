title       = "Star Unpacking Blocks the Explode"

description = '''
Nothing here moves. `*parts` unpacks an unknown number of arguments into `send`, so there is no way to tell which of `body` through `wrap` the trailing `extra`, `more`, and `last` bind to.

The unpacking itself can never take a `name=` form either, so **the reshape is blocked entirely** and the call stays inline exactly as written.
'''

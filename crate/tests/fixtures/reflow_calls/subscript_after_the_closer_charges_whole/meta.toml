[docs]
previewable = true
title       = "A Subscript After the Closer Counts at Its Full Width"

description = '''
A subscript trailing the call on its row can never be broken across lines, so **its whole `[0]` counts toward the joined row**.

A breakable bracket would have contributed only its single opening column. Because the index counts in full here, a join that would fit only by ignoring it is rejected, and the call stays fractured.
'''

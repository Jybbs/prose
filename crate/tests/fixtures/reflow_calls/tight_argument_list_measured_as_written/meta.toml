previewable = false
title       = "A Single-Row Argument List Is Measured as the Author Spaced It"

description = '''
`Star(1000000, Vec(0,0), Vec(0,-2.5), gs, "circle")` sits on one row that fits `code-line-length = 60` exactly as written, its inner `Vec(0,0)` calls carrying no space after their commas. **Nothing moves and the `Vec` calls keep their spacing**, because the width check reads the width the row has as written rather than a normalized one-row form, so it counts no columns a rewrite would never add.
'''

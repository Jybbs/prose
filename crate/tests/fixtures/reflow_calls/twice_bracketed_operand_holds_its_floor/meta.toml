[docs]
previewable = false
title       = "An Operand Closing and Reopening a Bracket Moves as a Unit"

description = '''
`emit` passes `alpha_value`, `beta_value`, an operand `compute_the_first(...) + compute_the_second(...)` spanning rows whose `) + compute_the_second(` row closes one bracket and opens the next, and `delta_value`. **`emit` explodes and the operand moves as a unit, its shallowest row at the item column and every other row keeping the offset the source gave it above that row**, because the operand changes bracket depth in the middle of the block in a way no per-row re-indent can follow.
'''

title       = "A Two-Row Generator Argument Rejoins Whole"

description = '''
The `set` call arrives fractured, and its bare generator argument wraps across two rows as well, with the `if` clause hanging below `f for f in fs`.

The rejoin emits the argument list's one-row form, and that row fits, so **the generator's own interior break folds into the same edit**. A single pass closes both breaks rather than leaving the inner one for a later one.

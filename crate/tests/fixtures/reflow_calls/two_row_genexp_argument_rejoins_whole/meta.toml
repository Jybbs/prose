title       = "A Two-Row Generator Argument Rejoins Whole"

description = '''
The `set` call arrives broken, and its bare generator argument wraps across two rows as well, with the `if` clause below `f for f in fs`. **Both breaks close in one edit, so the whole statement sits on one row**, because the rejoin writes the argument list's one-row form, that row fits, and the generator's own interior break folds into the same edit rather than being left for a later pass.

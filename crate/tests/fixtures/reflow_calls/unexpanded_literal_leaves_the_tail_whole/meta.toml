[docs]
previewable = false
title       = "A List No Rule Expands Leaves the Whole Tail on the Call's Row"

description = '''
`helper(alpha, beta)` arrives broken across two rows with `+ [gamma_value, ...]` trailing its `)`, and `reflow-collections` is not running to expand that list. **The call explodes one argument per row**, because with nothing to expand the list, its `[` never ends the row, so the whole list counts against the rejoined row, which reaches 94 columns.
'''

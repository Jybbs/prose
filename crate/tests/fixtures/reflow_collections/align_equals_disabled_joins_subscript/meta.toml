[docs]
previewable = false
title       = "An Assigned Subscript Joins Without a Reserved Column"

description = '''
With `align-equals` set to `false`, `reflow-collections` reserves no shifted `=` column, so the `registry` subscript assigned to `HEADER_VALIDATORS` measures against its literal `=` position and **rejoins onto one line**. With alignment on, the `=` would shift out to the column `_VALID_HEADER_VALUE_RE_BYTE` sets, pushing the same rejoin past the budget and leaving the break standing.
'''

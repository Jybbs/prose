[docs]
previewable = false
title       = "An Assigned Subscript Rejoins When No `=` Column Is Reserved"

description = '''
`align-equals = false` is set, and the `registry[...]` subscript assigned to `HEADER_VALIDATORS` is broken across three rows below `_VALID_HEADER_VALUE_RE_BYTE = 1`. **The subscript rejoins onto one line**, measured from the `=` as written because no `=` column is reserved. With alignment on it rejoins the same way, because `align-equals` leaves the joined row unpadded rather than pad it past the budget to the column `_VALID_HEADER_VALUE_RE_BYTE` sets.
'''

[docs]
previewable = false
title       = "With `max-atomics` Off a Row Packs by Width Alone"

description = '''
`max-atomics = false` is set, and `many_atomics` lists twenty-four integers on a line past the budget. **The list expands and packs twelve integers on each of two rows**, because with the count cap off the width is the only limit on a row, whereas the default cap would have split the integers across more rows.
'''

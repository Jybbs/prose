[docs]
previewable = false
title       = "An Entry's Own Parentheses Survive the Expansion"

description = '''
The over-wide `precedence` list expands one entry per line, and the already-broken `short_precedence` is left as written, with every entry written as a parenthesized operand raised to a power. **Each entry keeps its parentheses, through the expansion and through the untouched literal alike**, because writing `(-a) ** 2` as `-a ** 2` would parse as `-(a ** 2)` and change the sign.
'''

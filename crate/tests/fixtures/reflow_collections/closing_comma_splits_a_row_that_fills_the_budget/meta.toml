[docs]
previewable = true
title       = "A Row That Fills the Budget Splits on Its Closing Comma"

description = '''
`queued_record_ids` and `pending_batch_key` would share a row at exactly the 40-column budget, so at a glance they look like they should pack together.

They do not, because `resolve(key)` is a call and lands on a line of its own, which means the row above it has to close with a comma. **That comma counts toward the budget** and takes the row to 41 columns, so all three items end up one per line.
'''

previewable = false
title       = "An `async for` Comprehension With a Filter Rejoins"

description = '''
`collect` returns a list comprehension broken across three rows, with an `async for` clause and an `if item.ready` filter. **The comprehension rejoins onto one line as `[item.value async for item in source if item.ready]`**, because the joined form fits, and both the `async` keyword and the filter are written through unchanged.
'''

previewable = false
title       = "A Multi-Line String Inside a Comprehension Keeps Its Breaks"

description = '''
Each element of `banners` is a triple-quoted string whose text spans rows, and the `for title in section_titles` clause sits on a row of its own. **The comprehension is left as written**, because joining its rows would move text inside the string and change the string's value.
'''

[docs]
previewable = false
title       = "A Comprehension Too Wide to Rejoin Keeps Its Breaks"

description = '''
The `filtered` comprehension is broken across its `for` and `if` rows, and its joined form would run past the budget. **It is left as written**, because the rule only ever rejoins a comprehension and never expands one, so a comprehension that does not fit keeps the breaks its author gave it.
'''

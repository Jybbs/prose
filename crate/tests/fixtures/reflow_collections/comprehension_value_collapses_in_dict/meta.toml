previewable = false
title       = "A Comprehension Value Rejoins While Its Dict Stays Expanded"

description = '''
The `buckets` dict is written one entry per line, and the value under `"kappa"` is a comprehension broken across rows. **The comprehension rejoins onto its entry's row as `[item for item in kappa_source]` and the dict keeps its one-entry-per-line layout**, because the joined comprehension fits and the dict is a column the rule keeps, with the trailing `,` after the last entry dropped as the canonical layout is written.
'''

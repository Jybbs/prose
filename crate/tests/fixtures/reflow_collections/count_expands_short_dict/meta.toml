[docs]
previewable = true
title       = "Dicts Past the Entry-Count Cap Expand Whatever Their Width"

description = '''
The four-entry `over_threshold` dict carries more entries than `max-dict-entries`, so it breaks to one entry per line even though it fits the width budget. The three-entry `under_threshold` sits at or under the cap and stays inline, and `already_expanded`, past the cap and already broken, keeps its expanded shape.
'''

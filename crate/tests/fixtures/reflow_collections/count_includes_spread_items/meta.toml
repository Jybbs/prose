[docs]
previewable = false
title       = "A `**` Spread Counts as a Dict Entry"

description = '''
`counts_spread` carries three keyed pairs and one `**extra` spread on a line that fits. **The dict expands to one entry per line**, because the spread counts as an entry, taking the dict to four and past `max-dict-entries`, whereas the three keyed pairs alone would sit at the cap and stay inline.
'''

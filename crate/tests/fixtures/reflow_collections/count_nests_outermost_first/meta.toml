[docs]
previewable = false
title       = "The Count Trigger Reads Each Nested Dict on Its Own Entries"

description = '''
`outer` has four entries, one of them the two-entry dict under `"inner"`, and `nested_trips` has three entries, one of them the four-entry dict under `"deep"`. **`outer` expands and its `"inner"` value stays inline, whereas in `nested_trips` the `"deep"` value expands and takes its enclosing dict with it**, because the count trigger fires once per dict on that dict's own entries, and every collection enclosing an expanded dict expands too.
'''

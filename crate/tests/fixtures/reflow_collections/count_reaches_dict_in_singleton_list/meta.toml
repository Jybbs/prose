title       = "The Count Trigger Reaches a Dict Inside a One-Element List"

description = '''
`wrapper` is a one-element list whose only element is a four-entry dict. **The dict expands to one entry per line and the list's `[` stays tight against the `{`**, because a one-element list never expands on its own, whereas the dict inside it passes `max-dict-entries` and expands wherever it sits.
'''

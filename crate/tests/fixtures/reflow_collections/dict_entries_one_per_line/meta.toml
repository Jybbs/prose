[docs]
canonical   = true
previewable = true
title       = "Dict Entries Break to One Per Line Past the Threshold"

description = '''
The three-entry `short_dict` stays inline, while the seven-entry `long_dict` crosses the threshold and expands to one entry per line, reading as a column of key-value pairs. `held_dict`, already laid out as a column of three entries, holds that shape rather than joining back because `keep-multiline-literals` defaults on, whereas the broken `single_entry_dict` rejoins onto one line.
'''

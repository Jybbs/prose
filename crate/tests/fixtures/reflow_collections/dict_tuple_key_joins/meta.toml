[docs]
previewable = true
title       = "Multi-Line Collection Keys Join So Their Colons Align"

description = '''
The tuple key `(alpha, beta)` in `mapping` and the subscript key `registry[lookup_index]` in `keyed` each **join onto one line**, so each key reads as a single clean member that the alignment and ordering rules can fold into their run, rather than one stranded across a break.

The tuple key in `overflow` would cross the budget once joined, so it stays multi-line instead, expanded canonically with one element per row.
'''

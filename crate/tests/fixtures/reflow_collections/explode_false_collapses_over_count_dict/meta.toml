[docs]
previewable = false
title       = "With `explode` and `keep-multiline-literals` Off a Dict Past the Count Rejoins"

description = '''
`explode = false` and `keep-multiline-literals = false` are set, and `fits_but_over_count` is a four-entry dict written one entry per line whose joined form fits. **The dict rejoins onto one line**, because `explode` off turns the count trigger off along with the width one, and `keep-multiline-literals` off releases the column the author wrote, leaving the rejoin as the only move.
'''

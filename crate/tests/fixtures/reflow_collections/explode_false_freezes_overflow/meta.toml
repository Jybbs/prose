[docs]
previewable = true
title       = "A False Explode Facet Freezes Every Collection Shape"

description = '''
Setting `explode` to `false` suppresses every expansion, so all three literals pass through untouched. The over-wide `overflowing_list` keeps its single line, the five-entry `over_count_dict` stays inline because the count cap stops applying, and `already_multiline`, already spread across lines, is left as written.
'''

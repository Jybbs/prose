title       = "A Set Inside a Dict Value's Generator Expands Where It Lands"

description = '''
The `"pr"` value of the returned dict calls `any` over a generator whose set of `gh` commands runs the row past the budget. **The set expands one tuple per row**, the layout it takes as a list element, because the dict's expand lays out each literal nested inside its entries, through the call and the generator, wherever its row lands.

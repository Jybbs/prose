title       = "A Hung Entry Rejoins Its Key Before Breaking at the `:`"

description = '''
The tuple key in `mapping` is broken across two rows, and even once rejoined its `key: value` width passes the budget. **The key rejoins onto one row and the entry then breaks at its `:` with `some_quite_long_value_expression_padding_here` hanging one indent step below**, because the hang is written from the rejoined key rather than from the source rows, so the broken row carries the same one-line key its siblings do.
'''

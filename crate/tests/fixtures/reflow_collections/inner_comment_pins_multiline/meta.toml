[docs]
previewable = false
title       = "An Inner Comment Pins the Multi-Line Shape"

description = '''
A literal holding a comment anywhere inside its range is **left expanded**, because collapsing it would drop prose the author wrote.

`own_line_comment_between_entries`, `trailing_comment_on_entry`, `comment_before_close`, and the `registry` subscript under `comment_pins_subscript` all keep the multi-line shapes they arrived in.

`trailing_comment_expands` is the exception. Its comment sits after the closing `]`, which is **outside the literal's range**, so that over-wide list still expands and packs its strings across rows.
'''

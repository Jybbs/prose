[docs]
previewable = true
title       = "Nested Collections Expand Level by Level Independently"

description = '''
**Each nested collection settles its own layout at its own column.** In `cascade` the expanding outer list carries its over-wide first dict into an expansion while `{"name": "bob", "role": "user"}` stays inline, and in `tiered_dict` the key text of `"primary_database"` counts toward its value's column, pushing that inner dict past the budget while `"cache": {"ttl": 60}` fits. `walks_through_singleton` keeps its singleton `[{` tight while the six-entry dict inside expands. The inner list of `outer_holds_with_inner` was written across lines and holds its own break, which then keeps the outer from joining, and `outer_pinned_inner_holds` shows the same hold under an outer already pinned past the budget by its long strings.
'''

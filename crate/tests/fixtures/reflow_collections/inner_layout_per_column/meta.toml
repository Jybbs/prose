[docs]
previewable = true
title       = "Nested Collections Expand Level by Level Independently"

description = '''
**Each nested collection settles its own layout at its own column**, rather than every level following whatever the outermost one does.

In `cascade` the outer list expands and carries its over-wide first dict into an expansion too, while `{"name": "bob", "role": "user"}` stays inline. In `tiered_dict` the key text of `"primary_database"` counts toward its value's column, which pushes that inner dict past the budget while `"cache": {"ttl": 60}` still fits. `walks_through_singleton` keeps its singleton `[{` tight while the six-entry dict inside it expands.

Two cases run the other way. The inner list of `outer_holds_with_inner` was written across lines and holds its own break, and that break is what keeps the outer list from joining. `outer_pinned_inner_holds` shows the same hold where the outer is already pinned past the budget by its long strings.
'''

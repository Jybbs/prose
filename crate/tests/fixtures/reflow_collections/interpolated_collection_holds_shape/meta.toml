[docs]
previewable = true
title       = "A Collection Inside a Replacement Field Holds Its Shape"

description = '''
The list `[alpha, beta, gamma]` sits inside the replacement field of the f-string handed to `ValueError`, on a line running past the budget. It still holds its source shape, because an f-string literal is opaque to layout and expanding the list would splice a line break into the string itself.
'''

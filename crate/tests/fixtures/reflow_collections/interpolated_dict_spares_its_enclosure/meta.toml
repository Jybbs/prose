[docs]
previewable = true
title       = "A Dict Inside a Replacement Field Spares Its Enclosure"

description = '''
The four-entry dict inside the f-string carries more entries than `max-dict-entries` allows, the count that normally expands a dict and every collection around it whatever the widths involved. Sitting inside a replacement field puts it out of the layout's reach, so neither the dict nor the `ROWS` list holding the string expands.
'''

[docs]
previewable = true
title       = "A False Keep Facet Joins a Fitting Literal Back"

description = '''
Setting `keep-multiline-literals` to `false` restores the join, so the broken `fitting_joins` list comes back onto one line as `[10, 20, 30]`, while the over-wide `overflowing_explodes` still explodes into packed rows. The `keep-multiline-literals` and `explode` facets move independently, in that clearing one leaves the other live.
'''

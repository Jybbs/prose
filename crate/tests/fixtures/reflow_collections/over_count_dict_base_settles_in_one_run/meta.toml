[docs]
previewable = true
title       = "An Over-Count Dict Under a Subscript Settles in One Run"

description = '''
The four-entry dict assigned to `selected` crosses `max-dict-entries` while standing as the base of the `[chosen_key]` subscript, so the count trigger expands it to one entry per line. The enclosing subscript then reads the expanded dict as a break the rejoin cannot swallow, so **the literal reaches one shape on the first run** rather than exploding and rejoining on alternate passes.
'''

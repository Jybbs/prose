[docs]
previewable = true
title       = "An Oversized Dict Entry Hangs Its Value at the Post-Colon Column"

description = '''
A `key: value` row that overflows at the item indent **breaks at `:` and hangs the value at `item_indent + INDENT_STEP`**, the move the long key in `config` takes while `"alpha"` and `"beta"` stay on one line. `mixed` hangs a row between fitting siblings, `multiple_hung_rows` hangs two rows in one dict, and the wide `"limits"` value in `nested_value_passes_through` runs its own expansion as a nested dict instead of triggering the hang.
'''

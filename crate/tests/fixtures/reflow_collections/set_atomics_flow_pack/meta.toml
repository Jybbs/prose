[docs]
previewable = false
title       = "An Over-Wide Set Packs Its Strings Across Two Rows"

description = '''
`short_set` fits its line, `long_set` lists nine permission strings past the budget, and `held_set` is three strings written one per line. **`long_set` expands and packs its strings across two balanced rows**, because atomic items pack across as few rows as fit under `code-line-length` and `max-atomics`, whereas `short_set` stays inline and `held_set` keeps its column and packs onto one row as `"read", "write", "execute"` rather than rejoining.
'''

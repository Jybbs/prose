[docs]
previewable = true
title       = "A Sibling Literal Lands on the Closer Row"

description = '''
The first tuple overflows the 50-column budget and expands to one component per row, closing back at the statement's indent.

The second tuple is measured **from where that closer leaves it**, on the closing row, rather than from the continuation column it was written under. There is room beside the closer, so it packs there instead of expanding under an indent that no longer applies.
'''

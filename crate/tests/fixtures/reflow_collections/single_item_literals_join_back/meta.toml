previewable = false
title       = "A One-Item or Empty Literal Rejoins Onto One Line"

description = '''
`joined_one_entry_dict`, `joined_one_item_list`, and `joined_empty_dict` are each spread across rows, `oversized_one_entry_dict` is a one-entry dict whose row passes the budget, and the aligned `only_*` and `empty_*` rows already fit. **The three spread literals rejoin onto one line, and `oversized_one_entry_dict` breaks at its `:` and hangs its value**, because a one-entry or empty literal has no column to keep, whereas any non-empty dict that overflows takes the hang.
'''

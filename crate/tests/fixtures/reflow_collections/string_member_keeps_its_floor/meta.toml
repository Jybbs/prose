title       = "A Row Inside a Multi-Line String Keeps Its Column"

description = '''
`holder` lists `alpha`, a `helper` call whose argument is a triple-quoted string with `line2` at column zero, and `zeta` in one construct. **The list expands one member per row and every row outside the string moves to the entry indent, whereas the `line2` row stays at column zero**, because indenting a row inside the string would add spaces to the string's own value.
'''

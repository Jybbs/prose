[docs]
previewable = false
title       = "Multi-Line Subscripts Join onto One Line"

description = '''
A multi-line subscript joins onto one line whatever shape its index takes, so `data[key]`, the tuple index `matrix[row, column]`, the slice `window[start:stop]`, and the operator expression in `offset_lookup` all collapse. The precedence parentheses in `coefficient_matrix` survive the join intact.

The join measures the result **from the subscript's own column**. `y` is one character too wide to fit once joined, so it stays on its source lines, and `guarded` stays too, because its index carries the non-atomic call `helper(adjustment)`.
'''

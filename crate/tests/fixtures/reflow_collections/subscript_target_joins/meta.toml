title       = "A Multi-Line Subscript Rejoins Onto One Line"

description = '''
`data[key]`, `matrix[row, column]`, `window[start:stop]`, `x`, `result`, `precedence`, and `guarded` each subscript across rows, whichever form the index takes, and `y` is one character wider than `x`. **Every subscript whose joined form fits rejoins onto one line, and `y` keeps its rows**, because the join is measured from the subscript's own column, and `y` joined would run one column past the budget, whereas the parentheses in `coefficient_matrix[(row_base + row_delta) * column_scale]` are written through unchanged and the call `helper(adjustment)` inside `guarded` does not stop the join.
'''

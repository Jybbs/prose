previewable = false
title       = "A Kept Tuple Keeps Its Parentheses"

description = '''
`held_paren_tuple` is three integers written one per row inside parentheses, `joined_one_element` is `42,` spread across rows, `paren_tuple` and `bare_tuple` fit on their lines, and `qualifying_inner_in_tuple` encloses a five-key dict. **`held_paren_tuple` keeps its column and its parentheses while its interior packs onto one row**, whereas `joined_one_element` rejoins as `(42,)` because one entry is too few for a kept column, the two fitting tuples are left as written whatever their bracket form, and `qualifying_inner_in_tuple` expands with the dict it encloses.
'''

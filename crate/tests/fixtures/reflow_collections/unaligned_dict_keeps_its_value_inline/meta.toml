[docs]
previewable = false
title       = "With `align-colons` Off, a Dict Value Stays on One Row"

description = '''
With [[align-colons]] off, no `:` column exists for [[reflow-collections]] to measure a value against. **The `"pr"` set stays on one row**, because it fits the budget beside its own key, whereas with [[align-colons]] on, [[reflow-collections]] expands the same set so `"pr"` joins the column.
'''

[docs]
previewable = false
title       = "Entries of Different Widths Pack in the Order Written"

description = '''
The `__all__` list alternates thirty-character strings with two-character ones on one over-wide line, and no sort reaches it here. **The list expands and packs three entries on each of two balanced rows**, because each row is measured at the widths the entries carry in source order, rather than filling the first row to the budget and leaving a short row behind it.
'''

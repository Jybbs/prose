[docs]
previewable = false
title       = "An Aligned `import` Keyword Keeps Its Column Across the Split"

description = '''
`from typing     import ...` pads the gap before its `import` keyword to the column [[align-imports]] sets under `from __future__ import`, and its member list runs past the default `import-line-length`. **Each line the split writes repeats the padded prefix with the same gap** rather than closing it to one space, so every `import` keyword stays on one column.
'''

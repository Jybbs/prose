[docs]
previewable = false
title       = "A Comment Above the Group Survives the Gather"

description = '''
A comment sits on the line above `from pkg import alpha`, with `from pkg import beta` below. **The two statements merge into `from pkg import alpha, beta` and the comment stays above them**, because the comment is outside the lines the merge rewrites, the complement of a comment inside the span keeping the statements apart.
'''

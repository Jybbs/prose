[docs]
previewable = true
title       = "A `noqa` Marker Repeats across the Split"

description = '''
With `import-line-length` set to `40`, `from pkg import alpha, beta, gamma, delta` overflows and splits across two statements.

The trailing `# noqa: F401` marker **repeats on every row the split writes**, so each name it covered still carries it. A rule reading the marker therefore holds the same set of names after the split that it held before it.
'''

[docs]
previewable = false
title       = "An Over-Long Member List Keeps Its Authored Order"

description = '''
`from pkg import gamma, alpha, beta, delta, epsilon` runs past the `import-line-length` budget of `30` with `alphabetize-siblings = false` set. **The names split across three lines and still read `gamma, alpha, beta, delta, epsilon` in authored order**, because sorting belongs to [[alphabetize-siblings]] rather than to the split, so the split leaves the list exactly as written.
'''

previewable = false
title       = "A Pair Whose Breaks Belong to a Nested Call Joins and Is Removed"

description = '''
The `if` condition in `consume` wraps a comparison whose line breaks all sit inside the `find` call's own parentheses, under a `code-line-length` of `100`. **The interior joins onto one row and the outer pair is removed with it**, because the pair carries none of those breaks, and the joined line fits the budget.
'''

[docs]
previewable = true
title       = "Alignment to a Code Token Beats the Hang Guess"

description = '''
The redundant grouping pair is shed, which moves everything inside it one column to the left.

The continuation row was sitting on the column where the second operand starts on the opening row, and **a row aligned to a code token follows that token**, so it moves one column left as well. A row whose indent merely happened to fall an indent step in would have been left where it was.
'''

[docs]
previewable = false
title       = "A Pair Around a `dict(...)` Call Turned Literal Opens the Literal on the Assignment's Row"

description = '''
`value = (` wraps a `dict(...)` call with ten keyword arguments, which `simplify-comprehensions` turns into a dict literal and `reflow-collections` explodes, since it holds more entries than `max-dict-entries` allows. **The pair is removed and the literal opens on the assignment's row as `value = {`**, whatever the width of its one-row form.
'''

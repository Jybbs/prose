previewable = false
title       = "A Join Against a Bracket Closes to Nothing"

description = '''
`x = (helper(` opens a pair whose interior breaks directly after `helper(` and directly before its `)`. **The interior joins onto one row with each break against a bracket closing to nothing rather than to a space**, so the joined line reads `x = helper(arg) and flag` with no padding left for [[strip-stranded-padding]] to remove.
'''

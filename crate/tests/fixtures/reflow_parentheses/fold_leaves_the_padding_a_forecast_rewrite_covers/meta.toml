previewable = false
title       = "A Fold Leaves the Padding a Forecast Rewrite Covers"

description = '''
`ok = (` holds a chain whose `.format` call [[prefer-fstring]] rewrites to an f-string, under a `code-line-length` of `26`. **The padding ahead of `==` lands inside the replacement field, so the join leaves it as written** and measures the joined row at `27` columns, past the budget. The chain then holds one row of its own inside the pair, measured at its rewritten width of `26`.
'''

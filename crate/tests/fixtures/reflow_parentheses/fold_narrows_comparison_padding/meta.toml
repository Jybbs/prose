[docs]
previewable = false
title       = "A Join Narrows the Padding Ahead of Each Comparison"

description = '''
`ok = (` holds a chain that [[align-comparisons]] padded so both operators share a column, under a `code-line-length` of `70`. **The join leaves one space ahead of each comparison operator**, since on one row that padding would line up with nothing. The joined row reaches `75` columns as written and `60` once narrowed, and the rule measures it narrowed, so the pair folds.
'''

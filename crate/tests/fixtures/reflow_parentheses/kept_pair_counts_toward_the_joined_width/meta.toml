[docs]
previewable = true
title       = "A Pair That Cannot Shed Still Counts Toward the Joined Width"

description = '''
The inner pair keeps its parentheses, since `server.up and cache.warm or cache.cold` regroups the parse, so the columns it occupies are still there when the outer pair measures its fold. Under `code-line-length = 46` the joined form reaches 48 columns and the break holds rather than folding past the budget.
'''

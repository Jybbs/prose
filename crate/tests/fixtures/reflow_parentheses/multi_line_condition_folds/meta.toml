title       = "A Multi-Line Condition Folds When It Fits"

description = '''
`ready = (` opens a multi-line grouping around `server.up and cache.warm`, and with the line budget set to `32` characters the folded single-line form just fits. The parentheses shed and the condition folds onto `ready = server.up and cache.warm`.

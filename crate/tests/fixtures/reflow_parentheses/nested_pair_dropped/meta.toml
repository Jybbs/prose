[docs]
previewable = false
title       = "Nested Redundant Pairs Drop in One Pass"

description = '''
`doubled = ((base + bonus))` nests one redundant set of parentheses inside another, and `mixed = (left + (right))` nests one around `right` alone. Both shed in the same pass, reducing them to `doubled = base + bonus` and `mixed = left + right`.
'''

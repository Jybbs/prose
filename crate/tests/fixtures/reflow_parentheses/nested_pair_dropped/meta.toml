[docs]
previewable = false
title       = "Nested Redundant Pairs Are Removed in One Pass"

description = '''
`doubled = ((base + bonus))` nests one redundant pair inside another, and `mixed = (left + (right))` wraps `right` alone inside a wider pair. **Every redundant pair is removed in the same run**, so the lines read `doubled = base + bonus` and `mixed = left + right`.
'''

[docs]
previewable = true
title       = "A Precedence-Bearing Pair Survives"

description = '''
`(base + bonus) * factor` and `2 ** (depth + 1)` each wrap a `+` expression whose precedence is looser than the operator enclosing it. Dropping either set of parentheses would rebind the expression to a different result, so both stay exactly as written.
'''

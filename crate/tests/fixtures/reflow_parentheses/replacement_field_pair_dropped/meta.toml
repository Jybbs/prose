[docs]
previewable = false
title       = "A Redundant Pair Inside a Replacement Field Sheds"

description = '''
The parentheses around `a + b` sit inside an f-string replacement field, whereas the pair around `c + d` sits in a plain assignment. Both shed the same way, leaving `f"{a + b}"` and `value = c + d`, because an interpolated expression follows the same rules as one written outside a string.
'''

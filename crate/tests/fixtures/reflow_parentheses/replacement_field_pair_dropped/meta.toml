previewable = false
title       = "A Redundant Pair Inside an f-string Replacement Field Is Removed"

description = '''
The pair around `a + b` sits inside an f-string replacement field, and the pair around `c + d` sits in a plain assignment. **Both pairs are removed the same way**, leaving `f"{a + b}"` and `value = c + d`, because an interpolated expression follows the same test as one written outside a string.
'''

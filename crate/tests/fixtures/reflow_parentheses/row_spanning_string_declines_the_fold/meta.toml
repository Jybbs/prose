[docs]
previewable = false
title       = "A String Spanning Rows Stops the Join"

description = '''
The `if` condition in `b` is an operator chain, so the join test opens, and one operand is a triple-quoted string spanning two rows. **The join stops**, because closing the soft breaks would respace the string's own interior. That string's break is not a logical break in the expression, so the pair carries no break of its own, and it is removed with the rows left where the author put them.
'''

[docs]
previewable = false
title       = "A Row-Spanning String Declines the Fold"

description = '''
The interior is an operator chain, so the shape test admits it, but one operand holds a string spanning two rows and closing the soft wraps would respace that string's own interior. The fold therefore declines on the string rather than on the shape, and because the string's break is not a logical one the pair reads as holding no break of its own, so it sheds and leaves the rows where the author put them.
'''

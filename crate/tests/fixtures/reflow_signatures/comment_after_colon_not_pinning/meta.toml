[docs]
previewable = false
title       = "A Comment Trailing the `:` Leaves the Signature Free to Expand"

description = '''
`render` takes five parameters, over `max-params`, and its `# entry point` comment trails the `:` rather than sitting between `(` and `)`. **The signature expands one parameter per line and the comment ends up trailing the `):` line**, because only a comment inside the parameter list keeps the existing layout, and this one sits outside it.
'''

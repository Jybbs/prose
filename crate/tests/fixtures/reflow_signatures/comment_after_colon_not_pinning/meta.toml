[docs]
previewable = false
title       = "Trailing Comment After the Colon Does Not Pin"

description = '''
`render`'s trailing `# entry point` comment sits after the `:`, which puts it **outside the `(...)` parameter list**.

A comment pins the signature only when it falls between `(` and `)`, so this one pins nothing. The five parameters still expand past `max-params`, and the comment stays where it was, now trailing the `):` line.
'''

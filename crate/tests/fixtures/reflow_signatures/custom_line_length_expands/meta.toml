[docs]
previewable = false
title       = "A Lower `code-line-length` Expands a Signature That Fits the Default"

description = '''
`render` takes three parameters, under `max-params`, and its inline form fits the default `code-line-length` of `88` but overflows the `50` this case sets. **`left`, `palette`, and `right` each move onto their own line**, because line length alone triggers the expansion once the configured budget is the smaller one.
'''

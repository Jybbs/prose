[docs]
previewable = false
title       = "Custom Line-Length Budget Drives Expansion"

description = '''
`render`'s three parameters stay under `max-params`, so only line length can trigger a reshape. With `code-line-length` configured to `50`, `render`'s inline form overflows that budget though it would fit the default of `88`, so `reflow-signatures` **expands `left`, `palette`, and `right` onto their own lines**.
'''

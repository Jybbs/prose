[docs]
previewable = false
title       = "Expanded Parameters Collapse While a Multi-Line Return Annotation Stays"

description = '''
`resolve`'s two parameters, `payload` and `fallback`, are written one per line but fit inline, and its return annotation `PrimaryEnvelope | SecondaryEnvelope | DeferredEnvelope` spans three parenthesized lines. **The parameters collapse onto one row and the return annotation keeps its multi-line layout and parentheses**, because the annotation is copied from the source as written rather than reflowed into the new line.
'''

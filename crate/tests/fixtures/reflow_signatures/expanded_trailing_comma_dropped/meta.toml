previewable = false
title       = "An Already-Expanded Signature Drops Its Trailing Comma"

description = '''
`render`'s five parameters are already written one per line, and the last, `verbose: bool,`, ends in a trailing comma. **The final parameter is rewritten to end bare**, because the one-per-line form the rule writes ends without a comma, leaving nothing for `strip-trailing-commas` to remove.
'''

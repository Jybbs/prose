[docs]
previewable = false
title       = "Setting `max-params` to `false` Turns the Count Trigger Off"

description = '''
`render` takes five parameters, one over the default `max-params` of `4`, and its inline form fits the line budget, with `max-params = false` set for the rule. **The signature stays inline**, because `false` turns the count trigger off, leaving line length as the only trigger for expansion.
'''

[docs]
previewable = true
title       = "Class Methods Reshape the Same Way Free Functions Do"

description = '''
`Renderer.render` carries `self` plus four typed parameters, enough to trip the `max-params` count trigger, so **it expands at the class-body indent**. The walker descends into class bodies the same way it descends into top-level defs, deriving each parameter line's indent from the method's own `def` position.
'''

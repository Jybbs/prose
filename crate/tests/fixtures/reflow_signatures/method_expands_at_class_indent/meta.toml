[docs]
previewable = true
title       = "Class Methods Reshape the Same Way Free Functions Do"

description = '''
`Renderer.render` carries `self` plus four typed parameters, which is enough to trip the `max-params` count.

**It expands at the class-body indent.** Class bodies are descended into the same way top-level definitions are, and each parameter line takes its indent from the method's own `def` position rather than from the module margin.
'''

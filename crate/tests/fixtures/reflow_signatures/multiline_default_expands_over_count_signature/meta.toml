[docs]
previewable = false
title       = "A Multi-Line Default Moves With Its Parameter Past the Count Limit"

description = '''
`configure` takes five parameters, over `max-params`, and the `opts` default is a dict spanning rows. **The signature expands one parameter per line and the dict's rows are re-indented**, so its `"a": 1` entry and its closing `}` hang from the parameter column rather than staying at their source indent.
'''

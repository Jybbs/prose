[docs]
previewable = false
title       = "A Multi-Line Default Expands a Signature Past the Count Cap"

description = '''
`configure` carries five parameters, over the `max-params` cap, and the `opts` default is a dict spanning rows. The signature expands one parameter per line, and the dict's block is re-indented so its `"a": 1` entry and its closing `}` hang from the parameter column rather than staying at their source indent.
'''

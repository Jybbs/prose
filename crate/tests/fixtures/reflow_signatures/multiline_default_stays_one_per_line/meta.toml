[docs]
previewable = false
title       = "A Multi-Line Default Keeps the Signature One Per Line"

description = '''
The `opts` default keeps the multi-line dict layout the author gave it, so `configure` reaches no one-row form and stays one parameter per line whatever its width would have been. The trailing comma after `mode: str = "auto"` is removed by `strip-trailing-commas` rather than surviving the reshape.
'''

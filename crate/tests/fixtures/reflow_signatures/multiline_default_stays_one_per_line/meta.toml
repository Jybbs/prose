[docs]
previewable = false
title       = "A Multi-Line Default Keeps the Signature One per Line"

description = '''
`configure` is written one parameter per line, and the `opts` default keeps the multi-line dict layout the author gave it. **The signature stays one parameter per line whatever its width would have been, and the trailing comma after `mode: str = "auto"` is removed**, because a signature with a multi-line default never collapses, and the one-per-line form ends its last parameter bare.
'''

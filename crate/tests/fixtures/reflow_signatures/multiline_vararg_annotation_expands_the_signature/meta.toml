title       = "A Multi-Line `*args` Annotation Moves With Its Parameter"

description = '''
`render` takes six parameters including `*args`, over `max-params`, and the `*args` annotation `Sequence[int]` is written across two rows. **The signature expands one parameter per line and the annotation moves with `*args`**, so `int` and the closing `]` end up indented under the new `*args` column rather than at the column the source left them.
'''

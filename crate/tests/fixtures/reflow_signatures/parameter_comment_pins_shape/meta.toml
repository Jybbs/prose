[docs]
previewable = true
title       = "Comments inside the Parameter List Pin the Shape"

description = '''
Nothing here moves. `own_line_pin` carries `# comment between parameters` on a line of its own, and `trailing_line_pin` carries `# trailing on a parameter line` after one of its parameters. Both comments sit between `(` and `)`.

**Either placement pins the signature's existing shape**, so both five-parameter signatures are left exactly as written despite exceeding `max-params`.
'''

[docs]
previewable = false
title       = "PEP 695 Type Parameters Survive the Rewrite"

description = '''
`render[T]` takes five parameters, each annotated `T`, over `max-params`, with a `[T]` type parameter list and a `-> tuple[T, T]` return annotation. **The parameters expand one per line, and the `[T]` list, each `T` annotation, and the return annotation all stay intact**, because the rewrite replaces only the text between `(` and `)`, leaving the name with its `[T]` list ahead of it and the return annotation after it as written.
'''

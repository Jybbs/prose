[docs]
previewable = false
title       = "PEP 695 Type Parameters Survive the Rewrite"

description = '''
`render[T]`'s five parameters, each annotated `T`, exceed `max-params`, so `reflow-signatures` expands them one per line. **The `[T]` type parameter list, each parameter's `T` annotation, and the `-> tuple[T, T]` return annotation all survive intact**, because the rewrite's range starts at the `(` rather than the function name.
'''

description = '''
`render`'s single parameter, `target: int`, is written in expanded shape though it fits comfortably inline. `reflow-signatures` collapses it to `render(target: int) -> int:`, **the `-> int` return annotation trailing the closing `)` on the same line** rather than landing on its own.

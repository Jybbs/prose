[docs]
previewable = false
title       = "An Implicit String-Concatenation Return Keeps Its Parentheses When Parameters Expand"

description = '''
`assemble_result`'s four parameters make the inline header overflow `code-line-length`, so they expand one per line.

The return annotation's parentheses wrap two adjacent string literals joined by implicit concatenation into a single expression. **Those parentheses pass through intact**, because dropping them would break the concatenation and leave output that does not parse.
'''

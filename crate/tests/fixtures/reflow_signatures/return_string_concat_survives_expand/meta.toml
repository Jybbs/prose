[docs]
previewable = false
title       = "A Concatenated String Return Annotation Keeps Its Parentheses When Parameters Expand"

description = '''
`assemble_result` takes four parameters whose inline header overflows `code-line-length`, and its return annotation is two adjacent string literals inside parentheses, joined by implicit concatenation. **The parameters expand one per line and the parentheses pass through intact**, because dropping them would break the concatenation and leave output that does not parse.
'''

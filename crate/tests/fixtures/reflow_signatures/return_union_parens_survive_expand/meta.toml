[docs]
previewable = true
title       = "A Multi-Line Return Annotation Keeps Its Parentheses When Parameters Expand"

description = '''
`assemble_result`'s four parameters make the inline header overflow `code-line-length`, so they expand one per line.

The return annotation's parentheses wrap a three-line union, `PrimaryEnvelope | SecondaryEnvelope | DeferredEnvelope`. **Those parentheses pass through intact**, because they are the only thing letting the type span several lines and dropping them would leave output that does not parse.
'''

[docs]
previewable = false
title       = "Rich Annotations Are Copied Verbatim"

description = '''
`configure` takes five parameters annotated `Callable[[int, str], bool]`, `Mapping[str, Any]`, `Annotated[dict[str, int], "extra"]`, and `tuple[str, ...]`, plus a `timeout: Optional[float] = None` default, over `max-params`. **The signature expands one parameter per line with each annotation copied verbatim from the source**, so no bracket, comma, or string inside an annotation is rewritten.
'''

[docs]
previewable = false
title       = "Parameter Separators Are Copied Verbatim"

description = '''
`render` mixes a positional-only `/` separator, a bare `*` separator opening the keyword-only section, a `verbose: bool = False` default, and a `-> tuple[int, str]` return annotation across five parameters, one over `max-params`. **The signature expands with every separator and default copied verbatim from the source**, each on its own line, rather than rebuilt in a different form.
'''

previewable = false
title       = "Variadic `*` and `**` Prefixes Carry Through Expansion"

description = '''
`dispatch` mixes two positional parameters, `*args`, two keyword-only parameters, and `**kwargs`, six parameters against a `max-params` limit of `4`. **The signature expands one per line with each variadic's `*` or `**` prefix kept**, because every variadic counts toward the parameter count the same as a plain parameter.
'''

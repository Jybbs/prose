[docs]
previewable = false
title       = "Variadic Star Prefixes Carry Through Expansion"

description = '''
`dispatch` mixes two positional parameters, `*args`, two keyword-only parameters, and `**kwargs`, six parameters total against a `max-params` cap of `4`. `reflow-signatures` expands the signature and **carries each variadic's `*` or `**` prefix through to the expanded form**, since every variadic slot counts toward the parameter count the same as a plain parameter.
'''

[docs]
previewable = false
title       = "A Zero-Parameter Signature With a Multi-Line Return Annotation Is Left Alone"

description = '''
`render` takes no parameters, and its return annotation `PrimaryEnvelope | SecondaryEnvelope | DeferredEnvelope` spans three parenthesized lines. **The signature is left untouched**, so the empty parameter list is never split across lines and the annotation's grouping parentheses stay intact.
'''

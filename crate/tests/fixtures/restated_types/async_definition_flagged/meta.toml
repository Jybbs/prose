[docs]
previewable = false
title       = "An `async def` Resolves Its Entries Like a Plain `def`"

description = '''
`fetch` is an `async def` annotating `url: str` and `timeout: float`, and its `Args:` entries restate both types. **Both entries are reported**, because an `async def` resolves its `Args:` entries against its own parameters exactly as a plain `def` does.
'''

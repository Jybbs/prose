title       = "An Async Definition Resolves Like Any Other"

description = '''
`fetch` is defined with `async def` rather than a plain `def`, and both `url (str)` and `timeout (float)` restate the same type their signature already annotates. **Both entries are flagged**, showing that `async def` resolves its `Args:` entries exactly like `def` would.

[docs]
previewable = true
title       = "An `Attributes:` Entry Resolves Against the Class Body"

description = '''
`host: str` is annotated in the class body, and its docstring entry `host (str)` restates that type. **`host` is flagged**, while `port`, bound by the unannotated `port = 8080`, and `proxy`, declared nowhere in the body, both stay silent.
'''

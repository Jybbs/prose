[docs]
previewable = false
title       = "Only a Direct Child of the Class Body Counts as an Annotated Field"

description = '''
`Remote` declares `registry: ClassVar[dict] = {}` as a direct child of its class body and `cache: dict` inside a nested `if TYPE_CHECKING:` block, and its `Attributes:` section restates both types. **`registry (ClassVar[dict])` is reported and `cache (dict)` is not**, because the rule reads the class body's direct children and does not descend into a nested block.
'''

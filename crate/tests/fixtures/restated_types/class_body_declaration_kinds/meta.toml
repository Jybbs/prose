[docs]
previewable = false
title       = "Which Class-Body Declarations Count as Annotated Fields"

description = '''
`registry: ClassVar[dict]` sits as a direct child of the class body, and its docstring entry restates the same `ClassVar[dict]` type. **`registry` is flagged, while `cache`, declared inside the nested `if TYPE_CHECKING:` block, resolves against nothing**, because the walk reads the class body's direct children rather than descending into a nested block.
'''

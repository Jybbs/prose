previewable = false
title       = "A Section Heading on the Wrong Definition Kind Resolves Against Nothing"

description = '''
`measure`, a function, carries an `Attributes:` section naming `width (int)`, and `Session`, a class, carries an `Args:` section naming `host (str)`, each heading on the definition kind the other belongs to. **Neither entry is reported**, because a function declares no attributes and a class body declares no parameters, so each section resolves against nothing.
'''

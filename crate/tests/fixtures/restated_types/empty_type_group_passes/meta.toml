previewable = false
title       = "An Empty Paren Pair Is Not a Type Group"

description = '''
`dial` annotates `host: str` and `port: int`, and its `Args:` entries write `host ()` and `port (  )` with empty or whitespace-only parens. **Neither entry is reported**, because an empty or whitespace-only paren group restates no type.
'''

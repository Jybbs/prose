previewable = false
title       = "The Parameter-Documenting Heading Synonyms"

description = '''
`width`, `depth`, and `height` are documented under `Parameters:` and `Keyword Arguments:` instead of `Args:`, each restating the `int` type its signature already annotates. **All three entries are flagged**, because `Parameters:` and `Keyword Arguments:` are heading synonyms that document parameters the same way `Args:` does.
'''

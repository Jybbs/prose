[docs]
previewable = false
title       = "The Parameter-Heading Synonyms Resolve Like `Args:`"

description = '''
`render` annotates `width`, `depth`, and `height` as `int`, and its docstring documents them under `Parameters:` and `Keyword Arguments:` rather than `Args:`, restating each type. **All three entries are reported**, because `Parameters:` and `Keyword Arguments:` are heading synonyms that document parameters the same way `Args:` does.
'''

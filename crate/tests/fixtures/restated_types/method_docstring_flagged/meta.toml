[docs]
previewable = false
title       = "A Method Resolves Against Its Own Signature"

description = '''
`dial` is a method inside `Remote`'s class body, annotating `host: str`, and its `Args:` entry `host (str)` restates that type. **The entry is reported**, because a method's docstring resolves against that method's own parameters even though the definition sits inside a class.
'''

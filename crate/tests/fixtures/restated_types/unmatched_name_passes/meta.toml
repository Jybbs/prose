title       = "An Entry Naming No Parameter and an Entry Carrying No Type Group"

description = '''
`dial` annotates `host: str`, and its `Args:` section writes `host` with no parenthesized type and `retries (int)` for a parameter `dial` does not declare. **Neither entry is reported**, because the first restates no type and the second resolves against no member of the signature.
'''

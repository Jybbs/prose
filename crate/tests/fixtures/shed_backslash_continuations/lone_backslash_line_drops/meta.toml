[docs]
previewable = true
title       = "A Backslash Alone on Its Line Takes the Line With It"

description = '''
The backslash in `x = (2 + \` sits alone on its own physical line inside the parentheses, so removing it leaves nothing behind on that line. The empty line drops along with the backslash, folding the expression down to `x = (2 +` and `2)`.
'''

[docs]
previewable = false
title       = "A Backslash Alone on Its Line at Module Level Is Left Alone"

description = '''
A backslash sits alone on its own line between `x = 1` and `y = 2` at module level. **The source is left exactly as written**, because a backslash that opens a physical line outside every bracket sits where a join would rewrite the statement's indentation, so the rule skips it rather than rejoining.
'''

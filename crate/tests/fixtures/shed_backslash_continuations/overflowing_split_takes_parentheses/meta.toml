[docs]
previewable = true
title       = "A Split Too Long to Rejoin Takes Parentheses"

description = '''
The addition chain assigned to `total` would overflow the budget if folded onto a single line, so the outermost expression spanning the break is wrapped in parentheses instead of rejoined. The parentheses carry the same split the backslash used to, keeping the six operands across two lines.
'''

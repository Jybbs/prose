[docs]
previewable = true
title       = "Several Continuations on One Statement Fold Together"

description = '''
`x = 1 + \` continues across two consecutive backslashes before reaching `2`, and `y = alpha + \` continues across two more before `gamma`. The whole run folds as a single rejoin, measured against the line it actually produces, `x = 1 + 2` and `y = alpha + beta + gamma`, rather than one break at a time.
'''

title       = "Two Backslash Runs Inside One Call Are Both Removed"

description = '''
`compute` spans three rows joined by two separate backslashes, both inside the call's parentheses. **Each backslash is removed and the newline it sat on stays**, because the call's parentheses already span both breaks, leaving one bracketed argument list with no continuation marker left.

title       = "Two Backslash Runs Inside One Call Both Shed"

description = '''
`compute` spans three rows joined by two separate backslashes, and both sit inside the same call parentheses. **Each run sheds its backslash into the one wrapped node** rather than the second replacing the first, so the call reads as one bracketed argument list with no continuation markers left.
'''

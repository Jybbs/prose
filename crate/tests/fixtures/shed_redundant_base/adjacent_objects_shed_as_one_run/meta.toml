[docs]
previewable = false
title       = "Adjacent `object` Bases Shed as One Run"

description = '''
`class Twice(Mapping, object, object):` lists `object` twice in a row, and both bases are removed as a single deletion covering the whole run. Deleting each base separately would produce overlapping edits, and an overlapping set is rejected for the entire file, which would leave even the ordinary `class Single(object):` above unshed. The one-run edit avoids that, so the headers settle to `class Single:` and `class Twice(Mapping):`.
'''

previewable = false
title       = "Empty Parentheses Drop Even Where `object` Is Rebound"

description = '''
`object = LegacyBase` rebinds the name at module level, and `class Rebound():` follows with an empty base list. **The empty parentheses drop, leaving `class Rebound:`**, because the rebinding keeps only a header that names `object` as a base, and this header names no base at all.
'''

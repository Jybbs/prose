[docs]
previewable = false
title       = "An Empty List Sheds Even Where `object` Is Rebound"

description = '''
`object = LegacyBase` rebinds the name, so any header in this module naming `object` as a base would be held rather than shed. `class Rebound():` names no base at all, and its empty parentheses still drop, leaving `class Rebound:`, because there is no `object` base whose meaning the rebinding could change.
'''

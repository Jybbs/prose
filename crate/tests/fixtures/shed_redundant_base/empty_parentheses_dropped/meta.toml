[docs]
previewable = true
title       = "Empty Parentheses Leave the Header"

description = '''
`class Marker():` and `class Sentinel():` each carry an empty base list, so the parentheses drop and the headers read `class Marker:` and `class Sentinel:`. `class Spaced ():` writes a space before its pair, and that space is removed along with the parentheses, leaving no gap ahead of the `:`.
'''

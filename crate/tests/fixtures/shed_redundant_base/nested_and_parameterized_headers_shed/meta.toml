previewable = false
title       = "The Walk Reaches Every Class Header"

description = '''
The decorated `Decorated`, the parameterized `Generic[T]`, `Inner` nested inside `Outer`, and `Local` defined inside `factory` each shed their `object` base, showing the walk reaches class headers at every depth. `class Generic[T] (object):` also carries a space ahead of its parentheses, and removing that space extends the deletion back to the `]` rather than to a class name.
'''

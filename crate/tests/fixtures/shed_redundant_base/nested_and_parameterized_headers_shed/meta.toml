[docs]
previewable = false
title       = "Class Headers at Every Depth Lose `object`"

description = '''
The decorated `Decorated`, the parameterized `Generic[T]`, `Inner` nested inside `Outer`, and `Local` defined inside `factory` each name `object` as a base. **Every one of them loses the base**, because the rule visits class headers at every depth, and `class Generic[T] (object):` also loses the space before its parentheses, the deletion extending back to the `]` rather than to the class name.
'''

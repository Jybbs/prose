[docs]
previewable = true
title       = "A Metaclass Keyword Holds the Parentheses Open"

description = '''
`class Plugin(object, metaclass=PluginMeta):` carries `metaclass=PluginMeta` as a surviving member of the base list. `object` and the comma that followed it drop, leaving the parentheses in place to carry the keyword, `class Plugin(metaclass=PluginMeta):`.
'''

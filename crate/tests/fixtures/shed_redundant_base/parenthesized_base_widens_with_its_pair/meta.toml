[docs]
previewable = false
title       = "A Base Wrapped in Its Own Parentheses Drops With Them"

description = '''
`class Adapter(Mapping, (object)):` and `class Wrapper((object), Sized):` each wrap `object` in a redundant pair of parentheses that sits outside the `object` expression's own range. **The deletion widens to take those parentheses along with the base**, leaving `class Adapter(Mapping):` and `class Wrapper(Sized):`, because a deletion that stopped at the expression would leave an unmatched `)` behind and the file would no longer parse.

In the default pipeline [[reflow-parentheses]] removes such a pair before this rule runs, whereas this case runs the rule alone, so the pair is still present here.
'''

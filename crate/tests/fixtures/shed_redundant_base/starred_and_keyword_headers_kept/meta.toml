previewable = false
title       = "A Header Carrying Anything Real Is Left Alone"

description = '''
`class Configured(metaclass=ConfiguredMeta):`, `class Dynamic(*RESOLVED_BASES):`, `class Forwarded(**NAMESPACE):`, and `class Plain:` each carry a header shape with nothing to shed: a bare keyword, a starred base list, a double-starred namespace, or no parentheses at all. Every one stays exactly as written.
'''

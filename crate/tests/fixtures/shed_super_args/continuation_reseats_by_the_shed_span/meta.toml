[docs]
previewable = false
title       = "A Continuation Moves Left by the Columns the Span Took"

description = '''
`Invoice.render` calls `super(Invoice, self).render(body,` with `footer` hanging on the next line under `body`. **The call shortens to `super().render(body,` and `footer` moves left by the width of `Invoice, self`**, so it stays under the first argument.
'''

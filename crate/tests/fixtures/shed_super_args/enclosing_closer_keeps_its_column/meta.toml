[docs]
previewable = true
title       = "An Enclosing Closer Keeps Its Column"

description = '''
Shedding `Invoice, self` from the `super` call shortens the row and pulls the text after it leftward.

**Only rows aligned to text that actually moved follow it.** The continuation under the first argument shifts left with that argument, while the closing `)` of the enclosing `wrap(` call hangs from its own opener and stays exactly where it was written.
'''

[docs]
previewable = true
title       = "A Hanging Indent Holds Its Depth"

description = '''
`super(SecureConnection, self).__init__(` opens a call whose `host`, `port`, and `timeout` arguments hang one step under the statement rather than aligning to the open parenthesis. `SecureConnection, self` drops from the `super(...)` call, and every hanging argument line stays at the indentation it already had.
'''

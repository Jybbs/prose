[docs]
previewable = true
title       = "Arguments Naming Anything Else Stay Written"

description = '''
`Child.run(self, other)` calls `super(Child, other).run()`, naming `other` rather than the receiver `self` as its second argument, and `super(Other, self).run()`, naming `Other` rather than the enclosing class `Child` as its first. Both calls stay exactly as written, since the bare form would resolve a different class-instance pair in each.
'''

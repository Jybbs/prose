[docs]
previewable = false
title       = "A Local Name Shadowing the Class Keeps the Call Written"

description = '''
`Child.total` names its own second parameter `Child`, which shadows the class name inside the method's scope, and calls `super(Child, self).total()`. **The explicit form stays written and nothing here moves**, because `super(Child, self)` reads the parameter's binding rather than the enclosing class, so shedding the arguments would change what the call resolves to.
'''

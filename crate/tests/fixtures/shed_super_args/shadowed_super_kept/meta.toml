[docs]
previewable = false
title       = "A Module Binding `super` Keeps Every Call Written"

description = '''
The module defines `def super(*args):` at module level, rebinding the name `super` itself ahead of `Child.read`'s call to `super(Child, self).read()`. Every parameterized call stays untouched, since the bare form would reach that local binding rather than the `super` builtin.
'''

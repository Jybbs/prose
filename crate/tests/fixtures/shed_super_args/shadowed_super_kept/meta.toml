[docs]
previewable = false
title       = "A Module Binding `super` Keeps Every Call Written"

description = '''
The module defines `def super(*args):` at module level, rebinding the name `super` ahead of `Child.read`'s call to `super(Child, self).read()`. **The parameterized call stays untouched**, because the bare form would reach that module binding rather than the `super` builtin.
'''

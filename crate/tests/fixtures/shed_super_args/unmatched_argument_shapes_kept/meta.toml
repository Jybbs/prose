[docs]
previewable = false
title       = "An Argument List of Any Other Shape Stays Written"

description = '''
`Child` defines three methods, each calling `super` with an argument shape the bare-call rewrite doesn't match. `send` passes `Child, self, **extra`, `single` passes only `Child`, and `starred` passes `*pair`, none the `ClassName, self` pair the rewrite requires, so `shed-super-args` leaves all three calls exactly as written.
'''

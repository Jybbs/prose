[docs]
previewable = true
title       = "Conflicting Call Signals Leave the Report Unsuggested"

description = '''
`render`'s only parameter, `width`, is called once with the `int` literal `80` and once with the `str` literal `"full"`. Because the two calls disagree on a type, `signature-annotations` reports the missing annotation on `width` without a suggested type.
'''

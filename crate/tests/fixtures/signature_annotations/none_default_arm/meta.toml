[docs]
previewable = true
title       = "A Bare None Default Contributes a None Arm"

description = '''
`connect`'s only parameter, `host`, defaults to `None`, contributing no type on its own. The call site `connect(host="localhost")` binds a `str` literal to `host`, and `signature-annotations` folds the two signals into a display-only `host: str | None` suggestion.
'''

[docs]
previewable = true
title       = "A Value Return Is Flagged While a Procedure Passes"

description = '''
`fetch` returns `store[key]`, a value, so `signature-annotations` reports its two unannotated parameters, `store` and `key`, alongside a missing return type on `fetch` itself. `persist` only assigns `store[key] = value` and returns nothing, so its three unannotated parameters are reported while no missing-return diagnostic fires.
'''

title       = "A Multi-Line String Default Expands the Signature and Keeps Its Floor"

description = '''
`note`'s default is a triple-quoted string whose line break falls inside the literal's own text. `signature-layout` still expands `render`'s three parameters one per line, but the string's second line **stays at its source column** rather than shifting under `note`, since moving it would pad the literal's own interior.
'''

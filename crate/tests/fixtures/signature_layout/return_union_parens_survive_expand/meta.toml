[docs]
previewable = true
title       = "A Multi-Line Return Annotation Keeps Its Parentheses When Parameters Expand"

description = '''
`assemble_result`'s four parameters make the inline header overflow `code-line-length`, so `signature-layout` expands them one per line. The return annotation's parentheses wrap a three-line union, `PrimaryEnvelope | SecondaryEnvelope | DeferredEnvelope`, and **those parentheses pass through intact**, since they are what let the type span multiple lines and dropping them would leave output that fails to parse.
'''

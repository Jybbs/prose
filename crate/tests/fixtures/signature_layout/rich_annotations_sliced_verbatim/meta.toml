[docs]
previewable = false
title       = "Rich Annotations Are Sliced Verbatim"

description = '''
`configure`'s five parameters carry varied annotations, `Callable[[int, str], bool]`, `Mapping[str, Any]`, `Annotated[dict[str, int], "extra"]`, `tuple[str, ...]`, and a `timeout: Optional[float] = None` default, exceeding `max-params`. `signature-layout` expands the signature to one parameter per line with **each annotation's source slice preserved verbatim**.
'''

[docs]
previewable = true
title       = "A Constructor Called With Nothing Reaches Its Literal"

description = '''
`dict()`, `list()`, and `tuple()` each collapse to their empty literal, `{}`, `[]`, and `()`. `set()` has no such literal, since `{}` already names an empty dict, so `simplify-comprehensions` leaves `unique = set()` written as a call.
'''

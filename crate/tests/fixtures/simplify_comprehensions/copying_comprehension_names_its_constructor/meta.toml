[docs]
previewable = true
title       = "A Comprehension That Copies Its Input Names the Constructor Instead"

description = '''
`[row for row in rows]`, `{row for row in rows}`, and `{key: value for key, value in rows}` each repeat their generator's target as the element unchanged, so every one is spelling a plain copy of `rows`. `simplify-comprehensions` collapses each to the constructor it was already building, `list(rows)`, `set(rows)`, and `dict(rows)`.
'''

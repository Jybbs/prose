[docs]
previewable = false
title       = "A Copying Dict Comprehension Inside `dict()` Becomes One `dict` Call"

description = '''
`dict({key: value for key, value in rows})` wraps a dict comprehension that repeats `key, value` unchanged as each entry, so the comprehension only copies `rows`. **The call and the comprehension become `dict(rows)` in one rewrite**, whereas a comprehension that transforms its values keeps the comprehension and drops the `dict()` call instead.
'''

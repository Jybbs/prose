previewable = false
title       = "A Call to Anything Else Holds Its Argument"

description = '''
`registry.make([1, 2])` calls an attribute, and `record([1, 2])` calls a name that isn't `dict`, `list`, `set`, or `tuple`. Neither callee matches a constructor `simplify-comprehensions` acts on, so the `[1, 2]` literal each one carries stays exactly where it was written.
'''

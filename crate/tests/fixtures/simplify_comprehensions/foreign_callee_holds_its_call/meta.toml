[docs]
previewable = false
title       = "A Call to Any Other Callee Keeps Its Argument"

description = '''
`registry.make([1, 2])` calls an attribute, and `record([1, 2])` calls a name other than `dict`, `list`, `set`, or `tuple`. **Both `[1, 2]` literals stay exactly where they were written**, because neither callee is a constructor the rule rewrites.
'''

[docs]
previewable = false
title       = "A Copy Written Against a Keyword Gets a Separating Space"

description = '''
`return[row for row in rows]` opens its comprehension directly after `return` with no space, and `return not{row for row in rows}` does the same after `not`. **The rewrite inserts the space that keeps `return list` and `not set` as two tokens**, because writing `list(rows)` or `set(rows)` flush against the keyword would run the constructor name into it.
'''

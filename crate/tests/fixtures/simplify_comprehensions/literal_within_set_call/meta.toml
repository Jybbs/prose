[docs]
canonical   = true
previewable = true
title       = "A List or Tuple Literal Inside `set()` Becomes a Set Literal"

description = '''
`set([1, 4, 9])` passes a list literal, and `set(("alpha", "beta"))` passes a tuple literal, each already spelling the set's members. `simplify-comprehensions` trades the call for the brace form, so `squares` becomes `{1, 4, 9}` and `labels` becomes `{"alpha", "beta"}`.
'''

title       = "A Comprehension Whose Target Does Not Match Its Entry Stays as Written"

description = '''
`{key: value for pair in rows}` binds one name, `pair`, as its target, while its entry `key: value` names two others. **`paired` stays exactly as written**, because the comprehension is not copying `rows`, so no `dict(...)` call could spell what it builds.
'''

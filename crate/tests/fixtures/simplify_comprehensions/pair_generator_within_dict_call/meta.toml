[docs]
previewable = true
title       = "A Pair-Yielding Comprehension Inside `dict()` Becomes a Dict Comprehension"

description = '''
`dict((row.key, row.width) for row in rows)` and `dict([(row.key, row.label) for row in rows])` each yield two-member tuples, so the pair inside each one splits on its comma into a key and a value. `simplify-comprehensions` rewrites both as dict comprehensions, `widths = {row.key: row.width for row in rows}` and `labels = {row.key: row.label for row in rows}`, building the mapping directly instead of through a `dict()` call.
'''

[docs]
previewable = false
title       = "A Call Inside a Replacement Field Stays as Written"

description = '''
`label = f"{set([x for x in xs])}"` writes a copying comprehension inside an f-string replacement field, and `plain = set([x for x in xs])` writes the same expression outside any string literal. **The field's call stays as written and `plain` becomes `set(xs)`**, because the rule does not read inside an f-string's replacement fields.
'''

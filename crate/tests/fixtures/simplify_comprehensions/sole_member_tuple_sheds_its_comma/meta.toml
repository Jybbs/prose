[docs]
previewable = true
title       = "A One-Member Tuple Drops Its Comma on the Way Out"

description = '''
`set((only,))` and `list((only,))` each wrap a one-member tuple, and both rewrite to the direct literals `{only}` and `[only]`. The comma in `(only,)` is grammar rather than content, in that it only marks the expression as a tuple, so the rewritten literal drops it along with the parentheses.
'''

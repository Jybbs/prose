[docs]
previewable = false
title       = "A Transforming Dict Comprehension Inside `dict()` Drops the Call"

description = '''
`dict({key: normalize(value) for key, value in rows})` wraps a dict comprehension that passes each value through `normalize`, so the comprehension builds a new mapping rather than copying `rows`. **The `dict()` call is removed and the comprehension stays**, whereas a copying comprehension becomes `dict(rows)` instead.
'''

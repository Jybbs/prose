[docs]
previewable = true
title       = "An Unpacked or Mixed Argument List Holds the `dict()` Call"

description = '''
`dict(**defaults)` unpacks a mapping without spelling out any key, and `dict(defaults, extra=1)` builds its result from a positional argument plus a keyword. Rewriting either as a `{...}` literal would need keys the call never names, so both `dict()` calls hold.
'''

[docs]
previewable = false
title       = "An Unpacking Comprehension Stays as Written"

description = '''
`{**row for row in rows}` spreads each `row`'s entries into the result, and `[*row for row in rows]` does the same with each row's elements. **Both comprehensions stay as written**, because each member is unpacked rather than copied, and `dict(rows)` or `list(rows)` would keep the rows whole.
'''

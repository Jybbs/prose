[docs]
previewable = false
title       = "An Unpacking Comprehension Stands"

description = '''
`{**row for row in rows}` spreads each `row`'s entries into the result, and `[*row for row in rows]` does the same with its elements, so each member is unpacked rather than copied. A constructor call like `dict(rows)` or `list(rows)` would keep the rows whole, so both comprehensions stand.
'''

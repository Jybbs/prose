[docs]
previewable = true
title       = "Every Target Read Once Names Its Subscript Rewrite"

description = '''
Both targets of `first, second = batch` are read exactly once, inside `combine(first, second)`, so the whole unpacking could dissolve into subscripts. The lint flags each target and names its rewrite, `batch[0]` for `first` and `batch[1]` for `second`, while the source itself is left unedited.
'''

[docs]
previewable = true
title       = "An Attribute Right-Hand Side Names Its Subscript Rewrite"

description = '''
`x, y = point.coords` unpacks an attribute access, and each target is read exactly once in `render(x, y)`. An attribute right-hand side supports the subscript rewrite the same way a plain name does, so the lint flags both targets and names `point.coords[0]` for `x` and `point.coords[1]` for `y`.
'''

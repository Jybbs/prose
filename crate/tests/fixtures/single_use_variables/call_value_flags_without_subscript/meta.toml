[docs]
previewable = true
title       = "A Call Right-Hand Side Flags Without a Suggestion"

description = '''
`name, value = lookup()` unpacks a call result, and each target is read exactly once in `render(name, value)`. Rewriting the reads as `lookup()[0]` and `lookup()[1]` would run the call twice, so the lint flags both targets without naming a subscript rewrite, which it reserves for a plain-name or attribute right-hand side.
'''

[docs]
previewable = true
title       = "A Closure-Captured Single-Use Binding Is Flagged"

description = '''
`helper` in `factory` is read once, inside the `lambda x: x * helper` closure, and the analyzer attributes that read to `factory`'s own scope rather than the lambda's, **so `helper` is flagged as single-use**. Inlining `helper` would shift when `compute()` runs if it carries a side effect, so the diagnostic surfaces for review rather than triggering a rewrite.
'''

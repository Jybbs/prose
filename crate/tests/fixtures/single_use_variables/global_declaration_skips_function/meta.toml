[docs]
previewable = true
title       = "Global-Scope Function Bindings Aren't Single-Use"

description = '''
`updater` declares `global counter`, so `single-use-variables` **skips the whole function** rather than reasoning about `next_value` in isolation, because tracking whether `counter` is truly single-use would mean following the binding out to module scope. The exemption covers the entire function body, not just the `global` line.
'''

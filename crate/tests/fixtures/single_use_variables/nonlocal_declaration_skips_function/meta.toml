[docs]
previewable = false
title       = "A `nonlocal` Declaration Skips the Function"

description = '''
`inner` declares `nonlocal counter`, and that **skips the whole function** rather than just the `nonlocal` line.

`bumped` is never considered, even though on its own it looks single-use. Deciding whether `counter` is truly single-use would mean following the binding out along the closure chain into `outer`, so the rule steps back from the entire body instead.
'''

[docs]
previewable = false
title       = "A Backslash Join Above a Suppression Region Stays as Written"

description = '''
A `# prose: off` region opens directly beneath a `\` explicit line join, which puts the directive's own row on the joined line. **The join stays as written ahead of the region**, so the gap above the directive keeps the form the author wrote rather than one that would leave the backslash with nothing to join.
'''

[docs]
previewable = false
title       = "A Backslash Join Below a Leading Comment Keeps Its Blank Run"

description = '''
The file opens with the comment `# notes`, two blank lines, and a `\` explicit line join on the row above `y = 2`. A module's leading comment block ordinarily caps the blank run beneath it at one line, and here the join opens the row that run ends on, so capping it would remove the line break the join rests on. **The run keeps every blank line the author wrote**, because the cap never reaches across a join.
'''

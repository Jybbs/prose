previewable = false
title       = "A Backslash Join Between Two Statements Holds"

description = '''
`x = 1` and `y = 2` are adjacent statements whose canonical gap the rule would ordinarily settle, and a `\` explicit line join sits between them. **The pair keeps the gap the join occupies**, since the break beneath the backslash belongs to the join rather than to the statements on either side.
'''

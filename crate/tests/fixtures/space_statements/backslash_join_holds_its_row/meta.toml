[docs]
previewable = false
title       = "A Backslash Join Keeps Its Row"

description = '''
The file opens with a `\` explicit line join on the row above `y = 2`, which makes that row part of the row above, so the line break between them is no gap between statements at all. **The joined row is left alone**, because rewriting the run would remove the newline the join rests on and leave source that no longer parses.
'''

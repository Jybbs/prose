title       = "A Backslash Join Inside a Body Stays as Written"

description = '''
Inside `f`, a `\` explicit line join sits on its own row between `x = 1` and `y = 2` at the body's indent. **The joined row inside the body is left alone**, exactly as one at module level is, because the join reads the same at any indentation.

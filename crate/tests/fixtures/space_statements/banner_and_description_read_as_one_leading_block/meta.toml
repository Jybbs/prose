previewable = false
title       = "A Banner and a Description Read as One Leading Block"

description = '''
The file opens with the `# Section: Configuration` banner, a blank line, and the description `# describes the sink` directly above `import os`. **The banner and the description count as one leading block running from the first own-line comment to the last**, so the divider's blank line is written between `# describes the sink` and `import os`, and the blank line already between the two comments stays.
'''

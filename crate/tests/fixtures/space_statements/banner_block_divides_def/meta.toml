[docs]
previewable = true
title       = "Banner Comments Don't Block the Blank-Line Discipline"

description = '''
The `# ====` banner block between `first` and `second` reads as a **section divider rather than a comment describing `second`**. The canonical two-blank gap between module defs therefore lands above the banner, and a single blank separates the banner from the `def second():` below it.
'''

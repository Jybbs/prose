[docs]
previewable = true
title       = "Banner Comments Don't Block the Blank-Line Discipline"

description = '''
The `# ====` banner block between `first` and `second` reads as a **section divider rather than a comment describing `second`**.

That changes where the gap goes. The canonical two-blank gap between module-level definitions lands above the banner, and a single blank separates the banner from the `def second():` beneath it.
'''

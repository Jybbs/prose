[docs]
previewable = false
title       = "A Decorated Class Binds Its Docstring and Spaces Its Fields"

description = '''
`Posting`, decorated with `@final` and `@dataclass`, has a blank line between its header and its docstring, and its fields `company` and `title` and the method `summary` sit flush below the docstring. **The blank line between the header and the docstring closes to none**, whatever decorators sit above the class, and one blank line is written between the docstring and `company` and another between `title` and `def summary(self):`.
'''

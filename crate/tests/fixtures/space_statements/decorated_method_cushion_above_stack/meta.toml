[docs]
previewable = false
title       = "The Blank Line Before a Decorated Method Sits Above Its Decorators"

description = '''
Inside `Posting`, the `capacity` field runs straight into the `label` method's decorators `@cached_property` and `@logged`. **The one blank line between a field and a method is written above the topmost decorator**, rather than between `@logged` and the `def`, so the decorator stack stays bound to its method, and the class header gains its one blank line before `capacity`.
'''

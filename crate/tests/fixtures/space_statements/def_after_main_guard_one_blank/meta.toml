[docs]
previewable = false
title       = "A Def After the `__main__` Guard Takes One Blank Line"

description = '''
`def cleanup():` sits three blank lines below the `if __name__ == "__main__":` block. **The gap narrows to one blank line**, because the count after a `__main__` guard takes precedence over the two blank lines a module-level `def` takes otherwise.
'''

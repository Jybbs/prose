title       = "A Decorated Def's Leading Edge Is Its Topmost Decorator"

description = '''
`second` carries the stacked decorators `@first_decorator` and `@second_decorator`, one blank line below `first`. **The gap is measured above the topmost decorator rather than above the `def` line**, so the one blank line widens to two above `@first_decorator` and the stack stays flush against its `def`.
'''

[docs]
previewable = false
title       = "Defs Inside an `if` Body Take No Canonical Count"

description = '''
`alpha` and `beta` sit flush against each other inside the `if FEATURE_X:` body. **No blank line is inserted between them**, because the rule reads into the `if` body to find nested classes and functions and applies no canonical count at that indentation, so the source passes through unchanged.
'''

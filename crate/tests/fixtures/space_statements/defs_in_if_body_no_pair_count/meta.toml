description = '''
`alpha` and `beta` sit directly against each other inside the `if FEATURE_X:` body, and **no blank lines are inserted between them**. The walker descends into the if body to find nested classes and functions, yet it applies no canonical count at the if-body indentation, so the source passes through unchanged.

title       = "Adjacent Fields Stay Tight While Oversized Method Gaps Collapse to One"

description = '''
Inside `Posting`, the fields `field` and `name` sit flush below the header and against each other, with three blank lines before `m1` and three more between `m1` and `m2`. **The three-blank-line gaps collapse to one each, and no blank line is inserted between the two adjacent fields**, whereas one blank line is written between the class header and `field`.

title       = "A Label Flanked by Dashes Divides Like a Full Rule"

description = '''
`# --- Auxiliary Helpers ---` sits between `first` and `second` with no blank line on either side. **The label flanked by short dash runs reads as a section divider rather than as a description of `second`**, so the canonical two blank lines are written above it and one blank line separates it from `def second():`.

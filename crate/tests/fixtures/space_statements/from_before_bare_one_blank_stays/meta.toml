previewable = false
title       = "One Blank Line Between a `from` Import and a Bare Import Stays"

description = '''
`from sys import argv` sits one blank line above the bare `import os`, the reverse order of the sibling case, with the rule running alone. **The blank line stays as written**, because `space-statements` alone sets no count between two imports, so the source passes through unchanged.
'''

[docs]
previewable = false
title       = "A Function Header Takes One Blank Line Before a Compound Opener"

description = '''
Every function here opens its body with a compound statement written flush against the header. **One blank line is inserted between the header and that opener in each**, for `match`, `if`, `for`, `while`, `with`, and `try` alike, and `with_async_for` and `with_async_with` take it too, because the `async` forms are the same statement kinds in the AST.
'''

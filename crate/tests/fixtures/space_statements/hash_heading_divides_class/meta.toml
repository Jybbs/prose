description = '''
`### Codec APIs` opens with several `#`, which reads as a **section divider rather than a description of the class below it**.

The canonical two-blank gap after `import codecs` therefore sits above the heading, and the single blank the author left below it stays. Separately, `Codec`'s own body gains one blank line between its header and `pass`.

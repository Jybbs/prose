title       = "An Indented Hash Heading Divides Methods"

description = '''
The indented `### Lifecycle` heading between `open` and `close` reads as a **section divider, and dividers hold at class scope too**.

One blank line lands above it and one below, separating the two methods around it rather than binding the heading to `close` as its leading comment.

title       = "A Comment Below a Class Header Binds to the First Member"

description = '''
`# describes the first method` sits flush between `class Posting:` and `def m1(self):`. **One blank line is written between the class header and the comment, and the comment stays flush against the method**, because it reads as `m1`'s leading block rather than as a note on the class.
'''

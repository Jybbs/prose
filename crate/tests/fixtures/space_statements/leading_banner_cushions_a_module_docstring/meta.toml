[docs]
previewable = false
title       = "A Leading Banner Takes One Blank Line Above a Module Docstring"

description = '''
The `# Copyright and license notice` banner opens the file directly above a module docstring rather than above code. **One blank line is written between the banner and the docstring, exactly as it would be above a first import**, because the rule places the blank line below a leading block without regard to the kind of statement beneath it.
'''

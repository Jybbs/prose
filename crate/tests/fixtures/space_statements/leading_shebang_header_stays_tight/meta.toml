[docs]
previewable = false
title       = "A Shebang Header Stays Flush Against the First Statement"

description = '''
`#!/usr/bin/env python` and `# -*- coding: utf-8 -*-` open the file flush against `import os`, with no rule line, heading, directive, or pragma among them, so the pair reads as a description of the import. **The header keeps the flush spacing the author wrote**, because the cap below a leading block only ever trims a run the author opened and never creates a gap that was not there.
'''

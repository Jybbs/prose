title       = "A Method's Leading Comment Takes One Blank Line Above and None Below"

description = '''
Inside `Posting`, `# describes the second helper` sits three blank lines below `first` and flush against `def second(self):`. **The three blank lines collapse to one above the comment, and the comment stays flush against the method it describes**, whereas the class header gains its one blank line before `first`.

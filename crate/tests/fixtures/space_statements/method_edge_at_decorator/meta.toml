title       = "A Method's Gap Is Measured From Its Decorator"

description = '''
Inside `Posting`, `second` carries `@cached_property` and sits three blank lines below `first`. **The three blank lines collapse to the one blank line class scope takes, measured above `@cached_property`**, so the decorator stays flush against its method, and the class header gains its one blank line before `first`.
'''

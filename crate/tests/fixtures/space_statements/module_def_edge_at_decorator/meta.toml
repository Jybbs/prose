[docs]
previewable = true
title       = "Decorators Travel with Their `def`, Not above the Blank Run"

description = '''
`def second` carries `@decorator`, so the blank lines separating it from `first` are counted above the decorator line rather than between the decorator and the `def`. **The single blank grows to two above `@decorator`**, and the decorator stays directly attached to the `def` it modifies.
'''

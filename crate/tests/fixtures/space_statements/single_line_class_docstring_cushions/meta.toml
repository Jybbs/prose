title       = "A Single-Line Class With a Docstring Body Takes Two Blank Lines on Each Side"

description = '''
`class B: "doc"` keeps its docstring on the header line, sitting flush between `A` and `C`. **Two blank lines are written on each side of `B`**, the same count any single-line class takes, and because `"doc"` sits on the header there is no gap inside `B` to set.

previewable = false
title       = "A Single-Line Class Stub Takes the Same Two Blank Lines as a Block Class"

description = '''
`class Beta: ...` keeps its `...` body on the header line, sitting flush between the block-bodied `Alpha` and `Gamma`. **Two blank lines separate `Beta` from each neighbor**, the same count a block-bodied class takes, and because the `...` sits on the header there is no gap inside `Beta` to set.
'''

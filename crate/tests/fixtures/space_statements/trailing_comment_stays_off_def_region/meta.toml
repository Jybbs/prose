title       = "A Trailing Comment Stays With Its Statement"

description = '''
`first`'s body ends with `return 1  # short note`, a trailing comment on the statement's own line, one blank line above `second`. **The comment stays with `return 1` rather than being read as a leading line above `second`**, so the gap between the two defs widens from one blank line to two without touching the commented line.
'''

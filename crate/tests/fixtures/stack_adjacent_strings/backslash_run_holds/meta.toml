[docs]
previewable = true
title       = "A Backslash-Continued Run Is Already One per Line"

description = '''
`message`'s run already breaks one literal per line, using a trailing backslash instead of parentheses to continue across the line break. `stack-adjacent-strings` gives this shape the same hold a parenthesized run gets, **so the backslash continuation stays exactly as written**.
'''

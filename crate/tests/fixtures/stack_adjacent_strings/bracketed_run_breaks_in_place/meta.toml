[docs]
previewable = true
title       = "A Run inside a Bracket Breaks without Adding Parentheses"

description = '''
`emit`'s call parentheses already enclose the two-clause run, so `stack-adjacent-strings` **breaks the run in place** rather than wrapping it in a nested pair of its own. `"and the trailing clause"` lands at the indent of the row the run opens on, one literal per line inside `emit(...)`.
'''

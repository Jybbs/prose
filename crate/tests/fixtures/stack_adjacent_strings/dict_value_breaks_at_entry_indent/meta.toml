[docs]
previewable = true
title       = "A Dict Value Breaks at Its Entry's Indent"

description = '''
`table`'s single entry has a run standing as its value, and `stack-adjacent-strings` **breaks that run at the indent of the entry's own row** rather than at the column the value opens at. The entry keeps its `key: value` line whole instead of hanging at the `:`.
'''

description = '''
`label`'s run mixes an f-string, `f"the opening clause {value} of this notice "`, with a plain literal, `"and the trailer"`. `stack-adjacent-strings` **breaks between the two parts**, leaving the `{value}` replacement field untouched inside the f-string part that carries it.

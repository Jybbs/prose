[docs]
previewable = true
title       = "A Run Carrying a Part with Its Own Break Stays Put"

description = '''
`message`'s run holds a triple-quoted part that already spans two lines next to a plain literal, `"and the trailing clause"`. `stack-adjacent-strings` **leaves the run as written**, because moving the triple-quoted part would place its opening line away from the interior the source already pinned it to.
'''

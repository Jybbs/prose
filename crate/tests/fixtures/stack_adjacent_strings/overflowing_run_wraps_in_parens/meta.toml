title       = "A Run past the Budget Breaks One Literal per Line"

description = '''
`message`'s run joins two adjacent string literals onto one line that overruns `code-line-length`. `stack-adjacent-strings` **wraps the run in parentheses and gives it one literal per line**, so the seam between `"the opening clause of this notice "` and `"and the trailing clause"` falls at a line end.
'''

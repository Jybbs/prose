title       = "A Run Scattered Unevenly Settles One per Line"

description = '''
`message`'s run spans two lines with two literals sharing the first one, `"the opening clause "` and `"and a middle clause"`, and a third literal on its own line. `stack-adjacent-strings` **normalizes the whole run to one literal per line**, the ragged boundary being exactly the shape the rule exists to settle.

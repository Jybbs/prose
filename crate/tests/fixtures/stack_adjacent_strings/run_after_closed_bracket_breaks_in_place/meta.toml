[docs]
previewable = true
title       = "A Run Following a Closed Bracket Reads Its Own Enclosing One"

description = '''
`helper(alpha)` opens and closes before the run in `emit(helper(alpha), ...)`, so the bracket the break answers to is `emit`'s own parentheses rather than the nested `helper(...)` pair that already closed. `stack-adjacent-strings` **breaks the run in place at `emit`'s indent**, leaving `helper(alpha)` on the first line.
'''

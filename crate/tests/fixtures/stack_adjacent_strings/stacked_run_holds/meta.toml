title       = "A Run Already One per Line Is Left Alone"

description = '''
`message`'s run is already written one literal per line, `"a short clause "` then `"and another"`, even though the joined form would clear `code-line-length`. `stack-adjacent-strings` **holds that shape rather than rejoining it**, because the rule only ever breaks a run and never rejoins one.
'''

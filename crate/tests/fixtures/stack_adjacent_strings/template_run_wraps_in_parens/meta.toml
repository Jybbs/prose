[docs]
previewable = true
title       = "A Template-String Run Breaks Like Any Other"

description = '''
`label`'s two `t"..."` template-string literals concatenate the way `str` and `bytes` literals do, and together they overflow the line. `stack-adjacent-strings` **gives the template run the same one-per-line break** that any other over-budget run gets, wrapping the assignment in parentheses the source did not have.
'''

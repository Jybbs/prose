[docs]
canonical   = false
previewable = false
title       = "A Chain Already Stacked Gets No Edit"

description = '''
The `pstats.Stats(profile)` chain is already written the way the break would write it, one link per row inside a parenthesis pair, so **no edit is produced**.

The rule reads the chain once and does not read its receiver as a second chain, because that reading would take the first three links as a chain of their own and wrap them in a second parenthesis pair.
'''

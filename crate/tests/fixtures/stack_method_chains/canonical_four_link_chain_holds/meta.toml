title       = "A Chain Already in the Broken Shape Emits Nothing"

description = '''
Nothing here moves. The `pstats.Stats(profile)` chain already sits in precisely the shape the break would emit, so no edit is produced.

The walk then **passes the chain by rather than descending into it**. A descent would read the first three links as a chain of their own and gather them inside a second pair of parentheses.
'''

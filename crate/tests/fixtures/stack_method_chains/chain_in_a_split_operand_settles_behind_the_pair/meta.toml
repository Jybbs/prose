title       = "A Chain Inside a Split Operand Settles Behind the Pair"

description = '''
Nothing here moves. The `%` expression runs over budget at a narrow width, so `reflow-parentheses` breaks its operands across rows before the chain rule ever reaches the `os.urandom(8).hex()` sitting inside the right operand.

**That ordering is what the `stack-method-chains` dependency column declares.** Running the chain rule first would leave the surrounding pair unsettled, and the chain would then be measured against a shape about to change underneath it.
'''

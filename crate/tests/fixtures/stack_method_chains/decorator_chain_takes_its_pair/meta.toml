title       = "A Decorator Chain Breaks Inside the Same Parenthesis Pair"

description = '''
`@registry.route(path).methods(verbs).build()` is a three-link chain on a decorator line. **It breaks like any other chain, with the parenthesis pair written directly after the `@`** and `.methods` and `.build` stacked beneath the dot of `registry`. PEP 614 lets a decorator carry any expression from Python 3.9, below the 3.10 floor the project targets.
'''

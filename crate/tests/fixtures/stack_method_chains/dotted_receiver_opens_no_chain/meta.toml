title       = "A Dotted Name Ahead of One Call Is Not a Chain"

description = '''
`settings.rules.stack_method_chains.max_links.cap()` is a long dotted name ending in a single call, so only `.cap()` counts as a link. **The statement stays as written**, because a chain needs at least two links before either trigger reads it.
'''

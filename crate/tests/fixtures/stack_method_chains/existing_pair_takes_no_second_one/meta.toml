title       = "A Parenthesized Chain Reuses Its Own Pair"

description = '''
`(query.filter(a).order(b).limit(c))` is already wrapped in parentheses. **Breaking the chain reuses that pair rather than adding a second one**, so `query.filter(a)` drops inside it with `.order` and `.limit` stacked beneath.
'''

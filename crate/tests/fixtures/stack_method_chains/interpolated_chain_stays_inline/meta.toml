title       = "A Chain Inside a Replacement Field Stays Inline"

description = '''
`query.filter(a).order(b).limit(c)` sits inside an f-string replacement field. **The chain stays inline**, because breaking it would write a line break inside a single-quoted field. That is PEP 701 syntax, which parses on Python 3.12 and later and fails everywhere earlier, so the rule changes no layout inside a replacement field.
'''

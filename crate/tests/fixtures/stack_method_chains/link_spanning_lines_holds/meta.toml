title       = "A Link Still Spanning Lines Keeps the Chain as Written"

description = '''
The `.filter(` link is written with `alpha` and `beta` one per line under a trailing comma, so the link still spans lines when the chain is measured. **The chain stays as written**, because the rule reads each link as one row and a link that cannot reach one row blocks the restack.
'''

title       = "A `false` `max-links` Leaves Width as the Only Trigger"

description = '''
With `max-links = false`, the three-link `short` chain stays inline whatever its link count. **The `wide` chain still breaks, because it crosses `code-line-length`**, so width stays the one trigger once the count trigger is removed.
'''

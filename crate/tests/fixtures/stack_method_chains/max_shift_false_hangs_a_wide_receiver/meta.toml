title       = "A `false` `max-shift` Hangs Every Chain"

description = '''
`max-shift = false` lifts the cap on how deep the dot column may sit, so `.order` and `.limit` hang aligned beneath the dot of `an_extremely_long_receiver_name` however wide that receiver runs. The full split that would otherwise catch an over-shift chain never fires.
'''

title       = "A `false` `max-shift` Hangs Every Chain"

description = '''
`max-shift = false` removes the limit on how far out the dot column may sit. **`.order` and `.limit` hang beneath the dot of `an_extremely_long_receiver_name`** however wide that receiver is, and the full split that would otherwise catch a chain past the limit never applies.
'''

title       = "A Chain Inside a Broken Chain's Link Breaks Where It Ends Up"

description = '''
Breaking the outer chain moves the `.relative_to` link to the hang column, and the `self.locate_file('').resolve()` chain inside its argument crosses the `60`-column budget from there. **The inner chain breaks in the same text**, wrapped in its own parenthesis pair at the indent of the row it ends up on.

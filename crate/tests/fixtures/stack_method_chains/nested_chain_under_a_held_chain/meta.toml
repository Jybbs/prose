title       = "A Chain Inside an Unbroken Chain's Argument Still Breaks"

description = '''
The outer `base.first(...).second(beta)` chain is under both triggers, so its own layout is left alone. **The three-link `other.one().two().three()` passed to `first` still breaks into a parenthesis pair inside the call**, because the rule reads each link's arguments and the inner chain exceeds `max-links` on its own.
'''

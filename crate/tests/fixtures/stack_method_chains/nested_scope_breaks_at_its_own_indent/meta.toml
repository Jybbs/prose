title       = "A Chain in a Nested Scope Opens at Its Own Indent"

description = '''
The three-link chain sits in a `return` inside `def build`, whose body is indented four spaces. **`query.filter(a)` drops one step past that indent and the closing `)` returns to it**, so the block hangs from the body indent rather than from the module margin.

title       = "A Link Past `max-args` Holds the Chain"

description = '''
Nothing here moves. `first` takes four arguments, past `max-args`, so its hand-wrapped argument list never closes back onto one row.

It cannot explode to keyword form either, because `base.first` resolves to no signature and the line already fits under the width cap. **The fracture therefore stands**, which means the link still spans lines when the chain is measured, and the chain stays where the source put it.
'''

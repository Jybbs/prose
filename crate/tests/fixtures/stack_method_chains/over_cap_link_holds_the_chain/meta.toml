title       = "A Link Past `max-args` Keeps the Chain as Written"

description = '''
`first` takes four arguments, one past the default `max-args`, hand-wrapped one per line, and no join closes the list back onto one row when the chain is measured.

**The chain stays as written**, because the `.first(` link still spans lines and a link that cannot reach one row blocks the restack.
'''

title       = "A Parenthesized Receiver Keeps Its Own Parentheses"

description = '''
The receiver `(alpha + beta)` needs its parentheses, because without them `.filter` would attach to `beta` alone. **The pair moves with the receiver onto the head row**, so `(alpha + beta).filter(a)` opens the block and `.order` and `.limit` stack beneath its dot.
'''

title       = "A Cleared `reflow-calls` Holds the Whole Chain"

description = '''
Measuring the chain reads each link at the width the fractures inside it settle to, and no fracture closes while [[reflow-calls]] is off. The `.lookup` link carrying the hand-wrapped `compute(alpha,` argument list therefore still spans lines when the chain is read, so no break lands and the chain stays exactly where the source put it.
'''

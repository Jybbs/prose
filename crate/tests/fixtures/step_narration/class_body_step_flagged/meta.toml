description = '''
`# 1. normalize input` sits on its own line inside `Processor`'s class body, ahead of `run`, and `step-narration` **flags it the same way it flags a numbered-step comment inside a function**. The comment's enclosing scope plays no part in the match, only its own-line numbered-step shape.

[docs]
previewable = true
title       = "A `# fmt: off` Block Suppresses the Lint"

description = '''
`# 1. normalize input` sits inside a `# fmt: off` block in `process`, and `step-narration` **drops the diagnostic it would otherwise report on that comment**. The suppression carries the same weight against lint diagnostics as it does against rewrites, covering both alike.
'''

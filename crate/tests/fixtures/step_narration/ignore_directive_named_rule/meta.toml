[docs]
previewable = false
title       = "An Ignore Directive Suppresses Only the Rule It Names"

description = '''
`# 1. normalize input` carries `# prose: ignore[step-narration]` and `# 2. fold the result` carries `# prose: ignore[align-equals]`, both inside `process`. **Only the second comment is reported**, because the directive suppresses a diagnostic only when it names this rule's slug, and `align-equals` is a different rule.
'''

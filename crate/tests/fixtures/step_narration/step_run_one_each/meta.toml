title       = "Multiple Steps in One Function Surface One Lint Each"

description = '''
`process` narrates its three statements with `# 1.`, `# 2.`, and `# Step 3:` comments, and the lint reports **one diagnostic per matching comment** rather than collapsing the run into a single report. Each diagnostic's range covers its own comment, so the numeric-dot and step-word shapes match independently.

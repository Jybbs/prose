title       = "Inline End-of-Line Comments Stay Quiet"

description = '''
The trailing `# 1. trim whitespace` sits at the end of the `cleaned = payload.strip()` line rather than on a line of its own, and **only comments occupying their own line are checked**, so nothing is reported even though the text matches the numbered-step shape. The source passes through unchanged.

[docs]
previewable = false
title       = "Decimal-Version Comments Sit Out"

description = '''
`# 1.2 release notes` and `# 2.0 spec compliance` each place a digit immediately after the `.`, and `step-narration`'s numbered-step shape **requires whitespace there before it counts as a step**. Because that whitespace is missing, neither comment matches, so decimal-version comments never trigger the lint.
'''

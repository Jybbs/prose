[docs]
previewable = true
title       = "Multi-Line Singleton Signatures Drop the Padding Too"

description = '''
`fetch`'s signature spans multiple lines but holds only `timeout : float,`, the lone parameter, so `strip-align-padding` **strips its pre-`:` padding** down to `timeout: float,`. `render`'s signature holds two parameters, `template : str,` and `context  : dict,`, each on its own line, so the rule defers to `align-colons` and their padding stays.
'''

[docs]
previewable = true
title       = "Normalizing the Colon Gap Leaves a Parenthesized Value Intact"

description = '''
`{"key":   (1, 2)}` pads its `:` with three spaces before the tuple `(1, 2)`. `strip-align-padding` **settles the gap to one space**, measuring from the tuple's own opening `(` so the parentheses stay exactly where they are, landing on `{"key": (1, 2)}`.
'''

previewable = true
title       = "Async Functions and Methods Drop the Annotation Alike"

description = '''
`Service.__init__` and the `async def shutdown` function each declare a redundant `-> None`, and `strip-none-return` drops the annotation from both. The strip reaches an `async def` and a method the same way, landing on `def __init__(self):` and `async def shutdown():`.
'''

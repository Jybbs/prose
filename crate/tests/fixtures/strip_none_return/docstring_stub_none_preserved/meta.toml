[docs]
previewable = false
title       = "A Stub With a Docstring Keeps Its `-> None`"

description = '''
`Reader.close` is a `Protocol` method whose body is the docstring `"""Close the reader."""` followed by a single `...`. **`strip-none-return` leaves its `-> None` in place**, because a docstring ahead of the `...` still leaves the body a declaration-only stub.
'''

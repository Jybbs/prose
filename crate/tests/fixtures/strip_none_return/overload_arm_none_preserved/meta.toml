[docs]
previewable = true
title       = "An Overload Stub's None Return Annotation Survives"

description = '''
The first `@overload` arm of `f` declares `-> None` with a body of a single `...`, and `strip-none-return` leaves it untouched, because the placeholder declares the type-checker contract rather than a redundant annotation. Stripping it would leave that arm declaring no return beside the second arm's `-> str`.
'''

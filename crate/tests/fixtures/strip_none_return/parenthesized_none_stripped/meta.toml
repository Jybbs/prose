[docs]
previewable = true
title       = "A Parenthesized None Return Drops Its Wrapping Parens"

description = '''
`configure`'s `-> (None)` return annotation wraps `None` in parentheses, and `strip-none-return` drops the parentheses along with the arrow, landing on `def configure():`. The rule reaches this parenthesized form as readily as a bare `-> None`.
'''

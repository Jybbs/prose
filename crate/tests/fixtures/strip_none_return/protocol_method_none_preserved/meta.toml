[docs]
previewable = false
title       = "A `Protocol` Method Stub Keeps Its `-> None`"

description = '''
`Reader.close` is a `Protocol` method whose whole body is a single `...`. **`strip-none-return` leaves its `-> None` in place**, because the annotation on a `...` body is the return type a structural type checker reads rather than a restatement of a body that returns nothing.
'''

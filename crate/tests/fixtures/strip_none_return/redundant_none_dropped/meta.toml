title       = "A Redundant Return Annotation Is Dropped"

description = '''
`configure` and `reset` each declare an explicit `-> None`, and both are stripped away, landing on `def configure():` and `def reset(state):`.

An omitted return annotation **already reads as a function that returns nothing**, so the explicit form carries no information worth keeping.
'''

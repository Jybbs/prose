[docs]
canonical   = true
previewable = true
title       = "A Redundant Return Annotation Is Dropped"

description = '''
`configure` and `reset` each declare an explicit `-> None`, and `strip-none-return` strips both away, landing on `def configure():` and `def reset(state):`. An omitted return annotation already reads as a function that returns nothing, so the explicit form carries no information the rule needs to keep.
'''

[docs]
previewable = false
title       = "Collapsed Multi-Entry Dict Strips Every Colon"

description = '''
`oneline = {"first" : 1, "second" : 2, "third" : 3}` sits on a single line, so each entry's `:` has no column to line up with, and `strip-stranded-padding` **strips every entry's pre-`:` padding** down to `oneline = {"first": 1, "second": 2, "third": 3}`. `multiline`'s two entries stay spread across separate lines, so their padding belongs to `align-colons` instead and stays untouched here.
'''

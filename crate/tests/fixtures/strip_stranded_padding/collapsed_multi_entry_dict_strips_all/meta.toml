[docs]
previewable = false
title       = "A One-Line Multi-Entry Dict Loses the Padding Before Every Colon"

description = '''
`oneline = {"first" : 1, "second" : 2, "third" : 3}` sits on a single line, so no entry's `:` has a column to line up with. **`strip-stranded-padding` removes the padding before every `:`**, writing `oneline = {"first": 1, "second": 2, "third": 3}`, whereas `multiline`'s two entries sit on separate lines, so their padding belongs to `align-colons` and stays.
'''

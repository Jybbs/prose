[docs]
previewable = false
title       = "A Commented Multi-Line Dict Keeps Its Padding"

description = '''
`multiline` carries two entries, `"first"  : 1` and `"second" : 2`, each followed on its line by a trailing comment, so the pair still forms one multi-row group for `align-colons`. **`strip-stranded-padding` keeps the padding before each `:`**, because it removes a column only when no alignment group keeps it.
'''

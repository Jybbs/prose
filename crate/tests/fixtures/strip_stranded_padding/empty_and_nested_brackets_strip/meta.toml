[docs]
previewable = false
title       = "Empty and Nested Brackets Lose Their Padding"

description = '''
`empty = call( )` carries a single space between its parentheses with nothing inside them, and `nested = outer( inner( x ) )` pads both the outer and inner calls. **`strip-stranded-padding` writes `call()` and `outer(inner(x))`**, removing the padding at each level.
'''

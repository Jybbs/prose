[docs]
previewable = false
title       = "Only the Pad Is Removed and the Interior Stays"

description = '''
`d[ 1 ]`, `s[ 1 : 2 ]`, and `trailing = [ 1, 2, ]` each pad just inside their brackets. **`strip-stranded-padding` removes only that bracket padding**, writing `d[1]`, `s[1 : 2]` with the spacing around the slice `:` kept, and `[1, 2,]` with its trailing comma left for `strip-trailing-commas` to remove.
'''

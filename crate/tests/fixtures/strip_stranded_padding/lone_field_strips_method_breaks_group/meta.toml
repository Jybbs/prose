[docs]
previewable = false
title       = "A Method Ends the Line-Adjacent Field Group"

description = '''
`Solo.only_field` is the lone annotated field in its class, and `WithMethod.sole_field` sits alone too, because the `serialize` method that follows ends the line-adjacent group rather than joining it. **`strip-stranded-padding` removes the padding before the `:` on both**, whereas `Pair`'s `first` and `second` sit on adjacent lines and keep their padding for `align-colons`.
'''

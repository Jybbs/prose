[docs]
previewable = true
title       = "A One-Arg Docstring `Args:` Block Drops the Colon Padding"

description = '''
`fetch`'s docstring `Args:` section holds one entry, `timeout : Maximum seconds to wait before giving up.`, and `strip-stranded-padding` **strips its pre-`:` padding** down to `timeout:`. `render`'s `Args:` section holds two entries, `template` and `context`, so their padding stays for `align-colons` to align in a separate pass.
'''

[docs]
previewable = false
title       = "A Singleton Loses Its Padding Beside a Leading or Trailing Comment"

description = '''
`stays_singleton` carries `# leading comment lives on its own line` above its one entry, and `also_stripped` carries `# trailing comment after the value` beside its entry on the same line. **`strip-stranded-padding` removes the padding before the `:` on both**, because the edit removes only the whitespace between the key and its `:`, which is separate from either comment, so neither comment is touched.
'''

[docs]
previewable = true
title       = "Function Calls Drop the Trailing Comma on the Final Arg"

description = '''
`Posting(...)`'s last argument, `title="Electrician",`, carries a `,` right before the call's closing `)`. **`strip-trailing-commas` scans backward from that `)`, finds the comma, and deletes it**, so the call reads without a dangling separator.
'''

[docs]
previewable = true
title       = "Class Base Lists Strip the Trailing Comma"

description = '''
`Loader`'s base list, `BaseLoader, CacheMixin,`, carries the same bracket shape as a call's argument list, so `strip-trailing-commas` reaches it the same way. **The scan backward from the closing `)` lands on the `,` after `CacheMixin`**, and the rule deletes it.
'''

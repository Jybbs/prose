`title="Electrician",` carries a trailing `# primary listing title` after its comma, and the `retired` list ends with an own-line `# legacy identifier kept for audit history` between its last element and the closing `]`. **Each trailing comma is removed and both comments stay exactly where they were**, because the rule reads past comments as trivia before testing for the comma ahead of a closing bracket.

title       = "Comments Around the Comma Ride Through"

description = '''
`title="Electrician",  # primary listing title` loses only its `,`, keeping the trailing comment intact, and `retired`'s own-line `# legacy identifier kept for audit history` survives untouched between the last element and the closing `]`. **`strip-trailing-commas` treats both comments as trivia before it tests for a comma**, so neither comment is disturbed.

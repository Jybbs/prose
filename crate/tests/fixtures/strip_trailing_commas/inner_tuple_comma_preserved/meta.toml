previewable = false
title       = "Inner Tuple Commas Survive the Strip"

description = '''
`(1,)` and `(2,)` are tuple literals nested inside the `make_pair` call, and each keeps its own trailing `,`, since tuples fall outside `strip-trailing-commas`'s scope. **The call's own trailing comma, after `(2,)`, is still stripped**, leaving the tuple separators intact.
'''

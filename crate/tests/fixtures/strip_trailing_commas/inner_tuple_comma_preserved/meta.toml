title       = "Inner Tuple Commas Survive the Strip"

description = '''
`(1,)` and `(2,)` are one-element tuples passed to `make_pair`, and the call carries its own `,` after `(2,)`. **The call's trailing comma is removed and each tuple keeps the `,` that makes it a tuple**, because a tuple literal is outside the rule's scope.
'''

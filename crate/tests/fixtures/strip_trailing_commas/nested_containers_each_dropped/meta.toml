[docs]
previewable = true
title       = "Nested Multi-Line Collections Strip Independently"

description = '''
`Posting(...)`'s call, its `keywords` list, its `metadata` dict, and `metadata`'s nested `tags` list each carry a trailing `,` before their own closing bracket. **`strip-trailing-commas` emits a separate deletion edit for each container**, so nesting the four inside one another does not make the edits interact.
'''

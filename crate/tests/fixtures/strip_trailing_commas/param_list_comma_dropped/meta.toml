[docs]
previewable = true
title       = "Function Signatures Drop the Trailing Comma on the Final Arg"

description = '''
`load_lexicon`'s last parameter, `fallback: dict[str, str],`, carries a `,` before the signature's closing `)`. **`strip-trailing-commas` scans backward from that `)` and lands on the comma**, treating the signature like any other argument list.
'''

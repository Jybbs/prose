[docs]
previewable = false
title       = "Single-Line Containers Strip Too"

description = '''
`f(a, b, c,)`, `[1, 2, 3,]`, `{"a": 1, "b": 2,}`, and `def signature(a, b, c,):` each keep their brackets on one source line, yet still carry a trailing `,`. **`strip-trailing-commas` strips each one along the same backward-scan path it uses on multi-line input**, since a single-line trailing comma carries no semantic weight in these contexts.
'''

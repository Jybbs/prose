[docs]
previewable = false
title       = "Positional-Only and Keyword-Only Separators Pass Through"

description = '''
`split_pos_only` ends its parameter list in `/,` before the closing `)`, and `split_kw_only` opens its list with `*,` and ends in `b,`. **The comma after `/` and the comma after `b` are removed, and the `/` and `*` markers are left in place**, because the rule tests only whether the token before the `)` is a `,`, and the markers carry no AST node of their own to handle specially.
'''

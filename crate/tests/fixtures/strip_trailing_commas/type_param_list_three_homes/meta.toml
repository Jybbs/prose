[docs]
previewable = false
title       = "Type-Parameter Lists Drop the Trailing Comma on `def`, `class`, and `type`"

description = '''
`transform`, `Container`, and `Pair` each carry a generic-syntax type-parameter list `[T, U,]` spread over one name per line, on a `def`, a `class`, and a `type` alias. **The comma after `U` is removed in all three**, because the rule reads each closing `]` the same way whatever statement the list sits on.
'''

[docs]
previewable = false
title       = "Type-Parameter Lists Strip in All Three Homes"

description = '''
`transform`'s `[T, U,]`, `Container`'s `[T, U,]`, and `Pair`'s `[T, U,]` are the three homes a generic-syntax type-parameter list can sit on, a `def`, a `class`, and a `type` alias. **`strip-trailing-commas` scans backward from each closing `]` and lands on the `,` after `U`**, dropping it in every one of the three homes.
'''

[docs]
previewable = true
title       = "A `prose: off` Region Keeps Its Comment Gaps"

description = '''
`seed()` and `compact_the_index()` sit inside a `#prose: off` region, and `flush()` and `warm_the_cache_now()` follow the `# prose: on` that closes it. **The comments inside the region keep the gaps they were written with**, whereas `align-comments` pads the two comments below the closer onto one shared column.
'''

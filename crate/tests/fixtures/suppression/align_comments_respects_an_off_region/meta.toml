[docs]
previewable = true
title       = "A `prose: off` Region Holds Its Comment Column"

description = '''
`seed()` and `compact_the_index()` sit inside a `#prose: off` region, so their trailing comments keep the gaps they were written with. Once `# prose: on` closes the region, `align-comments` settles the comments on `flush()` and `warm_the_cache_now()` onto a shared column.
'''

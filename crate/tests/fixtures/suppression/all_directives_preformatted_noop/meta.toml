[docs]
previewable = false
title       = "Already-Formatted Source With Every Directive Gets No Edit"

description = '''
The file is already formatted and carries every directive, with `bar_baz`, `foo`, and `x` padded to one `=` column, a `# fmt: off` block keeping three unaligned assignments, and `skipped = 4` trailing a `# fmt: skip`. **No rule emits an edit**, because the suppressed spans stay as written and the aligned runs already sit on their group widths, so a second run changes nothing.
'''

[docs]
previewable = false
title       = "A Bare On With No Preceding Off Does Nothing"

description = '''
The `# fmt: on` here has no `# fmt: off` ahead of it to close, so **it does nothing at all**. Every assignment stays open to formatting, in that `x`, `foo`, and `bar_baz` above the directive sort to `bar_baz`, `foo`, `x` and pad to one `=` column, and `aa`, `bbb`, and `cccc` below it align the same way, exactly as if the comment were absent.
'''

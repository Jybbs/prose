[docs]
previewable = true
title       = "An Off Region Holds Comment Spacing, Its Closer Included"

description = '''
Comment spacing is the first rewrite whose subject is the comment itself, so a directive is both the marker and a candidate. The `off` directive keeps its spelling because it sits inside the region it opens, whereas the `on` directive is settled because the region closes at that line's start, and it classifies afterward either way.
'''

[docs]
previewable = false
title       = "A File-Top Off Opts the Whole File Out"

description = '''
`# fmt: off` opens the file with no closing `# fmt: on`. **Every line below it is suppressed from every rule**, so `x = 1`, `foo = 2`, and `bar_baz = 3` stay unaligned, `config = {"z": 1, "a": 2,}` keeps its unsorted keys and its trailing `,`, and `helper`'s `b, a` parameters keep their written order, the same result a file-level `# prose: off` gives.
'''

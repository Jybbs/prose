[docs]
previewable = false
title       = "File-Top Off Opts the Whole Source Out"

description = '''
`# fmt: off` opens the file with no closing `# fmt: on`, so `x = 1`, `foo = 2`, and `bar_baz = 3` stay unaligned, `config = {"z": 1, "a": 2,}` stays unsorted with its trailing `,`, and `helper`'s `b, a` parameters stay in their written order. **Every subsequent line is suppressed from every rule**, matching what a file-level `# prose: off` would do.
'''

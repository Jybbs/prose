[docs]
previewable = false
title       = "A Skip Keeps One Line out of the Group Aligning Around It"

description = '''
`short = 4  # fmt: skip` sits in the middle of one assignment run, between `x`, `foo`, `bar_baz` and `aa`, `bbb`, `cccc`. **The trailing `# fmt: skip` keeps that one line out of the run's alignment group** without splitting the group, so `short` keeps the spacing its author wrote while every other row pads its `=` to the one column shared across the gap.
'''

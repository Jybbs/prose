[docs]
previewable = false
title       = "An Ignore Silences One Lint Line and Rewrites Still Apply"

description = '''
`RETRY_INTERVAL = 30  # prose: ignore[reassigned-constants]` carries an inline suppression. **It silences the `reassigned-constants` diagnostic on its own line only**, leaving the same diagnostic on `DEFAULT_LIMIT` and `PAGE_SIZE` in place, and rewrites still apply to every line, so `RETRY_INTERVAL`'s `=` and `+=` align with the other two constants.
'''

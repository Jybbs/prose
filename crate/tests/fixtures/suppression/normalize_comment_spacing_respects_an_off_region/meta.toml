[docs]
previewable = true
title       = "An Off Region Keeps Comment Spacing up to Its Closer"

description = '''
`normalize-comment-spacing` rewrites the comment itself, so a directive here is both the region marker and a candidate for the edit. **`#prose: off` and the `x = 1 #kept exactly as written` line below it keep their tight spelling because they sit inside the region, whereas the closer is rewritten to `# prose: on`** because the region ends where that line begins. Below it, `y = 2` gains the standard two spaces before its `#` and one after.
'''

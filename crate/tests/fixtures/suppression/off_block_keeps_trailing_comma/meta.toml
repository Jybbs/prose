[docs]
previewable = false
title       = "An Off Block Keeps a Trailing Comma the Rule Would Remove"

description = '''
`inside(1, 2, 3,)` sits between `# fmt: off` and `# fmt: on`, and `outside(4, 5, 6,)` sits below the block. **`inside` keeps its trailing `,`**, whereas `strip-trailing-commas` removes the one on `outside` the way it would on any other call, so the suppression filter in the pipeline covers every rule rather than alignment alone.
'''

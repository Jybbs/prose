[docs]
previewable = false
title       = "Native Prose Block Mirrors the Fmt Span Exactly"

description = '''
A `# prose: off` / `# prose: on` pair opens a block covering `short`, `much_longer_name`, and `mid`, sitting between the `x`, `foo`, `bar_baz` run and the later `a`, `bb`, `ccc` run. That block **survives verbatim** while `alphabetize` reorders each surrounding run and `align-equals` pads it to its own group width, and the native `prose` namespace reads the same span the `fmt` namespace would.
'''

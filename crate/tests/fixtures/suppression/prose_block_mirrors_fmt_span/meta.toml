[docs]
previewable = false
title       = "A `prose` Block Covers the Same Span as a `fmt` Block"

description = '''
A `# prose: off` / `# prose: on` pair encloses `short`, `much_longer_name`, and `mid`, between the `x`, `foo`, `bar_baz` run and the `a`, `bb`, `ccc` run. **The block stays verbatim** while `band-constants` sorts the run above it and `align-equals` pads each surrounding run to its own group width, so the `prose` namespace reads the same span the `fmt` namespace does.
'''

[docs]
previewable = false
title       = "File-Top Prose Off Opts the Whole Source Out"

description = '''
`# prose: off` at the top of the source **opts every line below it out of every rule**, so `x`, `foo`, and `bar_baz` stay unsorted and unaligned, `config`'s unsorted keys and trailing comma stay as written, and `helper`'s `b, a` parameter order stays in place, however many rules would otherwise fire.
'''

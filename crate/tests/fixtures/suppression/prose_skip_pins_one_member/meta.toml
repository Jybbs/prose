[docs]
previewable = false
title       = "A `prose: skip` Keeps One Line Out Like a `fmt: skip`"

description = '''
A trailing `# prose: skip` on `short` sits in the middle of one assignment run. **It keeps that line out of the alignment group without splitting the group**, so `bar_baz`, `foo`, and `x` above it and `aa`, `bbb`, and `cccc` below it pad to one shared `=` column across the gap while `short` keeps its own tight spacing, the same result a bare `# fmt: skip` gives.
'''

[docs]
previewable = false
title       = "Prose Skip Holds One Line Out, Mirroring Fmt Skip"

description = '''
A trailing `# prose: skip` on `short` **holds that line out of its alignment group** while leaving it transparent to the group around it.

`bar_baz`, `foo`, and `x` above it and `aa`, `bbb`, and `cccc` below it still align to a single shared `=` column reaching across the gap, and `short` keeps its own tight spacing. This mirrors what a bare `# fmt: skip` does.
'''

[docs]
previewable = false
title       = "Prose Skip Holds One Line Out, Mirroring Fmt Skip"

description = '''
A trailing `# prose: skip` on `short` **holds that line out of its alignment group** as a transparent gap, so `bar_baz`, `foo`, `x` above it and `aa`, `bbb`, `cccc` below it still align to one shared `=` column across the gap. This mirrors the semantics of a bare `# fmt: skip`.
'''

description = '''
`# prose: skip[signature-layout]` names a slug that no longer resolves, so the directive suppresses nothing and `reflow-signatures` condenses the one-parameter header exactly as it would with no comment at all. The sibling case pinning the same signature with a live directive is the contrast.

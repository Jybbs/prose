title       = "A Retired Slug in a Skip Directive Pins Nothing"

description = '''
`# prose: skip[collection-layout]` names a slug that no longer resolves, so the directive suppresses nothing and `reflow-collections` packs the entries exactly as it would with no comment at all. The sibling case pinning the same list with a live slug is the contrast.

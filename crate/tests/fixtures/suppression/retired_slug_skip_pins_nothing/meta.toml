title       = "A Retired Slug in a Skip Directive Suppresses Nothing"

description = '''
`# prose: skip[signature-layout]` names a slug that no longer resolves. **The directive suppresses nothing**, so `reflow-signatures` condenses the one-parameter header onto one line exactly as it would with no comment at all. The sibling case with a live directive on the same signature is the contrast.

[docs]
previewable = false
title       = "A Per-Rule Skip Reaches Back to the Statement's First Line"

description = '''
`# prose: skip[reflow-parentheses]` trails the closing `)` of `z`'s wrapped assignment. **It suppresses that rule across every line the statement spans** rather than the physical line the directive sits on alone, so the redundant parentheses around `x` stay, because the whole assignment falls inside the suppressed span.
'''

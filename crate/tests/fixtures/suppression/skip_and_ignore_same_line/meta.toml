[docs]
previewable = false
title       = "Skip and Ignore Coexist on One Line"

description = '''
One line assigning `RETRY_INTERVAL` carries both `# prose: skip[strip-trailing-commas]` and `# prose: ignore[reassigned-constants]`. The **skip stops `strip-trailing-commas` from removing the trailing comma in `func(3, 4,)`**, and the **ignore stops `reassigned-constants` from reporting `RETRY_INTERVAL`'s later `+= 1`**, while `align-equals` still aligns the line's `=` against `DEFAULT_LIMIT` and `PAGE_SIZE`.
'''

[docs]
previewable = false
title       = "Per-Rule Skip Leaves Other Format Rules Composing"

description = '''
`# prose: skip[strip-trailing-commas]` trailing `ccc`'s call opts that one line out of **a single format rule** while every other rule's edits still land on it. `strip-trailing-commas` leaves `func(5, 6,)`'s trailing comma in place, yet `align-equals` still aligns all three `=` signs, including `ccc`'s, to `longer_name`'s column.
'''

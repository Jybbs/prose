[docs]
previewable = false
title       = "A Per-Rule Skip Leaves Every Other Rule Applying"

description = '''
`# prose: skip[strip-trailing-commas]` trails `ccc`'s call, and **it opts that one line out of a single rule while every other rule's edits still apply to it**, so `strip-trailing-commas` leaves the trailing comma in `func(5, 6,)` and `align-equals` still pads `short`'s and `ccc`'s `=` to `longer_name`'s column.
'''

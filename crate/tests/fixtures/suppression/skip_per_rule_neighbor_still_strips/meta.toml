[docs]
previewable = false
title       = "Per-Rule Skip Is Line-Scoped, Neighbors Still Strip"

description = '''
`# prose: skip[strip-trailing-commas]` trailing `inside(1, 2, 3,)` opts only that line out of the named rule, **without sparing the neighboring line from that same rule**. `inside`'s call keeps its trailing `,`, while `outside(4, 5, 6,)` still has its comma stripped.
'''

[docs]
previewable = false
title       = "A Per-Rule Skip Covers Its Own Line and Not the Next"

description = '''
`# prose: skip[strip-trailing-commas]` trails `inside(1, 2, 3,)`. **It opts that line alone out of the named rule**, so `inside` keeps its trailing `,` while `strip-trailing-commas` still removes the one on the neighboring `outside(4, 5, 6,)`.
'''

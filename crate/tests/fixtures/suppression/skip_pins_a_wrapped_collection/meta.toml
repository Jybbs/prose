[docs]
previewable = false
title       = "A Skip on a Wrapped Collection Keeps It Exploded"

description = '''
A `# fmt: skip` trails the `]` of `items`'s multi-line list. **The directive covers every line between the `[` and the `]`**, not the line it sits on alone, so `1` and `2` stay one per line where rejoining them onto a single line would otherwise fit.
'''

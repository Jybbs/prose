[docs]
previewable = false
title       = "Skip on a Wrapped Collection Keeps It Exploded"

description = '''
A `# fmt: skip` trailing `items`'s multi-line list **spans every line between its `[` and `]`**, so `collection-layout` leaves `1` and `2` exploded one per line rather than rejoining them onto one line where they would otherwise fit.
'''

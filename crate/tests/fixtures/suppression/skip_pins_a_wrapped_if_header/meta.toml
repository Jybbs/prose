[docs]
previewable = false
title       = "Skip on a Wrapped Condition Pins the Header, Not the Body"

description = '''
A `# fmt: skip` trailing the wrapped `if ready:` header **covers only that header's own logical line**.

The header keeps its parentheses, while `strip-trailing-commas` still reaches into the indented body below and strips the trailing comma from `compute(1, 2,)`. A suppression on a header does not extend into the block it opens.
'''

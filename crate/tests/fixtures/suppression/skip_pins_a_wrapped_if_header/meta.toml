[docs]
previewable = false
title       = "A Skip on a Wrapped Condition Covers the Header and Not the Body"

description = '''
A `# fmt: skip` trails the wrapped `if ready:` header. **It covers that header's own logical line only**, so the header keeps its parentheses while `strip-trailing-commas` still reaches into the indented body and removes the trailing comma from `compute(1, 2,)`. A suppression on a header does not extend into the block it opens.
'''

[docs]
previewable = false
title       = "A Skip on a Wrapped Signature Keeps the Parameter List Open"

description = '''
A `# fmt: skip` trails `render`'s wrapped `def` header. **It covers the whole signature, from the opening `(` through the closing `)`**, so the exploded `width` parameter and its trailing comma stay exactly as written rather than the one-parameter signature condensing back onto a single line.
'''

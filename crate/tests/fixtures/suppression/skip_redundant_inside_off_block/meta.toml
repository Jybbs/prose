[docs]
previewable = false
title       = "Skip Inside an Off Block Is Redundant"

description = '''
The `# fmt: skip` trailing `inside = 2` sits inside an already-active `# fmt: off` block and is **redundant**, since the block already holds every line verbatim regardless of the extra directive. The `bar_baz`, `foo`, `x` run above the block and the `a`, `bb`, `ccc` run below it still align as two separate groups.
'''

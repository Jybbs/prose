[docs]
previewable = false
title       = "Trailing Off Comment Is Not a Block Opener"

description = '''
The `# fmt: off` trailing `short = 3` is a **normal end-of-line comment, not a block opener**, because only a `# fmt: off` on its own line opens a suppressed span. `short` still receives its `align-equals` edit alongside `x`, `foo`, `aa`, `bbb`, and `cccc`, and none of the code below it is suppressed.
'''

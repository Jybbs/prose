[docs]
previewable = false
title       = "Two Off Blocks Stay Separate Spans"

description = '''
The module carries two `# fmt: off` / `# fmt: on` blocks, one around `inside_one_alpha` and `inside_one_beta` and the other around `inside_two_alpha` and `inside_two_beta`. **The two blocks stay separate suppressed spans rather than joining into one**, so each block's interior stays verbatim while the `bar_baz`/`foo`/`x`, `a`/`bb`/`ccc`, and `ww`/`xxx`/`yyyy` runs around them each align on their own column.
'''

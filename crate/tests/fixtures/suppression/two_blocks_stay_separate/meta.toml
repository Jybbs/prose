[docs]
previewable = false
title       = "Two Off Blocks Stay Distinct Spans"

description = '''
The module holds two distinct `# fmt: off` / `# fmt: on` blocks, one wrapping `inside_one_alpha` and `inside_one_beta` and the other wrapping `inside_two_alpha` and `inside_two_beta`, and the two blocks **remain separate suppressed spans** rather than fusing into one. The `bar_baz`/`foo`/`x`, `a`/`bb`/`ccc`, and `ww`/`xxx`/`yyyy` runs outside the blocks each align normally, while each block's interior stays verbatim.
'''

[docs]
previewable = false
title       = "Unmatched Off Suppresses Through End of File"

description = '''
An unmatched `# fmt: off`, with no closing `# fmt: on` anywhere below it, **suppresses through end of file**, so `short`, `much_longer_name`, and `mid` stay exactly as written even though their `=` signs sit ragged. The run above the marker is untouched by the suppression, so `x`, `foo`, and `bar_baz` sort into `bar_baz`, `foo`, `x` and align their `=` on that group's own width.
'''

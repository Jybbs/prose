[docs]
previewable = false
title       = "`yapf: disable` and `yapf: enable` Alias the `fmt` Span"

description = '''
`# yapf: disable` and `# yapf: enable` enclose `short`, `much_longer_name`, and `mid`. **They produce the same suppressed span `# fmt: off` and `# fmt: on` would**, so those three assignments stay verbatim while the `bar_baz`, `foo`, `x` run above the block and the `a`, `bb`, `ccc` run below it align to their own group widths.
'''

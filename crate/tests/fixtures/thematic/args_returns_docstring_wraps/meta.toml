[docs]
previewable = false
title       = "An `Args:` and `Returns:` Docstring Frames, Wraps, and Aligns"

description = '''
`render`'s docstring carries an `Args:` section for `template`, `context`, and `encoding` and a `Returns:` section, with its summary sentence running past the budget. **The opening `"""` moves onto its own line, the summary wraps at the budget, and the `Args:` entries align on one `:` column**, while the parameters stay in their source order and `unsorted-positionals` reports them.
'''

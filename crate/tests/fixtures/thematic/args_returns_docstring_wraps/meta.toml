title       = "Args and Returns Docstring Wraps With Aligned Args Colons"

description = '''
`render`'s docstring carries `Args:` and `Returns:` sections above a parameter list of varying widths: `template`, `context`, `encoding`. **The docstring's opening and closing `"""` lift onto their own lines, its prose paragraph wraps at the budget, the parameters hold their source order, and the `Args:` entries align their `:` column.**
'''

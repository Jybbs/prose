[docs]
previewable = false
title       = "A Typed `Args:` Entry Wraps Under Its Description Column"

description = '''
`render`'s Google-style `Args:` entry for `markup` carries a parenthesized type, `(str)`, ahead of its `:`, and its description runs past the budget. **The opening `"""` moves onto its own line, and the over-budget entry wraps so its continuation hangs under the description column** rather than dropping flush to the section indent.
'''

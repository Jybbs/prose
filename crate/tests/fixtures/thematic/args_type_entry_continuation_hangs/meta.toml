previewable = false
title       = "Type-Bearing Args Entry Continuation Hangs Under Its Description"

description = '''
`render`'s Google-style `Args:` entry for `markup` carries a parenthesized type, `(str)`, ahead of its `:`, and its description runs past the budget. **The docstring's opening `"""` lifts onto its own line, and the over-budget entry wraps so its continuation hangs under the description column rather than falling flush-left to the section indent.**
'''

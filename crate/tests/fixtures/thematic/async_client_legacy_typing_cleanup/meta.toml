[docs]
previewable = false
sandbox     = true
title       = "Async Client Drops the Future Import and Modernizes Its Legacy Typing"

description = '''
This async API client opens on a `from typing import …` line pulling in `Any`, `Dict`, `Optional`, `Callable`, `Awaitable`, `Mapping`, `Text`, `Tuple`, `Union`, `AsyncIterator`, `Iterable`, `List`, and `Sequence` alongside an unused `from __future__ import annotations`, then declares `Payload`, `Handler`, and `Interval` type aliases, a `poll` coroutine with an over-wide signature and keyword call, and a `consume` coroutine annotated through a quoted forward reference. The rewrites land together:

1. The unused future import falls away.
2. The typing import splits, sorts, and drops the names the module no longer needs.
3. `Optional` and `Union` surface as `|` unions.
4. The constants band and align.
5. The wide `poll` signature, its `client.get` call, and the `DEFAULT_HEADERS` dict each explode one entry per line.

Lints stand alongside them, on `register`'s, `poll`'s, and `consume`'s half-annotated parameters and on `decode`'s assign-once `parsed`.
'''

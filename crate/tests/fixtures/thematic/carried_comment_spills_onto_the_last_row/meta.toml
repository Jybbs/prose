[docs]
previewable = false
title       = "A Carried Comment Is Written Onto the Split's Last Row"

description = '''
`from package.transforms import indentation, suitify, commatize` crosses the `60`-column import budget, so the statement splits into two rows sharing the prefix, and the `# A comment trailing the run.` line beneath it travels with the statement. **The comment is written inline on the last row** rather than on a line of its own above the split. The split packs the row above without counting the comment and leaves the comment's row last on its own, so the comment's width counts against the row it joins rather than against the widest row of the split.
'''

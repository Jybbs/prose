[docs]
previewable = false
title       = "A Carried Comment Spills onto the Roster's Last Row"

description = '''
The three names overrun the 60-column import budget, so the statement splits into a run of repeated-prefix lines.

The comment carried along with it **lands inline on the last row** rather than opening a line of its own above the run. The forecast seats that final row alone and holds the row above it at the column it packed to, so the comment's width is measured against the row it actually joins rather than against the widest row of the roster.
'''

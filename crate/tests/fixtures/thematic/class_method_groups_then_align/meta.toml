previewable = false
title       = "Method Regrouping Then Field Column Alignment on a Class"

description = '''
`Posting`'s methods sort into the standard groups, which puts `__init__` and `__repr__` first, then the `name` property, then the private `_internal`, then the public `update`.

The annotated fields sort alphabetically to `company`, `description`, `salary`, `title`, and both import runs alphabetize at the top of the module. **`align-colons` and `align-equals` then settle the field declarations onto shared `:` and `=` columns.**
'''

title       = "Dataclass Fields Sort, Align, and Method Docstring Reshapes"

description = '''
`JobPosting` is a `@dataclass`, so its fields feed the generated constructor's signature and **their order is held rather than sorted**, even though they arrive out of alphabetical order.

The annotation `:` and default `=` columns still align, the blank-line cushion before `summary` is normalized, and that method's single-line docstring is reshaped into multi-line form.
'''

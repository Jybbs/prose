previewable = false
title       = "Dataclass Fields Keep Their Order, Align, and the Docstring Reframes"

description = '''
`JobPosting` is a `@dataclass` whose fields arrive out of alphabetical order. **The fields keep their written order rather than sorting**, because they define the generated constructor's signature, while their `:` and `=` columns still align. A blank line opens before `summary`, and its single-line docstring expands to the framed form with the `"""` on their own lines.
'''

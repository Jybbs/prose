title       = "Dataclass Fields Sort, Align, and Method Docstring Reshapes"

description = '''
A dataclass with unsorted annotated fields and varying-width defaults precedes a method body. **The pipeline holds the field order the generated constructor binds, aligns the annotation `:` and default `=` columns**, normalizes the cushion before the method, and reshapes its single-line docstring into multi-line form.
'''

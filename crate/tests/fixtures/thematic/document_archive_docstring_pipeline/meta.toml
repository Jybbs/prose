[docs]
previewable = false
sandbox     = true
title       = "Document Archive Reframes, Wraps, and Expands Docstrings Across the Whole Module"

description = '''
This persistence module runs the docstring rules across a whole file. It opens with a mis-framed module docstring whose summary paragraph runs long, then unsorted interleaved imports, a pool of constants split around the function definitions, an over-wide `write_document` signature, and single-line docstrings on `write_document`, `purge`, and `CatalogStore`.

The rewrites land together:

1. The module docstring and `purge`'s `Args:` docstring reframe onto their own `"""` lines and wrap at the budget, with the `Args:` entries aligning their `:` column.
2. The single-line docstrings expand to framed form.
3. The imports group, sort, and align, and `ARCHIVE_ROOT`, `ENCODING`, and `MANIFEST_NAME` gather into one aligned block.
4. `write_document`'s signature explodes one parameter per line, and `purge`'s bare `-> None` strips.

Lints stand alongside those rewrites. `json` and `hashlib` are each reached through a single attribute, `write_document`'s out-of-order parameters stay in place but are flagged, and `purge`'s assign-once `cutoff` is flagged for inlining.
'''

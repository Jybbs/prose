title       = "Event Dispatch Splits Match Arms and Explodes a Keyword Call"

description = '''
`dispatch` matches on `event.kind`, its `"create"` arm carrying an over-wide `registry.create` call while `"update"` and `_` stay short, and `summarize` builds a five-entry `totals` dict. **The `"create"` arm's call explodes to one keyword per line with the keywords sorted and aligned on one `=` column, whereas the `"update"` and `_` arms each join their one-statement body onto the `case` line, `registry.update`'s keywords sort to `actor`, `source`, and the two `:` pad to one column.** The `totals` dict sorts and expands to one entry per line, both single-line docstrings expand to the framed form, the imports regroup, and `bare-imports` reports `logging` as reached through a single attribute.
'''

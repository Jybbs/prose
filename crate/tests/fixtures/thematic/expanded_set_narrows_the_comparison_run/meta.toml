[docs]
previewable = false
title       = "An Expanded Set Narrows the Comparison Run"

description = '''
The set literal in `conn.family in {...}` crosses the `55`-column budget, so `reflow-collections` lays it out across rows and the `in` comparison no longer shares a row with an operator. **`align-comparisons` reads `conn.type` and `conn.proto` as the run and sets the column from those two alone** rather than from all three rows the author wrote.
'''

title       = "An Expanded Set Narrows the Comparison Run"

description = '''
The set literal crosses the budget, so `reflow-collections` lays it out across rows and the `in` comparison stops sharing a row with an operator. That leaves `conn.type` and `conn.proto` as the run `align-comparisons` reads, and **the column comes from those two alone** rather than from all three rows the author wrote.
'''

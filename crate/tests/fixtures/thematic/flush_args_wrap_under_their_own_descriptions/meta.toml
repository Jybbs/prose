[docs]
previewable = false
title       = "Flush `Args:` Entries Wrap Under Their Own Descriptions"

description = '''
`config.toml` sets `align-docstring-entries = false`, and both `Args:` entries of `render` run past the budget. With no shared `:` column, **each wrapped entry's continuation hangs under the start of its own description**, so `markup` and `options` wrap at different columns.
'''

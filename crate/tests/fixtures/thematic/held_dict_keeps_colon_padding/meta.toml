[docs]
previewable = false
title       = "A Multi-Line Dict Kept as Written Keeps Its Aligned Colon Column"

description = '''
`config`'s multi-line dict already carries `align-colons`-style padding and would fit the budget on one line. **The dict stays on the lines the author wrote, with only its trailing comma removed**, because `keep-multiline-literals` is on, and the padded gap round-trips through the rebuild, so the `:` column on `alpha`, `beta`, and `gamma` survives rather than collapsing to `": "` and being padded again.
'''

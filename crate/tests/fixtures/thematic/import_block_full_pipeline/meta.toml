previewable = false
title       = "An Import Block Drops Its Future Import, Sorts, and Aligns Aliases"

description = '''
The module top mixes an unused `from __future__ import annotations` with the bare imports `requests`, `numpy as np`, `os`, and `functools as ft`, plus the from-imports `collections.Counter` and `typing.Any`, all out of order above an unannotated `render` function. **The future import is removed**, because no annotation in the module reads it, and each import kind then sorts alphabetically, the `as` of `functools as ft` and `numpy as np` aligns on one column, and the gap before `render` settles to two blank lines.
'''

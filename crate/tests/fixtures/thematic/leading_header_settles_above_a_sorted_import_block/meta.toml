previewable = false
title       = "A Leading Header Settles Above a Sorted Import Block"

description = '''
A two-line copyright header opens the file above an import run that is regrouped and sorted beneath it.

**The header keeps the single blank line its author left below it** while `group-imports`, `alphabetize-siblings`, and `align-imports` reshape `requests`, `numpy`, `os`, and `collections` underneath. It settles the same way against every rule acting on the statements it heads.
'''

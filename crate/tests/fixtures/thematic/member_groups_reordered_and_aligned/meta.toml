title       = "Service Class Members Regroup and Field Columns Align"

description = '''
`CacheService` declares its `capacity`, `timeout`, `backend_name` fields out of order alongside a `size` property, a `_initialize_store` private helper, and the public `evict` and `get` methods. **The methods reorder into the canonical dunder, property, private, then public groups**, landing `size`, then `_initialize_store`, then `evict` and `get`, the fields alphabetize to `backend_name`, `capacity`, `timeout`, their `:` and `=` columns align, and member spacing normalizes.
'''

previewable = false
title       = "Nested Classes Sort and Align Independently Per Scope"

description = '''
`Order` wraps an inner `LineItem` class, and both carry fields and methods written in arbitrary order.

**Every rule runs at each nesting depth independently.** `Order`'s fields alphabetize to `customer_id`, `placed_on`, `total` and `LineItem`'s to `price`, `quantity`, `sku`, with each class settling its own `:` and `=` columns rather than sharing one across both. The methods reorder within each scope too, and the blank-line cushion between members settles throughout.
'''

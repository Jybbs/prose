[docs]
previewable = false
title       = "An Inline Dict Past the Budget Expands to One Entry per Line"

description = '''
`CONFIG` is written as one long dict literal on a single line that crosses the width budget. **`reflow-collections` puts each entry on its own line and expands the nested `limits` dict the same way**, with the scalar-valued entries partitioned ahead of the collection-valued `limits` and `tags` and their `:` columns aligned.
'''

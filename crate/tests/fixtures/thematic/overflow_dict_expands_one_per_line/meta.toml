[docs]
previewable = false
title       = "Inline Dict Overflows Budget and Expands One Per Line"

description = '''
`CONFIG` is written as one long dict literal on a single source line, and that line overflows the width budget once measured.

`reflow-collections` puts each entry on its own line and **recursively expands the nested `limits` dict** as well. The scalar-valued entries partition ahead of the collection-valued `limits` and `tags`, their `:` columns align, and the dangling commas drop.
'''

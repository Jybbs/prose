[docs]
previewable = false
title       = "A Padded Entry Holds Where Its Rebuild Fits"

description = '''
The entry carries padding around its `:` that `strip-stranded-padding` removes, so the row settles **three columns** narrower than the author wrote it. Reading the source spelling alone would explode the dict across three rows and reading the rebuilt spelling alone would hold a row too wide to keep, so the expand decision reads the narrower of the two and the entry keeps the row it was written on.
'''

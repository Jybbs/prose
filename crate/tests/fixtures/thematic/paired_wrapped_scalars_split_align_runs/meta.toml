title       = "Paired Wrapped Scalars Split the Alignment Runs"

description = '''
In `LABELS`, `bravo` and `charlie` hold long string values that wrap onto their own continuation lines, and each keeps its alphabetical slot among the scalars `alpha`, `delta`, `echo`, so a blank-line divider opens between `bravo` and `charlie` themselves rather than fencing the two together as one contiguous block. Each divider ends the `align-colons` run where it sits, leaving `alpha` unpadded above and only `delta` and `echo` below sharing a `:` column.
'''

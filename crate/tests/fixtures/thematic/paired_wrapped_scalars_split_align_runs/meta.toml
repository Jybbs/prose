title       = "Paired Wrapped Scalars Split the Alignment Runs"

description = '''
`bravo` and `charlie` carry long string values that wrap onto their own continuation lines, and each keeps its alphabetical slot among the plain scalars `alpha`, `delta`, and `echo`. **A blank line opens between `bravo` and `charlie` themselves** rather than fencing the pair off as one block, because the two stay separate entries, and each blank line ends the `align-colons` run where it sits, leaving `alpha` unpadded above and only `delta` and `echo` sharing a `:` column below.
'''

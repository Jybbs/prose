title       = "A Service Module Runs the Import, Constant, Dataclass, and Signature Pipeline"

description = '''
This service module opens with unsorted imports and a loose pool of constants, then a `@dataclass` `ServiceConfig` with unsorted annotated fields and interleaved methods, and closes on an over-wide `build_request` function returning an inline dict literal.

The rewrites are written together:

1. The imports group and align, and the constants gather and sort.
2. **`ServiceConfig`'s `region`, `endpoint`, `id`, and `labels` fields keep their written order**, because `@dataclass` binds them positionally, while their `:` and `=` columns still align.
3. Its methods regroup into `__post_init__`, then `_key`, then `describe`.
4. `build_request`'s signature and its returned dict each explode to one entry per line.

`miscased-constants` reports the lowercase `timeout`, and `unsorted-positionals` reports both the field run and `build_request`'s parameter list.
'''

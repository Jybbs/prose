title       = "Service Module Runs the Import, Constant, Dataclass, and Signature Pipeline"

description = '''
A service module opens with unsorted imports and a loose constant pool, then a dataclass with unsorted annotated fields and interleaved methods, and closes on an over-wide function whose body reaches a bare import through one attribute. **The imports group and align, the constants band, the fields hold their positional order while their `:` and `=` columns align, the methods regroup, the signature and the returned dict explode one-per-line**, and the bare import surfaces a lint.
'''

description = '''
This alerting module declares its `SEVERITY_LADDER` and `PAGE_CHANNELS` tables inline with dangling commas, leaves its constant pool unsorted and unaligned, and threads a guard chain in `within_budget` whose `<` and `<=` operators drift out of column. The rewrites land together:

1. The tables explode one entry per line with `:` and `=` aligned.
2. The constants band and sort.
3. The guard chain's `<` and `<=` settle into one shared column.
4. The redundant parentheses around `classify`'s `if` condition shed.
5. The over-wide `notify` call splits with its kwargs sorted.

Lints stand alongside them, on the rebound `LATENCY_CEILING_MS`, the bare `import math`, and the numbered step comments in `classify`.
'''

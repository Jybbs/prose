description = '''
This alerting module declares its `SEVERITY_LADDER` and `PAGE_CHANNELS` tables inline with dangling commas, leaves its constant pool unsorted and unaligned, and threads a guard chain in `within_budget` whose `<` and `<=` operators drift out of column. **The tables explode one entry per line with `:` and `=` aligned, the constants band and sort, the guard chain's `<` and `<=` settle into one shared column, the redundant parentheses around `classify`'s `if` condition shed, and the over-wide `notify` call splits with its kwargs sorted**, while the rebound `LATENCY_CEILING_MS`, the bare `import math`, and the numbered step comments in `classify` each surface a lint.

[docs]
previewable = false
title       = "Stacked Decorators Keep, Docstring Reshapes, Cushions Normalize"

description = '''
Three stacked decorators, `@memoize`, `@trace`, `@functools.lru_cache(maxsize=128)`, sit above `lookup`, whose docstring opener and closer each share a prose line rather than sitting alone. **The pipeline lifts the docstring's `"""` delimiters onto their own lines, wraps the prose, and normalizes the blank-line cushions** around `memoize` and `trace`. `lookup`'s single-line signature carries no multi-line columns to align, so it passes through unchanged.
'''

title       = "Stacked Decorators Stay, the Docstring Reframes, and Blank Lines Settle"

description = '''
Three stacked decorators sit above `lookup`, whose docstring has both the opening and closing `"""` sharing a line with prose. **The `"""` move onto their own lines and the prose wraps at the budget**, while the gaps around `memoize` and `trace` settle to two blank lines. `lookup`'s signature stays on one line and carries no multi-line columns to align, so it passes through unchanged.
'''

previewable = true
title       = "A `ClassVar` and the `KW_ONLY` Sentinel Drop from the Run"

description = '''
Neither `REGISTRY`'s `ClassVar` annotation nor the `_: KW_ONLY` sentinel becomes a constructor parameter in `Session`, so both **drop out of the run rather than counting against it**. What remains before the sentinel, `alpha, beta`, already sits in order, and the `zulu, yankee` pair below it binds by name, leaving the class **without a diagnostic**.
'''

[docs]
previewable = true
title       = "A `ClassVar` Between Two Fields Sits Inside the Reported Span"

description = '''
`DEFAULT`'s `ClassVar` annotation drops out of `Palette`'s run without ending it, so `zebra` and `apple` still read as one out-of-order pair and **trigger a diagnostic**. The reported span runs from `zebra` to `apple`, carrying the `DEFAULT` line along with it even though that constant binds no constructor parameter.
'''

[docs]
previewable = true
title       = "A Positional-Binding Decorator Silences the Lint"

description = '''
`run(target, source)` lists its parameters out of alphabetical order, yet the case produces **no diagnostic** because `click.argument` is a decorator that binds arguments by position. Reordering the parameters would change which value lands in each one, so the lint skips any function under such a decorator.
'''

[docs]
previewable = true
title       = "A Field Run and a Method Draw Separate Reports"

description = '''
`Report` is a `@dataclass`, so `width` and `height` feed its generated constructor as one positional run, and the `render` method ends that run rather than counting against it. The method's own parameters, `target` and `source`, form a second run out of alphabetical order, so the class gets **two diagnostics that name different constructs**, one on the fields and one on the parameter list.
'''

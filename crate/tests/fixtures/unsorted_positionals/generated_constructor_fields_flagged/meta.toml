[docs]
previewable = true
title       = "A Generated Constructor's Field Run Is Flagged"

description = '''
`@dataclass` turns `Window`'s annotated fields into its generated constructor's positional parameters, so `width` sitting before `height` fixes the order every positional call binds them in. The lint **reports the run without reordering it**, because a reorder would transpose the values at every such call. The defaulted `title` sorts after the required pair, since Python permits no defaulted field before a required one.
'''

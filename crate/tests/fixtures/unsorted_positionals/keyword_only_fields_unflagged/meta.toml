[docs]
previewable = true
title       = "A `kw_only=True` Generator Draws No Report"

description = '''
`Request`'s `@dataclass(kw_only=True)` generator binds every field by name, so its out-of-order `timeout`, `method`, `body` run **gets no diagnostic**. Nothing here needs a human's read of the callers, because [[alphabetize]] sorts these fields as an auto-fix instead.
'''

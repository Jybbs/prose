[docs]
previewable = true
title       = "A Method's Parameters Draw the Same Report"

description = '''
`Catalog.update`'s out-of-order `target, source` parameters **trigger the same diagnostic a free function's would**. Its callers bind by slot exactly as a free function's callers do, so the run reads the same way, with the `self` receiver dropping out of the run rather than silencing the check.
'''

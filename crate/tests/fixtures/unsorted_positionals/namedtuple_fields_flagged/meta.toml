[docs]
previewable = true
title       = "A `NamedTuple` Base Carries the Same Run"

description = '''
`ModelSpec`'s `NamedTuple` base generates the same positional constructor a `@dataclass` decorator would, so its out-of-order `display`, `build` field run **triggers the same report**. Alphabetizing it would move `build` ahead of `display`, and that reorder would leave a call site like `ModelSpec("Baseline", BaselineAE)` binding the type where the label belongs.
'''

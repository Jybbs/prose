[docs]
previewable = false
title       = "A Pinned Method Leaves the Field Run Still Reported"

description = '''
`Report.render`'s `@click.argument("path")` decorator, since it carries an argument, silences the method's own `target, source` parameters, while `Report`'s `zebra`, `apple` field run **still triggers its diagnostic**. The two skips are independent, in that one reads the decorator list and the other reads the class header.
'''

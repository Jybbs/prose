[docs]
previewable = false
title       = "A Silenced Method Leaves the Field Run Reported"

description = '''
`Report` is a `@dataclass` declaring `zebra` then `apple`, and its `render` method takes `target, source` under `@click.argument("path")`. **The lint reports the field run and nothing for the method**, because the decorator's positional argument silences the method's own run whereas the class header still generates a positional constructor, so the two checks read different constructs and neither depends on the other.
'''

title       = "A Heading Directly After an Entry Closes Its Section"

description = '''
The `Returns:` heading sits directly below the `url` entry with no blank line between them. **The `url` description wraps at its hanging column and the heading is written unchanged below it**, because a heading closes the open entry the same way a blank line does, which is the one path where a heading arrives while an entry paragraph is still open.
'''

[docs]
previewable = false
title       = "An Over-Budget URL in an Entry Description Stays Whole"

description = '''
The `endpoint` entry under `Args:` carries a URL too wide for any line the budget allows. **The URL is written alone on a continuation line at the description column and overflows there**, because a token that reads as a URL wraps as one whole word rather than splitting at a `/` or `-`.
'''

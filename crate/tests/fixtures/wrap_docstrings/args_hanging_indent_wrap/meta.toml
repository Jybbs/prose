description = '''
The `name` entry under `Args:` overruns its line, so it **re-wraps to the section budget with a hanging indent**.

The continuation lines sit under `A descriptive name`, at the column the description itself starts at, rather than back at the parameter-list indent. The short `retries` entry below already fits and is left alone.

[docs]
previewable = false
title       = "A Blank Line Keeps an Indented Block Below an Entry Verbatim"

description = '''
A blank line follows the `config` entry, and the deeper-indented `{"retries": 3, "timeout": 30}` block sits below it. **The block passes through verbatim while the `config` description wraps to its hanging column**, because the blank line closes the entry and the block's opening `{` marks it as a literal, which would keep it verbatim even without the blank line.
'''

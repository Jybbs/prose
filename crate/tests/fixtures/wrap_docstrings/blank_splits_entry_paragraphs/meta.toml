previewable = false
title       = "A Blank Line Splits an `Args:` Section Into Two Entries"

description = '''
A blank line separates the `first` entry from the `second:` line under `Args:`. **Each wraps as its own entry at its own description column**, because the blank line ends the `first` paragraph, so `second:` is tested as a fresh entry rather than read as a continuation of `first`.
'''

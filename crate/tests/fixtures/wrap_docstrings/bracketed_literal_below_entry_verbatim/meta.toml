[docs]
previewable = false
title       = "A Bracketed Literal Below an Entry Stays Verbatim"

description = '''
The `{"retries": 3, "timeout": 30}` line sits directly under the `config` entry with no blank line between them. **The literal passes through verbatim while the `config` description wraps to its hanging column**, because a line opening on `{` or `[` reads as a literal rather than as prose.
'''

[docs]
previewable = true
title       = "Mixed Description + Args Apply Both Budgets in Sequence"

description = '''
`render`'s docstring carries both a description paragraph and a structured `Args:` section, and **each region wraps to its own shape**.

The paragraph wraps at the docstring budget measured against the body indent. The over-long `label` entry wraps at that same budget but with a hanging indent at its description column, and the short `count` entry is left untouched.
'''

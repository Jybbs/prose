[docs]
previewable = false
title       = "An Entry-Shaped Continuation Past the Section Body Stays Joined"

description = '''
The continuation line `nested: it picks up here.` reads like a fresh `name: description` pair, but it sits deeper than the section body indent. **It stays part of the `outer` description and joins its head line**, because no sibling entry can open past the section body indent, so only a line at that indent, like `after:`, opens the next entry.
'''

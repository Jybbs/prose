previewable = false
title       = "A Fence Inside an Entry Passes Through and the Next Entry Resumes"

description = '''
The `sample` entry introduces a fenced code block, and the over-long `next_entry` follows the closing fence. **The fence passes through verbatim and `next_entry` wraps with a hanging indent at its description column**, because the fence ends `sample` at the block boundary and entry detection resumes once the closing fence is read.
'''

title       = "A Field List Opening After a Summary Passes Through"

description = '''
The `:param source:` and `:param amount:` field list opens its own block after the over-long summary paragraph. **The summary reflows and the field list passes through unwrapped**, because the blank line marks a block boundary, so the `:param` markers read as structure rather than as continuation prose.
'''

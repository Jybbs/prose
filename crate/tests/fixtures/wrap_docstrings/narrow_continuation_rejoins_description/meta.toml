previewable = false
title       = "A Continuation Left of the Hanging Column Rejoins Its Description"

description = '''
`name`'s continuation line sits at a narrower indent than the hanging column its `:` sets, stranded to the left of where the entry hangs from. **The line rejoins the description and reflows at the hanging column under the entry's first word**, because every line past the section body indent that opens no sibling entry reads as a continuation rather than passing through verbatim.
'''

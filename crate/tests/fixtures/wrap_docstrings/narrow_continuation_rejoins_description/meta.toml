[docs]
previewable = false
title       = "Continuation Below the Hanging Column Rejoins Its Description"

description = '''
`name`'s continuation line sits at a narrower indent than the hanging column its `:` sets, leaving it stranded to the left of where the entry now hangs from.

Every line past the section body indent that opens no sibling entry reads as a continuation, so **the stranded line rejoins the description and reflows at the current hanging column**. The text refills under the entry's first word rather than passing through verbatim.
'''

previewable = false
title       = "Raises Entries Wrap the Description, Exception Name Stays Flush"

description = '''
Both entries under `Raises:` run past the budget, so each **wraps its description at the docstring budget with a hanging indent at the description's start column**. `ValueError` and `IOError` themselves stay flush at the entry indent, so the continuation lines hang under each description's `When` rather than under the exception name.
'''

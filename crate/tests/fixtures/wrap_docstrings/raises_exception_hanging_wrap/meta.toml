previewable = false
title       = "A `Raises:` Entry Wraps Its Description and Keeps the Exception Name Flush"

description = '''
Both entries under `Raises:` run past the budget. **Each description wraps at the docstring budget with a hanging indent at its start column, while `ValueError` and `IOError` stay flush at the entry indent**, so the continuation lines hang under each description's `When` rather than under the exception name.
'''

[docs]
previewable = true
title       = "An Interpreted-Text Role Reads as Prose at a Line Start"

description = '''
The wrap lands the `:class:` role of `~ensemble.VotingClassifier` at the start of a line. A field list opens only at a block boundary, so the marker on a continuation line still reads as prose, and **the role stays inside the reflowed paragraph** rather than opening a field list that would pass the rest through verbatim.
'''

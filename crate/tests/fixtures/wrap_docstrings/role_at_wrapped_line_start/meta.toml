[docs]
previewable = true
title       = "An Interpreted-Text Role Reads as Prose at a Line Start"

description = '''
The wrap happens to land the `:class:` role of `~ensemble.VotingClassifier` at the start of a line, which is where a field list would normally open.

A field list opens **only at a block boundary**, so a marker arriving at the start of a continuation line still reads as ordinary prose. The role stays inside the reflowed paragraph rather than opening a field list that would pass everything after it through verbatim.
'''

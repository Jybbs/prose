[docs]
previewable = false
title       = "Section Body Prose Collapses Its Whitespace Runs"

description = '''
A Title-case section's body prose **collapses every interior whitespace run** the same way description prose does, even where the line already fits the budget. The section path wraps each line on its own rather than joining a paragraph, so without the collapse a run would survive here and vanish only once a later edit pushed it to a wrap point.
'''

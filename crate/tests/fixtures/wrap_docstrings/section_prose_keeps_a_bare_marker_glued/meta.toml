[docs]
previewable = true
title       = "Section Prose Keeps a Bare Marker Glued"

description = '''
Section prose wraps one row at a time, first-fit, and a break whose remainder would head the next row as an entry head, a comment marker, or a list marker **folds back into the word before it**.

A plain fill would open a row on `threshold:`, which would then read as a new entry rather than as prose. The wrap takes `writes threshold:` down together instead, and the same guard keeps the bare `#` and `+` markers glued to the words ahead of them.
'''

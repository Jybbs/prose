[docs]
previewable = true
title       = "Section Prose Keeps a Bare Marker Glued"

description = '''
Section prose wraps one line at a time, first-fit, and a break whose remainder would head the next row as a comment marker, an entry head, or a list marker folds back into the word before it. The bare `#`, `toks:`, and `+` a wrap leaves at a row's end read as those markers too, so the rows the first pass writes re-wrap to themselves.
'''

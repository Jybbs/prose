title       = "Simple Tables Pass Through Verbatim"

description = '''
The reStructuredText simple table under `Summary line.` **keeps its columns**, even though its `dict` and `list` rows open with no leading punctuation at all. The spaced `=====` adornment above them opens a passthrough block that runs to the next blank line, so the rows stay under the `Name` and `Meaning` headings.

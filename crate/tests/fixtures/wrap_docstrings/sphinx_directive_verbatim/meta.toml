title       = "Sphinx Directives Pass Through Verbatim"

description = '''
`.. versionadded:: 0.10` and `.. deprecated:: 1.0` sit on consecutive lines, and a line opening with `..` starts a directive block, so both **pass through verbatim**. Reflowed into one paragraph they would render as a single directive, so the wrap keeps them one per line.
'''

previewable = false
title       = "Named Yields Entries Wrap Like Every Other Section"

description = '''
The `chunk` entry under `Yields:` runs past the budget, so it **wraps at the docstring budget with a hanging indent at the description's start column**. A named yields entry takes the same shape as every other entry-carrying section, so the continuation lines hang under the first word of the description.
'''

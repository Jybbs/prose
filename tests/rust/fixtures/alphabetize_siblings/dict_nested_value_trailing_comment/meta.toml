[docs]
previewable = false
title       = "A Nested Block Value Keeps Its Trailing Comment"

description = '''
`"nested"` holds a multi-line dict with a trailing `# block` comment after its closing `}`, sitting above the one-line `"scalar"`. **The scalar entry sorts ahead of the nested block, the `# block` comment travels with the block, and the `,` sits after the closing `}` rather than inside the comment.** As the dict's only multi-line entry the block takes no blank divider, so it lands directly below `"scalar"`, while the nested dict keeps `"b"` ahead of `"a"`, since it is neither looked up in place nor bound to a name.
'''

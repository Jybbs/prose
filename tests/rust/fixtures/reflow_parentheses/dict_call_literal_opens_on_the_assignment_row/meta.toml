[docs]
previewable = false
title       = "A Pair Around a `dict(...)` Call Turned Literal Opens the Literal on the Assignment's Row"

description = '''
`configuration_defaults_for_the_service = (` wraps a `dict(...)` call with six keyword arguments, which `simplify-comprehensions` turns into a dict literal and `reflow-collections` explodes, since it holds more entries than `max-dict-entries` allows. **The pair is removed and the literal opens on the assignment's row as `configuration_defaults_for_the_service = {`**, even though its one-row form fits the row inside the pair.
'''

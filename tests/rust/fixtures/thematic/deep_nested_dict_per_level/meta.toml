[docs]
previewable = false
title       = "A Nested Dict Expands and Aligns at Every Depth"

description = '''
`DEPLOY` is one long single-line dict nesting through `services`, `api`, `endpoints`, `headers`, `gateway`, `worker`, and `telemetry`. **Every depth expands to one entry per line and aligns a `:` column, while only the top level sorts**, its scalar entries partitioning ahead of `services` and `telemetry` behind a blank line with each group aligning its own column. `DEPLOY` is bound once and never read, so every use of it is a lookup, whereas each nested dict keeps the order written, since it is neither looked up in place nor bound to a name.
'''

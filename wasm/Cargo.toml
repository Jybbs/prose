[package]
description            = "WebAssembly bindings for the prose formatting core."
edition.workspace      = true
name                   = "prose_wasm"
publish                = false
rust-version.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
prose                    = { path = "../crate", default-features = false }
serde                    = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen       = "0.6"
wasm-bindgen             = "0.2"

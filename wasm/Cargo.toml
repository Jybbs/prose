[package]
description            = "WebAssembly bindings for the prose formatting core."
edition.workspace      = true
name                   = "prose_wasm"
publish                = false
rust-version.workspace = true

[package.metadata.cargo-machete]
ignored = ["getrandom", "uuid"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1"
getrandom                = { version = "0.4", features = ["wasm_js"] }
prose                    = { path = "../crate", default-features = false }
uuid                     = { version = "1", features = ["js"] }
wasm-bindgen             = "0.2"
